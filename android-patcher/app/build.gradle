plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fsmkh1.zillfontdump'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fsmkh1.zillfontdump'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.8.1-alpha'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
