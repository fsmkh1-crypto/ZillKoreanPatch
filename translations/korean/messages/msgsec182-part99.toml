["1820004"]
japanese = "あ、うふふっ。<line-break>ホントに、なんででしょうね。　　　<line-break>　<line-break>あの、お名前はなんというんですか？<line-break>私は、ここの神殿の巫女、<line-break>イークレムンといいます。<end>"
