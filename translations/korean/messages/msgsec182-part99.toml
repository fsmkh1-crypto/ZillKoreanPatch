["1820010"]
japanese = "<value:$28>さんは<line-break>冒険者なんですよね？<line-break>ご家族は、いらっしゃるんですか？　　<line-break>私の両親は、私が赤ん坊のころに<line-break>亡くなったんだそうです。<line-break>だから、私、家族の記憶がないんです。<end>"
korean = "<value:$28> 씨는 모험가죠? 가족은 있으신가요? 제 부모님은 제가 아기였을 때 돌아가셨대요. 그래서 저는 가족에 대한 기억이 없어요.<end>"

["1820014"]
