line-break>これでは先に進めません。<end><if><value:$01><equal>25ねぇ、見て。不思議ね。<line-break>この向こう、水で覆われている。<line-break>この先には進めないみたいね。<end><if><value:$01><equal>192水で世界がさえぎられています。<line-break>これ以上は進めません。<end><if><value:$01><equal>193不思議…。水で覆われています。<line-break>この先ってやっぱり進んだら<line-break>溺れちゃいますよね？<end><if><value:$01><equal>194水の結界か。<line-break>これじゃぁ先に進むことはできないな。<end><if><value:$01><equal>191ダメね。<line-break>水で覆われてて<line-break>先に進めないわ。<end><if><value:$01><equal>190何だこれは。<line-break>水で覆われて先に進めない。<end>あらら。世界が水に包まれてる。<line-break>キレイだけど、これじゃあ<line-break>先に進めないよ。 <end>"
