["80001"]
japanese = "<select><value:$20>%4８世紀末に最後の神聖王レムゲドンが　　　<line-break>将軍のメガ・ディンガルに殺され、<line-break>神聖王国アルレシアは崩壊しました。<line-break>ここアルノートゥンは神聖王国の流れをくむ<line-break>最後の都市国家なのです。<end>強力な魔法文明を持つ魔道王国ラドラスを、<line-break>聖光石を利用した魔道兵器で滅ぼした神聖王国も<line-break>結局は滅んでしまいました。<line-break>強大な力は使い方を誤れば不幸を呼ぶだけです。<line-break>そのことを伝えていくためにも我々は<line-break>この地を守っていかなくてはならないのです。<end>ふもとの廃墟は見ましたか？　　　　　　　　　<line-break>あの廃墟も今から４００年ほど昔には<line-break>平和な町だったのです。<line-break>しかし、太守アハブが聖光石の力を悪用しようと<line-break>企てたため、大神官エシュトの怒りにふれ<line-break>現在のような廃墟になってしまいました。<end>ふもとの廃墟アハブは、聖光石の力を<line-break>求める者への戒めとするため、<line-break>今も昔のままに放置してあるのです。<line-break>聖光石の力は町をひとつ滅ぼしてまでも<line-break>守らなくてはならない禁忌の力。<line-break>そのことを忘れないでください。<end>"
korean = "<select><value:$20>%48세기 말 마지막 신성왕 렘게돈이 장군 메가 딩갈에게 살해되면서 신성왕국 알레시아는 붕괴했습니다. 이 알노툰은 신성왕국의 계보를 잇는 마지막 도시국가입니다.<end>강력한 마법 문명을 지닌 마도왕국 라드라스를 성광석을 이용한 마도병기로 멸망시킨 신성왕국도 결국 멸망했습니다. 강대한 힘은 사용법을 잘못하면 불행을 부를 뿐입니다. 그 사실을 전하기 위해서라도 우리는 이 땅을 지켜야 합니다.<end>산기슭의 폐허를 보셨습니까? 그 폐허도 약 400년 전에는 평화로운 도시였습니다. 하지만 태수 아하브가 성광석의 힘을 악용하려 하다가 대신관 에슈트의 분노를 사 지금과 같은 폐허가 됐습니다.<end>산기슭의 폐허 아하브는 성광석의 힘을 원하는 자들에게 경고가 되도록 지금도 옛 모습 그대로 방치되어 있습니다. 성광석의 힘은 도시 하나를 멸망시켜서라도 지켜야 하는 금기의 힘입니다. 그 사실을 잊지 마십시오.<end>"

["80002"]
japanese = "<if><value:$2C><less-equal>%49この近くに、はざまの塔があるんだ。<line-break>そこには研究室のような部屋があるんだが、<line-break>誰もいないんだよ。不思議だよな。<end><if><value:$2C><less-equal>%100この近くにアハブって町の廃墟があるんだ。　<line-break>レムゲドンの時代に太守のアハブが聖光石を<line-break>手に入れようとして滅ばされたんだとよ。<line-break>疫病の魔法を使って皆殺しにしたっていうから<line-break>住人の恨みや苦しみもすごかったんだろうな。<line-break>今じゃ悪霊、死霊のたまり場だよ。<end><if><value:$2C><less-equal>%120死霊や悪霊はたいてい闇属性だから、<line-break>聖属性の魔法や武器が有効なんだぜ。<end>この地には<line-break>世界を滅ぼすほど強大な力を持つ<line-break>邪竜がいたと言う。<end>"
korean = "<if><value:$2C><less-equal>%49이 근처에 틈새의 탑이 있어. 거기에는 연구실 같은 방이 있는데 아무도 없더라고. 이상하지.<end><if><value:$2C><less-equal>%100이 근처에 아하브라는 마을의 폐허가 있어. 렘게돈 시대에 태수 아하브가 성광석을 손에 넣으려다 멸망했다더군. 역병 마법으로 몰살시켰다니 주민들의 원한과 고통도 엄청났겠지. 지금은 악령과 사령의 소굴이야.<end><if><value:$2C><less-equal>%120사령이나 악령은 대개 어둠 속성이니까 성 속성 마법이나 무기가 효과적이야.<end>이 땅에는 세계를 멸망시킬 만큼 강대한 힘을 지닌 사룡이 있었다고 한다.<end>"

["80003"]
japanese = "<select><value:$20>%4我らがノトゥーン様は天空の神にして<line-break>すべての神々の頂点に立つお方。<line-break>そのお方に仕えることを誇りに思っております。<end>この世界に災いを及ぼす者をノトゥーン様は<line-break>お許しになりません。<line-break>ふもとの廃墟、アハブを見てみなさい。<line-break>聖光石の力を悪用して世界に災いを<line-break>及ぼそうとしたアハブは、ノトゥーン様の<line-break>正義の鉄槌で滅ばされたのです。<end>私は以前アミラルに住んでおりましたが、<line-break>ノトゥーン様にお仕えしようと決心し<line-break>ここへ参りました。<line-break>ここの神官の多くは世界各地から<line-break>ノトゥーン様にお仕えしようと<line-break>集まった者たちです。<end>この山は大陸でも有数の標高を誇るので、<line-break>神聖王国時代に、天空神に仕える神殿として<line-break>天経院の神殿が建てられたのです。<end>"
korean = "<select><value:$20>%4우리 노툰 님은 천공의 신이며 모든 신들의 정점에 서신 분입니다. 그분을 섬기는 것을 자랑스럽게 생각합니다.<end>이 세계에 재앙을 끼치는 자를 노툰 님은 용서하지 않으십니다. 산기슭 폐허 아하브를 보십시오. 성광석의 힘을 악용해 세계에 재앙을 끼치려 한 아하브는 노툰 님의 정의의 철퇴로 멸망했습니다.<end>저는 예전에 아미랄에 살았지만 노툰 님을 섬기기로 결심하고 이곳에 왔습니다. 이곳 신관의 상당수도 세계 각지에서 노툰 님을 섬기기 위해 모인 사람들입니다.<end>이 산은 대륙에서도 손꼽히게 높기 때문에 신성왕국 시대에 천공신을 섬기는 신전으로 천경원의 신전이 세워졌습니다.<end>"

["80004"]
japanese = "<select><value:$33>今は旅立ち中だろ、なんでここにいるんだ。<end>世界中で、地震や火山の噴火があったらしいな。<line-break>ここも小さな地震があったが<line-break>被害はそれほどでもなかったよ。<end>ディンガルの皇帝が代わったんだってな。　　<line-break>なんでも魔王バロルを倒した勇者ネメアが<line-break>前の皇帝を殺して帝位を奪ったらしいぞ。<line-break>主君殺しとは勇者も落ちたもんだぜ。<line-break>まあ、ディンガルの人間はネメアが皇帝になる<line-break>のを望んでいたから、これでよかったのかもな。<end>ロセンがディンガルに滅ばされたみたいだな。<line-break>世界を魔王から救った勇者が、魔王のまねして<line-break>世界征服とはふざけた世の中だよなあ。<end>名将と呼ばれたアンギルダンも<line-break>ロストールの若き将軍ゼネテスに破れたか…。<line-break>時代を切り開くのは若さなのかもな。<end>アンギルダンが破れてディンガルの勢いも<line-break>なくなったと思ったが、なかなかどうして<line-break>カルラもたいしたものだな。<line-break>しかし、リベルダムを破壊してしまうとは、<line-break>若さゆえの暴走としか思えぬな。<end>カルラとゼネテスがいよいよ対決か…。<line-break>どちらが勝っても大陸は混乱するな。<line-break>戦とは不毛なものだと実感するよ。<end>ネメアが死に、カルラは動けなくなった。<line-break>しばらく平和が続くかもしれぬな。<end>"
korean = "<select><value:$33>지금 여행 중일 텐데, 왜 여기 있는 거야.<end>세계 곳곳에서 지진과 화산 분화가 있었다더군. 여기도 작은 지진이 있었지만 피해는 그리 크지 않았어.<end>딩갈의 황제가 바뀌었다더군. 마왕 바롤을 쓰러뜨린 용사 네메아가 전 황제를 죽이고 제위를 빼앗았다나 봐. 주군을 죽이다니 용사도 타락했군. 뭐, 딩갈 사람들은 네메아가 황제가 되길 바랐으니 이게 나았을지도 모르지.<end>로센이 딩갈에 멸망한 모양이군. 세계를 마왕에게서 구한 용사가 마왕을 흉내 내 세계 정복이라니, 웃기는 세상이야.<end>명장이라 불리던 앙길단도 로스토올의 젊은 장군 제네테스에게 패했나…. 시대를 여는 건 젊음일지도 모르겠군.<end>앙길단이 패해서 딩갈의 기세도 꺾인 줄 알았는데, 카를라도 대단하군. 하지만 리벨덤을 파괴해 버리다니 젊음 탓의 폭주라고밖에 생각할 수 없어.<end>카를라와 제네테스가 드디어 맞붙나…. 누가 이겨도 대륙은 혼란스러워지겠군. 전쟁은 정말 허무하다는 걸 실감해.<end>네메아가 죽고 카를라는 움직일 수 없게 됐다. 한동안 평화가 이어질지도 모르겠군.<end>"

["80005"]
japanese = "<select><value:$33>おやおや、今は旅立ちの途中のはずですが。<end>大陸の各地で、竜王の覚醒が原因の地震や<line-break>火山の噴火などが起きているようですね。<line-break>私の故郷は大丈夫なのでしょうか…心配です。<end>ディンガルでは皇帝が家臣の　　　<line-break>ネメアに殺され、帝位を奪われた<line-break>という話を聞きました。<line-break>竜王の覚醒が乱世を呼ぶというのは、<line-break>どうやら本当のようですね。<end>ロセンを占領したカルラは、<line-break>ロセン王の一族を皆殺しにしたそうです。<line-break>なんと恐ろしい所業でしょうか…。<end>ネメアのような野心家が、聖光石の力を<line-break>手に入れたら世界はおしまいです。<line-break>なんとしてもこの地を守らなくては。<end>罪もない人々の命を奪い、住居を破壊する…<line-break>カルラの悪行はとどまることを知りません。<line-break>いまに天空神の裁きが下るに違いありません。<end>ディンガル軍がいかに精強であろうとも、<line-break>天空神の名にかけて負けるわけにはいきません。<end>聞きましたか？<line-break>あのネメアが死んだというのですよ。<line-break>まさに天空神の裁きが下されたのです。<end>"
korean = "<select><value:$33>이런, 지금은 여행을 떠나는 중일 텐데요.<end>대륙 곳곳에서 용왕의 각성이 원인인 지진과 화산 분화 등이 일어나고 있는 모양입니다. 제 고향은 괜찮을까요… 걱정입니다.<end>딩갈에서는 황제가 신하 네메아에게 살해되고 제위를 빼앗겼다는 이야기를 들었습니다. 용왕의 각성이 난세를 부른다는 말은 아무래도 사실인가 보군요.<end>로센을 점령한 카를라는 로센 왕의 일족을 몰살했다고 합니다. 얼마나 끔찍한 짓입니까….<end>네메아 같은 야심가가 성광석의 힘을 손에 넣는다면 세계는 끝입니다. 무슨 일이 있어도 이 땅을 지켜야 합니다.<end>죄 없는 사람들의 목숨을 빼앗고 집을 파괴하다니… 카를라의 악행은 끝을 모릅니다. 머지않아 천공신의 심판이 내릴 겁니다.<end>딩갈군이 아무리 정예라 해도 천공신의 이름을 걸고 질 수는 없습니다.<end>들으셨습니까? 그 네메아가 죽었다고 합니다. 그야말로 천공신의 심판이 내려진 것입니다.<end>"

["80006"]
japanese = "<if><value:$2A><less-equal>%49俺たち傭兵は生き残ることにすべてをかけてる。<line-break>それはあんたら冒険者でも同じだろ？<line-break>死んじまったら何にもならないからなあ。<end><if><value:$2A><less-equal>%100最近、<value:$28>なんて<line-break>名前の冒険者がいるらしいな。<line-break>あんたも知っているかい？<end><if><value:$2A><less-equal>%130傭兵仲間のあいだで、<value:$2B>と<line-break>剣聖レーグはどっちが強いかって<line-break>いうのが話題になってるんだ。<line-break>俺は<value:$2B>のほうが<line-break>強いと思ってるんだがな。<line-break>あんたはどっちだと思う？<end>おぉ！　<value:$28>に会えるなんてっ！<line-break>俺はなんて運のよい男なんだ。<line-break>ノトゥーンに感謝しないとな。<end>"
korean = "<if><value:$2A><less-equal>%49우리 용병은 살아남는 데 모든 걸 걸지. 그건 너희 모험자도 마찬가지겠지? 죽으면 아무 의미도 없으니까.<end><if><value:$2A><less-equal>%100요즘 <value:$28>라는 이름의 모험자가 있다더군. 너도 알아?<end><if><value:$2A><less-equal>%130용병들 사이에서 <value:$2B>와 검성 레그 중 누가 더 강한지가 화제야. 난 <value:$2B> 쪽이 더 강하다고 보는데. 넌 어떻게 생각해?<end>오오! <value:$28>를 만나다니! 난 정말 운 좋은 남자야. 노툰께 감사해야겠군.<end>"

["80007"]
japanese = "<select><value:$20>%2あんたレーグを知っているか？　　　　　　<line-break>剣聖の名で知られている最強の男。<line-break>俺たちボルダンの誇り、そして英雄だ。<line-break>かつて勇者ネメアたちと魔王バロルを<line-break>倒して世界を救ったこともある。<line-break>俺もあんな強い男になりたいと思っている。<end>レーグが持つ２本の剣、剛刃、閃刃は剣聖の証。<line-break>昔、神聖王サラミスの粛清から逃げる人々を<line-break>リベルダムまで守り、導いた英雄が愛用した剣だ。<line-break>最強の男が最強の武器を振るい戦う姿…、<line-break>なんと美しいことではないか。<end>"
korean = "<select><value:$20>%2너 레그를 알고 있나? 검성이라 불리는 최강의 남자. 우리 볼단의 자랑이자 영웅이지. 예전에 용사 네메아 일행과 마왕 바롤을 쓰러뜨려 세계를 구한 적도 있어. 나도 저렇게 강한 남자가 되고 싶어.<end>레그가 지닌 두 자루의 검, 강인과 섬인은 검성의 증표다. 옛날 신성왕 살라미스의 숙청에서 도망치는 사람들을 리벨덤까지 지키고 이끌었던 영웅이 애용하던 검이지. 최강의 남자가 최강의 무기를 휘두르며 싸우는 모습… 얼마나 아름다운가.<end>"

["80008"]
japanese = "<select><value:$33>旅立ちの時は誰にでもあるものだ。<end>このあいだの地震で、エンシャントにある<line-break>ノトゥーン神殿の天井が壊れたそうだよ。<line-break>きれいなステンドグラスだったんだがなあ。<end>国から出奔したと思ったら、何の前触れもなく<line-break>帰ってきて、いきなり皇帝を名乗っちゃう。<line-break>ほんと勇者なんて理解できない人種だね。<line-break>殺された先帝のエリュマルクも運がないと<line-break>いうか何というか…、あわれなもんだよな。<line-break>運のない奴が死ぬのは傭兵も一緒だけどね。<end>ロセンを滅ぼしたディンガルの青竜将軍は<line-break>かわいい女の子だっていうじゃないか。<line-break>俺もディンガル軍に入ろうかなあ。<end>名将と呼ばれたアンギルダンも衰えたな。<line-break>最後の最後でゼネテスなんて若造に<line-break>負けてしまうとはね。<end>最小限の損害で勝利を手にする。<line-break>カルラのやり方は間違っていない。<line-break>若いが、たいした将軍だよ。<end>大陸中で戦争が起きてるんだ。<line-break>俺の生活もしばらくは安泰だな。<line-break>戦争がなくならないかぎり仕事があるからな。<end>傭兵生活も飽きてきたな。<line-break>お前のように冒険者になるのも<line-break>いいかもな。<end>"
korean = "<select><value:$33>여행을 떠날 때는 누구에게나 있는 법이지.<end>지난번 지진으로 엔샨트의 노툰 신전 천장이 부서졌다더군. 아름다운 스테인드글라스였는데 말이야.<end>나라에서 달아났다가 아무 예고도 없이 돌아와 갑자기 황제를 자처하다니. 정말 용사란 이해할 수 없는 인종이군. 살해된 선제 에류마르크도 운이 없다고 해야 할지… 불쌍한 일이야. 운 없는 녀석이 죽는 건 용병도 마찬가지지만.<end>로센을 멸망시킨 딩갈의 청룡장군은 귀여운 여자아이라면서? 나도 딩갈군에 들어갈까.<end>명장이라 불리던 앙길단도 쇠했군. 마지막에 제네테스 같은 젊은 녀석에게 지다니.<end>최소한의 피해로 승리를 얻는다. 카를라의 방식은 틀리지 않았어. 젊지만 대단한 장군이야.<end>대륙 곳곳에서 전쟁이 벌어지고 있어. 내 생활도 당분간은 안정적이군. 전쟁이 사라지지 않는 한 일이 있으니까.<end>용병 생활도 질렸군. 너처럼 모험자가 되는 것도 괜찮겠어.<end>"

