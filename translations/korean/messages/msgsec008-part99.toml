["80011"]
japanese = "<if><value:$2A><less-equal>%49冒険者として名を売るには、<line-break>ギルドで引き受けた仕事を<line-break>期限内に確実に完了させることだ。　　　　　<line-break>小さな信用をこつこつと貯めていけば、<line-break>そのうち大きな仕事も来るようになるからな。<end><if><value:$2A><less-equal>%100あんた、最近がんばっているみたいだな。<line-break><value:$28>だったっけ、<line-break>名前も聞くようになったよ。<end><if><value:$2A><less-equal>%130よう、<value:$28>。<line-break>がんばって仕事をしてるか？<line-break>冒険者もいいが傭兵も捨てたものじゃないよ。<end>よう、<value:$28>。<line-break>あんたが立派になって他人事ながら<line-break>うれしく思うよ。<end>"
korean = "<if><value:$2A><less-equal>%49모험자로 이름을 알리려면 길드에서 맡은 일을 기한 안에 확실히 끝내는 거다. 작은 신용을 차곡차곡 쌓다 보면 언젠가 큰 일도 들어오게 되니까.<end><if><value:$2A><less-equal>%100너 요즘 열심히 하는 것 같더군. <value:$28>였나, 이름도 들리기 시작했어.<end><if><value:$2A><less-equal>%130여어, <value:$28>. 열심히 일하고 있나? 모험자도 좋지만 용병도 나쁘지 않아.<end>여어, <value:$28>. 네가 훌륭해진 게 남 일 같지 않게 기쁘군.<end>"

["80012"]
japanese = "<if><value:$2C><less-equal>%9ソウルは肉体の成長にも影響を与える。　　　　<line-break>ソウルを変更するときはスキルだけでなく、<line-break>どのパラメータを成長させるかも考えるんだ。<line-break>例えばＳＴＲとＶＩＴを成長させたいなら<line-break>グロウファイターのソウルを宿せばいいんだ。<end><if><value:$2C><less-equal>%29気に入ったスキルがあればスキルポイントを<line-break>使って習得するといい。特に魔法のスキルは<line-break>習得しておいて損はないだろう。<end><if><value:$2C><less-equal>%49難易度が高い罠の解除は、<line-break>アンチハードルなしでは難しいぞ。<line-break>習得しといて損はないだろう。<end>無限のソウルを持つ者だけが<line-break>宿すことのできるソウルがあるそうだよ。<line-break>たしか、インフィニティアだったかな？<end>"
korean = "<if><value:$2C><less-equal>%9소울은 육체의 성장에도 영향을 준다. 소울을 바꿀 때는 스킬뿐 아니라 어떤 파라미터를 성장시킬지도 생각해야 해. 예를 들어 STR과 VIT를 키우고 싶다면 그로우 파이터의 소울을 깃들이면 돼.<end><if><value:$2C><less-equal>%29마음에 드는 스킬이 있으면 스킬 포인트를 써서 습득해 두는 게 좋아. 특히 마법 스킬은 배워 둬서 손해 볼 건 없을 거야.<end><if><value:$2C><less-equal>%49난이도가 높은 함정을 해제하려면 안티 허들이 없이는 힘들어. 배워 둬서 손해 볼 건 없지.<end>무한의 소울을 가진 자만 깃들일 수 있는 소울이 있다고 해. 아마 인피니티아였던가?<end>"

["80014"]
