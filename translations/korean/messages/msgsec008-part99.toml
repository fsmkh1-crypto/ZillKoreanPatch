korean = "<if><value:$2C><less-equal>%9클레릭의 소울을 얻고 싶다면 믿는 마음 Belief를 높이세요. 신을 섬기는 자에게는 믿는 마음이 중요하니까요.<end><if><value:$2C><less-equal>%29패트리아크의 소울을 얻으려면 Belief뿐 아니라 다정함 Kind도 높아야 합니다. 남을 배려하는 다정함과 믿는 마음이 높다면 분명 패트리아크의 소울을 얻어 성스러운 힘을 쓸 수 있을 겁니다.<end><if><value:$2C><less-equal>%49우리가 쓰는 마법은 정령력 레벨이 한쪽으로 치우쳐선 안 됩니다. 균형 있게 정령력 레벨을 올리세요.<end>우리가 쓰는 마법은 사람을 치유하기 위한 것이지만 어둠을 멸하기 위한 금주도 존재합니다.<end>"

