["2400001"]
japanese = "いらっしゃい。冒険者登録かね？<line-break>だったら、ここに名前を書いておくれ。<end>"
korean = "어서 오게. 모험자 등록인가? 그렇다면 여기에 이름을 써 줘.<end>"

["2400002"]
japanese = "ふむ。名前は<value:$28>と。<line-break>幻術計振れておらず、<line-break>犯罪登録にも当てはまらず…。<line-break>よし、これで登録は終了だ。<line-break>お前さんは今日から冒険者だよ。<line-break>　<line-break>ああ、そうそう。あんたは<line-break>初心者だから最初に教えておこう。<line-break>手に入れたソウルはちゃんと宿すこと。<line-break>最近これを忘れる冒険者が多くてね。<line-break>ああそれと、こいつも注意して<line-break>おかなきゃならんな。<line-break>冒険者は、町の中ではひとりで行動し、<line-break>町の外に出て冒険するときだけ<line-break>パーティーと一緒になるのが基本だ。<line-break>だから町の中を歩いているときは、<line-break>何かあっても仲間が助けに来る<line-break>とは限らない。油断しないようにな。<end>"
korean = "흠. 이름은 <value:$28>…. 환술계에 걸려 있지도 않고 범죄 등록에도 해당하지 않고…. 좋아, 이걸로 등록은 끝이다. 넌 오늘부터 모험자야. 아, 그래. 넌 초보니까 먼저 알려 두지. 얻은 소울은 제대로 깃들일 것. 요즘 이걸 잊는 모험자가 많아서 말이야. 그리고 이것도 주의해야 해. 모험자는 마을 안에서는 혼자 행동하고 마을 밖으로 나가 모험할 때만 파티와 함께하는 게 기본이다. 그러니 마을 안을 걸을 때는 무슨 일이 생겨도 동료가 도우러 올 거라고 장담할 수 없어. 방심하지 마.<end>"

["2400003"]
japanese = "まぁ、町の中にある塔や廃城とかを<line-break>調べるときなんかは、一緒に行動する<line-break>こともあるんだろうがな。<line-break>説明はこんなところだ。<line-break>さあ、<value:$28>。　<line-break>これからは、バリバリ仕事して<line-break>名を上げていってくれよ。<end>"
korean = "뭐, 마을 안의 탑이나 폐성을 조사할 때는 함께 행동할 수도 있겠지. 설명은 이 정도다. 자, <value:$28>. 이제부터 열심히 일해서 이름을 날려 줘.<end>"

