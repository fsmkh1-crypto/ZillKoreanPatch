japanese = "ノトゥーン神官。もとは荒くれ者の傭兵だったが<line-break>アンギルダンに出会ったことにより自分の小ささ<line-break>に気付き、天空神ノトゥーンに仕える神官として<line-break>生きることを決心する。その後、他人の何十倍も<line-break>努力してアルノートゥンで一番の法力を持つ神官<line-break>となった。古代の怪物退治に功があり封士の<line-break>異名を持つ。<line-break>　<end>"
