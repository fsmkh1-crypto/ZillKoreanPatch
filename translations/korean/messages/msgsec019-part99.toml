["190009"]
japanese = "破壊神ウルグの円卓騎士のひとり。人間が魔法を<line-break>行使するときに犠牲となった精霊から生まれた。<line-break>気まぐれで残忍な性格。セラの姉シェスターの<line-break>体を乗っ取って復活した。闇の神器忘却の仮面の<line-break>力でロイを下僕にし、また、禁断の聖杯を使って<line-break>魔獣商アンティノに究極の怪物エクリプスを<line-break>創らせて、世界を滅ぼそうとしていたが、<line-break><value:$28>に敗れる。<end>"
korean = "파괴신 울그의 원탁기사 중 하나. 인간이 마법을 쓸 때 희생된 정령들로부터 태어났다. 변덕스럽고 잔혹한 성격. 세라의 언니 셰스터의 몸을 빼앗아 부활했다. 어둠의 신기 망각의 가면으로 로이를 하인으로 만들고, 금단의 성배를 이용해 마수상 안티노에게 궁극의 괴물 이클립스를 만들게 해 세계를 멸망시키려 했지만 <value:$28>에게 패한다.<end>"

