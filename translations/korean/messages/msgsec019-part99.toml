japanese = "エルフ全体の指導者（クィーダロア）で本名を<line-break>パルシェンと言う。ネメアとケリュネイアの育て<line-break>の親で、魔王バロルとの戦いにも参加した賢者。<line-break>闇の神器のひとつ魂吸いの指輪を奪いに来た<line-break>ネメアとの戦いで、自分の精神を子猫に封じる。<line-break>以後は子猫の姿のままで<value:$28>たちを<line-break>導いていく。<line-break>　<end>"
