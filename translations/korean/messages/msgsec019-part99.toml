japanese = "破壊神ウルグの円卓の騎士のひとり。バルザーと<line-break>並ぶ実力者で、アーギルシャイア、アスティア、<line-break>マゴス、ネモらを率いる。<line-break>虚無と闇のはざまと、現世とを結ぶ闇の門を<line-break>開くことができる。<line-break>虚無に落ちた破壊神ウルグの魂は、この門を<line-break>通って現世に戻る。<line-break>　<end>"
korean = "파괴신 울그의 원탁 기사 중 하나. 발자와 어깨를 나란히 하는 실력자로 아르길샤이어, 아스티아, 마고스, 네모 등을 이끈다. 허무와 어둠의 틈과 현세를 잇는 어둠의 문을 열 수 있다. 허무에 떨어진 파괴신 울그의 영혼은 이 문을 통해 현세로 돌아온다.<end>"

