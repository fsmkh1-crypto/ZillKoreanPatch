korean = "로스토올 왕국의 왕녀. 로스토올의 선선왕 페로히아의 딸. 셀모노 사후 왕위를 계승해 국정을 맡는다. 열린 정치를 지향하며 엘리에나이 저택에서 시민과 함께 로스토올의 체제를 다시 세우려 활동 중이다. 글 읽기와 쓰기, 요리도 공부하고 있다.<end>"

