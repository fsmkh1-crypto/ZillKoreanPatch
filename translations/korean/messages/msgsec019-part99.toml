japanese = "ロストール生まれの鍛冶工。彼の打つ剣は名剣と<line-break>もてはやされ、当代きっての名工と言われる。<line-break>ドワーフの名工デルガドとは親友。<line-break>デルガドの弟子ロッチナと恋に落ち、結婚。<line-break>炎竜山の宝剣伝説を求め、炎竜山にふたりの小屋<line-break>をかまえる。<line-break>伝説の宝剣を打とうとして、炎竜山の噴火に<line-break>巻き込まれ死亡する。<end>"
korean = "로스토올 출신의 대장장이. 그가 만든 검은 명검으로 칭송받아 당대 최고의 명공이라 불린다. 드워프 명공 델가도와는 절친한 사이. 델가도의 제자 로치나와 사랑에 빠져 결혼하고, 염룡산의 보검 전설을 찾아 둘이 오두막을 짓는다. 전설의 보검을 만들려다 염룡산 분화에 휘말려 사망한다.<end>"

