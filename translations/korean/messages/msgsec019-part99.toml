korean = "아를레시아의 칠왕 중 한 명. 같은 칠왕인 디바와 함께 마도왕국 라드라스를 건국했다. 인류가 진정한 각성을 거치면 신에 필적하는 초인류가 될 수 있다는 사상에 사로잡혀 자신을 강대한 마력과 썩지 않는 육체를 지닌 초인류로 바꾼다. 그 지나치게 강한 힘을 두려워한 용왕은 그를 마도의 탑에 봉인했다.<end>"

