korean = "사막 일족의 수장이자 땅의 무녀. 마도왕국 라드라스 최후의 무녀 중 한 명인 땅의 무녀 즈의 피를 잇고 있다. 사막 일족이 사는 라드라스는 마도의 힘으로 생활하기 쾌적한 환경을 유지하고 식량과 물 등을 제공하여 사막에서도 사람이 살아갈 수 있게 한다.<end>"

