["190004"]
japanese = "破壊神ウルグの円卓騎士のひとり。<line-break>闇の神器忘却の仮面の守護者で、気まぐれで<line-break>残酷な性格。ミイスの村を襲って神器の神殿<line-break>に封印されていた忘却の仮面を取り戻す。<line-break>忘却の仮面をかぶったものは強大な力とひきかえ<line-break>に記憶を失い、アーギルシャイアの操り人形<line-break>として利用されてしまう。究極モンスターを創り<line-break>出すために禁断の聖杯を探している。<end>"
korean = "파괴신 울그의 원탁기사 중 하나. 어둠의 신기 망각의 가면을 지키며 변덕스럽고 잔혹한 성격이다. 미이스 마을을 습격해 신기의 신전에 봉인되어 있던 망각의 가면을 되찾는다. 망각의 가면을 쓴 자는 강대한 힘을 얻는 대신 기억을 잃고 아르길샤이어의 꼭두각시로 이용된다. 궁극의 몬스터를 만들어 내기 위해 금단의 성배를 찾고 있다.<end>"

