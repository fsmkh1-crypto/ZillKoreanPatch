["190034"]
japanese = "ロストールの先王フェロヒアの娘。<line-break>先王死去のおりには母の胎内にいたので、<line-break>王位は先王の弟セルモノーが継いだ。<line-break>彼女は生まれつき病弱で盲目のため、<line-break>政争に巻き込まれることもなく<line-break>王宮の隅でひっそりと暮らしている。<line-break>暗闇の中、ただひとりで。<line-break>　<end>"
korean = "로스토올 선왕 페로히아의 딸. 선왕이 죽었을 당시 어머니 뱃속에 있었기에 왕위는 선왕의 동생 세르모노가 이었다. 태어날 때부터 병약하고 맹인이어서 정쟁에 휘말리지 않은 채 왕궁 한구석에서 조용히 살고 있다. 어둠 속에서 홀로.<end>"

