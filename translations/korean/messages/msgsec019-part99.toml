japanese = "風の巫女、同時にエルズの支配者。<line-break>魔道王国ラドラス最後の巫女たちのひとり、<line-break>風の巫女エアの末裔。天地千年を見通す水晶球を<line-break>持っており、過去と未来千年のできごとであれば<line-break>知ることができる。<line-break>エルズの町の奥にある翔王のすみか竜の座で<line-break>風の精霊神に仕えている。<line-break>　<end>"
korean = "바람의 무녀이자 동시에 엘즈의 지배자. 마도 왕국 라드라스의 마지막 무녀 중 한 명인 바람의 무녀 에어의 후예다. 천 년의 세월을 내다보는 수정구를 가지고 있어 과거와 미래 천 년의 일을 알 수 있다. 엘즈 안쪽, 비상왕의 거처인 용의 자리에서 바람의 정령신을 섬기고 있다.<end>"

