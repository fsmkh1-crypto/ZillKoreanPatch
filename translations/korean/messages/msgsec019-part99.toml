japanese = "ロストールの先王の娘。王宮の隅で孤独に暮らす<line-break>自分とは対照的に、華やかで誰からも好かれてい<line-break>る従妹ティアナの存在が、彼女の心を闇に落とし<line-break>てしまう。システィーナの伝道師シャリは、彼女<line-break>の心の闇を解放し世界を危機に陥れる。<line-break><line-break><line-break>　<end>"
korean = "로스토올 선왕의 딸. 왕궁 구석에서 외롭게 살아가는 자신과 달리 화려하고 누구에게나 사랑받는 사촌 티아나의 존재가 그녀의 마음을 어둠으로 떨어뜨린다. 시스티나의 전도사 샤리는 그녀의 마음속 어둠을 해방시켜 세계를 위기에 빠뜨린다.<end>"

