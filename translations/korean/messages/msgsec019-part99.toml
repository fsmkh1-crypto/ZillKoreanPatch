japanese = "元はエリスの宝石たちの一員。テジャワの変に<line-break>大きく関わり、そのすえに魂切の鎌でソウルを<line-break>刈られるが、闇の神器・同化の髪飾りの力で<line-break>よみがえる。同化の髪飾りを使い、犠牲となった<line-break>ジリオンを救うため自分の身を捧げ、消滅して<line-break>しまう。<line-break><end>"
korean = "원래는 엘리스의 보석들 중 한 명. 테자와의 변에 크게 관여했고 그 끝에 혼절의 낫으로 소울을 베이지만, 어둠의 신기·동화의 머리장식의 힘으로 되살아난다. 동화의 머리장식을 사용해 희생된 지리온을 구하기 위해 자신의 몸을 바쳐 소멸한다.<end>"

