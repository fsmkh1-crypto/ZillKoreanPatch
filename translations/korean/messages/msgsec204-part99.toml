["2040006"]
japanese = "さらにはエルフの軍勢を率いて、<line-break>魔人の俺様に徹底抗戦だ。<line-break>思わず別人かと疑っちまったよ。<line-break>それから何度も矛を交えたが、<line-break>最後に戦ったのは<line-break>バロルの時だったな…。<line-break>俺様は魔獣軍を指揮して、こいつは<line-break>ネメアとレーグ、ケリュネイアを<line-break>引き連れていた。<end>"
korean = "게다가 엘프 군세를 이끌고 마인인 나한테 철저히 맞섰지. 순간 다른 사람인가 싶었다니까. 그 뒤로 몇 번이나 맞붙었지만 마지막으로 싸운 건 발로르 때였어…. 나는 마수군을 지휘했고, 이 녀석은 네메아와 레이그, 케류네이아를 데리고 있었지.<end>"

["2040007"]
