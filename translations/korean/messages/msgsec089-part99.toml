ルの居場所が<line-break>わかるのか。<line-break>何か見えるぞ。<line-break>これは竜骨の砂漠…？<line-break>そうか、ラドラスか！<end>エステルの水晶！　　　<line-break>そっか、これでエステルの<line-break>居場所がわかるね。<line-break>見て、見て！　何か映ってる。<line-break>竜骨の砂漠だよ、これ。<line-break>ほらラドラスがある…！ <end>"
korean = "<if><value:$01><equal>2에스텔의 수정? 이걸로 에스텔의 위치를 알 수 있네. 이건 용골 사막… 라드라스 근처…!?<end><if><value:$01><equal>3에스텔의 수정인가…! 이걸로 에스텔의 위치를 알 수 있겠군! 용골 사막…! 라드라스 근처다.<end><if><value:$01><equal>4에스텔 님의 수정? 그렇구나, 이걸로 위치를 알 수 있겠어! 꺅, 뭔가 보여! 용골 사막…? 라드라스 근처인가?<end><if><value:$01><equal>5에스텔의 수정? 그래, 이걸로 위치를 알 수 있었지. 이건… 용골 사막… 라드라스잖아!<end><if><value:$01><equal>13에스텔의 수정인가…. 전에도 썼지. 이번엔 어디 잡혀 있나? 용골 사막이 보인다. …라드라스인가!?<end><if><value:$01><equal>10역시 누나! 그 수정이 있으면 에스텔 위치를 알 수 있지! 봐, 뭔가 보여. 이거 용골 사막이지? 저기 라드라스야!<end><if><value:$01><equal>14에스텔의 수정인가? 하하하, 잊고 있었군! 이걸로 위치를 알 수 있겠어. 용골 사막이 보이는구나! 알았다, 라드라스다!<end><if><value:$01><equal>15에스텔의 수정! 그걸로 위치를 알 수 있지. 용골 사막이 보여. 라드라스 근처야!<end><if><value:$01><equal>17수정? 에스텔의? 그런 게 정말 쓸모 있을까? 어머, 뭔가 보이네…. 이건 용골 사막이야! 알았어, 라드라스구나!<end><if><value:$01><equal>19에스텔 언니의 수정! 그걸로 위치를 알 수 있지. 와, 봐! 용골 사막이야. 저기 라드라스야아!<end><if><value:$01><equal>27에스텔의 수정? 이건… 용골 사막…? 그래, 라드라스인가!<end><if><value:$01><equal>26에스텔의 수정인가. 이건 용골 사막… 라드라스군.<end><if><value:$01><equal>193에스텔 씨의 수정…. 그렇군요! 이걸로 위치를 알 수 있어요! 뭔가 보이네요… 용골 사막…? 여긴 분명 라드라스예요!<end><if><value:$01><equal>191역시 <value:$28>. 이 수정을 쓰면 에스텔 위치를 알 수 있겠네. 뭔가 보여. 용골 사막…. 에스텔은 라드라스에 있어.<end><if><value:$01><equal>190에스텔의 수정? 그걸로 위치를 알 수 있나. 뭔가 보인다. 용골 사막…? 그래, 라드라스인가!<end>에스텔의 수정! 그렇구나, 이걸로 위치를 알 수 있네. 봐, 뭔가 보여. 용골 사막이야. 저기 라드라스가 있어…!<end>"

