reak>これは竜骨の砂漠…？<line-break>でもなに、この塔の群れは…？<end><if><value:$01><equal>190エステルの水晶？<line-break>それでエステルの居場所が<line-break>わかるのか。<line-break>何か見えるぞ。<line-break>これは竜骨の砂漠…？<line-break>だが、なんだこの塔の群は…。<end>エステルの水晶！　　　　　　<line-break>そっか、これでエステルの<line-break>居場所がわかるかもね。<line-break>見て、見て！　何か映ってる。<line-break>竜骨の砂漠だよ。それに、塔の群…。<line-break>神話の歌にある空中都市かも…！ <end>"
korean = "<if><value:$01><equal>2에스텔의 수정? 이걸로 위치를 알 수 있어? 이건… 용골 사막…? 이 탑들은 뭐지….<end><if><value:$01><equal>3에스텔의 수정인가…! 이걸로 위치를 알지도 모르겠군. 용골 사막…? 이 탑 무리는 뭐지….<end><if><value:$01><equal>4에스텔 님의 수정? 이걸로 위치를 알 수 있겠어! 꺅, 뭔가 보여! 용골 사막…? 이상한 탑이 잔뜩 있어!<end><if><value:$01><equal>5에스텔의 수정? 이런 걸로 위치를 알 수 있나. 이건… 용골 사막…? 야, 이거 맞아?<end><if><value:$01><equal>13수정이라고…? 그걸로 그 성가신 여자의 행방을 알 수 있나? 용골 사막이 보인다. …이 탑들은 뭐지.<end><if><value:$01><equal>10역시 누나! 그 수정으로 에스텔을 찾는 거야! 뭔가 보여. 이거 용골 사막이지?<end><if><value:$01><equal>14에스텔의 수정? 이런 걸로 위치를 알 수 있나. 오! 용골 사막이 보인다! 여기에 있구나!<end><if><value:$01><equal>15에스텔의 수정? 그걸로 위치를 알 수 있지. 용골 사막과 탑들이 보여…. 여기 있는 걸까….<end><if><value:$01><equal>17수정? 에스텔의? 정말 쓸모 있나? 어머, 뭔가 보이네…. 용골 사막이야! 탑 무리…? 뭐야 이게!?<end><if><value:$01><equal>19에스텔 언니의 수정! 이걸로 위치를 알지도 몰라. 와, 뭔가 보여! 용골 사막이야아! 탑도 잔뜩 있어.<end><if><value:$01><equal>27에스텔의 수정? 보이는 건… 용골 사막이군. 하지만 이 탑들은 대체….<end><if><value:$01><equal>26에스텔의 수정인가? 뭔가 보인다. 이건 용골 사막이다! 하지만 이 탑들은….<end><if><value:$01><equal>193에스텔 씨의 수정…. 그렇군요! 이걸로 위치를 알 수 있어요! 뭔가 보이네요… 용골 사막…? 그런데 이 탑은 뭐죠….<end><if><value:$01><equal>191역시 <value:$28>. 이 수정을 쓰면 에스텔 위치를 알 수 있어. 뭔가 보여. 용골 사막…? 그런데 이 탑 무리는 뭐지…?<end><if><value:$01><equal>190에스텔의 수정? 그걸로 위치를 알 수 있나. 뭔가 보인다. 용골 사막…? 그런데 이 탑들은 뭐지….<end>에스텔의 수정! 그렇구나, 이걸로 위치를 알지도 몰라. 봐, 뭔가 보여. 용골 사막과 탑 무리…. 신화의 노래에 나오는 공중도시일지도…!<end>"

