japanese = "<if><value:$01><equal>2シャリはいよいよ、<line-break>ラドラスで事を起こす気ね。<line-break>急ぎましょ。エステルが危ないわ。 <end><if><value:$01><equal>3エステルもシャリもラドラスじゃな。<line-break><value:$28>、急ごうぞ。<line-break>一刻も早くラドラスへ行かねば。 <end><if><value:$01><equal>4エステル様は捕らわれの身。　　　　<line-break>ラドラスで、王子様の助けを<line-break>待っているのね…。きゃっ！<line-break>でも、運命は残酷かも…。<line-break>助けに行くのは、王子様じゃなくて<line-break><value:$28>だったりするのね。 <end><if><value:$01><equal>5行こうぜ、<value:$28>！<line-break>エステルを助けるんだ。　　<line-break>　<line-break>きっとエステルだって、<line-break>ラドラスで<line-break>俺たちの助けを待ってるぜ。 <end><if><value:$01><equal>13…やめておけ。　　　　　　<line-break>足手まといなのが<line-break>いなくなっただけだ…。<line-break>…と言っても、<line-break>お前は助けに行くのだろう？<line-break>仕方あるまい。 <end><if><value:$01><equal>10姉ちゃん、急ごうぜ。　　　　　<line-break>早くしないと、<line-break>エステルが危ない。<line-break>何しろ、相手はシャリだからな。 <end><if><value:$01><equal>14一刻も早く、<line-break>ラドラスへ行かにゃならんぞ。　<line-break>エステルを助けにの。<line-break>何しろ、相手はシャリじゃて。<line-break>ラドラスの魔道技術を使って<line-break>何をやらかしおるか…。 <end><if><value:$01><equal>15行こうよ、ラドラスへ。<line-break>エステルを助けなきゃ。 <end><if><value:$01><equal>17わかったわ！　ピンときたわ！<line-break>さすが、アタクシは高貴なエルフだわ！<line-break>シャリのねらいはラドラスよ！<line-break>そう、その魔道技術を手に入れるため<line-break>エステルをさらったのだわ！<line-break>行くのよー！　ラドラスへ！ <end><if><value:$01><equal>19急ごうよ、<value:$28>。<line-break>エステルお姉ちゃんを　　<line-break>助けなくちゃ！<line-break>ラドラスに行かなくちゃ！ <end><if><value:$01><equal>27急ごう、<value:$28>。<line-break>ラドラスへ！<end><if><value:$01><equal>26急ぐのじゃ！<line-break>シャリめ、何をするつもりじゃ？<end><if><value:$01><equal>193急ぎましょう<value:$28>さん！<line-break>絶対にエステルさんを助けないと！<end><if><value:$01><equal>191行きましょ、<value:$28>。<line-break>早くエステルを助けないと<line-break>シャリが何をするか…！<end><if><value:$01><equal>190エステルを助けにいくぞ！<line-break>急がないとシャリが何をするか…。<end>ラドラスへ行くんでしょ？<line-break>エステルを助けに。<line-break>　<line-break>急がないとね。<line-break>相手はシャリだから。 <end>"
korean = "<if><value:$01><equal>2샤리가 마침내 라드라스에서 일을 벌이려는 것 같아. 서두르자. 에스텔이 위험해.<end><if><value:$01><equal>3에스텔도 샤리도 라드라스에 있군. <value:$28>, 서두르자. 한시라도 빨리 라드라스로 가야 해.<end><if><value:$01><equal>4에스텔 님은 붙잡힌 몸. 라드라스에서 왕자님의 구원을 기다리는구나…. 꺅! 하지만 운명은 잔혹할지도…. 구하러 가는 건 왕자님이 아니라 <value:$28>라니.<end><if><value:$01><equal>5가자, <value:$28>! 에스텔을 구하는 거야. 분명 라드라스에서 우리 도움을 기다릴 거야.<end><if><value:$01><equal>13…그만둬라. 짐이 하나 없어진 것뿐이다…. …그래도 너는 구하러 가겠지? 어쩔 수 없군.<end><if><value:$01><equal>10누나, 서두르자. 늦으면 에스텔이 위험해. 상대는 샤리라고.<end><if><value:$01><equal>14한시라도 빨리 라드라스로 가야 한다. 에스텔을 구하러 말이지. 상대가 샤리니까. 라드라스의 마도 기술로 무슨 짓을 할지….<end><if><value:$01><equal>15라드라스로 가자. 에스텔을 구해야 해.<end><if><value:$01><equal>17알았어! 감이 왔어! 역시 고귀한 엘프인 아타쿠시야! 샤리의 목표는 라드라스야! 마도 기술을 손에 넣으려고 에스텔을 납치한 거야! 가는 거야, 라드라스로!<end><if><value:$01><equal>19서두르자, <value:$28>. 에스텔 언니를 구해야 해! 라드라스로 가야 해!<end><if><value:$01><equal>27서두르자, <value:$28>. 라드라스로!<end><if><value:$01><equal>26서두르자! 샤리 녀석, 무슨 짓을 하려는 게냐?<end><if><value:$01><equal>193서둘러요 <value:$28> 씨! 반드시 에스텔 씨를 구해야 해요!<end><if><value:$01><equal>191가자, <value:$28>. 빨리 에스텔을 구하지 않으면 샤리가 무슨 짓을 할지…!<end><if><value:$01><equal>190에스텔을 구하러 간다! 서두르지 않으면 샤리가 무슨 짓을 할지….<end>라드라스로 가는 거지? 에스텔을 구하러. 서둘러야 해. 상대는 샤리니까.<end>"

