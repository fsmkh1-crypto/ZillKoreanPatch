["30021"]
japanese = "<select><value:$20>%2天井のステンドグラスが自慢だった<line-break>のですが、竜王の覚醒が原因と噂される<line-break>例の大地震で壊れてしまいました。<end>天井のステンドグラスを修理できる　　　　<line-break>職人を探してみたのですが、残念なことに<line-break>ディンガルにはいませんでした。<line-break>修理するには、かなりの技術を必要とする<line-break>らしくて、ドワーフ王国にでも行って捜して<line-break>みるしかないようです。<end>"
korean = "<select><value:$20>%2천장의 스테인드글라스가 자랑거리였는데<line-break>용왕의 각성이 원인이라는 소문이 도는<line-break>그 대지진으로 부서지고 말았습니다.<end>천장의 스테인드글라스를 수리할 수 있는　　　　<line-break>장인을 찾아봤지만, 안타깝게도<line-break>딘갈에는 없었습니다.<line-break>수리에는 상당한 기술이 필요한 모양이라<line-break>드워프 왕국에라도 가서 찾아보는<line-break>수밖에 없을 것 같습니다.<end>"

["30022"]
japanese = "<select><value:$33>特に話すことはありません。<end>うひゃー、本当に壊れてるね。　　　　<line-break>ノトゥーン神殿のステンドグラスは<line-break>観光名所として有名だったんだよ。<line-break>君もせっかく来たのに残念だったねえ。<line-break>せっかくだから、天空神に旅の安全でも<line-break>お祈りしていくといいよ。<end>みんな、多かれ少なかれ<line-break>心のどこかで、勇者ネメアこそ<line-break>皇帝にふさわしいと思っていたんだよ。　　　<line-break>エリュマルク帝もそれに気づいていたから、<line-break>嫉妬して、無茶な命令をしていたんだろうね。<line-break>それを考えると、彼もかわいそうな人だよ。<end>祝ロセン陥落！　これで東方の脅威は<line-break>なくなったわけだ。ロセンの人もペウダから<line-break>解放されて喜んでいるんじゃないのかい？<end>さすがは名将アンギルダン将軍だよ。<line-break>分断の山脈を越えてロストールに攻め込む<line-break>なんて無茶なやり方、普通は思いつかないよな。<line-break>海路からの攻撃しかないと思っていた<line-break>ロストールの連中は、何が起きたかさえ<line-break>わからないうちにやられたんだろうね。<end>リベルダムがカルラ将軍に破壊されたってね。<line-break>あそこは、今まで誰も占領することの<line-break>できなかった難攻不落の都市だったんだぜ。<line-break>それが、こうも簡単に占領できるなんて、<line-break>ノトゥーンの正義がディンガルにあるとしか<line-break>考えられないじゃないか！<end>カルラ将軍がロストール攻略を開始するんだと。<line-break>竜王なんて化け物を信仰するような国なんて、<line-break>ノトゥーンに守られた我が国の敵じゃないね。<end>ネメア様が死んだなんて…。<line-break>エルファス様の予言は正しかったんだ。<line-break>俺も真の神に祈りを捧げなくては…。<end>"
korean = "<select><value:$33>딱히 할 말은 없습니다.<end>우와, 정말 부서졌네.　　　　<line-break>노툰 신전의 스테인드글라스는<line-break>관광 명소로 유명했거든.<line-break>모처럼 여기까지 왔는데 아쉽겠네.<line-break>온 김에 천공신께 여행의 안전이라도<line-break>빌고 가는 게 좋겠어.<end>사람들은 정도의 차이는 있어도<line-break>마음 한구석으로는 용사 네메아야말로<line-break>황제에 어울린다고 생각했어.　　　<line-break>에류마르크 황제도 그걸 알고 있었으니<line-break>질투해서 무리한 명령을 내렸던 거겠지.<line-break>그렇게 생각하면 그 사람도 불쌍하긴 해.<end>로센 함락을 축하하자!　이제 동방의 위협은<line-break>사라진 셈이야. 로센 사람들도 페우다에게서<line-break>해방돼서 기뻐하고 있지 않을까?<end>역시 명장 앙길단 장군이야.<line-break>분단의 산맥을 넘어 로스톨을 공격한다는<line-break>무모한 방법은 보통 사람이라면 생각도 못 하지.<line-break>해로에서만 공격해 올 거라 생각했던<line-break>로스톨 녀석들은 무슨 일이 벌어졌는지도<line-break>모르는 사이에 당했겠지.<end>리베르담이 카를라 장군에게 파괴됐다더군.<line-break>그곳은 지금까지 아무도 점령하지 못했던<line-break>난공불락의 도시였어.<line-break>그런 곳을 이렇게 쉽게 점령했다면<line-break>노툰의 정의가 딘갈과 함께한다고밖에는<line-break>생각할 수 없잖아!<end>카를라 장군이 로스톨 공략을 시작한다더군.<line-break>용왕 같은 괴물을 숭배하는 나라 따위는<line-break>노툰의 가호를 받는 우리나라의 상대가 아니지.<end>네메아 님이 죽었다니….<line-break>엘파스 님의 예언은 옳았어.<line-break>나도 참된 신께 기도를 올려야겠군….<end>"

["30023"]
japanese = "<if><value:$2C><less-equal>%9お前、よそ者で駆け出しの冒険者だな。<line-break>親切な先輩としてありがたい助言を与えてやる。<line-break>スラムの先の荒れ果てた城には近づくなよ。<line-break>あそこは魔王バロルの居城だった所だ。<line-break>魔王が勇者に倒された今でも、邪悪な鬼気が<line-break>城中にただよっていて危険なんだからよ。<end><if><value:$2C><less-equal>%29親切な先輩から助言を与えてやろう。　<line-break>スラムの右奥には塔がある。<line-break>それが魔道の塔だ。<line-break>塔の中には古代の魔道士が使っていた<line-break>アクセサリーが眠っているという。<line-break>罠の解除が得意なら行ってみるといい。<end>魔道の塔にはマノンとかいう魔道士が<line-break>造った化け物がいるらしいぞ。そいつを<line-break>倒すと強力な魔法がおぼえられるそうだ。<end>"
korean = "<if><value:$2C><less-equal>%9너, 외지에서 온 풋내기 모험자구나.<line-break>친절한 선배로서 고마운 충고 하나 해 주지.<line-break>슬럼 너머의 황폐한 성에는 가까이 가지 마.<line-break>그곳은 마왕 바로르의 거성이었던 곳이다.<line-break>마왕이 용사에게 쓰러진 지금도 사악한 기운이<line-break>성 전체에 감돌고 있어서 위험하거든.<end><if><value:$2C><less-equal>%29친절한 선배가 충고 하나 더 해 주지.　<line-break>슬럼 오른쪽 깊숙한 곳에 탑이 있어.<line-break>그게 바로 마도의 탑이다.<line-break>탑 안에는 고대 마도사들이 사용하던<line-break>액세서리가 잠들어 있다고 해.<line-break>함정 해제에 자신 있다면 가 보는 것도 좋아.<end>마도의 탑에는 마논이라는 마도사가<line-break>만든 괴물이 있다더군. 그 녀석을<line-break>쓰러뜨리면 강력한 마법을 배울 수 있대.<end>"

["30024"]
japanese = "<select><value:$20>%3ここはスラムだよ。用がないなら厄介な事件に<line-break>巻き込まれる前に帰ったほうがいいと思うよ。<line-break>ぼくは闇社会の情報収集のために来たのさ。<end>宝箱に仕掛けられた罠は、<line-break>ディテクターのスキルなしでは解除できないよ。<line-break>宝箱を開けたければ習得しないとね。<end>宝箱の罠をうまく解除するには君自身の冷静さと<line-break>集中力が重要だよ。そして失敗を恐れずに数多く<line-break>罠解除をこなして経験を積むことさ。<end>"
korean = "<select><value:$20>%3여기는 슬럼이야. 볼일이 없다면 귀찮은 사건에<line-break>휘말리기 전에 돌아가는 게 좋을 거야.<line-break>난 암흑가의 정보를 모으려고 온 거고.<end>보물상자에 설치된 함정은<line-break>디텍터 스킬이 없으면 해제할 수 없어.<line-break>보물상자를 열고 싶다면 배워 둬야 해.<end>보물상자의 함정을 잘 해제하려면 네 자신의 냉정함과<line-break>집중력이 중요해. 그리고 실패를 두려워하지 말고 많이<line-break>함정을 해제하면서 경험을 쌓는 거야.<end>"
