["30020"]
japanese = "<select><value:$20>%3ここは天空神ノトゥーンの神殿です。<line-break>ノトゥーンは最高神として万物の上に存在し、<line-break>すべてを統括する神々の長なのです。<end>ノトゥーン神殿の総本山はアルノートゥンです。<line-break>１度お参りに行かれてはどうでしょうか？<line-break>あそこなら神を身近に感じることができますよ。<end>テラネの東に霊峰トールがあります。<line-break>ノトゥーンを信じる者なら、一生に一度は<line-break>巡礼しなくてはならない聖地ですよ。<end>"
