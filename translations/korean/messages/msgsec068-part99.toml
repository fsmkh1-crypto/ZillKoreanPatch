korean = "<select><value:$20>%4캡틴이 돌아가시고 가장 힘든 건 힐다리아야. 하지만 그 애는 우리 생활을 지키려고 최선을 다하고 있어. 울고 싶을 만큼 힘들 때도 있을 텐데 캡틴의 장례식 이후로 눈물도 흘리지 않게 됐지.<end>칸다칸은 독단적인 사람이었어. 뭐든 혼자 다 하다 보니 다른 사람은 명령만 따르면 됐지. 그래서 힐다리아를 보좌할 사람이 없는 거야.<end>이 요새에는 빈부 차이가 없어. 워낙 변방이라 서로 돕지 않으면 살아갈 수 없거든.<end>난 와셔를 자유롭고 차별도 없고 사람이 사람답게 사는 나라로 만들고 싶어. 그러니 자네도 힘내게나. 칸다칸 흉내야. 말투가 좀 이상하지?<end>"

