japanese = "<select><value:$20>%4普通の船乗りは危険を恐れるが、<line-break>俺たちは海の冒険者だ。<line-break>冒険に危険はつきもの、恐れはしない。<end>フゴーは先代に珍品を売ってもらえなかった<line-break>腹いせに、我々の船が各地の港に<line-break>入港できないようにした。<line-break>だから、必要な物資はフゴーの交易船から<line-break>いただくことにしているのだ。<end>ヒルダリアもがんばっているが、<line-break>先代には到底およばない。<line-break>やはり冒険の素人にキャプテンは無理だろう。<end>先代と一緒に西の海を冒険していたころは、<line-break>毎日が充実していたものだ。<line-break>あんたなら、俺の気持ちもわかるだろ？<end>"
korean = "<select><value:$20>%4보통 선원은 위험을 두려워하지만 우리는 바다의 모험자다. 모험에 위험은 따라오는 법, 두렵지 않아.<end>휴고는 선대에게 진품을 팔지 않았다는 앙갚음으로 우리 배가 각지 항구에 입항하지 못하게 했다. 그래서 필요한 물자는 휴고의 무역선에서 받아 가기로 했지.<end>힐다리아도 노력하고 있지만 선대에는 도저히 미치지 못해. 역시 모험 초보에게 선장은 무리겠지.<end>선대와 함께 서쪽 바다를 모험하던 시절은 매일이 충실했지. 너라면 내 마음도 알겠지?<end>"

