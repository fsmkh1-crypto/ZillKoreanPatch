["30032"]
japanese = "<select><value:$33>リベルダムの商人は守銭奴じゃ！<end>リベルダムのアンティノもロティもロセン王に<line-break>戦闘用モンスターと武器を売りつけて、<line-break>しこたま、もうけやがってからに。<line-break>奴らのもうけた金は、ロセン王が国民から<line-break>しぼりとった税金ですぞ。女神ライラネートの<line-break>名においてうらやましいが許せんです、ハイ。<end>リベルダムの大富豪フゴーさんには、<line-break>私もお世話になっております。<line-break>あの方のご先祖様は有名な義賊だそうですよ。<end>ロセンが解放されたので忙しくなりますぞ。　<line-break>東方国家群一の都市といわれたロセンも<line-break>愚王ペウダのせいで荒れ果てていますからな。<line-break>それを復興させるのが我々商人の仕事です。<line-break>見ていてください、ロセンをリベルダム以上の<line-break>商業都市にしてみせますぞ。<end>ロセンで解放軍と名乗る者たちのテロが　　　　<line-break>続発していましてな、なんでもロセン王家の<line-break>復興を目指しているとかで。<line-break>奴らにも言い分があるでしょうが、我々も<line-break>ロセンのためを思って復興に参加しておる<line-break>のです。奴らに負けるわけにはいかんのです。<end>ああっ女神様！<line-break>自由都市リベルダムが破壊されてしまうなんて。<line-break>私は、これからどうすればいいのでしょうか…。<end>今ではロセンが商人の町になってしまいました。<line-break>私も復興活動に投資していたので、ずいぶんと<line-break>もうけさせてもらいました。<line-break>カルラ様によって解放軍も壊滅したと聞きますし<line-break>万事安泰と言いたいのですが、リベルダム破壊も<line-break>含めて、カルラ様に都合がよすぎて不気味です。<end>今、この瞬間もこの大陸のどこかで戦いが<line-break>起こっております。<line-break>世間ではネメア死すの噂で持ちきりというのに。<line-break>彼らは、いったい何のために戦おうと<line-break>いうのですかな。<end>"
korean = "<select><value:$33>리벨덤 상인들은 구두쇠투성이야!<end>리벨덤의 안티노도 로티도 로센 왕에게 전투용 몬스터와 무기를 팔아넘기고 엄청난 돈을 벌어들였지 뭡니까. 그들이 번 돈은 로센 왕이 백성들에게서 쥐어짠 세금이라구요. 여신 라이라네트의 이름으로 부럽지만 용서할 수 없습니다, 네.<end>리벨덤의 대부호 휴고 씨에게는 저도 신세를 지고 있습니다. 그분의 조상은 유명한 의적이었다고 합니다.<end>로센이 해방됐으니 바빠지겠군요. 동방 국가들 가운데 제일가는 도시라던 로센도 우왕 페우다 때문에 황폐해졌으니까요. 그곳을 복구하는 게 우리 상인의 일입니다. 두고 보십시오. 로센을 리벨덤 이상의 상업도시로 만들어 보이겠습니다.<end>로센에서는 해방군을 자처하는 자들의 테러가 계속 일어나고 있습니다. 로센 왕가의 부흥을 노리고 있다더군요. 그들에게도 나름의 사정은 있겠지만, 우리도 로센을 생각해 복구에 참여하고 있는 겁니다. 그들에게 질 수는 없습니다.<end>아아, 여신님! 자유도시 리벨덤이 파괴되다니. 저는 이제 어떻게 해야 한단 말입니까….<end>지금은 로센이 상인의 도시가 되어 버렸습니다. 저도 복구 사업에 투자해서 상당한 이익을 보았습니다. 카를라 님이 해방군도 괴멸시켰다고 들었으니 이제 안심이라고 말하고 싶지만, 리벨덤 파괴까지 포함하면 모든 일이 카를라 님에게 너무 유리해 섬뜩합니다.<end>지금 이 순간에도 이 대륙 어딘가에서는 싸움이 벌어지고 있습니다. 세상은 네메아 사망설로 떠들썩한데도 말입니다. 그들은 대체 무엇을 위해 싸우려는 걸까요.<end>"
layout = "<select><value:$33>리베르담 상인들은 구두쇠투성이야!<end>리베르담의 안티노도 로티도 로센 왕에게<line-break>전투용 몬스터와 무기를 팔아넘기고<line-break>엄청난 돈을 벌어들였지 뭡니까.<line-break>그들이 번 돈은 로센 왕이 백성들에게서<line-break>쥐어짠 세금이라구요. 여신 라이라네트의<line-break>이름으로 부럽지만 용서할 수 없습니다, 네.<end>리베르담의 대부호 휴고 씨에게는<line-break>저도 신세를 지고 있습니다.<line-break>그분의 조상은 유명한 의적이었다고 합니다.<end>로센이 해방됐으니 바빠지겠군요.<line-break>동방 국가들 가운데 제일가는 도시라던 로센도<line-break>우왕 페우다 때문에 황폐해졌으니까요.<line-break>그곳을 복구하는 게 우리 상인의 일입니다.<line-break>두고 보십시오. 로센을 리베르담 이상의<line-break>상업도시로 만들어 보이겠습니다.<end>로센에서는 해방군을 자처하는 자들의 테러가<line-break>계속 일어나고 있습니다. 로센 왕가의<line-break>부흥을 노리고 있다더군요.<line-break>그들에게도 나름의 사정은 있겠지만, 우리도<line-break>로센을 생각해 복구에 참여하고 있는<line-break>겁니다. 그들에게 질 수는 없습니다.<end>아아, 여신님!<line-break>자유도시 리베르담이 파괴되다니.<line-break>저는 이제 어떻게 해야 한단 말입니까….<end>지금은 로센이 상인의 도시가 되어 버렸습니다.<line-break>저도 복구 사업에 투자해서 상당한<line-break>이익을 보았습니다.<line-break>카를라 님이 해방군도 괴멸시켰다고 들었으니<line-break>이제 안심이라고 말하고 싶지만, 리베르담 파괴까지<line-break>포함하면 모든 일이 카를라 님에게 너무 유리해 섬뜩합니다.<end>지금 이 순간에도 이 대륙 어딘가에서는 싸움이<line-break>벌어지고 있습니다.<line-break>세상은 네메아 사망설로 떠들썩한데도 말입니다.<line-break>그들은 대체 무엇을 위해 싸우려는<line-break>걸까요.<end>"

