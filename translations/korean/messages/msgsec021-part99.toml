["210061"]
japanese = "　　　　　　　ディンガル帝国。<line-break>　　広大な大地、バイアシオン大陸において<line-break>　　　南のロストール王国と肩を並べる<line-break>　　　　　　　北の大国である。<line-break>　　　　その片隅にテラネの町がある。<line-break>　時折旅人が立ち寄る他は、変化のない日々と<line-break>　　　　　緑とが続く、のどかな町。<line-break>　大いなる魂の物語は、ここから始まる……。<end>"
korean = "딩갈 제국. 광대한 대지 바이아시온 대륙에서 남쪽의 로스토올 왕국과 어깨를 나란히 하는 북방의 대국이다. 그 한편에 테라네 마을이 있다. 가끔 여행객이 들르는 것 외에는 변화 없는 나날과 푸른 자연이 이어지는 한적한 마을. 위대한 혼의 이야기는 여기서 시작된다…….<end>"

["210062"]
japanese = "　　　　広大な大地、バイアシオン大陸。<line-break>　　　　　人と、人ならざる者とが　　　<line-break>　　　　　　それぞれの生を営み　　　　<line-break>　　　　　旅と冒険とが息づく世界。　　<line-break>　　　　　大陸の南、ノーブルの町。<line-break>　今日、この地においても、旅の商人の親子が<line-break>　　次の町を目指し、旅立とうとしていた。<line-break>　大いなる魂の物語は、ここから始まる……。<end>"
korean = "광대한 대지 바이아시온 대륙. 인간과 인간 아닌 자들이 각자의 삶을 살아가고 여행과 모험이 숨 쉬는 세계. 대륙 남쪽, 노블 마을. 오늘 이곳에서도 여행 상인 부자가 다음 도시를 향해 떠나려 하고 있었다. 위대한 혼의 이야기는 여기서 시작된다…….<end>"

["210063"]
japanese = "　　　　　　　ロストール王国。<line-break>　　　広大な大地、バイアシオン大陸の<line-break>　　　　南側に領土を持つ大国であり、<line-break>　　政治は、貴族により執り行われている。<line-break>その領地のひとつに、ノーブルという町がある。<line-break>　　　　　今、このちっぽけな町は<line-break>　暴政に対する反乱の気運でつつまれていた。<line-break>　大いなる魂の物語は、ここから始まる……。<end>"
korean = "로스토올 왕국. 광대한 바이아시온 대륙 남부에 영토를 둔 대국이며 정치는 귀족들에 의해 이루어진다. 그 영지 중 하나에 노블이라는 마을이 있다. 지금 이 작은 마을은 폭정에 맞선 반란의 기운에 휩싸여 있었다. 위대한 혼의 이야기는 여기서 시작된다…….<end>"

["210064"]
japanese = "　　　広大な大地、バイアシオン大陸の南に<line-break>　　　　ロストールという名の王国がある。<line-break>　　その王都ロストールでは、悪質な貴族が<line-break>　　　民衆をいたずら半分に苦しめていた。<line-break>　　　　そして、それと時を同じくして、<line-break>　　　古代の神々にまつわる神器をめぐり<line-break>　闇のしもべたちが動き出そうとしていた…。<line-break>　大いなる魂の物語は、ここから始まる……。<end>"
korean = "광대한 바이아시온 대륙 남쪽에는 로스토올이라는 왕국이 있다. 그 왕도 로스토올에서는 악질 귀족이 장난 삼아 민중을 괴롭히고 있었다. 그리고 때를 같이해 고대 신들과 관련된 신기를 둘러싸고 어둠의 하수인들이 움직이기 시작하려 하고 있었다…. 위대한 혼의 이야기는 여기서 시작된다…….<end>"

["210065"]
japanese = "　　　　広大な大地、バイアシオン大陸。<line-break>　　　　　そのあまりの広大さゆえに、<line-break>　　　　地図にも記されず、旅人にさえ<line-break>　　知られることのない、小さな村がある…。<line-break>　　　　　村の名は、ミイスという。<line-break>　　そこにあるのは、小さな神殿と、森と<line-break>　　　穏やかな日常くらいのものだった。<line-break>　大いなる魂の物語は、ここから始まる……。<end>"
korean = "광대한 대지 바이아시온 대륙. 너무나 넓어 지도에도 기록되지 않고 여행자에게조차 알려지지 않은 작은 마을이 있다…. 마을의 이름은 미이스. 그곳에는 작은 신전과 숲, 그리고 평온한 일상 정도뿐이었다. 위대한 혼의 이야기는 여기서 시작된다…….<end>"

["210066"]
japanese = "　　　　　北の大都市、エンシャント。<line-break>　　　広大な大地、バイアシオン大陸の<line-break>　北半分を支配し、南のロストールと対立する<line-break>　　　　ディンガル帝国の首都である。<line-break>　　　　その、にぎやかな街の外れに、<line-break>　　ひっそりとたたずむ、禁忌の塔がある。<line-break>　　今そこで、目覚めようとする者が居た。<line-break>　大いなる魂の物語は、ここから始まる……。<end>"
korean = "북쪽의 대도시 엔샨트. 광대한 바이아시온 대륙 북반부를 지배하며 남쪽의 로스토올과 대립하는 딩갈 제국의 수도다. 그 번화한 거리 변두리에 조용히 서 있는 금기의 탑이 있다. 지금 그곳에서 깨어나려는 자가 있었다. 위대한 혼의 이야기는 여기서 시작된다…….<end>"

