["120001"]
japanese = "あなた、外の世界から来たのね。<line-break>外の世界の人に会うの、あたし初めてなの。<line-break>だって、ラドラスから一度も出たことないから。<line-break>外の世界って危険でいっぱいって本当なの？<line-break>あたしもエステルみたいに、外の世界に<line-break>冒険に行ってみたいなぁ。<end>"
