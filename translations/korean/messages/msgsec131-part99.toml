["1310000"]
japanese = "エア　ボリューム１その２開始<end>"
korean = "에어 볼륨1 그 2 시작<end>"

["1310001"]
japanese = "<value:$28>。<line-break>より多くの道標を望むか。<line-break>ならば、聞かせてやろう。<end>"
korean = "<value:$28>. 더 많은 이정표를 원하나. 그렇다면 들려주지.<end>"

["1310002"]
japanese = "よくぞ来た、<value:$28>よ。<end>"
korean = "잘 왔다, <value:$28>여.<end>"

["1310003"]
japanese = "またも、進むべき道に迷い<line-break>わらわの言葉を求めるか。<line-break>ならば、聞かせてやろう。<end>"
korean = "또 나아갈 길을 잃고 나의 말을 구하느냐. 그렇다면 들려주마.<end>"

["1310004"]
japanese = "わらわはエア。<line-break>このエルズの竜の座で<line-break>すべてを見る者なり。<end>"
korean = "나는 에아. 이 엘즈의 용의 자리에서 모든 것을 보는 자이니라.<end>"

["1310005"]
japanese = "いかがした？<line-break>わらわがそなたの名を知っておるのが<line-break>それほど、驚きか？<line-break>わらわは天地千年を見通す。<line-break>そなたの名を知ることぐらい、<line-break>たやすきことよ。<end>"
korean = "왜 그러느냐? 내가 그대의 이름을 아는 것이 그리 놀라운가? 나는 천지 천년을 내다본다. 그대 이름을 아는 정도는 쉬운 일이지.<end>"

["1310006"]
japanese = "さて、そなたは道標を求め<line-break>わらわを訪ねたのであろう？<line-break>ならば、聞かせてやろう。<end>"
korean = "자, 너는 길잡이를 찾아 나를 찾아온 것이겠지? 그렇다면 들려주마.<end>"

["1310007"]
japanese = "エンシャントの南東にある賢者の森。<line-break>選ばれた者のみに見える館が<line-break>汝を迎え入れるであろう。<line-break>そなたの真の旅は<line-break>そこから始まるであろう…。<end>"
korean = "엔샨트 남동쪽의 현자의 숲. 선택받은 자에게만 보이는 저택이 그대를 맞이할 것이다. 그대의 진정한 여행은 그곳에서 시작되리라….<end>"

["1310008"]
japanese = "汝、かつての栄華の跡なる地より<line-break>常なる世界を越え<line-break>闇の淵へと迷い込まん。<line-break>そこで汝は<line-break>若き獅子の雄々しさと<line-break>その背負いたる宿業を見るであろう。<end>"
korean = "그대는 옛 영화의 흔적이 남은 땅에서 일상의 세계를 넘어 어둠의 심연으로 헤매어 들 것이다. 거기서 젊은 사자의 용맹과 그가 짊어진 숙업을 보게 되리라.<end>"

["1310009"]
japanese = "無限のソウルを持つ者は、<line-break>汝だけにあらず。<line-break>今ひとつの魂が無限の輝きを宿す。<line-break>千年樹としんきろう、ふたつを<line-break>結びし古の道にて<line-break>汝とその魂は出会うであろう。<end>"
korean = "무한의 소울을 지닌 자는 너만이 아니다. 또 하나의 영혼이 무한의 빛을 품고 있다. 천년수와 신기루, 둘을 잇는 옛길에서 너와 그 영혼은 만나게 되리라.<end>"

["1310011"]
japanese = "青き死神、　　　　　　　　　　<line-break>東の暗愚王の業に怒り<line-break>裁きの鎌を振るわんとす。<line-break>汝、死神の力になりたくば、<line-break>閉ざされし国の門を叩くがよい。<end>"
korean = "푸른 사신이여, 동쪽 암우왕의 업에 분노하여 심판의 낫을 휘두르려 한다. 그대가 사신의 힘이 되고자 한다면 닫힌 나라의 문을 두드려라.<end>"

["1310012"]
japanese = "ロストールにふたりの王女あり。<line-break>ひとりは光、<line-break>今ひとりは闇をまとう。<line-break>今この大地には戦乱の兆しあり。<line-break>彼女らに会うべき想いあらば<line-break>急ぎ彼の国へと向かうがよい。<end>"
korean = "로스토올에는 두 왕녀가 있다. 하나는 빛, 다른 하나는 어둠을 두른다. 지금 이 대지에는 전란의 조짐이 있다. 그녀들을 만나야 할 뜻이 있다면 서둘러 그 나라로 향하라.<end>"

["1310013"]
japanese = "この大陸が揺らいでおる。<line-break>ふたつの大いなる力の交錯じゃ。<line-break>　<line-break>汝に守るべき縁あらば、<line-break>その者と道を共にするがよい。<line-break>汝が、生きる力となろう。<end>"
korean = "이 대륙이 흔들리고 있다. 두 거대한 힘이 교차하는구나. 네게 지켜야 할 인연이 있다면 그자와 길을 함께하라. 그것이 네가 살아갈 힘이 될 것이다.<end>"

["1310015"]
japanese = "いにしえの日より<line-break>大いなる力のために<line-break>血を連ねし４人の巫女あり。<line-break>やがて巫女らは<line-break>東方の魔道士にかどわかされ<line-break>空舞う恐怖の鍵となろう。<end>"
korean = "태고부터 위대한 힘을 위해 피를 이은 네 명의 무녀가 있었다. 이윽고 무녀들은 동방의 마도사에게 현혹되어 하늘을 나는 공포의 열쇠가 되리라.<end>"

["1310016"]
japanese = "今そなたに示すべき道は<line-break>このようなものじゃ。<line-break>進むがよい。<value:$28>よ。<end>"
korean = "지금 그대에게 보일 길은 이와 같다. 나아가거라, <value:$28>여.<end>"

