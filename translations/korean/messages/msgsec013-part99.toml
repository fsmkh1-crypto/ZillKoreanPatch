["130000"]
japanese = "<if><value:$2C><less-equal>%9うぉほっほっほ、細い体じゃな。<line-break>冒険者なら、もっとがっしりとした体に<line-break>ならんと、オーガに叩きつぶされるぞい。<end><if><value:$2C><less-equal>%29うぉほっほっほ、筋肉バカになってはダメぞい。<line-break>賢く戦うために頭も鍛えるのじゃ。<end><if><value:$2C><less-equal>%49うぉほっほっほ、少しは筋肉もついたのう。<line-break>じゃが、フットワークが足りんと当たらんぞい。<line-break>敏捷性や器用さも鍛えるのじゃ。<end>うぉほっほっほ、ええ体つきになったぞい。<line-break>また１人、優秀な戦士を育ててしまったぞい。<line-break>わしは名コーチじゃのう。<end>"
korean = "<if><value:$2C><less-equal>%9우홋홋홋, 몸이 가늘구나. 모험자라면 좀 더 단단한 몸이 되지 않으면 오거에게 짓눌릴 게야.<end><if><value:$2C><less-equal>%29우홋홋홋, 근육 바보가 되어선 안 되지. 영리하게 싸우려면 머리도 단련해야 해.<end><if><value:$2C><less-equal>%49우홋홋홋, 근육은 조금 붙었구나. 하지만 풋워크가 부족하면 공격이 맞지 않아. 민첩성과 손재주도 단련하거라.<end>우홋홋홋, 좋은 몸이 되었구나. 또 한 명 훌륭한 전사를 길러 냈군. 나는 명코치야.<end>"

["130001"]
japanese = "<if><value:$2A><less-equal>%49我らドワーフ族は、初代国王ボルキスの<line-break>時代から、一族最強の戦士が王をつとめるのが<line-break>習わしとなっておる。<line-break>もちろん今の国王ジンガも、前回の王位決定戦で<line-break>優勝した一族最強の戦士なのである。<line-break>もっとも、次の大会までの王位であるがの。<end><if><value:$2A><less-equal>%140わしも一族最強の戦士になるべく、日夜修行を<line-break>しておる。レーグやネメアがドワーフ族なら、<line-break>きっとよい好敵手になっていたであろうな。<end>なにっ！　貴殿が<value:$28>か…。<line-break>ドワーフ族であれば王位も狙えたであろうに…。<line-break>惜しいことだ。<end>"
korean = "<if><value:$2A><less-equal>%49우리 드워프족은 초대 국왕 볼키스 시대부터 일족 최강의 전사가 왕을 맡는 것이 관습이다. 물론 지금의 국왕 징가도 지난 왕위 결정전에서 우승한 일족 최강의 전사지. 다만 다음 대회까지의 왕위지만.<end><if><value:$2A><less-equal>%140나도 일족 최강의 전사가 되려고 밤낮으로 수련하고 있네. 레그나 네메아가 드워프족이었다면 틀림없이 좋은 호적수가 되었겠지.<end>뭐라고! 그대가 <value:$28>인가…. 드워프족이었다면 왕위도 노릴 수 있었을 텐데…. 아깝군.<end>"

["130002"]
japanese = "<select><value:$20>%3ここがドワーフたちの国だということは　　　<line-break>知っているな。この地には、我々、人間の<line-break>しがらみを持ち込んではならない。<line-break>たとえ敵対する国の人間に会っても、争っては<line-break>ならないのだ。我々は部外者なのだから、<line-break>彼らドワーフのおきてには逆らうなよ。<end>俺の槍は名工デルガドが鍛えたものだ。<line-break>こいつのおかげで、何度命拾いをしたことか…。<line-break>この槍は俺の宝だよ。<end>武器は人を傷つけるだけじゃない。<line-break>俺の槍のように命を守ってくれる時もある。<line-break>大切なのは、どう使うかなのだ。<end>"
korean = "<select><value:$20>%3여기가 드워프들의 나라라는 건 알고 있겠지. 이곳에 우리 인간의 사정을 끌어들여서는 안 된다. 설령 적대국 사람을 만나도 싸워서는 안 돼. 우리는 외부인이니 드워프들의 규율을 거스르지 마라.<end>내 창은 명장 델가도가 벼린 물건이야. 이 녀석 덕분에 목숨을 건진 게 몇 번인지…. 이 창은 내 보물이야.<end>무기는 사람을 다치게만 하는 게 아니야. 내 창처럼 목숨을 지켜 줄 때도 있어. 중요한 건 어떻게 쓰느냐지.<end>"

["130003"]
japanese = "<select><value:$20>%2我々が通貨として使用しているギアは、<line-break>ここドワーフの国で製造されているのだ。<line-break>それゆえ、ここは人間世界から独立している。<line-break>どこかの国が、ここを占領して通貨を<line-break>独占してしまうと問題だからな。<end>ここにはドワーフ専用地下街道がいくつかある。<line-break>そこにいる案内人に頼めば、連れていって<line-break>もらえるはずだ。<end>"
korean = "<select><value:$20>%2우리가 화폐로 사용하는 기어는 이 드워프 왕국에서 만들어진다. 그래서 이곳은 인간 세계에서 독립되어 있지. 어느 나라가 이곳을 점령해 화폐를 독점하면 문제가 되니까.<end>여기에는 드워프 전용 지하도로가 몇 개 있다. 거기 있는 안내인에게 부탁하면 데려다줄 거다.<end>"

["130005"]
