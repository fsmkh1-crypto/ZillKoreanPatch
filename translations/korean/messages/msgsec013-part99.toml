korean = "<select><value:$20>%2나는 올해로 260살이지만 기력도 체력도 충실하단다. 인생 경험은 물론이고 전사로서도 아직 젊은이들에게 지지 않아.<end>이 앞은 결투장이다. 지금은 결투 시기가 아니니 들어가면 안 된다. 신성한 결투장에는 선택받은 전사만 들어갈 수 있으니까.<end>"

["130006"]
japanese = "<select><value:$20>%3精霊力の強弱関係はひ・み・つ・かで　　　<line-break>おぼえるといいよ。火は水に、水は土に、<line-break>土は風に、風は火に、それぞれ強いから<line-break>頭文字を取ってひ・み・つ・かってわけさ。<line-break>どうだい、覚えやすいだろ？<line-break>これで、効率よく戦えるってものだね。<end>錬剛石は色々な所に落ちているよ。<line-break>洞窟の中などで光っている場所があったら<line-break>錬剛石が落ちているかもしれないね。<end>人生いそがば回れ、ってね。<line-break>歴史が動くような大事件は急がないと<line-break>取り返しがつかなくなるかもしれないけど、<line-break>それ以外は、ゆっくりやったって<line-break>罰は当たらないさ。気持ちに余裕がないと<line-break>新たな発見ってのはできないからね。<end>"
korean = "<select><value:$20>%3정령력의 강약 관계는 불·물·땅·바람 순서로 외우면 돼. 불은 물에, 물은 땅에, 땅은 바람에, 바람은 불에 각각 강하니까 말이야. 어때, 외우기 쉽지? 이걸 알면 효율적으로 싸울 수 있어.<end>연강석은 여러 곳에 떨어져 있어. 동굴 안 같은 곳에서 빛나는 장소가 있으면 연강석이 떨어져 있을지도 몰라.<end>인생은 급할수록 돌아가라는 말이 있지. 역사가 움직일 만큼 큰 사건은 서두르지 않으면 돌이킬 수 없을지 몰라도, 그 밖의 일은 천천히 해도 벌받지 않아. 마음에 여유가 없으면 새로운 발견도 못 하는 법이야.<end>"

["130008"]
japanese = "<select><value:$20>%3わしは武器を作るのが好きじゃ。<line-break>じゃが、人殺しは好きじゃないのじゃ。<line-break>わしの作った武器で人が死ぬのが悲しいのじゃ。<end>わしは防具を作るのが好きじゃ。<line-break>じゃが、わしの作った防具を着て死んでいく<line-break>人もたくさんおるのじゃ。くやしいのじゃ。<end>いいのじゃ、いいのじゃ、グチを言えるのは<line-break>酔ってる時だけなのじゃ。<line-break>いつもは黙って鍛冶をしておるのじゃ。<end>"
korean = "<select><value:$20>%3난 무기 만드는 걸 좋아한다. 하지만 사람 죽이는 건 싫어. 내가 만든 무기로 사람이 죽는 게 슬프다.<end>난 방어구 만드는 걸 좋아한다. 하지만 내가 만든 방어구를 입고 죽는 사람도 많다. 분하다.<end>괜찮아, 괜찮아. 푸념할 수 있는 건 취했을 때뿐이야. 평소엔 말없이 대장간 일을 하지.<end>"

