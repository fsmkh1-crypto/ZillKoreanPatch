japanese = "<select><value:$33>あたしはリルビーの吟遊詩人なのん。<line-break>旅をして、いろんな国を見ているわ。　　　　　<line-break>それにしても、この国は平和よねえ。<line-break>王妃エリスとエリエナイ公レムオンの<line-break>派閥争いが一番の問題なんですもの。<line-break>ロセンなんて愚王ペウダの支配で大変なのにぃ。<end>あたしはリルビーの吟遊詩人なのん。<line-break>旅をして、いろんな国を見ているわ。　　　　　<line-break>それにしても、この国は平和よねえ。<line-break>王妃エリスとエリエナイ公レムオンの<line-break>派閥争いが一番の問題なんですもの。<line-break>ロセンなんて愚王ペウダの支配で大変なのにぃ。<end>勇者ネメアが新しいディンガル皇帝になったの。<line-break>ディンガルの人たちは新皇帝を歓迎しているよう<line-break>だけど、前の皇帝はホントにかわいそうだよぉ。<line-break>だ～って、さんざん皇帝の器じゃないって陰口<line-break>たたかれて、目障りなネメアを処刑しようと<line-break>したら逃げられて最後は殺されたんだもん。<end>噂の愚王ペウダが処刑されてロセンは<line-break>解放されたみたいなのん。きーっとロセン中で<line-break>お祝いをしてるんだわ。たのしそーだよね。<line-break>あたしもロセンに行ってこようかなぁ。<line-break>カルラちゃんっていう女の子を見てみたいし、<line-break>それに解放祝賀祭に参加したいもん。<end>分断の山脈を越えてロストールに攻めてきた　　<line-break>ディンガルの朱雀将軍アンギルダンって、<line-break>あたし知っているよ。会ったことあるもん。<line-break>真っ赤な全身鎧を着て、とーっても大きな戦斧を<line-break>びゅんびゅん振り回す元気なお爺ちゃんなのん。<line-break>冒険者をやめて将軍様になってたんだねぇ。<end>東にあるリベルダムがカルラちゃんに<line-break>壊されちゃったのん。<line-break>カルラちゃんは恐い人なのかなぁ。<end>カルラちゃんが攻めてくるから、<line-break>みんな大騒ぎなのん。<line-break>カルラちゃんは、ここも壊しちゃうのかなぁ？<end>え～ん、え～ん、勇者ネメアが<line-break>死んじゃうなんてぇ。<line-break>まだ、会ったことなかったのに～。<end>"
korean = "<select><value:$33>나는 릴비의 음유시인이야앙. 여행하면서 여러 나라를 보고 다녀. 그런데 이 나라는 참 평화롭네에. 왕비 에리스와 엘리에나이 공 레몬의 파벌 싸움이 가장 큰 문제라니 말이야. 로센은 우왕 페우다 때문에 난리인데에.<end>나는 릴비의 음유시인이야앙. 여행하면서 여러 나라를 보고 다녀. 그런데 이 나라는 참 평화롭네에. 왕비 에리스와 엘리에나이 공 레몬의 파벌 싸움이 가장 큰 문제라니 말이야. 로센은 우왕 페우다 때문에 난리인데에.<end>용사 네메아가 새 딘갈 황제가 됐어. 딘갈 사람들은 새 황제를 반기는 모양 이지만 전 황제는 정말 불쌍해애. 맨날 황제감이 아니라고 뒤에서 욕먹고, 눈엣가시인 네메아를 처형하려다가 도망쳐 버려서 결국 자기가 죽었잖아.<end>소문난 우왕 페우다가 처형되고 로센이 해방된 모양이야앙. 분명 로센 전체가 축제 분위기겠지. 재밌겠다아. 나도 로센에 가 볼까아. 카를라라는 여자애도 보고 싶고, 해방 축제에도 참가하고 싶거든.<end>분단의 산맥을 넘어 로스톨로 쳐들어온 딘갈의 주작장군 안길단 말이지, 나 알아. 만난 적도 있어. 새빨간 전신 갑옷을 입고 엄청 큰 전투도끼를 휙휙 휘두르는 아주 정정한 할아버지야앙. 모험자를 그만두고 장군이 됐구나아.<end>동쪽의 리베르담이 카를라한테 파괴돼 버렸어어. 카를라는 무서운 사람인 걸까아.<end>카를라가 쳐들어온다니까 다들 난리야앙. 카를라는 여기도 부숴 버리려나아?<end>엉엉, 용사 네메아가 죽어 버리다니이. 아직 만나 보지도 못했는데에.<end>"
