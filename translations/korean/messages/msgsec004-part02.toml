japanese = "<if><value:$2C><less-equal>%9救助の依頼を受けたら、行きがけに出会った<line-break>モンスターを倒しておいた方がいいよ。<line-break>そうすれば帰り道が楽になるから。<end><if><value:$2C><less-equal>%29ロストールの西にあるルンホルスの森は　　　<line-break>気味悪い形の木ばかりで不気味な森だよね。<line-break>なんでも闇の力の影響を受けているそうだよ。<line-break>だから、森の奥に行くとモンスターが凶暴に<line-break>なっちゃうのかもしれないね。<line-break>奥にはいったい何があるんだろうか？<end><if><value:$2C><less-equal>%49珍しい品物を高く買いますよ、<line-break>なんてフゴーの秘書ダイダロに言われたけど、<line-break>珍しい物なんてめったに手に入らないよ。<end>フゴーは有名人の装備品を<line-break>高く買ってくれるそうですよ。<line-break>あなたの装備品なら買ってくれそうですね。<end>"
korean = "<if><value:$2C><less-equal>%9구조 의뢰를 받았다면 가는 길에 만난 몬스터는 미리 쓰러뜨리는 게 좋아. 그러면 돌아오는 길이 편해지니까.<end><if><value:$2C><less-equal>%29로스톨 서쪽의 룬홀스 숲은 기괴하게 생긴 나무들뿐이라 으스스한 숲이지. 어둠의 힘에 영향을 받고 있다더군. 그래서 숲 깊숙이 갈수록 몬스터가 흉폭해지는 건지도 모르겠어. 안쪽에는 대체 뭐가 있는 걸까?<end><if><value:$2C><less-equal>%49진귀한 물건은 비싸게 사 주겠다고 휴고의 비서 다이달로가 말하긴 했지만, 진귀한 물건이라는 게 좀처럼 손에 안 들어오더라.<end>휴고는 유명인의 장비품을 비싸게 사 준다고 해요. 당신 장비라면 사 줄 것 같네요.<end>"
layout = "<if><value:$2C><less-equal>%9구조 의뢰를 받았다면 가는 길에 만난<line-break>몬스터는 미리 쓰러뜨리는 게 좋아.<line-break>그러면 돌아오는 길이 편해지니까.<end><if><value:$2C><less-equal>%29로스톨 서쪽의 룬홀스 숲은<line-break>기괴하게 생긴 나무들뿐이라 으스스한 숲이지.<line-break>어둠의 힘에 영향을 받고 있다더군.<line-break>그래서 숲 깊숙이 갈수록 몬스터가 흉폭해지는<line-break>건지도 모르겠어.<line-break>안쪽에는 대체 뭐가 있는 걸까?<end><if><value:$2C><less-equal>%49진귀한 물건은 비싸게 사 주겠다고<line-break>휴고의 비서 다이달로가 말하긴 했지만,<line-break>진귀한 물건이라는 게 좀처럼 손에 안 들어오더라.<end>휴고는 유명인의 장비품을<line-break>비싸게 사 준다고 해요.<line-break>당신 장비라면 사 줄 것 같네요.<end>"

["40016"]
japanese = "<select><value:$33>なるほど、なるほど…。<line-break>いやあ、この人たちの言うことは<line-break>新米の僕には勉強になるなあ。<line-break>ねえ、君も<line-break>この人たちの言うことを聞いて<line-break>僕と一緒に勉強しないかい？<end>なるほど、なるほど…。<line-break>いやあ、この人たちの言うことは<line-break>新米の僕には勉強になるなあ。<line-break>ねえ、君も<line-break>この人たちの言うことを聞いて<line-break>僕と一緒に勉強しないかい？<end>冒険者って装備品にこだわりを持っている<line-break>もんなんだね。いつも両手剣を使ってる先輩に<line-break>槍をプレゼントしたら怒られちゃったよ。<end>ソウルを変えると、習得していないスキルは使え<line-break>なくなっちゃうんだね。この前ソウルをうっかり<line-break>変えて、魔法が使えなくなって困ったよ。<end>剣聖レーグのように、両手に剣を持って　　　<line-break>戦えるようになるスキルがあるらしいよ。<line-break>たしかダブルブレードだったかな。<line-break>どうやったら習得できるのかは僕も<line-break>知らないけど、ソウルの影響を受けない<line-break>独立したスキルだってことはわかってるんだ。<end>僕の今のソウルはアルバレストなんだけど、<line-break>ウォーロックのロースペルは役に立つから<line-break>スキルポイントを貯めて習得することにするよ。<end>装備品を鍛えるために必要な錬剛石は<line-break>ゼグナ鉱山に落ちているんだ。<line-break>見つけたら教えてあげるよ。<end>ふふふふ…ぼくも今や立派な冒険者ですよ。<line-break>初心者なんて言わせません。<line-break>えっ！　属性の強弱関係ですか…そ、それは…。<end>"
korean = "<select><value:$33>그렇군, 그렇군…. 이야, 이 사람들이 하는 말은 초보인 나한테 정말 공부가 되네. 있잖아, 너도 이 사람들 이야기를 들으면서 나랑 같이 공부하지 않을래?<end>그렇군, 그렇군…. 이야, 이 사람들이 하는 말은 초보인 나한테 정말 공부가 되네. 있잖아, 너도 이 사람들 이야기를 들으면서 나랑 같이 공부하지 않을래?<end>모험자는 장비에 나름의 고집이 있나 봐. 늘 양손검을 쓰는 선배에게 창을 선물했더니 화를 내더라고.<end>소울을 바꾸면 배우지 않은 스킬은 쓸 수 없어지는구나. 얼마 전 실수로 소울을 바꿨다가 마법을 못 써서 곤란했어.<end>검성 레그처럼 양손에 검을 들고 싸울 수 있게 되는 스킬이 있다더라. 아마 더블 블레이드였던가. 어떻게 익히는지는 나도 모르지만, 소울의 영향을 받지 않는 독립 스킬이라는 건 알고 있어.<end>내 지금 소울은 아르발레스트인데, 워록의 로 스펠은 유용하니까 스킬 포인트를 모아서 익히려고.<end>장비를 단련하는 데 필요한 연강석은 제그나 광산에 떨어져 있어. 찾으면 알려 줄게.<end>후후후후… 나도 이제 훌륭한 모험자라고. 초보라고는 못 하게 할 거야. 뭐! 속성 간 상성 말이야… 그, 그건….<end>"
layout = "<select><value:$33>그렇군, 그렇군….<line-break>이야, 이 사람들이 하는 말은<line-break>초보인 나한테 정말 공부가 되네.<line-break>있잖아, 너도<line-break>이 사람들 이야기를 들으면서<line-break>나랑 같이 공부하지 않을래?<end>그렇군, 그렇군….<line-break>이야, 이 사람들이 하는 말은<line-break>초보인 나한테 정말 공부가 되네.<line-break>있잖아, 너도<line-break>이 사람들 이야기를 들으면서<line-break>나랑 같이 공부하지 않을래?<end>모험자는 장비에 나름의 고집이<line-break>있나 봐. 늘 양손검을 쓰는 선배에게<line-break>창을 선물했더니 화를 내더라고.<end>소울을 바꾸면 배우지 않은 스킬은 쓸 수<line-break>없어지는구나. 얼마 전 실수로 소울을<line-break>바꿨다가 마법을 못 써서 곤란했어.<end>검성 레그처럼 양손에 검을 들고<line-break>싸울 수 있게 되는 스킬이 있다더라.<line-break>아마 더블 블레이드였던가.<line-break>어떻게 익히는지는 나도<line-break>모르지만, 소울의 영향을 받지 않는<line-break>독립 스킬이라는 건 알고 있어.<end>내 지금 소울은 아르발레스트인데,<line-break>워록의 로 스펠은 유용하니까<line-break>스킬 포인트를 모아서 익히려고.<end>장비를 단련하는 데 필요한 연강석은<line-break>제그나 광산에 떨어져 있어.<line-break>찾으면 알려 줄게.<end>후후후후… 나도 이제 훌륭한 모험자라고.<line-break>초보라고는 못 하게 할 거야.<line-break>뭐! 속성 간 상성 말이야… 그, 그건….<end>"

["40017"]
japanese = "<select><value:$20>%3この酒場の看板娘、フェルムちゃんは<line-break>明るくて、かわいくて、みんなの人気者じゃ。<line-break>みんな、フェルムちゃん目当てでここに来る。<line-break>もっとも、わしだけは、違うぞ。<line-break>酒場で情報を手に入れるために来とるんじゃ。<line-break>…しかし、フェルムちゃんはかわいいのう。<end>よそから来たえたいの知れない男どもが<line-break>フェルムちゃんに付きまとっておる。<line-break>奴らもフェルムちゃんにほれておるのかのう。<end>ロストールには酒場が２件あるのじゃよ。<line-break>広場の西側にスラムがあってな、<line-break>そこにも酒場があるんじゃ。穴場じゃぞ。<end>"
korean = "<select><value:$20>%3이 술집의 간판 아가씨 펠름은 밝고 귀엽고 모두에게 인기 만점이지. 다들 펠름을 보려고 여기 온다네. 물론 나만은 다르다네. 술집에서 정보를 얻으려고 온 거지. …하지만 펠름은 정말 귀엽구먼.<end>외지에서 온 정체 모를 남자들이 펠름을 따라다니고 있더군. 그놈들도 펠름에게 반한 건가.<end>로스톨에는 술집이 두 군데 있단다. 광장 서쪽에 슬럼이 있는데, 거기에도 술집이 하나 있어. 숨은 명소지.<end>"
