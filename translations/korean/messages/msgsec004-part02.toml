japanese = "<if><value:$2C><less-equal>%9アクセサリーは<line-break>ただの飾りじゃないんですよ。<line-break>上手に使えば本当に役に立つんですから。<line-break>ひ弱な私は体力の首飾りをつけて<line-break>自分の弱点を補強して<line-break>冒険に出ているんですよ。<end><if><value:$2C><less-equal>%29アクセサリーは２個まで装備できることは　　<line-break>ご存知ですよね。装備する組み合わせを考えて<line-break>いると眠れなくなりませんか？<line-break>私もいろいろ迷った結果、体力の首飾りと<line-break>知恵の首飾りを装備して弱点の補強と<line-break>強みの強化をすることにしました。<end><if><value:$2C><less-equal>%49戦闘中のマヒと石化は困りものですよね。<line-break>防具に石化の特殊効果をつければ防げるの<line-break>ですが、お金も錬剛石もなくて無理なんです。<end>闇の神器を集めて破壊神ウルグを復活させ、<line-break>それを倒すことができれば、<line-break>その力を得ることができるといいます。<line-break>しかし、破壊神を倒すことなど<line-break>できるのでしょうか？<end>"
korean = "<if><value:$2C><less-equal>%9액세서리는 그냥 장식품이 아니에요. 잘 활용하면 정말 도움이 되거든요. 허약한 저는 체력의 목걸이를 착용해서 제 약점을 보완한 뒤 모험을 하고 있어요.<end><if><value:$2C><less-equal>%29액세서리는 ２개까지 장비할 수 있다는 건 알고 계시죠? 어떤 조합으로 장비할지 생각하다 보면 잠이 안 오지 않나요? 저도 이것저것 고민한 끝에 체력의 목걸이와 지혜의 목걸이를 장비해서 약점은 보완하고 강점은 강화하기로 했어요.<end><if><value:$2C><less-equal>%49전투 중 마비와 석화는 정말 골치 아프죠. 방어구에 석화 특수 효과를 붙이면 막을 수 있지만, 돈도 연강석도 없어서 무리예요.<end>어둠의 신기를 모아 파괴신 울그를 부활시키고 그걸 쓰러뜨릴 수 있다면 그 힘을 얻을 수 있다고 해요. 하지만 파괴신을 쓰러뜨리는 일이 정말 가능할까요?<end>"
layout = "<if><value:$2C><less-equal>%9액세서리는<line-break>그냥 장식품이 아니에요.<line-break>잘 활용하면 정말 도움이 되거든요.<line-break>허약한 저는 체력의 목걸이를 착용해서<line-break>제 약점을 보완한 뒤<line-break>모험을 하고 있어요.<end><if><value:$2C><less-equal>%29액세서리는 ２개까지 장비할 수 있다는 건<line-break>알고 계시죠? 어떤 조합으로 장비할지 생각하다 보면<line-break>잠이 안 오지 않나요?<line-break>저도 이것저것 고민한 끝에 체력의 목걸이와<line-break>지혜의 목걸이를 장비해서 약점은 보완하고<line-break>강점은 강화하기로 했어요.<end><if><value:$2C><less-equal>%49전투 중 마비와 석화는 정말 골치 아프죠.<line-break>방어구에 석화 특수 효과를 붙이면 막을 수<line-break>있지만, 돈도 연강석도 없어서 무리예요.<end>어둠의 신기를 모아 파괴신 울그를 부활시키고<line-break>그걸 쓰러뜨릴 수 있다면<line-break>그 힘을 얻을 수 있다고 해요.<line-break>하지만 파괴신을 쓰러뜨리는 일이<line-break>정말 가능할까요?<end>"

["40014"]
japanese = "<if><value:$2A><less-equal>%30冒険している途中に怪しげな花や岩を<line-break>目にすることがあると思う。<line-break>そんな時は調べて見ろ。<line-break>そいつが拾えるかもしれないぜ。<line-break>もっとも、持っていると危険な<line-break>ものかもしれないがな。<end><if><value:$2A><less-equal>%75ダンジョンや洞窟でやっかいなのは、<line-break>モンスターなんかよりも、むしろ罠だぜ。<line-break>特に宝箱にしかけられた呪いガスの罠。<line-break>ダンジョンの奥深くであれを食らうと、<line-break>もうダメだぜ。<end><if><value:$2A><less-equal>%120アンチハードルをタイミングよく使うことが<line-break>できるなら、難易度が高い罠でも、<line-break>楽に解除できるんだろうがな。<end>ネガヴァニティアのソウルを持つ者が、<line-break>新月の塔の屋上に登ると、デモリッシュという<line-break>闇の禁呪が身に付くらしいぞ。<line-break>あんたくらいの冒険者なら、<line-break>もう知っていたかもしれないがな。<end>"
korean = "<if><value:$2A><less-equal>%30모험하다 보면 수상한 꽃이나 바위를 보게 될 때가 있을 거야. 그럴 때는 조사해 봐. 그걸 주울 수 있을지도 모르거든. 물론 가지고 있으면 위험한 물건일 수도 있지만 말이야.<end><if><value:$2A><less-equal>%75던전이나 동굴에서 골치 아픈 건 몬스터보다 오히려 함정이야. 특히 보물상자에 설치된 저주 가스 함정 말이지. 던전 깊숙한 곳에서 그걸 맞으면 정말 끝장이야.<end><if><value:$2A><less-equal>%120안티 허들을 타이밍 좋게 사용할 수 있다면 난도가 높은 함정도 쉽게 해제할 수 있겠지.<end>네가바니티아 소울을 지닌 자가 신월의 탑 옥상에 오르면 데몰리시라는 어둠의 금주를 익힐 수 있다더군. 너 정도 되는 모험자라면 이미 알고 있었을지도 모르겠지만.<end>"
