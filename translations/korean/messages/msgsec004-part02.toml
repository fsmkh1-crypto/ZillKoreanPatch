japanese = "<select><value:$33>あそこの女の子、人間の子供みたいだろ？<line-break>でも、あれはリルビーっていう種族なんだ。<line-break>ほら、顔につけぼくろが埋め込まれてるだろ？<line-break>ああ、リルビーはいいよなあ。得だよなあ。<line-break>いつまでも子供みたいな外見だし。<line-break>人間にかわいがられて養ってもらえるし。<end>あそこの女の子、人間の子供みたいだろ？<line-break>でも、あれはリルビーっていう種族なんだ。<line-break>ほら、顔につけぼくろが埋め込まれてるだろ？<line-break>ああ、リルビーはいいよなあ。得だよなあ。<line-break>いつまでも子供みたいな外見だし。<line-break>人間にかわいがられて養ってもらえるし。<end>フェルムちゃんてかわいいよなあ。<line-break>好きな人とかいるのかなあ。<line-break>とっても気になるんだよなあ。<line-break>えっ、何？　ディンガルの皇帝が<line-break>勇者ネメアに代わったって？<line-break>そんなことどうでもいいよ。<end>あそこのリルビーの女の子がロセン解放祝賀祭に<line-break>行くって言ってるんだが、俺はそんなのないから<line-break>行っても無駄だと思うけどなあ。<line-break>だって考えてもみろよ、ロセンが解放されたって<line-break>言うけどディンガル帝国に攻め滅ぼされて<line-break>占領されたんだぜ。ロセンは敗戦国なんだよ。<end>どーするよ、どーするよ。ディンガルが攻めて　<line-break>来たら、ロストールが戦場になっちゃうぞ。<line-break>分断の山脈を越えてくるなんて反則じゃないか。<line-break>貴族や騎士団はいったいどうするんだよ。<line-break>誰が酒場でフェルムちゃんを見ながらぼーっと<line-break>するささやかな幸せを守ってくれるんだ。<end>あそこのリルビーの女の子、リベルダム陥落が<line-break>どれだけ重大な事件なのかわかっているのかな？<line-break>次はロストールに攻めてくるぞ！　きっとだぞ！<end>もうだめだー！<line-break>今のロストールじゃカルラに勝てっこないよー。<line-break>俺の幸せな生活もこれで終わりだー。<end>本当はロストールを逃げ出したい…。<line-break>だけど、フェルムちゃんに会えない<line-break>生活なんて堪えられそうもないんだ。<end>"
korean = "<select><value:$33>저기 여자애, 인간 아이처럼 보이지? 하지만 저건 릴비라는 종족이야. 봐, 얼굴에 점 장식이 박혀 있잖아? 아아, 릴비는 좋겠다. 정말 유리하겠어. 언제까지나 아이 같은 모습이고, 인간에게 귀여움받으며 먹여 살려지니까.<end>저기 여자애, 인간 아이처럼 보이지? 하지만 저건 릴비라는 종족이야. 봐, 얼굴에 점 장식이 박혀 있잖아? 아아, 릴비는 좋겠다. 정말 유리하겠어. 언제까지나 아이 같은 모습이고, 인간에게 귀여움받으며 먹여 살려지니까.<end>펠름은 참 귀엽지. 좋아하는 사람이라도 있으려나. 정말 신경 쓰인단 말이야. 뭐? 딘갈 황제가 용사 네메아로 바뀌었다고? 그런 건 아무래도 좋아.<end>저기 릴비 여자애가 로센 해방 축제에 간다는데, 난 그런 축제는 없을 테니 가 봐야 헛걸음이라고 생각해. 생각해 봐. 로센이 해방됐다고는 하지만 딘갈 제국에게 공격당해 멸망하고 점령된 거잖아. 로센은 패전국이라고.<end>어쩌지, 어쩌지. 딘갈이 쳐들어오면 로스톨이 전쟁터가 되어 버릴 거야. 분단의 산맥을 넘어오는 건 반칙 아니냐고. 귀족이나 기사단은 대체 뭘 하는 거야. 누가 술집에서 펠름을 바라보며 멍하니 있는 이 소소한 행복을 지켜 주는 거냐고.<end>저기 릴비 여자애는 리베르담 함락이 얼마나 큰 사건인지 알고 있는 걸까? 다음에는 로스톨로 쳐들어올 거야! 틀림없어!<end>이젠 끝장이야아! 지금 로스톨로는 카를라를 이길 수 없어어. 내 행복한 생활도 이제 끝이야아.<end>사실은 로스톨에서 도망치고 싶어…. 하지만 펠름을 만날 수 없는 생활은 견딜 수 없을 것 같아.<end>"
