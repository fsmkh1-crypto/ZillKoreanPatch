japanese = "<select><value:$33>王妃エリス様のことを、ファーロスの雌狐って<line-break>バカにする奴らがいるけど<line-break>とんでもないことさね！<line-break>王妃様の知略で、分断の山脈から南、<line-break>ロストールに逆らう国はみんな滅びちまった。<line-break>近頃は戦もない。これも王妃様のおかげさね。<end>この間の地震はすごかったね。ディンガルじゃ<line-break>ノトゥーン神殿の天井が壊れたそうじゃないか。<line-break>悪いことの前ぶれでなければいいんだけどねぇ。<end>ディンガルのネメアが謀反を起こしたって話を　<line-break>聞いたかい！　ネメアが殺した皇帝は、自分の<line-break>叔父さんだっていうじゃないか。<line-break>まったく恐ろしい世の中になっちまったもんさ。<line-break>ロストールが平和なのは、エリス様が謀反を<line-break>起こしそうな人間を排除したおかげかもねえ。<end>ディンガル帝国がロセン王国を攻め滅ぼしたって<line-break>話じゃないか。エリス様がいる限り、ロストール<line-break>には攻めてこないと思うけど…心配だねえ。<end>ディンガル軍が分断の山脈を越えて　　　　　　<line-break>すぐそこまで攻めて来てるらしいじゃないか！<line-break>迎撃のロストール軍は壊滅したっていうし…。<line-break>自決した総司令ノヴィン様に代わって軍の指揮を<line-break>とることになった、息子のゼネテスはどうなった<line-break>んだろうか？　勝ったのかい、それとも…。<end>ディンガルが、とうとうリベルダムまで<line-break>占領しちゃったよ。次はロストールの番…。<line-break>ああ、どうすりゃいいんだろうねえ。<end>血なまぐさいことばかり起きて…ふう。<line-break>ついこの間までは、子供たちの笑い声が<line-break>絶えない、平和な時間が過ごせたってのに…。<end>あのネメアが死んだって話だよ。<line-break>これで平和な時間が戻ってきて<line-break>欲しいものだけど…。<end>"
korean = "<select><value:$33>왕비 에리스 님을 파로스의 암여우라고 비웃는 자들이 있다지만 말도 안 되는 소리야! 왕비님의 지략 덕분에 분단의 산맥 남쪽에서 로스토올에 대항하던 나라들은 모두 멸망했지. 요즘은 전쟁도 없어. 이것도 왕비님 덕분이야.<end>지난번 지진은 정말 대단했지. 딘갈에서는 노툰 신전의 천장이 부서졌다잖아. 나쁜 일의 전조가 아니면 좋겠는데 말이야.<end>딘갈의 네메아가 반란을 일으켰다는 이야기 들었어? 네메아가 죽인 황제는 자기 숙부라잖아. 정말 무서운 세상이 되어 버렸어. 로스토올이 평화로운 건 에리스 님이 반란을 일으킬 만한 자들을 제거한 덕분일지도 모르겠네.<end>딘갈 제국이 로센 왕국을 공격해 멸망시켰다잖아. 에리스 님이 계시는 한 로스토올까지 쳐들어오지는 않겠지만… 그래도 걱정이야.<end>딘갈군이 분단의 산맥을 넘어 바로 코앞까지 쳐들어왔다잖아! 맞서 싸우던 로스토올군은 괴멸했다 하고…. 자결한 총사령관 노빈 님을 대신해 군을 지휘하게 된 아들 제네테스는 어떻게 된 걸까? 이긴 걸까, 아니면….<end>딘갈이 마침내 리벨덤까지 점령해 버렸어. 다음은 로스토올 차례…. 아아, 어떻게 해야 하지.<end>피비린내 나는 일만 계속 벌어지고… 휴. 얼마 전까지만 해도 아이들 웃음소리가 끊이지 않는 평화로운 나날을 보냈는데….<end>그 네메아가 죽었다는 이야기야. 이제 평화로운 시간이 돌아왔으면 좋겠는데….<end>"
