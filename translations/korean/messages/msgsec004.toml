["40001"]
japanese = "<select><value:$33>ここだけの話だが、国王であるセルモノー陛下は<line-break>政治にやる気をなくしていてな。国政はもっぱら<line-break>王妃のエリス様が取り仕切っていらっしゃる。<end>世間では王妃様のことを悪く言っているらしいが<line-break>私はそうは思わない。むしろ尊敬しているのだ。<line-break>ロストールに敵対する国や私利私欲のために<line-break>王政をないがしろにしようとする貴族を<line-break>王妃様が知略を駆使し排除してくださるから<line-break>今の平和があるのではないか。<end>ディンガルでは、魔王バロルを倒した勇者　　　<line-break>ネメアが叔父のエリュマルク帝を殺して<line-break>ディンガル皇帝になったということだ。<line-break>叔父殺しに主君殺し…勇者も罪深い男になり<line-break>下がったものよ。しかし、無能なエリュマルク帝<line-break>と違って、ネメアは切れ者だからやっかいだな。<end>東方諸国の盟主ロセンを滅ぼしたディンガルの<line-break>青竜将軍が１６かそこらの少女だと聞いたのだが<line-break>それは本当なのか？　私にはとても信じられん。<end>総司令ノヴィン様率いる我がロストール軍が<line-break>ディンガルのアンギルダンの奇襲で大敗し、<line-break>総司令は名誉の自決をされたそうだ。<line-break>しかし、ノヴィン様のご子息ゼネテス様が<line-break>弔い合戦に臨まれて見事に仇をとったとか…。<line-break>親の敵を子が討つとは、まさに騎士道だな。<end>リベルダムが陥落したそうだな。<line-break>カルラの次のねらいはロストールだろうが、<line-break>ゼネテス様がいる限り負けはせんぞ！<end>ディンガルのカルラが迫ってきている。<line-break>我々はここを死守せねばならぬのだ！<line-break>用がないなら早く立ち去れ！<end>ディンガルのカルラがこの地を狙っているのだ。<line-break>我々はここを死守せねばならぬ。<line-break>用がないなら早く立ち去れ！<end>"
korean = "<select><value:$33>여기서만 하는 이야기지만, 국왕 셀모노 폐하는 정치에 의욕을 잃으셨다. 국정은 대부분 왕비 에리스 님께서 맡아 처리하고 계시지.<end>세상에서는 왕비님을 험담하는 모양이지만 나는 그렇게 생각하지 않는다. 오히려 존경한다. 로스토올에 적대하는 나라나 사리사욕을 위해 왕정을 업신여기려는 귀족들을 왕비님께서 지략을 발휘해 제거해 주시니 지금의 평화가 있는 것 아니겠나.<end>딘갈에서는 마왕 발로르를 쓰러뜨린 용사 네메아가 숙부 에류마르크 황제를 죽이고 딘갈 황제가 되었다고 한다. 숙부 살해에 주군 살해라… 용사도 죄 많은 남자로 전락했군. 하지만 무능한 에류마르크 황제와 달리 네메아는 수완가라서 골치 아프다.<end>동방 제국의 맹주 로센을 멸망시킨 딘갈의 청룡장군이 열여섯 살쯤 된 소녀라고 들었는데 그게 정말인가? 나는 도저히 믿을 수 없군.<end>총사령관 노빈 님이 이끄는 우리 로스토올군이 딘갈의 앙길단 기습으로 대패했고, 총사령관께서는 명예롭게 자결하셨다고 한다. 하지만 노빈 님의 아드님 제네테스 님이 복수전에 나서 훌륭히 원수를 갚으셨다더군…. 부모의 원수를 자식이 갚다니, 그야말로 기사도다.<end>리벨덤이 함락됐다더군. 카를라의 다음 목표는 로스토올이겠지만, 제네테스 님이 계시는 한 지지는 않는다!<end>딘갈의 카를라가 다가오고 있다. 우리는 이곳을 반드시 사수해야 한다! 용건이 없다면 어서 물러가라!<end>딘갈의 카를라가 이 땅을 노리고 있다. 우리는 이곳을 반드시 사수해야 한다. 용건이 없다면 어서 물러가라!<end>"
layout = "<select><value:$33>여기서만 하는 이야기지만, 국왕 셀모노 폐하는<line-break>정치에 의욕을 잃으셨다. 국정은 대부분<line-break>왕비 에리스 님께서 맡아 처리하고 계시지.<end>세상에서는 왕비님을 험담하는 모양이지만<line-break>나는 그렇게 생각하지 않는다. 오히려 존경한다.<line-break>로스톨에 적대하는 나라나 사리사욕을 위해<line-break>왕정을 업신여기려는 귀족들을<line-break>왕비님께서 지략을 발휘해 제거해 주시니<line-break>지금의 평화가 있는 것 아니겠나.<end>딘갈에서는 마왕 바로르를 쓰러뜨린 용사<line-break>네메아가 숙부 에류마르크 황제를 죽이고<line-break>딘갈 황제가 되었다고 한다.<line-break>숙부 살해에 주군 살해라… 용사도 죄 많은 남자로<line-break>전락했군. 하지만 무능한 에류마르크 황제와<line-break>달리 네메아는 수완가라서 골치 아프다.<end>동방 제국의 맹주 로센을 멸망시킨 딘갈의<line-break>청룡장군이 열여섯 살쯤 된 소녀라고 들었는데<line-break>그게 정말인가? 나는 도저히 믿을 수 없군.<end>총사령관 노빈 님이 이끄는 우리 로스톨군이<line-break>딘갈의 안길단 기습으로 대패했고,<line-break>총사령관께서는 명예롭게 자결하셨다고 한다.<line-break>하지만 노빈 님의 아드님 제네테스 님이<line-break>복수전에 나서 훌륭히 원수를 갚으셨다더군….<line-break>부모의 원수를 자식이 갚다니, 그야말로 기사도다.<end>리베르담이 함락됐다더군.<line-break>카를라의 다음 목표는 로스톨이겠지만,<line-break>제네테스 님이 계시는 한 지지는 않는다!<end>딘갈의 카를라가 다가오고 있다.<line-break>우리는 이곳을 반드시 사수해야 한다!<line-break>용건이 없다면 어서 물러가라!<end>딘갈의 카를라가 이 땅을 노리고 있다.<line-break>우리는 이곳을 반드시 사수해야 한다.<line-break>용건이 없다면 어서 물러가라!<end>"

["40002"]
