japanese = "<if><value:$2A><less-equal>%50冒険者ってもうかるのかーい？<line-break>ロストールじゃ貴族の子供しか貴族になれない<line-break>から、平民は才能があっても平民なのさー。<line-break>普通に働いてちゃ、金持ちになれないのさー。<line-break>冒険者がもうかる仕事なら、ボクも転職して<line-break>冒険者になろうと思っているけど、どーだい？<end><if><value:$2A><less-equal>%150冒険者ってとーっても危険らしいじゃーん。　　<line-break>ボクは才能にあふれる男だけど、危険なことは<line-break>しない主義なのさー。<line-break>だから冒険者になるのはやめることにしたよー。<line-break>冒険者は有名にならないとダメなんだろー。<line-break>キミの噂はぜーんぜん聞かないよ、どしたのー？<end>やあ、<value:$2B>さーん。<line-break>キミもけっこう有名人みたいじゃーん。　　<line-break>ボクが水面下で宣伝活動したおかげだよー。<line-break>えっ！　ボクかーい？<line-break>ボクは相変わらずダイアモンドの原石さー。<line-break>磨いてくれる人はどこなのかなー。<end>"
korean = "<if><value:$2A><less-equal>%50모험자는 돈을 많이 버나아? 로스토올에서는 귀족 자식만 귀족이 될 수 있으니까, 평민은 재능이 있어도 평민이거든. 평범하게 일해서는 부자가 될 수 없어어. 모험자가 돈 되는 직업이라면 나도 전직해서 모험자가 될까 하는데, 어때에?<end><if><value:$2A><less-equal>%150모험자라는 건 엄청 위험하다면서어. 나는 재능이 넘치는 남자지만 위험한 일은 안 하는 주의거든. 그래서 모험자가 되는 건 관두기로 했어어. 모험자는 유명해져야 한다며어. 근데 네 소문은 전혀 안 들리는데, 왜 그래애?<end>안녕, <value:$2B> 씨이. 너도 꽤 유명해진 것 같네에. 내가 물밑에서 홍보해 준 덕분이야아. 응? 나 말이야아? 나는 여전히 다이아몬드 원석이지이. 나를 갈고닦아 줄 사람은 어디 있으려나아.<end>"
