["40003"]
japanese = "<if><value:$2C><less-equal>%9ここは、リューガ家の流れをくむ、<line-break>ルブルグ伯タルテュバ様のお屋敷だ。　　　<line-break>用のない者は立ち去るがよい。<line-break>…いやホント、早く行った方がいいぞ。<line-break>タルテュバ様は平民いじめが趣味の<line-break>貴族の家柄を鼻にかけたイヤな人だからな。<end><if><value:$2C><less-equal>%29どうした冒険者、道にでも迷ったのか？　　　　<line-break>ここは七竜家のひとつリューガ家をはじめとする<line-break>大貴族の方々のお屋敷が並ぶ通りだ。<line-break>七竜家は征服帝ランガスターを倒しロストールを<line-break>建国した七人の勇者の子孫で、王に匹敵する<line-break>権威をもつ恐ろしい方々なんだからな。<end><if><value:$2C><less-equal>%49お前…タルテュバ様を狙う刺客ではないのか。<line-break>そのただならぬ雰囲気、どこか怪しいぞ。<end>屋敷の前をちょろちょろするんじゃない。<line-break>用がないなら、どこかへ行け！<end>"
korean = "<if><value:$2C><less-equal>%9여기는 류가 가문의 혈통을 이은 루브르그 백작 타르튜바 님의 저택이다. 용건 없는 자는 물러가라. …아니, 정말로 빨리 가는 게 좋아. 타르튜바 님은 평민 괴롭히기가 취미인 데다 귀족 집안을 내세우는 불쾌한 분이거든.<end><if><value:$2C><less-equal>%29왜 그러지, 모험자? 길이라도 잃었나? 여기는 칠룡가 중 하나인 류가 가문을 비롯해 대귀족들의 저택이 늘어선 거리다. 칠룡가는 정복제 랑가스터를 쓰러뜨리고 로스토올을 건국한 일곱 용사의 후손으로, 왕에 필적하는 권위를 지닌 무서운 분들이란 말이지.<end><if><value:$2C><less-equal>%49너… 타르튜바 님을 노리는 자객은 아니겠지. 그 범상치 않은 분위기, 어딘가 수상한데.<end>저택 앞에서 얼쩡거리지 마라. 용건이 없으면 다른 데로 가!<end>"
layout = "<if><value:$2C><less-equal>%9여기는 류가 가문의 혈통을 이은<line-break>루부르그 백작 타르튜바 님의 저택이다.<line-break>용건 없는 자는 물러가라.<line-break>…아니, 정말로 빨리 가는 게 좋아.<line-break>타르튜바 님은 평민 괴롭히기가 취미인 데다<line-break>귀족 집안을 내세우는 불쾌한 분이거든.<end><if><value:$2C><less-equal>%29왜 그러지, 모험자? 길이라도 잃었나?<line-break>여기는 칠룡가 중 하나인 류가 가문을 비롯해<line-break>대귀족들의 저택이 늘어선 거리다.<line-break>칠룡가는 정복제 랑가스터를 쓰러뜨리고 로스톨을<line-break>건국한 일곱 용사의 후손으로, 왕에 필적하는<line-break>권위를 지닌 무서운 분들이란 말이지.<end><if><value:$2C><less-equal>%49너… 타르튜바 님을 노리는 자객은 아니겠지.<line-break>그 범상치 않은 분위기, 어딘가 수상한데.<end>저택 앞에서 얼쩡거리지 마라.<line-break>용건이 없으면 다른 데로 가!<end>"

["40004"]
japanese = "<if><value:$2C><less-equal>%20ダルケニスを知っとるかの？<line-break>人間の生き血を吸う恐ろしい種族じゃ！<line-break>お前のような弱い者は奴らの餌食になるぞ。　<line-break>ふぉふぉ、恐がることはないて。<line-break>もう、ダルケニスは冒険者に退治され尽くして<line-break>今時は、ほとんど絶滅しとるでな。<end><if><value:$2C><less-equal>%40人の生き血を吸う恐ろしいダルケニス族はのう、<line-break>月神セリューンの従者じゃから、新月の晩には<line-break>とーんでもない怪力の化け物になるんじゃよ。<line-break>新月の晩は１人で出歩かんことじゃて。<line-break>ふぉふぉ、恐いじゃろ。でも安心せい、<line-break>ダルケニスはほとんど全滅しとるでな。<end>新月の塔を知っておるかの？<line-break>あそこは、ダルケニス族の聖地と呼ばれとる。<line-break>一度行ってみるとええじゃろうて。<end>"
korean = "<if><value:$2C><less-equal>%20다르케니스를 아느냐? 사람의 생피를 빠는 무시무시한 종족이지! 너처럼 약한 자는 놈들의 먹잇감이 될 게다. 허허, 무서워할 것 없다. 이제 다르케니스는 모험자들에게 거의 다 토벌돼서 요즘은 사실상 멸종 직전이니까.<end><if><value:$2C><less-equal>%40사람의 생피를 빠는 무시무시한 다르케니스족은 말이다, 월신 세리운의 종자라서 초승달이 뜨지 않는 밤에는 터무니없는 괴력의 괴물이 된단다. 신월의 밤에는 혼자 돌아다니지 마라. 허허, 무섭지? 하지만 안심해라. 다르케니스는 거의 전멸했으니까.<end>신월의 탑을 알고 있느냐? 그곳은 다르케니스족의 성지라고 불린다. 한번 가 보는 것도 좋겠구나.<end>"
