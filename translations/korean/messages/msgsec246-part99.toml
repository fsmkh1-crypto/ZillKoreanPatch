["2460003"]
japanese = "ふむ。まあよかろう。<line-break>ここまでたどり着けたのであれば、<line-break>ことさら隠す必要もあるまい。<line-break>心して聞くがよい。<line-break><value:$28>よ…。<line-break>　<line-break>汝は余によって造られた人間だ。<line-break>　<line-break>　<line-break>果たして人間と呼んでいいかは<line-break>わからぬがな。<end>"
korean = "흠. 뭐 좋다. 여기까지 도달했다면 굳이 숨길 필요도 없겠지. 마음 단단히 먹고 들어라. <value:$28>여…. 그대는 짐이 만든 인간이다. 과연 인간이라 불러도 되는지는 모르겠다만.<end>"

["2460004"]
japanese = "かつて余は幽閉される前に<line-break>先人類の魔道技術を使って<line-break>不死の研究を続けていた。<line-break>その結果、偶発的ではあったが<line-break>無限のソウルを宿せる肉体が<line-break>完成した…。<line-break>ただし、余の望んだ不死の能力は<line-break>備わっていなかったがな…。<line-break>　<line-break>それが汝だ。<value:$28>よ。<line-break>汝は、研究の副産物として誕生し、<line-break>余ととともに封印されていたのだ。<line-break>よもや汝がこの時代に目覚めるとは<line-break>余にとっても想定外だったがな…。<end>"
korean = "예전에 짐은 유폐되기 전 선인류의 마도 기술을 이용해 불사의 연구를 계속하고 있었다. 그 결과 우연이긴 했지만 무한의 소울을 담을 수 있는 육체가 완성되었다…. 다만 짐이 바라던 불사의 능력은 갖추지 못했지만 말이다…. 그것이 바로 너다, <value:$28>. 너는 연구의 부산물로 태어나 짐과 함께 봉인되어 있었다. 설마 네가 이 시대에 깨어날 줄은 짐에게도 예상 밖이었지만 말이다….<end>"

["2460005"]
japanese = "クックック。愚かな…。<line-break>教えてほしいと望んだのは汝自身だぞ。<line-break>　<line-break>たかだか出生の秘密を知ったところで、<line-break>動揺して何になる？<line-break>　<line-break>父母から命をもらおうと、<line-break>研究によって誕生しようと<line-break>瑣末な問題だ。取るに足らぬ。<end>"
korean = "큭큭큭. 어리석군…. 알려 달라고 원한 건 그대 자신이다. 고작 출생의 비밀을 알았다고 동요해서 무엇 하겠나? 부모에게 생명을 받았든 연구로 태어났든 사소한 문제다. 하찮은 일이지.<end>"

["2460006"]
japanese = "ほう。自分が造られた存在で<line-break>あることに激昂したか。<line-break>人間並みの感情はできているようだな。<line-break>だが、封印された余の肉体に<line-break>汝の剣では傷ひとつつけられぬ。<line-break>　<line-break>それに余は汝の敵ではない。<line-break>汝にとって創造者であり、<line-break>唯一の理解者なのだぞ。<end>"
korean = "호오. 자신이 만들어진 존재라는 사실에 격분했나. 인간다운 감정은 제대로 갖췄나 보군. 하지만 봉인된 짐의 육체에는 네 검으로 상처 하나 낼 수 없다. 게다가 짐은 네 적이 아니다. 네 창조자이자 유일한 이해자다.<end>"

["2460007"]
japanese = "フフフ。そうだ…。<line-break>おとなしく余の話を聞くがよい。<end>"
korean = "후후후. 그래…. 얌전히 짐의 이야기를 듣거라.<end>"

["2460008"]
japanese = "<value:$28>よ。<line-break>余は汝の力を必要としている。<line-break>　<line-break>余が完全に復活するためには、<line-break>その器となる肉体が必要なのだ。<line-break>　<line-break>特に余の息子、ベルゼーヴァの<line-break>身体であれば申し分ない。<line-break>　<line-break>余は復活し、人類の革新に邪魔な<line-break>竜どもを完全に滅ぼさねばならぬ。<line-break>特に余を封じた竜王は、な。<end>"
korean = "<value:$28>여. 나는 네 힘이 필요하다. 내가 완전히 부활하려면 그 그릇이 될 육체가 필요하지. 특히 내 아들 벨제바의 몸이라면 더할 나위 없다. 나는 부활해 인류의 혁신을 방해하는 용들을 완전히 멸해야 한다. 특히 나를 봉인한 용왕을 말이지.<end>"

["2460009"]
japanese = "わかるか、<value:$28>よ。<line-break>汝は生みの親である余に<line-break>協力するのだ。<line-break>そうすれば、余は汝に、<line-break>人類の革新という生きる目的と<line-break>価値ある意義を授けよう。<end>"
korean = "알겠느냐, <value:$28>여. 그대는 창조자인 나에게 협력해야 한다. 그러면 나는 인류의 혁신이라는 삶의 목적과 가치 있는 의의를 주겠다.<end>"

["2460010"]
japanese = "フフフ。まさかベルゼーヴァの言動や<line-break>ネメアごときを信じているのか？<line-break>　<line-break>それこそ夢想というものだ。<line-break>所詮、あのふたりでは<line-break>人類の革新は成し得まい。<end>"
korean = "후후후. 설마 벨제바의 말과 행동이나 네메아 따위를 믿는 건가? 그야말로 몽상이지. 결국 그 둘로는 인류의 혁신을 이룰 수 없을 것이다.<end>"

["2460011"]
japanese = "よく考えてみるがよい。<line-break>人間だけの力で本当に<line-break>人類の革新が可能かどうかを…。<line-break>もし可能であれば、とうの昔に<line-break>人類は完成し、すべてを超越した<line-break>至高の存在となっているだろう。<line-break>竜王ごときもこの世におるまい。<line-break>それが現実はどうだ？<line-break>　<line-break>竜王は依然として世界を裏から操り、<line-break>人類の進化を停滞せしめている。<line-break>　<line-break>あくことなき愚かな争いが続く、<line-break>暗黒に満ちた不安定な混沌の世界…<line-break>それこそまさに竜王の望むもの。<end>"
korean = "잘 생각해 보아라. 인간만의 힘으로 정말 인류의 혁신이 가능한지를…. 가능했다면 인류는 진작 완성되어 모든 것을 초월한 지고의 존재가 되었겠지. 용왕 따위도 이 세상에 없었을 것이다. 하지만 현실은 어떤가? 용왕은 여전히 뒤에서 세계를 조종하며 인류의 진화를 정체시키고 있다. 끝없는 어리석은 싸움이 이어지는 어둠과 불안으로 가득한 혼돈의 세계…. 바로 그것이 용왕이 바라는 것이다.<end>"

["2460012"]
japanese = "<value:$28>よ。汝は余とともに<line-break>神々や竜王の支配を断ち切り、<line-break>新しき人類の未来を築くのだ。<line-break>汝のように優れた資質を持った者と、<line-break>余の魔道技術が合わさってこそ、<line-break>人類の革新は果たせよう。<end>"
korean = "<value:$28>여. 너는 짐과 함께 신들과 용왕의 지배를 끊고 새로운 인류의 미래를 세우는 것이다. 너처럼 뛰어난 자질을 지닌 자와 짐의 마도기술이 합쳐져야 인류의 혁신을 이룰 수 있으리라.<end>"

