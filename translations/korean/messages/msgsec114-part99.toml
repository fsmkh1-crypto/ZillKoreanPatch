["1140002"]
japanese = "よく来てくれたわね、　　　　　<line-break><value:$28>。<line-break>　<line-break>今日は、どうしても<line-break>あなたにお礼が言いたかったの。<end>"
korean = "잘 와 줬어, <value:$28>. 오늘은 꼭 네게 감사하다는 말을 하고 싶었어.<end>"

["1140005"]
japanese = "私は、闇を憎んでいるのよ。　<line-break>　<line-break>　<line-break>なぜなら、私の体の中にも<line-break>闇が巣くっているから。<line-break>あなたも墓地で見たでしょう？<end>"
korean = "난 어둠을 증오해. 내 몸속에도 어둠이 깃들어 있으니까. 당신도 묘지에서 봤잖아?<end>"

["1140006"]
japanese = "ふふふ、聞かせてあげるわ。<line-break>私がなぜ闇にとりつかれたのか。<end>"
korean = "후후후, 들려주지. 내가 왜 어둠에 사로잡혔는지.<end>"

["1140007"]
japanese = "あれは、まだディンガルが、<line-break>魔王バロルに支配されていたころ、<line-break>妖術宰相ゾフォルはこう予言した…。<line-break>ザギヴがディンガルを支配する<line-break>…とね。<end>"
korean = "그건 아직 딩갈이 마왕 바로르에게 지배받던 시절, 요술재상 조포르는 이렇게 예언했어…. 자기브가 딩갈을 지배할 것이라고….<end>"

["1140008"]
japanese = "それで、私の家族は魔王バロルに<line-break>捕らえられて…破壊神の円卓騎士<line-break>マゴスの餌食に…………。<line-break>マゴスには魔法も…打撃も…<line-break>効かなかった。<end>"
korean = "그래서 내 가족은 마왕 바로르에게 붙잡혀… 파괴신의 원탁기사 마고스의 먹이가 됐어… 마고스에겐 마법도… 타격도… 통하지 않았어.<end>"

["1140010"]
japanese = "私…だけ…。<end>"
korean = "나…만….<end>"

["1140014"]
japanese = "ふふふ…。ごめんなさい。<line-break>こんな話を聞きに来たんじゃないわね。<line-break>闇の怪物退治、ありがとう。<line-break>これは私からの気持ちよ。<line-break>受け取っておいて。<end>"
korean = "후후후…. 미안해. 이런 이야기를 들으러 온 건 아니지. 어둠의 괴물을 퇴치해 줘서 고마워. 이건 내 마음이야. 받아 둬.<end>"

["1140015"]
japanese = "くだらない話を<line-break>聞いてくれて、ありがとう。<line-break>　<line-break>少し楽になったわ。<end>"
korean = "시답잖은 얘기 들어줘서 고마워. 조금은 마음이 편해졌어.<end>"

["1140017"]
japanese = "あの話を聞いて<line-break>まだここに来るなんて…。　　　<line-break>　<line-break>ふふふ、変な人ね。<line-break>うれしいけど、複雑な気分だわ。<end>"
korean = "그 이야기를 듣고도 여기 오다니…. 후후, 이상한 사람이네. 기쁘긴 하지만 복잡한 기분이야.<end>"

["1140018"]
japanese = "私、いつまで<line-break>この闇を抑えておけるのかしら？　<line-break>　<line-break>もし、闇に飲まれてしまったら…。<line-break>その時は、きっとネメア様が<line-break>楽にしてくれるわよね。<end>"
korean = "나는 언제까지 이 어둠을 억누를 수 있을까? 만약 어둠에 삼켜진다면… 그때는 분명 네메아 님이 편하게 해 주겠지.<end>"

["1140019"]
japanese = "エリュマルク帝のように…。　　<line-break>　<line-break>　<line-break>それとも、あなたがしてくれる？<line-break>ふふふ。それも悪くないわね。<end>"
korean = "에류마르크 황제처럼…. 아니면 당신이 해 줄래? 후후후. 그것도 나쁘지 않겠네.<end>"

["1140020"]
japanese = "ゾフォルの予言は<line-break>成就しないですみそうね。<line-break>　<line-break>ネメア様がいれば<line-break>何もかも平気だわ。<line-break>…あなたもいるしね。<end>"
korean = "조포르의 예언은 이루어지지 않을 것 같네. 네메아 님이 있으면 아무 걱정 없어. …당신도 있고.<end>"

["1140021"]
