["1140001"]
japanese = "ザギヴに気に入られているようだな。<line-break>だが、気をつけることだ。<line-break>見た目では判断できぬからな。<end>"
korean = "자기브에게 꽤 마음에 든 모양이군. 하지만 조심해. 겉모습만으로는 판단할 수 없으니까.<end>"

["1140002"]
japanese = "よく来てくれたわね、　　　　　<line-break><value:$28>。<line-break>　<line-break>今日は、どうしても<line-break>あなたにお礼が言いたかったの。<end>"
korean = "잘 와 줬어, <value:$28>. 오늘은 꼭 네게 감사하다는 말을 하고 싶었어.<end>"

["1140003"]
japanese = "あなたがギルドで受けていた　　　　　<line-break>モンスター退治の依頼の中には、<line-break>闇の怪物も含まれていたのよ。<line-break>私もずっと追っていたの。<line-break>一匹でも多くこの世から消すためにね。<end>"
korean = "당신이 길드에서 받은 몬스터 토벌 의뢰 중에는 어둠의 괴물도 섞여 있었어. 나도 계속 쫓고 있었지. 한 마리라도 더 이 세상에서 없애려고.<end>"

["1140004"]
japanese = "あなたのおかげで<line-break>ずいぶんと気分が楽になったわ。<line-break>ありがとう、殺してくれて。<end>"
korean = "당신 덕분에 마음이 한결 편해졌어. 고마워, 죽여 줘서.<end>"

["1140005"]
japanese = "私は、闇を憎んでいるのよ。　<line-break>　<line-break>　<line-break>なぜなら、私の体の中にも<line-break>闇が巣くっているから。<line-break>あなたも墓地で見たでしょう？<end>"
korean = "난 어둠을 증오해. 내 몸속에도 어둠이 깃들어 있으니까. 당신도 묘지에서 봤잖아?<end>"

["1140006"]
japanese = "ふふふ、聞かせてあげるわ。<line-break>私がなぜ闇にとりつかれたのか。<end>"
korean = "후후후, 들려주지. 내가 왜 어둠에 사로잡혔는지.<end>"

["1140007"]
japanese = "あれは、まだディンガルが、<line-break>魔王バロルに支配されていたころ、<line-break>妖術宰相ゾフォルはこう予言した…。<line-break>ザギヴがディンガルを支配する<line-break>…とね。<end>"
korean = "그건 아직 딩갈이 마왕 발로르에게 지배받던 시절, 요술재상 조포르는 이렇게 예언했어…. 자기브가 딩갈을 지배할 것이라고….<end>"

["1140008"]
japanese = "それで、私の家族は魔王バロルに<line-break>捕らえられて…破壊神の円卓騎士<line-break>マゴスの餌食に…………。<line-break>マゴスには魔法も…打撃も…<line-break>効かなかった。<end>"
korean = "그래서 내 가족은 마왕 발로르에게 붙잡혀… 파괴신의 원탁기사 마고스의 먹이가 됐어… 마고스에겐 마법도… 타격도… 통하지 않았어.<end>"

["1140009"]
japanese = "私の目の前で…家族が、私の家族が…<line-break>なぶり殺されて…いったわ。<line-break>私が…ザギヴ…だったばっかりに…。<line-break>あのとき…、<line-break>ネメア様が助けに来てくださって、<line-break>私だけ…助かった…。<end>"
korean = "내 눈앞에서… 가족이, 내 가족이… 잔혹하게 죽어 갔어. 내가… 자기브였기 때문에…. 그때… 네메아 님이 구하러 와 주셔서 나만… 살아남았어….<end>"

["1140010"]
japanese = "私…だけ…。<end>"
korean = "나…만….<end>"

["1140011"]
japanese = "マゴスはその時、私の中に潜んだの。<line-break>それ以来、私の中にはマゴスが<line-break>棲み続けているわ。<end>"
korean = "마고스는 그때 내 안에 숨어들었어. 그 뒤로 줄곧 내 안에는 마고스가 살고 있어.<end>"

["1140012"]
japanese = "マゴスは死んでいない。<line-break>私の中に逃げ込んで、生きている。<line-break>でも、ネメア様は私を殺さなかった…。<end>"
korean = "마고스는 죽지 않았어. 내 안으로 도망쳐 살아 있어. 하지만 네메아 님은 나를 죽이지 않았어….<end>"

["1140013"]
japanese = "闇に巣くわれていようと、<line-break>心までは闇に堕ちていないなら<line-break>戦え。生き続けろって…。<end>"
korean = "어둠이 깃들어 있어도 마음까지 어둠에 떨어지지 않았다면 싸워. 계속 살아가라고….<end>"

["1140014"]
japanese = "ふふふ…。ごめんなさい。<line-break>こんな話を聞きに来たんじゃないわね。<line-break>闇の怪物退治、ありがとう。<line-break>これは私からの気持ちよ。<line-break>受け取っておいて。<end>"
korean = "후후후…. 미안해. 이런 이야기를 들으러 온 건 아니지. 어둠의 괴물을 퇴치해 줘서 고마워. 이건 내 마음이야. 받아 둬.<end>"

["1140015"]
japanese = "くだらない話を<line-break>聞いてくれて、ありがとう。<line-break>　<line-break>少し楽になったわ。<end>"
korean = "시답잖은 얘기 들어줘서 고마워. 조금은 마음이 편해졌어.<end>"

["1140016"]
