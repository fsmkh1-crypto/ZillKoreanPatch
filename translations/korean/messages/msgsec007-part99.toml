["70018"]
japanese = "<if><value:$2C><less-equal>%15さすがに剣聖の名を持つだけのことはある。<line-break>レーグの強さは本物だよ。<line-break><line-break>だが、わしとしては<line-break>彼と互角に戦えるヤツがいないと<line-break>試合がおもしろくないんだな。<end><if><value:$2C><less-equal>%25ゼネテスという冒険者が、<line-break>なかなかの腕前らしいじゃないか。<line-break>闘技大会でレーグと戦ってくれないかな。<end><if><value:$2C><less-equal>%35最近、気になっている冒険者がいるのだよ。<line-break>顔は知らないのだが見かけによらず強いらしい。<line-break>たしか、<value:$28>とかいったかな…。<end>おお、<value:$28>ではないか！<line-break>君なら永遠の王者になれるはずだ。<line-break>わたしは期待しているからな。<end>"
korean = "<if><value:$2C><less-equal>%15과연 검성이라는 이름값은 하는군. 레그의 강함은 진짜야.  하지만 내 입장에선 그와 호각으로 싸울 녀석이 없으면 경기가 재미없단 말이지.<end><if><value:$2C><less-equal>%25제네테스라는 모험자가 상당한 실력자라면서? 투기대회에서 레그와 싸워 주지 않으려나.<end><if><value:$2C><less-equal>%35요즘 신경 쓰이는 모험자가 하나 있어. 얼굴은 모르지만 보기와 달리 강하다더군. 확실히 <value:$28>라고 했던가….<end>오오, <value:$28> 아닌가! 자네라면 영원한 왕자가 될 수 있을 거야. 기대하고 있네.<end>"

