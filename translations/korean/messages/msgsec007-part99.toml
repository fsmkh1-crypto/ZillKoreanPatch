["70006"]
japanese = "<select><value:$33>悪魔はペウダだけじゃない。<line-break>ペウダに武器やモンスターを売る<line-break>リベルダムの商人も悪魔だよ。<end>悪魔はペウダだけじゃない。<line-break>ペウダに武器やモンスターを売る<line-break>リベルダムの商人も悪魔だよ。<end>悪魔はペウダだけじゃない。<line-break>ペウダに武器やモンスターを売る<line-break>リベルダムの商人も悪魔だよ。<end>みんなペウダが処刑されて喜んでいるけど<line-break>何がうれしいんだい。ロセンの支配者が<line-break>ペウダからディンガル帝国に代わっただけだよ。<line-break>あたしたちの暮らしがよくなるって保証は<line-break>どこにもないんだ。もっと悲惨な生活が<line-break>待っているかもしれないのにさ。<end>自ら解放軍を名乗ってロセン王家再興を目指す<line-break>集団がいるらしいね。しかも旗印がリベルダムの<line-break>武器商人ロティの娘なんて笑っちゃうよ。<line-break>ペウダがあたしらの税金で武器を買って<line-break>さんざんもうけさせてやったのに、<line-break>こんどは国まで売ってやるつもりなのかね。<end>リベルダムが破壊されたもんで、<line-break>あのフゴーが引っ越してきたよ。<line-break>ギルドのとなりの建物がそうだよ。<end>戦争、戦争って…。<line-break>カルラは戦争以外に興味がないのかね。<line-break>少しはロセン復興に力を入れて欲しいよ。<end>すべては救世主エルファス様の予言通りに<line-break>なってきたねえ。<line-break>本当に世界は滅んでしまうのかい？<end>"
korean = "<select><value:$33>악마는 페우다만이 아니야. 페우다에게 무기와 몬스터를 파는 리벨덤 상인들도 악마라고.<end>악마는 페우다만이 아니야. 페우다에게 무기와 몬스터를 파는 리벨덤 상인들도 악마라고.<end>악마는 페우다만이 아니야. 페우다에게 무기와 몬스터를 파는 리벨덤 상인들도 악마라고.<end>다들 페우다가 처형됐다고 좋아하지만 뭐가 그렇게 기쁜 거야. 로센의 지배자가 페우다에서 딩갈 제국으로 바뀌었을 뿐이야. 우리 생활이 나아진다는 보장은 어디에도 없어. 더 비참한 삶이 기다릴지도 모르는데.<end>스스로 해방군을 자처하며 로센 왕가 재흥을 노리는 집단이 있다더군. 게다가 기치로 내세운 게 리벨덤 무기상 로티의 딸이라니 웃기지도 않아. 페우다가 우리 세금으로 무기를 사 줘서 실컷 벌게 해 줬더니 이번엔 나라까지 팔아먹을 셈인가 봐.<end>리벨덤이 파괴돼서 그 휴고가 이사 왔어. 길드 옆 건물이 바로 거야.<end>전쟁, 전쟁이라니…. 카를라는 전쟁 말고는 관심이 없는 거야? 로센 복구에도 좀 힘을 써 줬으면 좋겠어.<end>모든 게 구세주 엘파스 님의 예언대로 되어 가는군. 정말 세계는 멸망하는 걸까?<end>"

["70007"]
japanese = "<if><value:$2C><less-equal>%9ロセン周辺のモンスターは手強いぞ。<line-break>駆け出しの冒険者は近づかないほうが<line-break>賢明だと思うがな。<end><if><value:$2C><less-equal>%29ロセンの東にある火山岩地帯は　　　　　<line-break>戦神ソリアスと破壊神ウルグの戦いで<line-break>噴火した炎竜山の溶岩でできたそうだよ。<line-break>モンスターは少々手強いが、お前の<line-break>レベルならそれほど苦戦もしないだろう。<line-break>今度行ってみるといい。<end><if><value:$2C><less-equal>%49精霊神は禁呪を守っているという。<line-break>その力を求めている冒険者も多いというが、<line-break>まだ、その力を得た者はいないそうだ。<end>精霊神を封じている巨人をすべて倒すと、<line-break>闇の女神ティラが復活するという伝説がある。<line-break>恐ろしい伝説だと思わないか？<end>"
korean = "<if><value:$2C><less-equal>%9로센 주변의 몬스터는 강하다. 초보 모험자는 가까이 가지 않는 게 현명할 거다.<end><if><value:$2C><less-equal>%29로센 동쪽의 화산암 지대는 전신 솔리아스와 파괴신 울그의 싸움으로 분화한 염룡산의 용암이 굳어 만들어졌다고 해. 몬스터가 좀 강하지만 네 레벨이면 크게 고전하진 않을 거다. 다음에 가 봐.<end><if><value:$2C><less-equal>%49정령신은 금주를 지키고 있다고 하지. 그 힘을 원하는 모험자도 많다지만 아직 그 힘을 얻은 자는 없다고 해.<end>정령신을 봉인한 거인들을 모두 쓰러뜨리면 어둠의 여신 티라가 부활한다는 전설이 있어. 무서운 전설이라고 생각하지 않나?<end>"

["70008"]
japanese = "<if><value:$2C><less-equal>%29魔法が使えるようになるスペル系の　　　<line-break>スキルは冒険の中で役に立つはずだ。<line-break>できるだけ習得しておいたほうがいいな。<end><if><value:$2C><less-equal>%49ロセンの北東にある地下墓地は迷宮になって<line-break>いるんだ。奥には巨大な墓があるらしいんだが<line-break>誰の墓かは学者が調べてもわからないそうだ。<end>新月の塔を知っているか？<line-break>ネガヴァニティアを持つ者には、<line-break>闇の禁呪を与えるらしいが本当だろうか。<end>"
korean = "<if><value:$2C><less-equal>%29마법을 사용할 수 있게 해 주는 스펠 계열 스킬은 모험 중에 도움이 될 거야. 가능한 한 익혀 두는 게 좋겠군.<end><if><value:$2C><less-equal>%49로센 북동쪽에 있는 지하묘지는 미궁으로 되어 있어. 안쪽에는 거대한 무덤이 있다는데, 누구의 무덤인지는 학자들이 조사해도 모른다고 하더군.<end>신월의 탑을 알고 있나? 네가바니티아를 지닌 자에게는 어둠의 금주를 준다는데 사실일까.<end>"

["70009"]
japanese = "<if><value:$2A><less-equal>%49魔法を使うにはスキルも必要だけど、それと<line-break>同じくらい精霊力レベルが重要なんだ。<line-break>ＭＰが足りているのに使えない魔法があったら<line-break>精霊力レベルが足りないのかもしれないよ。<line-break>もし火属性の魔法が使えなかったら、それは<line-break>火の精霊力レベルが低いってことだからね。<end><if><value:$2A><less-equal>%100ネガヴァニティアというソウルがあるんだ。　<line-break>闇属性の魔法を使うことのできる唯一のソウル<line-break>なんだけど、宿している人は少ないんだよ。<line-break>このソウルを宿すには、やさしさＫｉｎｄが<line-break>極端に低くないといけないんだ。闇の力を<line-break>使う人にやさしさは不要ってことなのかな。<end>ネガヴァニティアのソウルを宿していないと、<line-break>闇の禁呪は使えないよ。もっとも封印を<line-break>解くことができればの話だけどね。<end>"
korean = "<if><value:$2A><less-equal>%49마법을 쓰려면 스킬도 필요하지만 그만큼 정령력 레벨도 중요해. MP가 충분한데도 못 쓰는 마법이 있다면 정령력 레벨이 부족한 걸지도 몰라. 불 속성 마법을 못 쓴다면 불의 정령력 레벨이 낮다는 뜻이지.<end><if><value:$2A><less-equal>%100네가바니티아라는 소울이 있어. 어둠 속성 마법을 쓸 수 있는 유일한 소울인데 깃들인 사람은 적어. 이 소울을 얻으려면 다정함 Kind가 극단적으로 낮아야 해. 어둠의 힘을 쓰는 사람에게 다정함은 필요 없다는 뜻일까.<end>네가바니티아의 소울을 깃들이지 않으면 어둠의 금주는 쓸 수 없어. 물론 봉인을 풀 수 있다면 말이지만.<end>"

