["70010"]
japanese = "<select><value:$20>%3ぼくがまだ子供だったころ、うちの爺さんが<line-break>毎夜のように昔話を聞かせてくれたんだ。<line-break>特に英雄伝説が面白かったよ。<end>ぼくも昔話にでてくるような英雄に<line-break>なろうと思っていたけど、<line-break>現実は厳しいものだね。<end>勇者ネメアは現代の英雄だね。<line-break>きっと彼の活躍は何百年たっても<line-break>伝説として語り継がれると思うよ。<end>"
korean = "<select><value:$20>%3내가 아직 어렸을 때 우리 할아버지가 매일 밤 옛날이야기를 들려주셨어. 특히 영웅 전설이 재미있었지.<end>나도 옛날이야기에 나오는 영웅이 되려고 했지만 현실은 만만치 않네.<end>용자 네메아는 현대의 영웅이지. 분명 그의 활약은 수백 년이 지나도 전설로 전해질 거야.<end>"

["70011"]
japanese = "<select><value:$20>%3フゴー美術館へようこそ。<line-break>世界中から集めた美術品の<line-break>数々をお楽しみください。<end>当美術館は、世界中から集めました<line-break>珍しい品々を展示しております。<line-break>ごゆっくりご鑑賞ください。<end>以前はリベルダムで展示していましたが、<line-break>事情によりこちらへ移って参りました。<line-break>今後ともよろしくお願いします。<end>"
korean = "<select><value:$20>%3후고 미술관에 오신 것을 환영합니다. 세계 각지에서 모은 여러 미술품을 즐겨 주십시오.<end>저희 미술관은 세계 각지에서 수집한 진귀한 물품을 전시하고 있습니다. 천천히 감상해 주십시오.<end>이전에는 리벨덤에서 전시했으나 사정이 있어 이곳으로 옮겨 왔습니다. 앞으로도 잘 부탁드립니다.<end>"

["70012"]
japanese = "<select><value:$20>%2俺はこのあいだまでリベルダムで冒険者を<line-break>やってたんだが、ここの美術品が気に入ってね。<line-break>いつも見てたいから警備員になったんだ。<end>ロセンは危険なところだからな。<line-break>俺のようなもと腕利き冒険者が<line-break>警備員として美術品を守っているんだ。<end>"
korean = "<select><value:$20>%2난 얼마 전까지 리벨덤에서 모험가였는데 이곳의 미술품이 마음에 들어서 말이야. 늘 보고 싶어서 경비원이 됐어.<end>로센은 위험한 곳이니까. 나처럼 한때 솜씨 좋던 모험가가 경비원으로 미술품을 지키는 거지.<end>"

["70015"]
japanese = "<if><value:$2C><less-equal>%9剣聖レーグこそ、我らボルダンの誇り。<line-break>彼に勝てるものは、この世にはいないだろう。<line-break>お前ごときでは、一撃ともたないだろうな。<end><if><value:$2C><less-equal>%29剣聖レーグは勇者ネメアとともに<line-break>魔王バロルを倒したという。<line-break>ゼネテスとやらも、二撃ともたないだろうな。<end><if><value:$2C><less-equal>%49ロストールのレムオンという貴族は<line-break>二刀流の使い手らしいな。<line-break>だが、レーグの二刀流は無敵だ！<line-break>その男も、三撃ともたないだろうな。<line-break>レーグは最強の男だからな。<end>…たぶん無理だと思うが、<line-break>お前なら竜王にも勝てるかもしれんな。<line-break>たぶん無理だと思うが…<end>"
korean = "<if><value:$2C><less-equal>%9검성 레그야말로 우리 볼단의 자랑이다. 그를 이길 자는 이 세상에 없겠지. 너 정도는 한 방도 못 버틸 거다.<end><if><value:$2C><less-equal>%29검성 레그는 용사 네메아와 함께 마왕 바로르를 쓰러뜨렸다지. 제네테스라는 자도 두 방은 못 버틸 거다.<end><if><value:$2C><less-equal>%49로스토르의 레무온이라는 귀족은 이도류의 달인이라더군. 하지만 레그의 이도류는 무적이다! 그 남자도 세 방은 못 버틸 거야. 레그는 최강의 남자니까.<end>…아마 무리라고 생각하지만, 너라면 용왕에게도 이길지 모르겠군. 아마 무리겠지만….<end>"

["70016"]
japanese = "<if><value:$2C><less-equal>%15いいねえいいねえ、レーグ最高！　<line-break>彼のような強い男が<line-break>生きている時代に生まれてよかったあ。<end><if><value:$2C><less-equal>%25ネメアとレーグの対決が見てみたいな。<line-break>歴史に残る好カード間違いなしだろ。<line-break>なあ、あんたはどっちを応援する？<end><if><value:$2C><less-equal>%35レーグを倒せるのはボルダンかドワーフの<line-break>戦士じゃないと無理か？　人間にもがんばって<line-break>ほしいけどな。例えば<value:$28>とかよ。<end>レーグのようにいかにも強そうって<line-break>感じじゃないけど、<value:$28>も<line-break>けっこういいよな。<end>"
korean = "<if><value:$2C><less-equal>%15좋아, 좋아! 레그 최고! 그처럼 강한 남자가 살아 있는 시대에 태어나서 다행이야.<end><if><value:$2C><less-equal>%25네메아와 레그의 대결을 보고 싶군. 역사에 남을 명승부가 틀림없겠지. 당신은 어느 쪽을 응원할 거야?<end><if><value:$2C><less-equal>%35레그를 쓰러뜨리려면 볼단이나 드워프 전사쯤은 되어야 하나? 인간도 힘내 줬으면 좋겠는데. 예를 들면 <value:$28> 같은 사람 말이야.<end>레그처럼 딱 봐도 강해 보이는 느낌은 아니지만, <value:$28>도 꽤 괜찮지.<end>"

["70017"]
