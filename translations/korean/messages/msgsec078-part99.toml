korean = "<if><value:$01><equal>2힘내. 응원할게.<end><if><value:$01><equal>3힘내거라.<end><if><value:$01><equal>4예로부터 굉장한 일은 누구 눈에도 바보 같은 일을 할 수 있다고 믿는 데서 시작됐어. 바보 같은 일을 믿었다는 점에서 아트레이아는 첫 관문을 넘은 거야. 후후. 그럼 안녕.<end><if><value:$01><equal>5힘내라고.<end><if><value:$01><equal>6힘내. 응원할게.<end><if><value:$01><equal>7조심해.<end><if><value:$01><equal>9응원하고 있으니까.<end><if><value:$01><equal>11너무 위험한 짓은 하지 마. 조심하고.<end><if><value:$01><equal>12잘 지내라. 가끔 얼굴 보러 올 테니까.<end><if><value:$01><equal>10힘내. 나도 누나도 응원할 테니까.<end><if><value:$01><equal>14잘 지내거라.<end><if><value:$01><equal>15조심해.<end><if><value:$01><equal>17뭐, 기껏 열심히 해 보시지. 고귀한 엘프인 이 몸도 응원해 주지 않는 건 아니니까!<end><if><value:$01><equal>19힘내~! 루루안타가 응원할게!<end>조심해. 다음에 놀러 갈게.<end>"

