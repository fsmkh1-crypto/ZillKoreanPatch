["1450010"]
japanese = "それでひとり娘だった私が<line-break>第２代おかしらに推されたわけ。<line-break>　<line-break>父さんの命、ワッシャー海賊を<line-break>つぶすわけにはいかない。<line-break>だから、やるしかなかったわ。<end>"
