["30003"]
japanese = "<select><value:$20>%2これは戦神ソリアスの像ですね。<line-break>ソリアスは神々の時代、破壊神ウルグを<line-break>倒すために異世界から呼ばれた神なのです。<end>強い憎しみや怒りから身体が闇に染まった　　<line-break>エルフを我々はダークエルフと呼んでいます。<line-break>ダークエルフは闇の使いなので抹殺すべし…<line-break>そう森では教えられましたが、世界を旅する<line-break>うちに疑問をもつようになりました。<line-break>自分の感情を隠すことは誤りではないかと…。<end>"
