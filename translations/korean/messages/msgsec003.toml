["30004"]
japanese = "<if><value:$2C><less-equal>%25上位の魔法を使えるようになりたいのなら　　　<line-break>探求心Ｓｅａｒｃｈだけでなく冷静さＣｏｏｌも<line-break>高めなさい。そうすればニルヴァーナが宿るわ。<line-break>強力な精霊力を制御するには冷静さが必要なの。<line-break>もちろん精霊力レベルが低いとスキルがあっても<line-break>魔法は使えないわよ。<end><if><value:$2C><less-equal>%40各属性にひとつずつ封印された禁呪があるの。<line-break>新月の塔と呼ばれる所にも、<line-break>禁呪が封印されているそうよ。<end>究極のソウルを宿すためには、マイティブロウ、<line-break>ニルヴァーナ、トリックスター、パトリアーク、<line-break>アルバレストが必要になるそうよ。<end>"
