["900001"]
japanese = "冒険者登録かい？<line-break>そこに名前を書いてくれ。<end>"
korean = "모험자 등록인가? 거기에 이름을 써 줘.<end>"

["900002"]
japanese = "幻術計振れておらず<line-break>犯罪登録当てはまらず。　　　<line-break>　<line-break>おめでとう。<line-break>あんたも冒険者として<line-break>登録されたよ。<end>"
korean = "환술계 수치도 없고 범죄 등록에도 해당하지 않음. 축하해. 자네도 모험자로 등록됐어.<end>"

["900003"]
japanese = "これからは、バリバリ仕事して<line-break>名をあげていってくれよ。<line-break>がんばりな！<end>"
korean = "이제부터 팍팍 일해서 이름을 날려 줘. 힘내!<end>"

["900004"]
japanese = "そういえば、こんな噂知ってるかい？ 　<line-break>エンシャントの南東の賢者の森深くに 　<line-break>猫屋敷ってのがあるらしいんだがね。 　<line-break>これが不思議なことに、そこに行っても<line-break>誰も屋敷なんて見たことがねえんだ。<line-break>運命に選ばれた者だけ入れるんだとさ。<end>"
korean = "그러고 보니 이런 소문 아나? 엔샨트 남동쪽 현자의 숲 깊숙한 곳에 고양이 저택이라는 곳이 있다는데 말이야. 이상하게도 거기 가 봐도 아무도 저택을 본 적이 없대. 운명에 선택받은 자만 들어갈 수 있다나 봐.<end>"

["900005"]
japanese = "不思議な話だろう？<line-break>誰も見たこともない屋敷の噂だなんて。<line-break>ま、運試しに行ってみたらどうだい。<end>"
korean = "이상한 이야기지? 아무도 본 적 없는 저택에 대한 소문이라니. 뭐, 운을 시험한다 생각하고 가 보는 게 어때.<end>"

["900006"]
japanese = "おじょおさぁんん！！<line-break>君は幸せ者だ。　　　　　　　　　<line-break>　<line-break>今、君は俺様とつきあうチャンスを<line-break>手に入れたぞ。さあ、俺様の愛の胸に<line-break>飛び込んでくるがいい！<end>"
korean = "아가씨이이!! 넌 행복한 사람이야. 지금 넌 이 몸과 사귈 기회를 손에 넣었다. 자, 이 몸의 사랑 가득한 품으로 뛰어들어 와!<end>"

["900007"]
japanese = "結構です。<end>"
korean = "괜찮습니다.<end>"

["900008"]
japanese = "ハッハァー！<line-break>俺様の名を聞いても<line-break>そういう風に冷たくあしらえるかな。<end>"
korean = "핫하아! 이 몸의 이름을 듣고도그렇게 차갑게 대할 수 있을까.<end>"

["900009"]
japanese = "俺様は未来の勇者、ガルドラン様だ。<line-break>さぁ、デートしたくなってきただろう？<end>"
