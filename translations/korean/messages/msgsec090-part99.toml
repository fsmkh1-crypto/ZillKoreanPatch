["900013"]
japanese = "君は俺様を愛している。<line-break>いや、愛さなくてはいけないのだ。　<line-break>　<line-break>俺様の腕から熱い鼓動を感じ取れえ！<line-break>そして、君の愛の脈拍を<line-break>俺様の愛の脈拍と共鳴させるんだあ！<end>"
korean = "넌 이 몸을 사랑하고 있다. 아니, 사랑해야만 한다. 이 몸의 팔에서 뜨거운 고동을 느껴라! 그리고 네 사랑의 맥박을 이 몸의 사랑의 맥박과 공명시키는 거다!<end>"

["900014"]
japanese = "妹の手を放せ。<end>"
