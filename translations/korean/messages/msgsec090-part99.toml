["900015"]
japanese = "なんだと？<line-break>俺様が未来の勇者ガルドランだと知って<line-break>そういうことを言ってるのか？<end>"
korean = "뭐라고? 이 몸이 미래의 용사 갈드란인 걸 알고도 그런 말을 하는 거냐?<end>"

["900016"]
japanese = "…お前が未来の勇者だというなら、<line-break>この世界の未来は見たくないな。<end>"
