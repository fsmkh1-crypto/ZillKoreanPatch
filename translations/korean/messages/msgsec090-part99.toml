["900017"]
japanese = "くっ！　未来の勇者をバカにしたな！<line-break>正義の鉄槌を食らいたいようだな！　<line-break>　<line-break>よかろう！　未来の勇者である俺様が<line-break>チンケな悪役のセリフはやっちまえと<line-break>覚えてろで十分なことを教えてやる！<end>"
korean = "큭! 미래의 용사를 바보 취급했겠다! 정의의 철퇴를 맞고 싶은 모양이군! 좋아! 미래의 용사인 나님이 하찮은 악당의 대사는 '두고 보자'와 '기억해 둬라'면 충분하다는 걸 가르쳐 주마!<end>"

["900018"]
