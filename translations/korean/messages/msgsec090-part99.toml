["900011"]
japanese = "そんなアニキは捨て置け！<line-break>未来の勇者が許す！　　　　　　　　　<line-break>　<line-break>君の瞳に俺様への恋の炎が燃えている。<line-break>未来の勇者にはガマンは無用さ！<line-break>俺様と甘いロマンの海に漕ぎ出すんだ！<end>"
korean = "그런 오빠는 내버려 둬! 미래의 용사가 허락한다! 네 눈동자에 나님을 향한 사랑의 불꽃이 타오르고 있어. 미래의 용사에게 참는 건 필요 없어! 나님과 달콤한 로망의 바다로 나아가자!<end>"

["900012"]
