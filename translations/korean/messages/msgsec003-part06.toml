japanese = "<if><value:$33><less-equal>2俺の故郷は港町アミラルなんだ。<line-break>今はエンシャントの水軍が港を封鎖していて<line-break>帰るに帰れないんだ。<end><if><value:$33><less-equal>3やっと港の封鎖が解かれたよ。<line-break>これでアミラルに帰れる。<line-break>でも、ずいぶん長いこと故郷を離れていたから<line-break>もう少し旅を続けてみるよ。<end>ロセンにいる親戚から手紙が来てね。<line-break>暗愚王ペウダが倒されてロセンが<line-break>解放されたそうだよ。<line-break>ペウダに仕えていた騎士は全員処刑されるか<line-break>奴隷にされたそうだけど自業自得だよ。<end>"
korean = "<if><value:$33><less-equal>2내 고향은 항구도시 아미랄이야.<line-break>지금은 엔션트 수군이 항구를 봉쇄하고 있어서<line-break>돌아가고 싶어도 돌아갈 수가 없어.<end><if><value:$33><less-equal>3드디어 항구 봉쇄가 풀렸어.<line-break>이제 아미랄로 돌아갈 수 있겠군.<line-break>하지만 너무 오랫동안 고향을 떠나 있었으니<line-break>조금 더 여행을 계속해 볼 생각이야.<end>로센에 있는 친척에게 편지가 왔어.<line-break>암군 페우다가 쓰러지고 로센이<line-break>해방됐다고 하더군.<line-break>페우다를 섬기던 기사들은 모두 처형되거나<line-break>노예가 됐다는데 자업자득이지.<end>"

