japanese = "<select><value:$33>ガルドランのやつは困ったもんだ。　　　　　<line-break>エンシャントから武器を仕入れては盗賊どもに<line-break>売っているんだからな。<line-break>最近じゃ魔人と取引しているって噂もある。<line-break>金のためなら、なんでもやる男だよ。<end>ガルドランのやつは困ったもんだ。　　　　　<line-break>エンシャントから武器を仕入れては盗賊どもに<line-break>売っているんだからな。<line-break>最近じゃ魔人と取引しているって噂もある。<line-break>金のためなら、なんでもやる男だよ。<end>ロセン王ペウダがロセンの町を封鎖しているから<line-break>ロセンの特産品が手に入らなくて困っているよ。<line-break>まったく、ペウダのやつは何を考えているんだ。<end>ロセンが解放されたんだってな。<line-break>よかった、よかった。<line-break>これでロセンの特産品が仕入れられるよ。<end>リベルダムがカルラ将軍に破壊されたそうだ。　<line-break>おかげでリベルダムとロセンの間で結んでいた<line-break>商売の契約が無効になってしまったよ。<line-break>せっかくロセンが解放されたのに、<line-break>これじゃ商売にならないよ。<end>ロストールとの戦争が激しくなってきたな。<line-break>ロストールから入ってくる品物もあるんだから<line-break>あんまり戦争してほしくないんだけどな。<end>ネメア帝が亡くなったという噂が流れているな。<line-break>ロストールが流したデマだと思うが、<line-break>本当だったら大変なことになるぞ。<end>ネメア帝が亡くなったという噂が流れているな。<line-break>ロストールが流したデマだと思うが、<line-break>本当だったら大変なことになるぞ。<end>"
korean = "<select><value:$33>갈드란 녀석은 정말 골칫거리야.　　　　　<line-break>엔션트에서 무기를 들여와서는 도적들에게<line-break>팔아넘기고 있으니 말이야.<line-break>요즘은 마인과 거래한다는 소문까지 있어.<line-break>돈을 위해서라면 뭐든 하는 남자지.<end>갈드란 녀석은 정말 골칫거리야.　　　　　<line-break>엔션트에서 무기를 들여와서는 도적들에게<line-break>팔아넘기고 있으니 말이야.<line-break>요즘은 마인과 거래한다는 소문까지 있어.<line-break>돈을 위해서라면 뭐든 하는 남자지.<end>로센 왕 페우다가 도시를 봉쇄하는 바람에<line-break>로센 특산품을 구하지 못해서 골치야.<line-break>정말이지 페우다 녀석은 무슨 생각인지 모르겠군.<end>로센이 해방됐다더군.<line-break>잘됐어, 정말 잘됐어.<line-break>이제 로센 특산품을 들여올 수 있겠군.<end>리베르담이 카를라 장군에게 파괴됐다더군.　<line-break>그 바람에 리베르담과 로센 사이에 맺어 두었던<line-break>상거래 계약이 무효가 되어 버렸어.<line-break>모처럼 로센이 해방됐는데<line-break>이래서는 장사를 할 수가 없잖아.<end>로스톨과의 전쟁이 점점 격렬해지는군.<line-break>로스톨에서 들어오는 물건도 있으니<line-break>전쟁은 너무 심하게 하지 않았으면 좋겠는데.<end>네메아 황제가 죽었다는 소문이 돌고 있군.<line-break>로스톨이 퍼뜨린 거짓말이라고 생각하지만,<line-break>사실이라면 큰일이야.<end>네메아 황제가 죽었다는 소문이 돌고 있군.<line-break>로스톨이 퍼뜨린 거짓말이라고 생각하지만,<line-break>사실이라면 큰일이야.<end>"

["30030"]
japanese = "<select><value:$33>ネメア様が即位して以来、首都エンシャントも<line-break>だいぶ活気が戻ってきたように思えるね。<line-break>我々商人にとって、ネメア様は英雄だよ。<line-break>ネメア様の１２の難事のおかげで、街道の盗賊や<line-break>モンスターも減ったからね。<end>ネメア様が即位して以来、首都エンシャントも<line-break>だいぶ活気が戻ってきたように思えるね。<line-break>我々商人にとって、ネメア様は英雄だよ。<line-break>ネメア様の１２の難事のおかげで、街道の盗賊や<line-break>モンスターも減ったからね。<end>エリュマルク帝は本当にろくなことをしなかった。<line-break>アキュリュース侵攻のせいで、大陸南部からの<line-break>交易品が入ってこなくなって大損したんだ。<line-break>でも、ネメア様は交易の重要性を理解している<line-break>からね。少しずつ交易も復活しているよ。<end>アキュリュースが解放されたそうだね。<line-break>これでアキュリュースの神殿まで行商に行けるよ。<line-break>前は水晶や貴重な薬草が手に入ったんだ。<end>ロセンが解放されてよかったよ。<line-break>これで東方の特産品も入ってくるからね。<line-break>ロセンの珍しい果物は、ロストールの貴族に<line-break>高く売れるんだよ。<end>リベルダムがなくなったって？<line-break>冗談じゃないよ。<line-break>あそこには私の店もあったんだぞ。<line-break>カルラって将軍は何を考えているんだ。<end>ロストールとの戦争が始まってから<line-break>街道が危なくてしょうがないよ。<line-break>戦争なんて商人にとって迷惑なだけだ。<end>ネメア様が亡くなったという噂があるけど、<line-break>そんなの信じられるわけがないよ。<line-break>ネメア様は不死身の英雄なんだから。<end>"
korean = "<select><value:$33>네메아 님이 즉위한 뒤로 수도 엔션트도<line-break>상당히 활기를 되찾은 것 같아.<line-break>우리 상인들에게 네메아 님은 영웅이지.<line-break>네메아 님의 열두 난업 덕분에 가도의 도적과<line-break>몬스터도 줄었으니까.<end>네메아 님이 즉위한 뒤로 수도 엔션트도<line-break>상당히 활기를 되찾은 것 같아.<line-break>우리 상인들에게 네메아 님은 영웅이지.<line-break>네메아 님의 열두 난업 덕분에 가도의 도적과<line-break>몬스터도 줄었으니까.<end>에류마르크 황제는 정말 좋은 일을 하나도 안 했어.<line-break>아큐류스 침공 때문에 대륙 남부에서 오는<line-break>교역품이 끊겨서 큰 손해를 봤거든.<line-break>하지만 네메아 님은 교역의 중요성을 알고<line-break>있으니까. 조금씩 교역도 되살아나고 있어.<end>아큐류스가 해방됐다더군.<line-break>이제 아큐류스 신전까지 행상을 갈 수 있겠어.<line-break>전에는 수정이나 귀한 약초를 구할 수 있었거든.<end>로센이 해방돼서 정말 다행이야.<line-break>이제 동방의 특산품도 들어올 테니까.<line-break>로센의 진귀한 과일은 로스톨 귀족들에게<line-break>비싸게 팔 수 있거든.<end>리베르담이 없어졌다고?<line-break>농담하지 마.<line-break>거기에는 내 가게도 있었단 말이야.<line-break>카를라라는 장군은 대체 무슨 생각이야.<end>로스톨과 전쟁이 시작된 뒤로<line-break>가도가 위험해서 견딜 수가 없어.<line-break>전쟁 같은 건 상인에게 민폐일 뿐이야.<end>네메아 님이 죽었다는 소문이 있지만,<line-break>그런 걸 믿을 수 있을 리 없지.<line-break>네메아 님은 불사신 영웅이니까.<end>"
