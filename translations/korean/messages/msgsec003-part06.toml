["30027"]
japanese = "<select><value:$33>今は旅立ちの時だろ、ここにいるのは変だぞ。<end>この間の大地震は竜王の覚醒が原因だってな。<line-break>おかげで竜王の島近海を航行するたびに、竜王が<line-break>襲ってくるんじゃないかとドキドキするんだ。<line-break>エルズ近海で海王を見たって話も聞くし、<line-break>そのうちラミリー山に住むっていう翔王が<line-break>世界中を飛び回るんじゃないのか。<end>ネメア帝が発表した幕僚の面々は知ってるか？　<line-break>宰相は前皇帝の時と同じくベルゼーヴァ、<line-break>玄武将軍に魔道アカデミー首席卒業のザギヴ、<line-break>青竜将軍に若干１６歳の少女カルラ、<line-break>朱雀将軍に歴戦の勇将アンギルダン、<line-break>白虎将軍にコーンスの魔道士ジラークだとよ。<end>ロセンの港が解放されたってな。<line-break>これでロセン、リベルダム、エンシャントの<line-break>三角貿易が復活するわけだ。忙しくなるぞ。<end>いやー分断の山脈を越えてロストール領に<line-break>攻め込むとはアンギルダン将軍も見事に<line-break>裏切ってくれたよな。<line-break>海路で攻め込むとばかり思っていたから<line-break>リベルダムの商人の中には軍船を大量に<line-break>用意した者もいるんだぜ。<end>ロセンが解放されて、せっかく活気が出てきた<line-break>のに、リベルダムがなくなっちまうとはな。<line-break>カルラって娘は何を考えてるのかね。<end>リベルダムを破壊した迷惑娘カルラが、<line-break>ロストール攻略を開始するんだってな。<line-break>兵力で劣るゼネテスの出方が楽しみだぜ。<end>ネメアが死んだってんで、世界中が大騒ぎさ。<line-break>だが、俺のつかんだ情報だとネメア死すの噂は<line-break>ゼネテスの流したデマなんだそうだ。<end>"
korean = "<select><value:$33>이제 떠날 때잖아. 여기 있는 건 이상한데.<end>지난번 대지진은 용왕이 깨어난 탓이라더군.<line-break>그 뒤로 용왕의 섬 근처를 항해할 때마다 용왕이<line-break>습격하는 건 아닐까 가슴이 두근거려.<line-break>엘즈 근해에서 해왕을 봤다는 이야기도 있고,<line-break>이러다 라미리 산에 산다는 상왕까지<line-break>온 세상을 날아다니는 거 아닌가 몰라.<end>네메아 황제가 발표한 막료진은 알고 있어?　<line-break>재상은 전 황제 때와 마찬가지로 벨제바,<line-break>현무장군은 마도 아카데미 수석 졸업생 자기브,<line-break>청룡장군은 겨우 １６살인 소녀 카를라,<line-break>주작장군은 역전의 용장 안길단,<line-break>백호장군은 콘스의 마도사 지라크라더군.<end>로센 항구가 해방됐다더군.<line-break>이제 로센, 리베르담, 엔션트 사이의<line-break>삼각무역이 부활하는 거야. 바빠지겠어.<end>이야, 분단의 산맥을 넘어 로스톨 영지로<line-break>쳐들어갈 줄은 안길단 장군도 멋지게<line-break>예상을 뒤엎어 줬군.<line-break>다들 해로로 공격할 줄만 알아서<line-break>리베르담 상인 중에는 군선을 잔뜩<line-break>준비한 사람도 있다니까.<end>로센이 해방돼서 모처럼 활기를 되찾았는데<line-break>이번에는 리베르담이 사라져 버리다니.<line-break>카를라라는 애는 대체 무슨 생각인지 모르겠군.<end>리베르담을 파괴한 말썽꾸러기 카를라가<line-break>로스톨 공략을 시작한다더군.<line-break>병력이 열세인 제네테스가 어떻게 나올지 기대돼.<end>네메아가 죽었다고 온 세상이 난리야.<line-break>하지만 내가 입수한 정보에 따르면 네메아 사망설은<line-break>제네테스가 퍼뜨린 거짓 소문이라더군.<end>"

