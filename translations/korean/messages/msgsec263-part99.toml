["2630001"]
japanese = "ふむ、お主の仲間の女性が<line-break>ほほに傷のある男を捜しておって<line-break>それが、わしではないかと？<end>"
korean = "흠, 네 동료 여성이 볼에 상처가 있는 남자를 찾고 있고 그게 내가 아닐까 싶다는 건가?<end>"

["2630002"]
japanese = "わーはっはっはっ。<line-break>いくらなんでもそれは<line-break>人違いじゃろう。<line-break>確かにわしの顔にも傷はあるが、<line-break>女性に捜してもらえるほどの<line-break>色男ではないぞ。<end>"
korean = "와하하하. 아무리 그래도 사람을 잘못 본 거겠지. 내 얼굴에도 상처는 있지만 여자가 찾아다닐 만큼 미남은 아니야.<end>"

["2630003"]
japanese = "ほほに傷のある男なら、<line-break>他にひとり知っておる。<line-break>興味があるのなら案内して進ぜよう。<end>"
korean = "뺨에 상처가 있는 남자라면 다른 한 명도 알고 있네. 관심이 있다면 안내해 주지.<end>"

["2630004"]
japanese = "このクリスタルに入っている男の名は<line-break>ジリオン…。お主と同じく、<line-break>無限のソウルの持ち主じゃった。<line-break>かつてロストールの王権をめぐる<line-break>テジャワの変という争乱があってな。<line-break>ジリオンはそれに巻きこまれたのよ。<end>"
korean = "이 크리스털 안에 있는 남자의 이름은 질리온…. 그대와 마찬가지로 무한의 소울을 지닌 자였지. 과거 로스토올의 왕권을 둘러싸고 테자와의 변이라는 분쟁이 있었고, 질리온은 거기에 휘말렸네.<end>"

["2630005"]
japanese = "当時、ジリオンと親しかった女の子…。<line-break>イーシャという娘がおってな。<line-break>　<line-break>彼女はテジャワの変の果てに<line-break>悪人の手でソウルを切り離されたのだ。<line-break>　<line-break>無論、ソウルを失えばその娘は消滅じゃ。<line-break>そこでジリオンは決断を下した。<line-break>　<line-break>自分のソウルと闇の神器・同化の髪飾りの<line-break>力を使ってイーシャの想いを支え、<line-break>彼女の命を存続させることを、な。<line-break>同化の髪飾りは確かにどんな欲望も<line-break>かなえるが、その欲望が<line-break>満たされることは決してない…。<end>"
korean = "당시 질리온과 가까웠던 여자아이…. 이샤라는 아이가 있었지. 그녀는 테자와의 변 끝에 악인의 손으로 소울이 분리되고 말았다. 물론 소울을 잃으면 그 아이는 소멸한다. 그래서 질리온은 결단을 내렸다. 자신의 소울과 어둠의 신기·동화의 머리장식 힘으로 이샤의 마음을 지탱해 그녀의 생명을 이어 가게 하기로. 동화의 머리장식은 어떤 욕망이든 이루지만 그 욕망은 결코 충족되지 않는다….<end>"

["2630006"]
japanese = "かくて、ジリオンの<line-break>イーシャを救いたいという願いは<line-break>かなった。<line-break>じゃが、ジリオン自身は、こうして<line-break>イーシャと言葉を交わすこともできず、<line-break>クリスタルの中で眠り続けておる。<line-break>まったく因果な宿命よ。<line-break>でも、それがジリオンの望んだ道<line-break>だったのじゃ。<end>"
korean = "그리하여 이샤를 구하고 싶다는 질리온의 소원은 이루어졌다. 하지만 질리온 자신은 이렇게 이샤와 말 한마디 나누지 못한 채 크리스털 속에서 계속 잠들어 있지. 참으로 기구한 운명이야. 그래도 그것이 질리온이 원한 길이었네.<end>"

["2630007"]
japanese = "おっと、今の話はジリオンから<line-break>固く口止めされておるから、<line-break>くれぐれも内密にな。<line-break>お主は信頼のおける人間だと<line-break>思ったからこそ教えたんじゃ。<line-break><line-break>さあ、長居は無用じゃ。行こうか。<end>"
korean = "어이쿠, 방금 이야기는 질리온에게 단단히 입막음당했으니 절대 비밀로 해두게. 자네라면 믿을 만한 사람이라 생각해서 알려준 게야. 자, 오래 머물 필요 없지. 가볼까.<end>"

