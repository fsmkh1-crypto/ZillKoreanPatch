["600000"]
japanese = "アンギルダン・ボリューム３用開始<end>"
korean = "앙길단 볼륨3용 시작<end>"

["600001"]
japanese = "　　　　皇帝ネメアの世界統一構想のもと　　　<line-break>　　南方攻略軍司令、朱雀将軍アンギルダンが　<line-break>　　　ついにロストール攻略に動き出した。<end>"
korean = "황제 네메아의 세계 통일 구상 아래 남방 공략군 사령관, 주작 장군 앙길단이 마침내 로스토올 공략에 나섰다.<end>"

["600002"]
japanese = "　　　　帝国軍が大兵力を投入すると　　　<line-break>　　予想したロストール側は、分断の山脈を<line-break>　　　越えてくるとは考えず、内海側の　　<line-break>　海路を封鎖し、敵の上陸時を叩く作戦に出た。<line-break>　これに対し、ロストール軍副指令ゼネテスは<line-break>　　帝国は分断の山脈を越えてくると主張、　<line-break>　山脈がわに兵を割いて防衛線を築くことを　<line-break>　　提案したが、軍議で即時に却下された。<end>"
korean = "제국군이 대병력을 투입할 것이라 예상한 로스토올 측은 분단의 산맥을 넘어올 것이라고는 생각하지 않고 내해 쪽 해로를 봉쇄해 적의 상륙 때 공격하는 작전을 세웠다. 이에 로스토올군 부사령 제네테스는 제국군이 분단의 산맥을 넘어올 것이라 주장하며 산맥 쪽에 병력을 나눠 방어선을 구축하자고 제안했으나 군의에서 즉시 기각되었다.<end>"

["600003"]
japanese = "　　しかし、このゼネテスの予測は正しく、<line-break>　　　　アンギルダンは少数の精兵で　　　<line-break>　　　分断の山脈を越えると、大街道を　　<line-break>　　　　電撃的な早さで行軍してきた。　　<line-break>　　　　分断の山脈を軍隊が越えたのは　　<line-break>　　　　　　歴史上初の壮挙である。　　　<line-break>　　　　　こうしてディンガル軍は　　　　<line-break>　　　　王都ロストールに王手をかけた。<end>"
korean = "하지만 제네테스의 예측은 정확했다. 앙길단은 소수 정예병으로 분단의 산맥을 넘은 뒤 대가도를 번개 같은 속도로 행군해 왔다. 군대가 분단의 산맥을 넘은 것은 역사상 최초의 위업이었다. 이렇게 딩갈군은 왕도 로스토올을 눈앞에 두게 되었다.<end>"

["600004"]
japanese = "　　　事ここに及び、ロストール軍総司令<line-break>　　　　ノヴィンは急きょ、軍を反転、　<line-break>　　　アンギルダン率いるディンガル軍を<line-break>　　　　　迎え撃つべく、急行した。　　<line-break>　　　　　このとき、ゼネテスは　　　　　<line-break>　　父親でもある総司令に、隊列を整えつつ<line-break>　　　ゆっくりと敵を牽制し、その上で　　<line-break>　　王都守備軍と連係攻撃すべきと説いた。<end>"
korean = "사태가 이에 이르자 로스토올군 총사령 노빈은 급히 군을 돌려 앙길단이 이끄는 딩갈군을 맞아 싸우러 달려갔다. 이때 제네테스는 아버지이기도 한 총사령에게 대열을 정비하면서 천천히 적을 견제한 뒤 왕도 수비군과 연계 공격해야 한다고 진언했다.<end>"

["600005"]
japanese = "　　しかし、ここでもまたゼネテスの説得は<line-break>　　　聞き入れられず、隊列が乱れたまま　<line-break>　　　交戦状態に入ったロストール軍は　　<line-break>　　ディンガル軍の攻撃を受け、壊滅した。<line-break>　　　この戦いで、ロストール軍総司令　　<line-break>　　　ノヴィン・ファーロスをはじめ、　　<line-break>　　　　ロストールの名だたる貴族が　　　<line-break>　　　　　多く、その命を落とした。　　　<end>"
korean = "하지만 여기서도 제네테스의 설득은 받아들여지지 않았다. 대열이 흐트러진 채 전투에 들어간 로스토올군은 딩갈군의 공격을 받아 괴멸했다. 이 전투에서 로스토올군 총사령 노빈 파로스를 비롯해 로스토올의 이름난 귀족 다수가 목숨을 잃었다.<end>"

["600006"]
japanese = "ルブルグ伯タルテュバ・リューガは　<line-break>自らの軍を捨て単身逃走。　　　<line-break>命こそ失わずにすんだものの、　　<line-break>その評判は地に落ちた。　　　　<end>"
korean = "루브르그 백작 타르튜바 류가는 자기 군대를 버리고 혼자 도주했다. 목숨은 건졌지만 평판은 땅에 떨어졌다.<end>"

["600007"]
japanese = "朱雀将軍アンギルダンは、　　　<line-break>ロストール軍を壊滅させると、　　<line-break>深追いを禁じ、続く王都侵攻に備え、<line-break>全軍に物資の現地調達開始を命じた。<end>"
korean = "주작 장군 앙길단은 로스토올군을 괴멸시키자 추격을 금하고, 이어질 왕도 침공에 대비해 전군에 현지 물자 조달을 명했다.<end>"

["600008"]
japanese = "アンギルダンの唯一の不安材料だった　<line-break>物資もこれにより補充され、　　　<line-break>ディンガル軍のロストール占領を　　<line-break>阻むものはなくなったかに見えた。　<end>"
korean = "앙길단의 유일한 불안 요소였던 물자도 이로써 보충되어, 딩갈군의 로스토올 점령을 막을 것은 없어 보였다.<end>"

["600009"]
japanese = "だが、ゼネテスは、驚くべき早さで　<line-break>ロストール軍の敗残兵を立て直し、　<line-break>徴発隊が繰り出して手薄になった　　<line-break>帝国軍中枢部を、奇襲した。　　　<line-break>このゼネテスの神速の奇襲により、　<line-break>帝国軍の中枢部は壊滅、　　　　<line-break>アンギルダンも討ち取られ、　　　<line-break>帝国軍は潰走した。　　　　　<end>"
korean = "하지만 제네테스는 놀라운 속도로 로스토올군의 패잔병을 수습하고, 징발대가 출동해 허술해진 제국군 중추부를 기습했다. 제네테스의 신속한 기습으로 제국군 중추부는 괴멸했고, 앙길단도 전사해 제국군은 패주했다.<end>"

["600010"]
japanese = "これによりゼネテスの声望は一気に　<line-break>高まり、奇跡の名将とまで呼ばれたが、<line-break>この戦いでロストールが受けた被害は　<line-break>甚大なものであった。　　　　<end>"
korean = "이로써 제네테스의 명성은 단숨에 높아져 기적의 명장이라 불리기까지 했으나, 이 전투에서 로스토올이 입은 피해는 막대했다.<end>"

