["600006"]
japanese = "ルブルグ伯タルテュバ・リューガは　<line-break>自らの軍を捨て単身逃走。　　　<line-break>命こそ失わずにすんだものの、　　<line-break>その評判は地に落ちた。　　　　<end>"
korean = "루브르그 백작 타르튜바 류가는 자기 군대를 버리고 혼자 도주했다. 목숨은 건졌지만 평판은 땅에 떨어졌다.<end>"

["600007"]
japanese = "朱雀将軍アンギルダンは、　　　<line-break>ロストール軍を壊滅させると、　　<line-break>深追いを禁じ、続く王都侵攻に備え、<line-break>全軍に物資の現地調達開始を命じた。<end>"
korean = "주작 장군 앙길단은 로스토올군을 괴멸시키자 추격을 금하고, 이어질 왕도 침공에 대비해 전군에 현지 물자 조달을 명했다.<end>"

["600008"]
japanese = "アンギルダンの唯一の不安材料だった　<line-break>物資もこれにより補充され、　　　<line-break>ディンガル軍のロストール占領を　　<line-break>阻むものはなくなったかに見えた。　<end>"
korean = "앙길단의 유일한 불안 요소였던 물자도 이로써 보충되어, 딩갈군의 로스토르 점령을 막을 것은 없어 보였다.<end>"

["600010"]
japanese = "これによりゼネテスの声望は一気に　<line-break>高まり、奇跡の名将とまで呼ばれたが、<line-break>この戦いでロストールが受けた被害は　<line-break>甚大なものであった。　　　　<end>"
korean = "이로써 제네테스의 명성은 단숨에 높아져 기적의 명장이라 불리기까지 했으나, 이 전투에서 로스토올이 입은 피해는 막대했다.<end>"

