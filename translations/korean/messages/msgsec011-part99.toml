["110001"]
japanese = "<if><value:$2C><less-equal>%9風の巫女エア様は、<line-break>天地千年を見通すことが<line-break>できる偉大なお方なのだ。<end><if><value:$2C><less-equal>%29エア様にわからぬことはない。<line-break>エア様の前で、くれぐれも隠し事など<line-break>してはいかんぞ。<end><if><value:$2C><less-equal>%49こうして他国の脅威におびえることなく<line-break>平和に暮らせるのもエア様のおかげだよ。<line-break>わしはいつも感謝しておるのだぞ。<end>君が強いのはよくわかる。<line-break>だからこそ勇み足でエア様を怒らせるような<line-break>ことだけはしないでくれよ。<end>"
korean = "<if><value:$2C><less-equal>%9바람의 무녀 에아 님은 천지의 천년을 내다볼 수 있는 위대한 분이시다.<end><if><value:$2C><less-equal>%29에아 님께 모르는 것은 없다. 에아 님 앞에서 절대로 숨기는 일이 있어선 안 된다.<end><if><value:$2C><less-equal>%49이렇게 다른 나라의 위협에 떨지 않고 평화롭게 살 수 있는 것도 에아 님 덕분이야. 나는 늘 감사하고 있단다.<end>네가 강하다는 건 잘 안다. 그렇기 때문에 너무 앞서 나가 에아 님을 화나게 하는 일만은 하지 말아 다오.<end>"

["110003"]
japanese = "<if><value:$2A><less-equal>%49自警団って危険な仕事が多そうだなあ…。<line-break>ボクは腕力に自信がないから<line-break>会計担当でいいよ。<end><if><value:$2A><less-equal>%100自警団っていっても、今までの仕事は<line-break>花壇を荒らしたピクシーをこらしめただけだよ。<line-break>平和すぎて仕事にならないよ～。<end><if><value:$2A><less-equal>%140自警団なんて言っているけど、団員は２人だよ。<line-break>強いモンスターが暴れたりしたらどうしよう…。<line-break><value:$28>のような人が団員ならな～。<end>大陸では戦争で家を焼かれたり家族を失ったり<line-break>した人が大勢いるのに、ここは本当に平和だね。<line-break>これもエア様のおかげなのかな。<end>"
korean = "<if><value:$2A><less-equal>%49자경단은 위험한 일이 많을 것 같아…. 난 힘에 자신이 없으니 회계 담당이면 됐어.<end><if><value:$2A><less-equal>%100자경단이라 해도 지금까지 한 일은 화단을 망친 픽시를 혼내 준 것뿐이야. 너무 평화로워서 일이 안 된다니까~.<end><if><value:$2A><less-equal>%140자경단이라고 해도 단원은 둘뿐이야. 강한 몬스터가 날뛰면 어쩌지…. <value:$28> 같은 사람이 단원이면 좋을 텐데~.<end>대륙에는 전쟁으로 집이 불타고 가족을 잃은 사람이 많은데 여긴 정말 평화롭네. 이것도 에어 님 덕분일까.<end>"

["110004"]
japanese = "<if><value:$2A><less-equal>%49アミラルじゃ自警団を組織して<line-break>町を守ってるんだってよ。<line-break>俺たちも海賊から町を守るために<line-break>組織したほうがいいかもな。<line-break>あんたは、どう思う？<end><if><value:$2A><less-equal>%100俺たちの町は、俺たちが守るっ！<line-break>う～ん、燃えるっ！　燃えるぜぇ！<line-break>今日もやあぁぁぁあってやるぜっ！<end><if><value:$2A><less-equal>%140俺たち自警団のおかげで今日も平和だぜぇ！<line-break>エルズ自警団では団員を募集している。<line-break>君も我々と町の平和を守ろうじゃないかっ！<end>今日も空は晴れ渡り、心地よい風が吹く…。<line-break>この平和なひとときを自分たちが守っている<line-break>なんて…俺は今、最高に充実しているっ！<end>"
korean = "<if><value:$2A><less-equal>%49아미랄은 자경단을 조직해서 마을을 지킨다더군. 우리도 해적으로부터 마을을 지키려면 조직하는 게 좋을지도 몰라. 넌 어떻게 생각해?<end><if><value:$2A><less-equal>%100우리 마을은 우리가 지킨다! 으음, 불타오른다! 오늘도 해내 주겠어어어!<end><if><value:$2A><less-equal>%140우리 자경단 덕분에 오늘도 평화롭다! 엘즈 자경단은 단원을 모집 중이다. 자네도 우리와 함께 마을의 평화를 지키자고!<end>오늘도 하늘은 맑고 기분 좋은 바람이 분다…. 이 평화로운 순간을 우리가 지키고 있다니… 지금 난 최고로 충실해!<end>"

["110005"]
japanese = "<select><value:$20>%4おっきくなったら船長になるんだ！<line-break>海の男だぞ。<end>海の男になるために、<line-break>足腰を鍛えるんだ！<line-break>がんばるぞ！<end>遅いぞ！<line-break>それじゃあ海の男になんて<line-break>なれないぞ。<end>今、特訓中なんだ。<line-break>邪魔しないでよ！<end>"
korean = "<select><value:$20>%4크면 선장이 될 거야! 바다의 사나이가 될 거라고.<end>바다의 사나이가 되려면 하체를 단련해야 해! 힘낼 거야!<end>느려! 그러고선 바다의 사나이가 될 수 없어.<end>지금 특훈 중이야. 방해하지 마!<end>"

["110006"]
japanese = "<select><value:$20>%4お兄ちゃん、<line-break>あたしも海の男になりたいよぉ。<end>お兄ちゃん、<line-break>走るの速すぎるよぉ～<line-break>あたしを何回も抜いちゃやだ～。<end>お兄ちゃん、<line-break>目が回るよぉ～<end>お兄ちゃん、<line-break>待ってぇ～、待ってよぉ～。<end>"
korean = "<select><value:$20>%4오빠, 나도 바다 사나이가 되고 싶어.<end>오빠, 너무 빨라~ 나를 몇 번이나 추월하면 싫어~.<end>오빠, 어지러워~<end>오빠, 기다려~ 기다려 줘~.<end>"

["110008"]
japanese = "<select><value:$20>%5エア様は、すべてを見通すことができる<line-break>魔法の水晶球を持ってらっしゃるのよ。<line-break>私も、子供たちの未来を知りたいわ。<end>ここはきれいなところでしょ。<line-break>こうやって子供たちが遊んでいる姿を見たり、<line-break>お花の手入れをしていると心がなごむの。<end>エア様は風の精霊神におつかえする<line-break>巫女でもあるのよ。<line-break>よい風が吹くのもエア様のおかげだわ。<end>エルズで悪いことをする人はいないわ。<line-break>だって、どんなに上手に隠してもエア様には<line-break>すべてお見通しなんですもの。<end>あなた、エア様に会いに来たのかしら？<line-break>エア様のいらっしゃる風の神殿へ続く道には<line-break>モンスターがいるから気をつけるのよ。<end>"
korean = "<select><value:$20>%5에아 님은 모든 것을 내다볼 수 있는 마법의 수정구를 가지고 계셔. 나도 아이들의 미래를 알고 싶네.<end>여기 참 예쁜 곳이지? 이렇게 아이들이 노는 모습을 보고 꽃을 돌보다 보면 마음이 편안해져.<end>에아 님은 바람의 정령신을 섬기는 무녀이기도 하셔. 좋은 바람이 부는 것도 에아 님 덕분이지.<end>엘즈에서 나쁜 짓을 하는 사람은 없어. 아무리 잘 숨겨도 에아 님은 전부 꿰뚫어 보시니까.<end>당신, 에아 님을 만나러 왔나 봐? 에아 님이 계신 바람의 신전으로 이어지는 길에는 몬스터가 있으니 조심해.<end>"

["110010"]
japanese = "<select><value:$20>%4今日もよい風が吹いてるわ。<line-break>風はいろんなものを運んでくるの。<line-break>あなたも風と来たのよね？<end>見て、見て！<line-break>きれいな花が咲いているでしょ。<line-break>この花の種も風が運んでくれたのよ。<end>１日１日がとーっても幸せ。　　　　　　　<line-break>今日はどんな花が咲くのかな？<line-break>今日はどんな人に会えるかな？<line-break>今日はどんな風が吹くのかな？<line-break>…なんて考えると楽しみでしょうがないの。<end>風の巫女エア様は墓地の奥にある<line-break>風の神殿にいらっしゃるのよ。<line-break>エルズが平和なのもエア様のおかげね。<end>"
korean = "<select><value:$20>%4오늘도 좋은 바람이 부네. 바람은 여러 가지를 실어 와. 당신도 바람과 함께 온 거지?<end>봐, 봐! 예쁜 꽃이 피었지? 이 꽃씨도 바람이 가져다준 거야.<end>하루하루가 정말 행복해. 오늘은 어떤 꽃이 필까? 오늘은 어떤 사람을 만날까? 오늘은 어떤 바람이 불까? …그렇게 생각하면 즐거워서 견딜 수가 없어.<end>바람의 무녀 에아 님은 묘지 안쪽 바람의 신전에 계셔. 엘즈가 평화로운 것도 에아 님 덕분이야.<end>"

["110011"]
japanese = "<if><value:$2A><less-equal>%49ここの人間はエアにずいぶんと従順なんだな。<line-break>もっとも何でもお見通しの水晶球を持たれては、<line-break>逆らいようもないのだろうがな。<end><if><value:$2A><less-equal>%120ここではエアの命令は絶対らしいな。<line-break>エアが殺せと命令すれば、それが子供でも<line-break>従わなければならないそうだ。<end>支配者にすべてを知られている暮らしなんて<line-break>俺にはがまんできないが、ここの人間は<line-break>毎日が楽しそうだよな。やはり慣れなのかな？<end>"
korean = "<if><value:$2A><less-equal>%49이곳 사람들은 에아에게 꽤 순종적이군. 하긴 뭐든 내다보는 수정구를 가지고 있으니 거역할 수도 없겠지.<end><if><value:$2A><less-equal>%120여기서는 에아의 명령이 절대적인 모양이군. 에아가 죽이라고 명하면 어린아이라도 따르지 않으면 안 된다고 하더군.<end>지배자가 모든 걸 알고 있는 삶이라니 난 못 견디겠지만, 여기 사람들은 매일 즐거워 보이잖아. 역시 익숙해진 걸까?<end>"

["110012"]
japanese = "<select><value:$20>%4ぼくたちリルビーは、<line-break>楽しいことが大好きなのさ。<line-break>ランラランララーン。<end>ぼくたちリルビー丈夫な体。<line-break>毒針、マヒガス何のその、<line-break>きかないよったらきかないよ～ん。<end>ぐるぐるぐるぐるぐる…<line-break>ベッドは大きいな～。<line-break>もう、大陸１周くらい歩いたかな？<end>宿屋のおじさんもかわいがってくれるし、<line-break>ずーっと、ここで回っていようかな。<end>"
korean = "<select><value:$20>%4우리 릴비는 즐거운 게 정말 좋아. 란라란라란~.<end>우리 릴비는 튼튼한 몸. 독침도 마비 가스도 아무렇지 않아, 안 통한다니까~.<end>빙글빙글빙글빙글…. 침대는 크구나~. 벌써 대륙 한 바퀴쯤 걸었으려나?<end>여관 아저씨도 귀여워해 주고, 계속 여기서 빙글빙글 돌고 있을까.<end>"

["110014"]
japanese = "<select><value:$20>%4欲しい物は、たくさんあるのに<line-break>金はなし。どれを買えばお得なのか…。<end>戦闘のことを考えると元気の薬と心の水は<line-break>必要だろうな…う～ん、迷っちゃう。<end>ブロークラストも捨てがたいな…<line-break>午睡の羽もけっこう役に立つし。<end>いざ！　というときのために<line-break>恵みの風は買っておくべきかも<line-break>しれないな。でも…う～ん迷うよ。<end>"
korean = "<select><value:$20>%4갖고 싶은 건 많은데 돈은 없고. 뭘 사야 이득일까….<end>전투를 생각하면 원기의 약과 마음의 물은 필요하겠지… 음, 고민되네.<end>브로크라스트도 포기하기 어렵고… 낮잠의 깃털도 꽤 쓸 만하지.<end>만일의 때를 대비해 은혜의 바람은 사 두는 게 좋을지도 모르겠어. 하지만… 음, 고민된다.<end>"

["110015"]
japanese = "<if><value:$2C><less-equal>%9魔法とは精霊の力を操ること。<line-break>精霊力レベルが低いと強力な魔法は使えぬぞ。<end><if><value:$2C><less-equal>%29この地は風の属性に包まれておる。<line-break>土属性の攻撃が有効じゃぞ。<end><if><value:$2C><less-equal>%49疾風の魔弓という武器が、この地に眠っておる。<line-break>疾風が突き抜けるように敵を刺し貫く<line-break>伝説の弓なのじゃ。<end>究極の風属性魔法が、この地に眠っておる。<line-break>そのカギは風の精霊神にあると思うのじゃが<line-break>エアが恐ろしうて調べられんのじゃ。<end>"
korean = "<if><value:$2C><less-equal>%9마법이란 정령의 힘을 다루는 것. 정령력 레벨이 낮으면 강력한 마법은 쓸 수 없느니라.<end><if><value:$2C><less-equal>%29이 땅은 바람 속성에 둘러싸여 있다. 땅 속성 공격이 효과적이니라.<end><if><value:$2C><less-equal>%49질풍의 마궁이라는 무기가 이 땅에 잠들어 있다. 질풍이 꿰뚫고 지나가듯 적을 찌르는 전설의 활이니라.<end>궁극의 바람 속성 마법이 이 땅에 잠들어 있다. 그 열쇠는 바람의 정령신에게 있다고 생각하지만 에아가 무서워 조사할 수 없구나.<end>"

["110016"]
japanese = "<if><value:$2A><less-equal>%49魔法を極めたいなら<line-break>ディンガルの魔道アカデミーがいいわよ。<line-break>あそこの卒業生は優秀なんだから。<end><if><value:$2A><less-equal>%100武器や防具の属性を無属性にするには<line-break>神官様にお願いするのが一番よ。<line-break>よく忘れるから覚えときなさい。<end><if><value:$2A><less-equal>%150装備品を持てる数は決まってるのよ。<line-break>そろそろいらないものは捨てちゃいなさい。<end>あなた、<value:$28>でしょ。<line-break>世界一の冒険者に、あたしが教えられること<line-break>なんてないわよ。からかわないでよね。<end>"
korean = "<if><value:$2A><less-equal>%49마법을 극한까지 익히고 싶다면 딩갈의 마도 아카데미가 좋아. 거기 졸업생들은 우수하거든.<end><if><value:$2A><less-equal>%100무기나 방어구의 속성을 무속성으로 바꾸려면 신관님께 부탁하는 게 제일이야. 자주 잊으니까 기억해 둬.<end><if><value:$2A><less-equal>%150장비품을 들 수 있는 수는 정해져 있어. 이제 필요 없는 건 버리도록 해.<end>너 <value:$28>지? 세계 최고의 모험자에게 내가 가르칠 게 뭐가 있겠어. 놀리지 마.<end>"

["110017"]
japanese = "<if><value:$2C><less-equal>%9ラミリー山には行かない方がいい。<line-break>あんたじゃ弱すぎて、<line-break>死にに行くようなもんだ。<end><if><value:$2C><less-equal>%29よし！　合格だ。<line-break>今の強さならラミリー山へ行っても大丈夫だな。<line-break>回復アイテムは多めに持っていけよ。<end><if><value:$2C><less-equal>%49ラミリー山は風の精霊神の座所に通じる山さ。<line-break>だけど座所へ行くには風の神殿を通る必要が<line-break>あるってのが問題なんだ。<end>風の神殿を通るにはエアの許可がいるだろ。<line-break>とうてい俺には無理だが、あんたなら<line-break>なんとかなるんじゃないかい？<end>"
korean = "<if><value:$2C><less-equal>%9라밀리 산에는 안 가는 게 좋아. 당신 정도로는 너무 약해서 죽으러 가는 거나 마찬가지야.<end><if><value:$2C><less-equal>%29좋아! 합격이다. 지금 실력이면 라밀리 산에 가도 괜찮겠군. 회복 아이템은 넉넉히 챙겨 가.<end><if><value:$2C><less-equal>%49라밀리 산은 바람의 정령신이 머무는 곳으로 이어지는 산이야. 하지만 그곳에 가려면 바람의 신전을 지나야 한다는 게 문제지.<end>바람의 신전을 지나려면 에아의 허가가 필요하겠지. 나로서는 도저히 무리지만, 당신이라면 어떻게든 되지 않을까?<end>"

["110018"]
japanese = "<select><value:$20>%4２階へは行かせぬぞえ。<line-break>この婆から、何もかも<line-break>持っていくつもりかえ。<end>年寄りじゃからといって、<line-break>バカにしておるのかえ。<line-break>この極道冒険者め！<end>勝手に人の家に入り込んで、<line-break>荒らしまわるなぞ不作法はなはだしいぞえ！<line-break>冒険者といえど、モラルを持ちなされ。<end>階段の先には何もないぞえ。<line-break>年寄りの言うことは聞くものじゃ。<end>"
