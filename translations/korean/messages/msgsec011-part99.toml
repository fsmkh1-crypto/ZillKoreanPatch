["110024"]
japanese = "<select><value:$20>%4働くぞ！　俺は働くぞ！<line-break>この体が壊れるまで！<end>ボルダンは戦いに生きる者…<line-break>俺の相手はこの荷物なのだ！<end>荷物運びは俺たちの仕事だ。<line-break>人間に任せておくと時間がかかって<line-break>しょうがない。<end>じゃまじゃま、どいてくれ！<end>"
korean = "<select><value:$20>%4일한다! 나는 일한다! 이 몸이 부서질 때까지!<end>볼단은 싸움에 사는 자… 내 상대는 이 짐이다!<end>짐 나르기는 우리 일이다. 인간에게 맡기면 시간이 걸려서 답답해.<end>비켜 비켜, 길을 열어!<end>"

["110025"]
japanese = "<select><value:$20>%4力仕事には自信があるが、<line-break>頭脳労働は苦手だな。<end>航海のことはわからん。<line-break>難しいことは人間に任せて<line-break>荷物運びに励むのがいいのだ。<end>俺もがんばっているが、<line-break>あいつはもっとがんばっている。<line-break>負けるわけにはいかんのだ！<end>なんだ？　難しい話が聞きたいなら<line-break>他の奴に聞いてくれ。<end>"
korean = "<select><value:$20>%4힘쓰는 일엔 자신 있지만 머리 쓰는 일은 영 약하군.<end>항해는 잘 모르겠어. 어려운 건 인간들에게 맡기고 짐 나르는 데 힘쓰는 게 낫지.<end>나도 열심히 하고 있지만 그 녀석은 더 열심히 하고 있어. 질 수는 없지!<end>뭐지? 어려운 이야기가 듣고 싶으면 다른 녀석에게 물어봐.<end>"

["110028"]
japanese = "<select><value:$20>%3主人の仕事がうまくいったら<line-break>お手伝いさんを雇って楽をしたいわ。<line-break>毎日忙しくて忙しくて…。<end>家事が一段落ついたら、<line-break>主人の仕事を手伝わないといけないわ。<line-break>ほんとに忙しいわね。 <end>私の夢は、我が社を世界一の貿易会社に<line-break>することなのよ。そのためには<line-break>このくらいの苦労なんてへっちゃらよ。<end>"
korean = "<select><value:$20>%3남편 일이 잘되면 도우미를 고용해서 좀 편해지고 싶어. 매일 너무 바쁘다니까….<end>집안일이 어느 정도 끝나면 남편 일도 도와야 해. 정말 바쁘네.<end>내 꿈은 우리 회사를 세계 최고의 무역회사로 만드는 거야. 그러려면 이 정도 고생쯤은 아무것도 아니지.<end>"

