["110000"]
japanese = "<select><value:$33>お若いの…人はみな、必ず死ぬんじゃ。<line-break>その時、後悔せんでいいような<line-break>人生を送りなされ。<end>お若いの…人はみな、必ず死ぬんじゃ。<line-break>その時、後悔せんでいいような<line-break>人生を送りなされ。<end>強大な魔力を持った魔道王国ラドラスも<line-break>滅びの運命には逆らえなんだ。<line-break>勇者ネメアとて、やがては滅びる。<end>ロセンで処刑された王族の中には子供も<line-break>おったそうな。その子たちは人生の意味さえ<line-break>知らずに死んだのじゃろうな…。<end>ひとたび戦争となれば、畑は人馬に荒らされ<line-break>村は火をつけられる。戦争の目的がいかに<line-break>崇高であろうと許される行為ではない…。<end>リベルダムには行ってみたかね？<line-break>壊された建物の中には小さな幸福がたくさん<line-break>つまっていただろうに、むごいことよ…。<end>世の乱れは人の心の乱れだという。<line-break>これだけ乱れれば、人々も平穏を<line-break>望むじゃろう…。<end>世の乱れは人の心の乱れだという。<line-break>これだけ乱れれば、人々も平穏を<line-break>望むじゃろう…。<end>"
korean = "<select><value:$33>젊은이… 사람은 누구나 반드시 죽는 법이네. 그때 후회하지 않을 인생을 살게나.<end>젊은이… 사람은 누구나 반드시 죽는 법이네. 그때 후회하지 않을 인생을 살게나.<end>강대한 마력을 지닌 마도왕국 라드라스도 멸망의 운명을 거스를 수 없었지. 용사 네메아도 언젠가는 사라질 걸세.<end>로센에서 처형된 왕족 중에는 아이들도 있었다더군. 그 아이들은 인생의 의미조차 모른 채 죽었겠지….<end>전쟁이 벌어지면 밭은 사람과 말에 짓밟히고 마을은 불타지. 전쟁의 목적이 아무리 숭고해도 용서받을 행위는 아니네….<end>리벨덤에는 가 봤나? 무너진 건물 속에는 작은 행복이 가득했을 텐데, 잔혹한 일이야….<end>세상의 혼란은 사람 마음의 혼란이라 하지. 이만큼 어지러우면 사람들도 평온을 바라겠지….<end>세상의 혼란은 사람 마음의 혼란이라 하지. 이만큼 어지러우면 사람들도 평온을 바라겠지….<end>"

["110001"]
japanese = "<if><value:$2C><less-equal>%9風の巫女エア様は、<line-break>天地千年を見通すことが<line-break>できる偉大なお方なのだ。<end><if><value:$2C><less-equal>%29エア様にわからぬことはない。<line-break>エア様の前で、くれぐれも隠し事など<line-break>してはいかんぞ。<end><if><value:$2C><less-equal>%49こうして他国の脅威におびえることなく<line-break>平和に暮らせるのもエア様のおかげだよ。<line-break>わしはいつも感謝しておるのだぞ。<end>君が強いのはよくわかる。<line-break>だからこそ勇み足でエア様を怒らせるような<line-break>ことだけはしないでくれよ。<end>"
korean = "<if><value:$2C><less-equal>%9바람의 무녀 에아 님은 천지의 천년을 내다볼 수 있는 위대한 분이시다.<end><if><value:$2C><less-equal>%29에아 님께 모르는 것은 없다. 에아 님 앞에서 절대로 숨기는 일이 있어선 안 된다.<end><if><value:$2C><less-equal>%49이렇게 다른 나라의 위협에 떨지 않고 평화롭게 살 수 있는 것도 에아 님 덕분이야. 나는 늘 감사하고 있단다.<end>네가 강하다는 건 잘 안다. 그렇기 때문에 너무 앞서 나가 에아 님을 화나게 하는 일만은 하지 말아 다오.<end>"

["110002"]
japanese = "<select><value:$33>よそから来た人はエア様を<line-break>恐がるみたいだけど<line-break>とんでもない話だよ。<end>よそから来た人はエア様を<line-break>恐がるみたいだけど<line-break>とんでもない話だよ。<end>なかなかに手入れの行き届いた花壇だろ。<line-break>こうして花を愛でる余裕があるのが、<line-break>ここのいいところなんだよ。<end>この広場に描いてあるのは、<line-break>エア様と一緒にこの地を守ってくれる<line-break>翔王様のお姿なんだよ。<end>エア様はこの世のすべてを過去から未来まで<line-break>見通すことのできる偉大なお方なんだよ。<line-break>あのネメアだってエア様に会いに来たからね。<end>先祖が魔道王国ラドラスの民だから、エア様や<line-break>神官たちは魔法が得意なんだよ。あたしも<line-break>魔法で山のひとつでも吹き飛ばしてみたいねえ。<end>大陸のロストールやリベルダムは<line-break>大変なことになっているそうだね。<line-break>ここはこんなに平和なのにね。<end>大陸はもうすぐディンガル帝国に<line-break>統一されるって噂だよ。<line-break>そうすると次はここに攻め込むのかねえ…。<end>"
korean = "<select><value:$33>외지 사람들은 에아 님을 무서워하는 것 같은데 말도 안 되는 소리야.<end>외지 사람들은 에아 님을 무서워하는 것 같은데 말도 안 되는 소리야.<end>꽤 잘 가꾼 화단이지? 이렇게 꽃을 감상할 여유가 있다는 게 이곳의 좋은 점이야.<end>이 광장에 그려진 건 에아 님과 함께 이 땅을 지켜 주는 상왕 님의 모습이야.<end>에아 님은 이 세상의 모든 것을 과거부터 미래까지 꿰뚫어 보는 위대한 분이야. 그 네메아도 에아 님을 만나러 왔으니까.<end>조상이 마도왕국 라드라스의 백성이라 에아 님과 신관들은 마법에 능숙해. 나도 마법으로 산 하나쯤 날려 보고 싶네.<end>대륙의 로스토올이나 리벨덤은 큰일이 났다더라. 여긴 이렇게 평화로운데.<end>대륙은 곧 딩갈 제국에 통일된다는 소문이야. 그러면 다음엔 여길 공격하려나…<end>"

["110003"]
japanese = "<if><value:$2A><less-equal>%49自警団って危険な仕事が多そうだなあ…。<line-break>ボクは腕力に自信がないから<line-break>会計担当でいいよ。<end><if><value:$2A><less-equal>%100自警団っていっても、今までの仕事は<line-break>花壇を荒らしたピクシーをこらしめただけだよ。<line-break>平和すぎて仕事にならないよ～。<end><if><value:$2A><less-equal>%140自警団なんて言っているけど、団員は２人だよ。<line-break>強いモンスターが暴れたりしたらどうしよう…。<line-break><value:$28>のような人が団員ならな～。<end>大陸では戦争で家を焼かれたり家族を失ったり<line-break>した人が大勢いるのに、ここは本当に平和だね。<line-break>これもエア様のおかげなのかな。<end>"
korean = "<if><value:$2A><less-equal>%49자경단은 위험한 일이 많을 것 같아…. 난 힘에 자신이 없으니 회계 담당이면 됐어.<end><if><value:$2A><less-equal>%100자경단이라 해도 지금까지 한 일은 화단을 망친 픽시를 혼내 준 것뿐이야. 너무 평화로워서 일이 안 된다니까~.<end><if><value:$2A><less-equal>%140자경단이라고 해도 단원은 둘뿐이야. 강한 몬스터가 날뛰면 어쩌지…. <value:$28> 같은 사람이 단원이면 좋을 텐데~.<end>대륙에는 전쟁으로 집이 불타고 가족을 잃은 사람이 많은데 여긴 정말 평화롭네. 이것도 에아 님 덕분일까.<end>"

["110004"]
japanese = "<if><value:$2A><less-equal>%49アミラルじゃ自警団を組織して<line-break>町を守ってるんだってよ。<line-break>俺たちも海賊から町を守るために<line-break>組織したほうがいいかもな。<line-break>あんたは、どう思う？<end><if><value:$2A><less-equal>%100俺たちの町は、俺たちが守るっ！<line-break>う～ん、燃えるっ！　燃えるぜぇ！<line-break>今日もやあぁぁぁあってやるぜっ！<end><if><value:$2A><less-equal>%140俺たち自警団のおかげで今日も平和だぜぇ！<line-break>エルズ自警団では団員を募集している。<line-break>君も我々と町の平和を守ろうじゃないかっ！<end>今日も空は晴れ渡り、心地よい風が吹く…。<line-break>この平和なひとときを自分たちが守っている<line-break>なんて…俺は今、最高に充実しているっ！<end>"
korean = "<if><value:$2A><less-equal>%49아미랄은 자경단을 조직해서 마을을 지킨다더군. 우리도 해적으로부터 마을을 지키려면 조직하는 게 좋을지도 몰라. 넌 어떻게 생각해?<end><if><value:$2A><less-equal>%100우리 마을은 우리가 지킨다! 으음, 불타오른다! 오늘도 해내 주겠어어어!<end><if><value:$2A><less-equal>%140우리 자경단 덕분에 오늘도 평화롭다! 엘즈 자경단은 단원을 모집 중이다. 자네도 우리와 함께 마을의 평화를 지키자고!<end>오늘도 하늘은 맑고 기분 좋은 바람이 분다…. 이 평화로운 순간을 우리가 지키고 있다니… 지금 난 최고로 충실해!<end>"

["110005"]
japanese = "<select><value:$20>%4おっきくなったら船長になるんだ！<line-break>海の男だぞ。<end>海の男になるために、<line-break>足腰を鍛えるんだ！<line-break>がんばるぞ！<end>遅いぞ！<line-break>それじゃあ海の男になんて<line-break>なれないぞ。<end>今、特訓中なんだ。<line-break>邪魔しないでよ！<end>"
korean = "<select><value:$20>%4크면 선장이 될 거야! 바다의 사나이가 될 거라고.<end>바다의 사나이가 되려면 하체를 단련해야 해! 힘낼 거야!<end>느려! 그러고선 바다의 사나이가 될 수 없어.<end>지금 특훈 중이야. 방해하지 마!<end>"

["110006"]
japanese = "<select><value:$20>%4お兄ちゃん、<line-break>あたしも海の男になりたいよぉ。<end>お兄ちゃん、<line-break>走るの速すぎるよぉ～<line-break>あたしを何回も抜いちゃやだ～。<end>お兄ちゃん、<line-break>目が回るよぉ～<end>お兄ちゃん、<line-break>待ってぇ～、待ってよぉ～。<end>"
korean = "<select><value:$20>%4오빠, 나도 바다 사나이가 되고 싶어.<end>오빠, 너무 빨라~ 나를 몇 번이나 추월하면 싫어~.<end>오빠, 어지러워~<end>오빠, 기다려~ 기다려 줘~.<end>"

["110007"]
japanese = "<select><value:$20>%4昔は海賊といえばワッシャー海賊だったのに、<line-break>最近は名を聞かなくなったなあ。<line-break><line-break>今でもフゴー商会の船だけを<line-break>襲っているのかな。<end>昔は海賊にも仁義があったものさ。<line-break>無抵抗の人間は殺さないし、モンスターに<line-break>襲われていたら助けてくれたしな。<end>今になって思えばワッシャー海賊は、　　　　<line-break>海賊というより海洋冒険者集団だったのかも<line-break>しれないな。<line-break>彼らがフゴー商会の船を襲うのは、フゴーが、<line-break>カンダカンの集めた宝を欲しがって嫌がらせを<line-break>したのが原因だというしな。<end>船旅で困るのは、モンスターに出会っても<line-break>逃げることができないってことだよな。<line-break>それさえなけりゃ快適なんだがな。<end>"
korean = "<select><value:$20>%4예전엔 해적 하면 와셔 해적이었는데 요즘은 이름도 잘 안 들리네. 지금도 휴고 상회의 배만 습격하고 있나?<end>옛날 해적들에겐 나름의 의리가 있었지. 저항하지 않는 사람은 죽이지 않았고, 몬스터에게 습격당하면 도와주기도 했으니까.<end>지금 생각하면 와셔 해적은 해적이라기보다 해양 모험자 집단이었는지도 모르겠어. 그들이 휴고 상회의 배를 습격하는 것도 휴고가 칸다칸이 모은 보물을 탐내며 괴롭힌 게 원인이라잖아.<end>뱃길에서 곤란한 건 몬스터를 만나도 도망칠 수 없다는 거야. 그것만 아니면 쾌적한데 말이지.<end>"

["110008"]
japanese = "<select><value:$20>%5エア様は、すべてを見通すことができる<line-break>魔法の水晶球を持ってらっしゃるのよ。<line-break>私も、子供たちの未来を知りたいわ。<end>ここはきれいなところでしょ。<line-break>こうやって子供たちが遊んでいる姿を見たり、<line-break>お花の手入れをしていると心がなごむの。<end>エア様は風の精霊神におつかえする<line-break>巫女でもあるのよ。<line-break>よい風が吹くのもエア様のおかげだわ。<end>エルズで悪いことをする人はいないわ。<line-break>だって、どんなに上手に隠してもエア様には<line-break>すべてお見通しなんですもの。<end>あなた、エア様に会いに来たのかしら？<line-break>エア様のいらっしゃる風の神殿へ続く道には<line-break>モンスターがいるから気をつけるのよ。<end>"
korean = "<select><value:$20>%5에아 님은 모든 것을 내다볼 수 있는 마법의 수정구를 가지고 계셔. 나도 아이들의 미래를 알고 싶네.<end>여기 참 예쁜 곳이지? 이렇게 아이들이 노는 모습을 보고 꽃을 돌보다 보면 마음이 편안해져.<end>에아 님은 바람의 정령신을 섬기는 무녀이기도 하셔. 좋은 바람이 부는 것도 에아 님 덕분이지.<end>엘즈에서 나쁜 짓을 하는 사람은 없어. 아무리 잘 숨겨도 에아 님은 전부 꿰뚫어 보시니까.<end>당신, 에아 님을 만나러 왔나 봐? 에아 님이 계신 바람의 신전으로 이어지는 길에는 몬스터가 있으니 조심해.<end>"

["110009"]
japanese = "<select><value:$20>%5わしらドワーフは泳げんから<line-break>海を越えるのには勇気がいるんじゃぞ。<line-break>海に落ちたら最後、おぼれ死ぬからのう。<end>分断の山脈の地下にあるわしらの国に<line-break>行ったことはあるかの？<line-break>ひんやりとしてよい所じゃぞ。<line-break>ここは少し暑すぎるわい。<line-break>日陰はどこじゃ～。<end>船の上では、ず～っと柱にしがみついて<line-break>水平線を見ておったのじゃ。波間を見ておると<line-break>吸い込まれそうになってしまうからのう。<end>船旅は恐かったが、よい土産話ができたわい。<line-break>じゃが帰りも海を越えねばいかんと思うと<line-break>なかなか帰る決心がつかんでのう…。<end>ここにはエアという何でもご存知の<line-break>人間がおるそうじゃぞ。<line-break>わしも会いに行ってみようかのう。<end>"
korean = "<select><value:$20>%5우리 드워프는 수영을 못해서 바다를 건너는 데 용기가 필요하네. 바다에 빠지면 끝장, 그대로 익사하니까.<end>분단의 산맥 지하에 있는 우리 나라에 가 본 적 있나? 서늘하고 좋은 곳이라네. 여긴 좀 너무 덥군. 그늘은 어디 있나~.<end>배 위에서는 줄곧 기둥에 매달려 수평선만 바라봤네. 파도를 보고 있으면 빨려 들어갈 것 같아서 말이야.<end>뱃길은 무서웠지만 좋은 이야깃거리가 생겼네. 하지만 돌아갈 때도 바다를 건너야 한다고 생각하니 좀처럼 돌아갈 결심이 안 서는군…<end>여기에는 에아라는 뭐든 다 아는 인간이 있다더군. 나도 한번 만나러 가 볼까.<end>"

["110010"]
japanese = "<select><value:$20>%4今日もよい風が吹いてるわ。<line-break>風はいろんなものを運んでくるの。<line-break>あなたも風と来たのよね？<end>見て、見て！<line-break>きれいな花が咲いているでしょ。<line-break>この花の種も風が運んでくれたのよ。<end>１日１日がとーっても幸せ。　　　　　　　<line-break>今日はどんな花が咲くのかな？<line-break>今日はどんな人に会えるかな？<line-break>今日はどんな風が吹くのかな？<line-break>…なんて考えると楽しみでしょうがないの。<end>風の巫女エア様は墓地の奥にある<line-break>風の神殿にいらっしゃるのよ。<line-break>エルズが平和なのもエア様のおかげね。<end>"
