["30015"]
japanese = "<select><value:$33>ちょ…ちょっと、魔法について質問されても　<line-break>困りますよ。私もここの学生で魔法を学んで<line-break>いるところなんですから。<line-break>魔道士の格好してるから間違えたって？<line-break>ははは、何事もまずは形からと言うでしょ。<line-break>格好だけは魔道士になってみたんですよ。<end>ちょ…ちょっと、魔法について質問されても　<line-break>困りますよ。私もここの学生で魔法を学んで<line-break>いるところなんですから。<line-break>魔道士の格好してるから間違えたって？<line-break>ははは、何事もまずは形からと言うでしょ。<line-break>格好だけは魔道士になってみたんですよ。<end>私が先生に聞いた話では魔道士系のソウルを<line-break>宿すには探求心Ｓｅａｒｃｈが高くないと<line-break>いけないそうですね。<line-break>でも、それだけじゃだめみたいですよ。<line-break>冷静さＣｏｏｌや信念Ｂｅｌｉｅｆも<line-break>高位の魔道士ソウルには重要みたいです。<end>戦闘後に手に入る精霊力ポイントは、<line-break>倒したモンスターの属性で決まるそうですよ。<line-break>戦う相手も考えなきゃいけませんね。<end>私が先生に聞いた話だと、人によって　　　　<line-break>生まれつき持っている精霊力レベルは違う<line-break>らしいですよ。<line-break>できるだけ精霊力レベルのかたよりをなくせと<line-break>先生はおっしゃってましたが、<line-break>これって大変じゃないですか？<end>火、水、土、風の４属性の上位属性で、<line-break>聖と闇というのがあるそうですよ。<line-break>やっぱり聖属性の攻撃魔法は強いんでしょうね。<end>私が先生に聞いた話だと、この世界のどこかに、<line-break>禁呪が封印されているそうですよ。<line-break>先輩の中には、必死に探している人もいますね。<end>もうすぐ初級課程の卒業試験があるんですよ。<line-break>これに合格すれば、私もほんとうの魔道士に<line-break>なれるわけです、ふふふふ…。<end>"
korean = "<select><value:$33>자… 잠깐, 마법에 대해 물어보셔도　<line-break>곤란해요. 저도 여기 학생이라 마법을 배우는<line-break>중이거든요.<line-break>마도사 차림이라서 착각하셨다고요?<line-break>하하하, 뭐든 먼저 모양부터 갖추라고 하잖아요.<line-break>일단 겉모습만 마도사처럼 해 본 거예요.<end>자… 잠깐, 마법에 대해 물어보셔도　<line-break>곤란해요. 저도 여기 학생이라 마법을 배우는<line-break>중이거든요.<line-break>마도사 차림이라서 착각하셨다고요?<line-break>하하하, 뭐든 먼저 모양부터 갖추라고 하잖아요.<line-break>일단 겉모습만 마도사처럼 해 본 거예요.<end>선생님께 들었는데 마도사 계열 소울을<line-break>품으려면 탐구심 Ｓｅａｒｃｈ가 높아야<line-break>한대요.<line-break>하지만 그것만으로는 안 되는 모양이에요.<line-break>냉정함 Ｃｏｏｌ과 신념 Ｂｅｌｉｅｆ도<line-break>고위 마도사 소울에는 중요하대요.<end>전투 후 얻는 정령력 포인트는<line-break>쓰러뜨린 몬스터의 속성에 따라 정해진대요.<line-break>싸울 상대도 잘 골라야겠네요.<end>선생님 말씀으로는 사람마다　　　　<line-break>태어날 때부터 지닌 정령력 레벨이<line-break>다르다고 해요.<line-break>가능한 한 정령력 레벨이 치우치지 않게 하라고<line-break>하셨는데,<line-break>이거 꽤 힘든 일 아닌가요?<end>불, 물, 땅, 바람 네 속성의 상위 속성으로<line-break>성속성과 암속성이 있다고 해요.<line-break>역시 성속성 공격 마법은 강하겠죠.<end>선생님께 들었는데 이 세계 어딘가에<line-break>금주가 봉인되어 있대요.<line-break>선배 중에는 필사적으로 찾는 사람도 있어요.<end>곧 초급 과정 졸업시험이 있어요.<line-break>여기에 합격하면 저도 진짜 마도사가<line-break>되는 거죠. 후후후후….<end>"

["30016"]
japanese = "<if><value:$2C><less-equal>%9魔法を使うためには、ウォーロックのソウルを<line-break>宿して、ロースペルが使えるようになりなさい。<line-break>あとは、精霊力レベルを上げるのです。<end><if><value:$2C><less-equal>%29ロースペルやハイスペルは、ひとつの精霊力のみ<line-break>を扱う魔法ですが、ユナイトスペルは火と水、<line-break>土と風のように複数の精霊力を扱います。<line-break>火と水の精霊力を扱う魔法を使うには<line-break>火と水の精霊力レベルが６以上なくては<line-break>ならないので注意してください。<end><if><value:$2C><less-equal>%49闇属性の魔法を使うためには、火、水、土、風、<line-break>４種類の精霊力レベルが、<line-break>２以上なければなりません。<line-break>その上で、ネガヴァニティアのソウルを宿し、<line-break>バニティスペルを使えるようになるのです。<line-break>精霊力レベルが、かたよっていてはダメですよ。<end>火、水、土、風の禁呪は、封印を解くだけでは<line-break>使えません。それぞれの精霊力レベルが９以上で<line-break>ハイスペルが使えなくてはならないのです。<end>"
korean = "<if><value:$2C><less-equal>%9마법을 사용하려면 워록 소울을<line-break>품고 로 스펠을 사용할 수 있게 되십시오.<line-break>그다음에는 정령력 레벨을 올리면 됩니다.<end><if><value:$2C><less-equal>%29로 스펠과 하이 스펠은 하나의 정령력만<line-break>다루는 마법이지만, 유나이트 스펠은 불과 물,<line-break>땅과 바람처럼 여러 정령력을 다룹니다.<line-break>불과 물의 정령력을 다루는 마법을 사용하려면<line-break>불과 물의 정령력 레벨이 ６ 이상이어야<line-break>하니 주의하십시오.<end><if><value:$2C><less-equal>%49암속성 마법을 사용하려면 불, 물, 땅, 바람<line-break>네 종류의 정령력 레벨이<line-break>２ 이상이어야 합니다.<line-break>그 위에 네가바니티아 소울을 품고<line-break>배니티 스펠을 사용할 수 있게 되어야 합니다.<line-break>정령력 레벨이 치우쳐서는 안 됩니다.<end>불, 물, 땅, 바람의 금주는 봉인을 푸는 것만으로는<line-break>사용할 수 없습니다. 각 정령력 레벨이 ９ 이상이고<line-break>하이 스펠을 사용할 수 있어야 합니다.<end>"

["30017"]
japanese = "<select><value:$33>うーん、あなたの信仰する神はなんなのかな？<line-break>ノトゥーン？　ソリアス？　ウルグ？<line-break>私はソリアスかなあ。<line-break>あっ、いちおう学生ですから魔法も勉強してますよ。<line-break>宗教学科の学生じゃないですからね。<end>あなた、魔道アカデミーの学生じゃないでしょ。<line-break>そんな人が、ここを歩き回ってちゃダメよ。<line-break>なに？　私も学生に見えないって？<line-break>う、失礼ね。<line-break>これでも、ちゃんと魔法を勉強しているのよ！<end>水の魔法は回復系が中心なの。<line-break>土は状態変化、風は補助系が中心ね。<line-break>えーと、火は…<line-break>いわなくても、わかるでしょ。<end>もう、またユーリスったらアカデミーを<line-break>壊してるわ。<line-break>ユーリスの爆発魔法、威力があるのは<line-break>いいけど、場所を選んで使ってほしいわね。<end>エンシャントで戦争が起きているみたいね。<line-break>まさか、ここまで戦火が広がることは<line-break>ないと思うけど…。<line-break>やっぱり、ちょっと不安ね。<end>ロセンの町が解放されたそうよ。<line-break>これで戦争が終わればいいんだけど…。<end>戦争が続いているせいかしら。<line-break>最近、授業を休む人が多いのよ。<line-break>先生の中にも授業を休む人がいるし…。<line-break>みんな、どこに行ってるのかしら。<end>最近、アカデミーをやめる人が増えてるのよ。<line-break>私もどうしようか考えているんだけど…。<line-break>卒業まで、もうちょっとだしなあ。<end>"
korean = "<select><value:$33>음, 당신이 믿는 신은 누구야?<line-break>노툰? 솔리아스? 울그?<line-break>나는 솔리아스려나.<line-break>아, 그래도 학생이니까 마법도 공부하고 있어.<line-break>종교학과 학생은 아니라고.<end>당신, 마도 아카데미 학생 아니지?<line-break>그런 사람이 여기저기 돌아다니면 안 돼.<line-break>뭐? 나도 학생처럼 안 보인다고?<line-break>뭐, 무례하네.<line-break>이래 봬도 제대로 마법을 공부하고 있거든!<end>물 마법은 회복 계열이 중심이야.<line-break>땅은 상태 변화, 바람은 보조 계열이 중심이고.<line-break>음, 불은…<line-break>말 안 해도 알겠지?<end>정말, 유리스가 또 아카데미를<line-break>부수고 있네.<line-break>유리스의 폭발 마법이 강력한 건<line-break>좋지만, 장소 좀 가려서 썼으면 좋겠어.<end>엔션트에서 전쟁이 벌어진 모양이네.<line-break>설마 여기까지 전쟁이 번지지는<line-break>않겠지만….<line-break>그래도 조금 불안해.<end>로센이 해방됐다고 해.<line-break>이걸로 전쟁이 끝나면 좋을 텐데….<end>전쟁이 계속돼서 그런가.<line-break>요즘 수업을 빠지는 사람이 많아.<line-break>선생님 중에도 수업을 쉬는 사람이 있고….<line-break>다들 어디로 간 걸까.<end>요즘 아카데미를 그만두는 사람이 늘고 있어.<line-break>나도 어떻게 할지 고민 중인데….<line-break>졸업까지 얼마 안 남았으니까 말이야.<end>"

["30018"]
japanese = "<if><value:$2C><less-equal>%19街道を北に進むとロセンの町があるの。<line-break>今は門を閉ざして、入れないみたいだけどね。<line-break>東方に住むエルフやドワーフの話を聞きたいなら<line-break>テラネっていう村に行くといいわよ。<line-break>少し遠いけど、東方への中継地だから<line-break>旅人が多いの。<end><if><value:$2C><less-equal>%29テラネは何度もモンスターの襲撃を<line-break>受けているそうね。<line-break>冒険者ギルドでモンスター退治の仕事を<line-break>募集しているかもしれないわよ。<end><if><value:$2C><less-equal>%49東方の霊峰トールに、天空神ノトゥーンが<line-break>降臨したという伝説があるの。<line-break>そのため、ノトゥーン信者は一生に一度は<line-break>トールに巡礼するそうよ。<end>東方にドワーフ王国があるって知ってる？<line-break>すごい宝があるって噂よ。<line-break>あたしも１度でいいから行ってみたいなあ。<end>"
korean = "<if><value:$2C><less-equal>%19가도를 따라 북쪽으로 가면 로센이 있어.<line-break>지금은 성문을 닫아서 들어갈 수 없는 모양이지만.<line-break>동방에 사는 엘프나 드워프 이야기를 듣고 싶다면<line-break>테라네라는 마을에 가 보는 게 좋아.<line-break>조금 멀지만 동방으로 가는 중계지라서<line-break>여행자가 많거든.<end><if><value:$2C><less-equal>%29테라네는 몬스터에게 몇 번이나 습격당했다더라.<line-break>모험자 길드에서 몬스터 퇴치 일을<line-break>모집하고 있을지도 몰라.<end><if><value:$2C><less-equal>%49동방의 영봉 토르에 천공신 노툰이<line-break>강림했다는 전설이 있어.<line-break>그래서 노툰 신자는 일생에 한 번은<line-break>토르를 순례한다고 해.<end>동방에 드워프 왕국이 있다는 거 알아?<line-break>엄청난 보물이 있다는 소문이야.<line-break>나도 한 번만이라도 가 보고 싶다.<end>"
