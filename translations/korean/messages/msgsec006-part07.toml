["60038"]
japanese = "<if><value:$33><less-equal>2正直者がバカを見るのがこのリベルダムだ。<line-break>親友さえも平気でおとしいれることのできる<line-break>人間が、ここじゃ勝利者なんだよ。<end><if><value:$33><equal>3ロセンで暴れている解放軍のリーダーは、<line-break>ロティだ。奴は王家の血をひく自分の娘を<line-break>女王にしようって腹なのさ。ふざけやがって！<end><if><value:$33><equal>4くくくくっ…ロティの奴が暗殺されてみろ。<line-break>恨みを持つ者が多すぎて犯人を探すことが<line-break>できないぜ。<end><if><value:$33><equal>5アンティノの野郎、カルラに何を吹き込まれた<line-break>かは知らないが、リベルダムを滅ぼした罪は<line-break>絶対に償わさせてやるっ！<end>自由都市だの文化の中心だのとたたえられた<line-break>リベルダムも、今じゃ巨大なスラムだよ。<line-break>ここら辺りは、もとからスラムだがよ。<end>"
korean = "<if><value:$33><less-equal>2정직한 사람이 손해 보는 곳이 이 리벨담이야. 친한 친구조차 태연하게 함정에 빠뜨릴 수 있는 인간이 여기서는 승리자지.<end><if><value:$33><equal>3로센에서 날뛰는 해방군의 지도자는 로티야. 그 녀석은 왕가의 피를 잇는 자기 딸을 여왕으로 만들 속셈이지. 웃기지 마!<end><if><value:$33><equal>4크크크크… 로티가 암살이라도 당해 봐. 원한을 품은 사람이 너무 많아서 범인을 찾지도 못할걸.<end><if><value:$33><equal>5안티노 그 자식, 카를라에게 무슨 말을 들었는진 몰라도 리벨담을 멸망시킨 죄만큼은 반드시 치르게 할 거야!<end>자유도시니 문화의 중심이니 칭송받던 리벨담도 이젠 거대한 슬럼이야. 뭐, 이 근처는 원래부터 슬럼이었지만.<end>"
layout = "<if><value:$33><less-equal>2정직한 사람이 손해 보는 곳이 이 리벨담이야.<line-break>친한 친구조차 태연하게 함정에 빠뜨릴 수 있는<line-break>인간이 여기서는 승리자지.<end><if><value:$33><equal>3로센에서 날뛰는 해방군의 지도자는<line-break>로티야. 그 녀석은 왕가의 피를 잇는 자기 딸을<line-break>여왕으로 만들 속셈이지. 웃기지 마!<end><if><value:$33><equal>4크크크크… 로티가 암살이라도 당해 봐.<line-break>원한을 품은 사람이 너무 많아서 범인을<line-break>찾지도 못할걸.<end><if><value:$33><equal>5안티노 그 자식, 카를라에게 무슨 말을 들었는진<line-break>몰라도 리벨담을 멸망시킨 죄만큼은<line-break>반드시 치르게 할 거야!<end>자유도시니 문화의 중심이니 칭송받던<line-break>리벨담도 이젠 거대한 슬럼이야.<line-break>뭐, 이 근처는 원래부터 슬럼이었지만.<end>"
