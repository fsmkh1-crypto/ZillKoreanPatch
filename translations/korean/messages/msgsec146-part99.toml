["1460000"]
japanese = "エスト用メッセージ開始<end>"
korean = "에스트용 메시지 시작<end>"

["1460001"]
japanese = "<value:$28>！ <line-break>こんな所で会うなんて、<line-break>すごい偶然だね。<end>"
korean = "<value:$28>! 이런 곳에서 만나다니, 정말 우연이네.<end>"

["1460002"]
japanese = "この場所には前から興味があってね。<line-break>調査してるんだ。<end>"
korean = "이곳엔 전부터 관심이 있어서 조사하고 있어.<end>"

["1460004"]
japanese = "例えば、魔道の塔に残された<line-break>宝とか…<line-break>　<line-break>古代文明を受け継いで栄えた<line-break>魔道王国ラドラスとかね。<end>"
korean = "예를 들면 마도의 탑에 남겨진 보물이나… 고대 문명을 이어받아 번영한 마도왕국 라드라스 같은 거지.<end>"

["1460005"]
japanese = "でも、魔道の塔の宝は　　　　<line-break>ほとんど残ってないし、<line-break>　<line-break>ラドラスは、８００年前に<line-break>滅亡して、謎に包まれてる…。<end>"
korean = "하지만 마도의 탑 보물은 거의 남아 있지 않고, 라드라스는 800년 전에 멸망해서 수수께끼에 싸여 있어….<end>"

["1460009"]
japanese = "現実を見ろよ<end>"
korean = "현실을 봐<end>"

["1460010"]
japanese = "そうなるといいね<end>"
korean = "그렇게 되면 좋겠네<end>"

["1460012"]
japanese = "その日まで、<line-break>僕はあきらめないから。<end>"
korean = "그날까지 난 포기하지 않을 거야.<end>"

["1460020"]
japanese = "それは勝手な言い分だ<end>"
korean = "그건 제멋대로인 말이야.<end>"

["1460021"]
japanese = "確かにそうだ<end>"
korean = "확실히 그래<end>"

["1460024"]
japanese = "ありがと。<line-break>君ならわかってくれると思ってた。<line-break>　<line-break>きっと、古代の謎を解き明かして<line-break>人類の生活を変えてみせるからね。<end>"
korean = "고마워. 너라면 이해해 줄 줄 알았어. 반드시 고대의 수수께끼를 풀어 인간의 생활을 바꿔 보일게.<end>"

["1460025"]
japanese = "冒険は順調？<end>"
korean = "모험은 순조로워?<end>"

["1460030"]
japanese = "今ある力で十分だ<end>"
korean = "지금 가진 힘이면 충분해<end>"

["1460031"]
japanese = "そんな力を操りたい<end>"
korean = "그런 힘을 다루고 싶다<end>"

["1460034"]
japanese = "さてと。<line-break>僕は調査を続けるよ。<line-break>　<line-break><value:$28>、<line-break>君も頑張ってね。<end>"
korean = "자, 난 조사를 계속할게. <value:$28>, 너도 힘내.<end>"

["1460035"]
japanese = "…うーん、なるほど…。<end>"
korean = "…음, 그렇군….<end>"

["1460036"]
japanese = "また会ったね、<value:$28>。<end>"
korean = "또 만났네, <value:$28>.<end>"

["1460039"]
japanese = "君は、いつだって僕の話を　　<line-break>真剣に聞いてくれたもの。<line-break>　<line-break>だから君には、僕の研究成果を<line-break>知る権利があるよね。<end>"
korean = "넌 언제나 내 이야기를 진지하게 들어 줬잖아. 그러니 내 연구 성과를 알 권리가 있지.<end>"

["1460042"]
japanese = "これから忙しくなるよ。<line-break>調査も大詰めだからね。<end>"
korean = "이제부터 바빠질 거야. 조사도 막바지니까.<end>"

["1460043"]
japanese = "アドヴェントを習得した。<end>"
korean = "어드벤트를 습득했다.<end>"

["1460046"]
japanese = "…余計なことを言ったようだ。<end>"
korean = "…쓸데없는 말을 한 것 같군.<end>"

["1460053"]
japanese = "悪いが、はずしてくれ。<line-break>片付けてしまいたい仕事がある。<end>"
korean = "미안하지만 자리를 비켜 줘. 끝내고 싶은 일이 있어.<end>"

["1460056"]
japanese = "じゃ、またね。<end>"
korean = "그럼, 또 봐.<end>"

["1460059"]
