["2510007"]
japanese = "フフ。そう焦ることはない。<line-break>まずは汝に<line-break>やってもらわねばならぬことがある。<line-break>この塔の最上階…<line-break>その奧には、マノンの腕輪という<line-break>強大な力を秘めた魔道器がある。<line-break>マノンは、かつて<line-break>この塔にいた魔道士の女だ。<line-break>　<line-break>そのマノンの力を封じた腕輪が<line-break>余の復活を阻んでおるのだ。<line-break>　<line-break>汝がこれに打ち勝つことができれば、<line-break>余は解放される、<line-break>汝もまた新たな力を得られよう。<line-break>今はまだ、マノンの腕輪は<line-break>深い眠りについているようだが、<line-break>余が起こしておこう。<line-break>必ずやマノンの腕輪を滅ぼし、<line-break>余を解き放つのだ。よいな。<end>"
korean = "후후. 그리 서두를 것 없다. 먼저 네가 해 줘야 할 일이 있다. 이 탑 최상층… 그 안쪽에는 마논의 팔찌라는 강대한 힘을 품은 마도기가 있다. 마논은 과거 이 탑에 있던 여마도사다. 그 마논의 힘을 봉인한 팔찌가 짐의 부활을 막고 있다. 네가 이것을 이길 수 있다면 짐은 해방되고 너도 새로운 힘을 얻겠지. 지금은 아직 마논의 팔찌가 깊은 잠에 빠진 듯하지만 짐이 깨워 두마. 반드시 마논의 팔찌를 멸하고 짐을 해방하라. 알겠느냐.<end>"

