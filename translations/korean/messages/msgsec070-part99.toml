["700200"]
japanese = "セラ見てるとホント<line-break>リディオンを思い出すよ。　　　　　　<line-break>　<line-break>アミラルで最強の剣士。<line-break>アミラルの銀狼騒ぎのとき、銀狼を<line-break>退治して、旅に出たことになってる。<end>"
korean = "세라를 보고 있으면 정말 리디온이 떠올라. 아미랄 최강의 검사. 아미랄 은랑 사건 때 은랑을 퇴치하고 여행을 떠난 걸로 되어 있지.<end>"

["700201"]
japanese = "あいつ…、<line-break>ずっと、昔の心の傷を負って、　　　　<line-break>心を閉ざして、荒れてた。　<line-break>あいつ、ガキのころ、<line-break>ロベルトさんとこの娘さんを<line-break>町の外へデート気分で連れ出したんだ。<end>"
korean = "그 녀석… 오래전 마음의 상처를 안고 마음을 닫고 거칠게 살았어. 어릴 때 로베르토 씨네 딸을 데이트 기분으로 마을 밖에 데리고 나갔거든.<end>"

["700202"]
japanese = "そのとき、モンスターに襲われて　　　<line-break>リディオンは助かったんだが<line-break>…娘さんの方は…ダメだった。<line-break>彼女を守れなかった…<line-break>そのことでリディオンは<line-break>変わっちまった…。<end>"
korean = "그때 몬스터에게 습격당해서 리디온은 살아남았지만… 따님은… 안 됐어. 그녀를 지키지 못했다는 일 때문에 리디온은 변해 버렸지….<end>"

["700203"]
japanese = "もともと意固地な奴だったけど<line-break>それからは、周囲の誰にも心を閉ざし、<line-break>ひたすら、怪物退治と剣に没頭した。<line-break>あいつ…、<line-break>俺によく突っかかってきたよな。<line-break>剣の勝負だとか、なんだとか言ってさ。<end>"
korean = "원래 고집 센 녀석이었지만 그 뒤로는 주변 누구에게도 마음을 닫고 오직 괴물 퇴치와 검에만 몰두했어. 그 녀석… 나한테 자주 시비 걸었지. 검으로 승부하자느니 뭐라느니 하면서.<end>"

["700205"]
japanese = "奴が、最後にすがろうとした　　　　　<line-break>人とのつながりが<line-break>俺…だったんじゃないかな。<line-break>あいつはあいつの心の中の様々な気持ち<line-break>…それは口にすればいいわけになる…<line-break>それを剣に託して伝えたかったんだ。<end>"
korean = "그 녀석이 마지막으로 매달리려 했던 사람과의 연결이… 나였던 게 아닐까. 그 녀석은 마음속의 여러 감정들… 입으로 말하면 변명이 되어 버릴 그것들을 검에 실어 전하고 싶었던 거야.<end>"

["700206"]
japanese = "…だけど俺の槍は未熟で、<line-break>結局、奴の剣に応えられなかった。<end>"
korean = "…하지만 내 창은 미숙해서 결국 녀석의 검에 응하지 못했다.<end>"

["700208"]
