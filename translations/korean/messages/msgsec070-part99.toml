["700209"]
japanese = "セラって奴さ。見てると<line-break>リディオンのこと、思い出すんだ。　<line-break>　<line-break>あいつも、不器用で片意地で<line-break>心の中の言葉を、<line-break>うまく、口にできない。<end>"
