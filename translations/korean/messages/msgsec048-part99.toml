korean = "<select><value:$20>%20아미랄의 드래곤 축제는 매년 ○○월 ○○일이래.<end>테라네의 봉가와 로스토올의 오시는 사실 아는 사이래. 꽤 깊은 인연이 있고 둘은 투기장으로 이어져 있다나. 모르는 사람들이면 미안해.<end>신의 손 롯시마의 생일은 5월 7일이래. 모르는 사람이면 미안해. 알아도 별 쓸모는 없지만.<end>체라셸의 여동생 바이라이라의 생일은 1월 14일이래. 모르는 사람이면 미안해. 알아도 별 쓸모는 없지만.<end>체라셸의 여동생 비아리아리의 생일은 1월 14일이래. 모르는 사람이면 미안해. 알아도 별 쓸모는 없지만.<end>고대 마도사 봉인사 레오닉이 마도 기술을 봉인한 레오닉의 미궁…. 롯시마는 거기에 도전한 적이 있대. 그렇다면 위치를 알겠지.<end>아미랄의 로베르토와 신의 손 롯시마는 아는 사이래. 옛날에 함께 여행한 동료였대. 롯시마가 궁금하면 로베르토에게 물어봐.<end>로스토올의 검술 사범 오시의 생일은 8월 12일이래. 모르는 사람이면 미안해. 알아도 별 쓸모는 없지만.<end>영봉 토르는 괜히 영봉이 아니래. 정상에 작은 비밀이 있다나.<end>휴고의 호위 겸 감정인 다이다로의 생일은 10월 10일이래. 모르는 사람이면 미안해. 알아도 별 쓸모는 없지만.<end>휴고의 아내 겸 대역인 휴고 부인의 생일은 2월 17일이래. 모르는 사람이면 미안해. 알아도 별 쓸모는 없지만.<end>엘즈의 테레지아 생일은 10월 19일이래. 모르는 사람이면 미안해. 알아도 별 쓸모는 없지만.<end>파로스 가문 당주 대공 노빈의 생일은 5월 7일이래. 모르는 사람이면 미안해. 알아도 별 쓸모는 없지만.<end>로스토올 술집의 페름 양 생일은 5월 11일이래. 내 생일은 1월 1일이니 페름 양과 궁합이 어떤지 궁금하네.<end>엘즈 용의 자리의 시녀 베모라베라모 생일은 12월 17일이래. 모르는 사람이면 미안해. 알아도 별 쓸모는 없지만.<end>아미랄의 로베르토 아내 폴리아의 생일은 7월 6일이래. 모르는 사람이면 미안해. 알아도 별 쓸모는 없지만.<end>이 세계 곳곳에는 운명의 여신 각인이 있대. 그런 곳에 조금 눈을 돌려 보면 재미있을지도 몰라.<end>테라네의 나무꾼 봉가 생일은 12월 17일이래. 모르는 사람이면 미안해. 알아도 별 쓸모는 없지만.<end>테라네 나무꾼 봉가의 아내 생일은 5월 5일이래. 모르는 사람이면 미안해. 알아도 별 쓸모는 없지만.<end>아미랄 여관집 딸 루프렌 양 생일은 2월 24일이래. 내 생일은 1월 1일이니 루프렌 양과 궁합이 어떤지 궁금하네.<end>"

