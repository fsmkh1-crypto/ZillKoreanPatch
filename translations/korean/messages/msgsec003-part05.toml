["30025"]
japanese = "<select><value:$33>ふん、貧乏が悪いのさ。<end>ディンガル建国のために大活躍した名将　　　　<line-break>アンギルダンも、皇帝に逆らった罪で賞金首。<line-break>支配者ってのは勝手なもんだね。<line-break>あんた、アンギルダンの首を狙うつもりなら考え<line-break>直した方がいいぜ。運よくアンギルダンを殺せて<line-break>も、彼を慕う人間すべてを敵に回すからな。<end>スラムには、表の世界で生きられない犯罪者や<line-break>無法者たちも住んでいるんだ。<line-break>やつらの情報が役に立つこともあると思うぜ。<end>ロセンってのは王様が無法者だったからよ、<line-break>町全体がスラムみたいなもんさ。<line-break>これからどう変わっていくのか楽しみだぜ<end>ロストール、リベルダムそしてエンシャント。<line-break>どこの大都市にもスラムはあるもんだ。金持ちが<line-break>いれば、その倍は貧しい人がいるからな。<end>リベルダムの商人どもは大あわてだろうな。<line-break>自分たちの都市が、一夜にしてガレキの山に<line-break>なっちまったんだから。へへ…いい気味だぜ。<end>カルラがロストール攻略を開始するようだぜ。　<line-break>天下のロストールもリベルダムみたいに<line-break>ガレキの山にされちまうのかね。<line-break>リベルダムがなくなったおかげで、<line-break>カルラの支配地ロセンはずいぶん活気があるん<line-break>だってよ。計画通りなのかもな、へへへ…。<end>ネメアが死んだんだってな。　　　　　　　　<line-break>これでディンガルも、一波乱ありそうだぜ。<line-break>ディンガルの将軍どもは仲が悪いしよ。<line-break>しょせん、ネメアっていう柱に支えられた<line-break>国だからよ、柱が倒れりゃ簡単に崩れちまう。<line-break>へへへっ…あんたも巻き込まれないようにな。<end>"
korean = "<select><value:$33>흥, 가난이 죄지.<end>딘갈 건국에 크게 공헌한 명장 안길단조차 황제에게 거역한 죄로 현상범이 됐어. 지배자란 것들은 제멋대로라니까. 당신, 안길단의 목을 노린다면 생각을 고치는 게 좋아. 운 좋게 안길단을 죽인다 해도 그를 따르는 모든 사람을 적으로 돌리게 될 테니까.<end>슬럼에는 겉세상에서 살 수 없는 범죄자와 무법자들도 살고 있어. 그놈들이 가진 정보가 도움이 될 때도 있을 거야.<end>로센은 왕부터가 무법자였으니 도시 전체가 슬럼이나 마찬가지였지. 앞으로 어떻게 변할지 기대되는군.<end>로스톨, 리베르담, 그리고 엔션트. 어느 대도시에나 슬럼은 있는 법이야. 부자가 있으면 그 두 배는 가난한 사람이 있으니까.<end>리베르담 상인들은 난리가 났겠군. 자기들 도시가 하룻밤 만에 잔해더미가 됐으니 말이야. 헤헤… 꼴좋군.<end>카를라가 로스톨 공략을 시작한다더군. 천하의 로스톨도 리베르담처럼 잔해더미가 되어 버리려나. 리베르담이 사라진 덕분에 카를라의 영지 로센은 상당히 활기를 띠고 있다더군. 계획대로였을지도 모르지, 헤헤헤….<end>네메아가 죽었다더군. 이제 딘갈에도 한바탕 소동이 일어나겠어. 딘갈의 장군들은 사이도 나쁘고 말이지. 결국 네메아라는 기둥 하나에 의지하던 나라니까, 기둥이 쓰러지면 쉽게 무너지겠지. 헤헤헤… 당신도 휘말리지 않게 조심해.<end>"
layout = "<select><value:$33>흥, 가난이 죄지.<end>딘갈 건국에 크게 공헌한 명장<line-break>안길단조차 황제에게 거역한 죄로 현상범이 됐어.<line-break>지배자란 것들은 제멋대로라니까.<line-break>당신, 안길단의 목을 노린다면 생각을<line-break>고치는 게 좋아. 운 좋게 안길단을 죽인다 해도<line-break>그를 따르는 모든 사람을 적으로 돌리게 될 테니까.<end>슬럼에는 겉세상에서 살 수 없는 범죄자와<line-break>무법자들도 살고 있어.<line-break>그놈들이 가진 정보가 도움이 될 때도 있을 거야.<end>로센은 왕부터가 무법자였으니<line-break>도시 전체가 슬럼이나 마찬가지였지.<line-break>앞으로 어떻게 변할지 기대되는군.<end>로스톨, 리베르담, 그리고 엔션트.<line-break>어느 대도시에나 슬럼은 있는 법이야. 부자가<line-break>있으면 그 두 배는 가난한 사람이 있으니까.<end>리베르담 상인들은 난리가 났겠군.<line-break>자기들 도시가 하룻밤 만에 잔해더미가<line-break>됐으니 말이야. 헤헤… 꼴좋군.<end>카를라가 로스톨 공략을 시작한다더군.<line-break>천하의 로스톨도 리베르담처럼<line-break>잔해더미가 되어 버리려나.<line-break>리베르담이 사라진 덕분에<line-break>카를라의 영지 로센은 상당히 활기를 띠고<line-break>있다더군. 계획대로였을지도 모르지, 헤헤헤….<end>네메아가 죽었다더군.<line-break>이제 딘갈에도 한바탕 소동이 일어나겠어.<line-break>딘갈의 장군들은 사이도 나쁘고 말이지.<line-break>결국 네메아라는 기둥 하나에 의지하던<line-break>나라니까, 기둥이 쓰러지면 쉽게 무너지겠지.<line-break>헤헤헤… 당신도 휘말리지 않게 조심해.<end>"

["30026"]
japanese = "<if><value:$2C><less-equal>%9俺のような強い戦士になりたければ<line-break>まずグロウファイターのソウルを宿すことだ。<line-break>勇敢さＢｒａｖｅがあるならいずれ宿るだろう。<end><if><value:$2C><less-equal>%29野生Ｗｉｌｄが高いと獣系のソウルが宿る。　　<line-break>獣のソウルには相手の攻撃に反応する<line-break>カウンター系のスキルがあるのだ。<line-break>無敵の戦士になりたいならルナカウンターと<line-break>ソルカウンターを習得することをすすめておく。<line-break>相手の数が多いときに役立つだろう。<end><if><value:$2C><less-equal>%49武器に特殊効果を付けるのなら、<line-break>石化をおすすめする。<line-break>石にしてしまえば、倒したも同然だからな。<end>この世には、火、水、土、風の属性を持った<line-break>強力な武器が存在するという。手に入れる<line-break>ことができれば、心強い味方になるだろう。<end>"
korean = "<if><value:$2C><less-equal>%9나처럼 강한 전사가 되고 싶다면 우선 그로우 파이터 소울을 품어라. 용맹함 Ｂｒａｖｅ가 있다면 언젠가 깃들 것이다.<end><if><value:$2C><less-equal>%29야성 Ｗｉｌｄ가 높으면 짐승 계열 소울이 깃든다. 짐승 소울에는 상대의 공격에 반응하는 카운터 계열 스킬이 있다. 무적의 전사가 되고 싶다면 루나 카운터와 솔 카운터를 익히는 것을 권하지. 상대가 많을 때 도움이 될 것이다.<end><if><value:$2C><less-equal>%49무기에 특수 효과를 붙인다면 석화를 추천한다. 돌로 만들어 버리면 쓰러뜨린 것이나 마찬가지니까.<end>이 세상에는 불, 물, 땅, 바람 속성을 지닌 강력한 무기가 존재한다고 한다. 손에 넣을 수 있다면 든든한 힘이 되어 줄 것이다.<end>"
layout = "<if><value:$2C><less-equal>%9나처럼 강한 전사가 되고 싶다면<line-break>우선 그로우 파이터 소울을 품어라.<line-break>용맹함 Ｂｒａｖｅ가 있다면 언젠가 깃들 것이다.<end><if><value:$2C><less-equal>%29야성 Ｗｉｌｄ가 높으면 짐승 계열 소울이 깃든다.<line-break>짐승 소울에는 상대의 공격에 반응하는<line-break>카운터 계열 스킬이 있다.<line-break>무적의 전사가 되고 싶다면 루나 카운터와<line-break>솔 카운터를 익히는 것을 권하지.<line-break>상대가 많을 때 도움이 될 것이다.<end><if><value:$2C><less-equal>%49무기에 특수 효과를 붙인다면<line-break>석화를 추천한다.<line-break>돌로 만들어 버리면 쓰러뜨린 것이나 마찬가지니까.<end>이 세상에는 불, 물, 땅, 바람 속성을 지닌<line-break>강력한 무기가 존재한다고 한다. 손에 넣을 수<line-break>있다면 든든한 힘이 되어 줄 것이다.<end>"
