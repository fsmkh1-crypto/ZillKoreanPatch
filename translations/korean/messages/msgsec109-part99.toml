japanese = "カルラはロストールで反乱が起こることを<line-break>見越していた。クーデターで混乱する王都に軍を<line-break>進めようとしたカルラだったが、ベルゼーヴァの<line-break>命により、攻撃は中止された。ベルゼーヴァは<line-break>ネメア死すの報を受け、カルラの勢力の強大化を<line-break>危ぶんだのである。カルラもネメア死後、情勢が<line-break>流動化することを想定し、ロセンに撤兵した。<line-break>ロストールでは王女アトレイアが、<line-break>政治の立て直しを図っている。また、王女はエリ<line-break>エナイ邸で民衆と王都の復興活動も行っている。<end>"
korean = "카를라는 로스토올에서 반란이 일어날 것을 내다보고 있었다. 쿠데타로 혼란한 왕도에 군을 진격시키려 했지만 벨제바의 명령으로 공격은 중지됐다. 벨제바는 네메아가 죽었다는 소식을 듣고 카를라 세력이 지나치게 커지는 것을 우려한 것이다. 카를라도 네메아 사후 정세가 유동적으로 변할 것을 예상해 로센으로 철수했다. 로스토올에서는 아트레이아 왕녀가 정치를 재건하고 있으며 엘리에나이 저택에서 민중과 함께 왕도 복구에도 나서고 있다.<end>"

