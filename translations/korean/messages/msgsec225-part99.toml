korean = "용사의 조건… 그것은 용사를 진심으로 사모하는 아름다운 왕녀! 그게 답이다! 나님을 격렬하게 사모하면서도 신분의 벽에 막혀 고백도 못 하고 나님 때문에 조그만 가슴을 떨고 있는 왕녀다!<end>"

["2250005"]
japanese = "アキュリースにひとり、<line-break>美しい巫女がいるという…。<line-break>彼女こそ、俺様を慕う王女に違いない！<line-break>だから、急いで彼女のもとへ<line-break>俺様は伝えにゆかねばならぬのだ！<line-break>勇者は身分の壁など軽く越えられると！<end>"
korean = "아큐류스에 아름다운 무녀가 한 명 있다고 한다…. 그녀야말로 이 몸을 사모하는 왕녀가 틀림없다! 그러니 서둘러 그녀에게 전하러 가야 한다! 용사에게 신분의 벽 따윈 아무것도 아니라고!<end>"

