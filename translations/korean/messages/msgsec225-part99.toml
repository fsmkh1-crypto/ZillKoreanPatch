["2250002"]
japanese = "ふっ、何も恥ずかしがることはない。<line-break>貴様のような思春期によくあることだ。<line-break>病気ではないから心配するな！<line-break>そんな貴様たちに教えておこう！<line-break>憧れだけではどうにもならない<line-break>厳しい「勇者の条件」を！<end>"
korean = "후, 부끄러워할 것 없다. 네 나이에는 흔한 일이야. 병이 아니니 걱정 마라! 그런 너희에게 알려 주지! 동경만으론 어쩔 수 없는 엄격한 '용사의 조건'을!<end>"

["2250003"]
japanese = "ふはは！　思うさま悩むがいい！<line-break>このガルドラン様のことで<line-break>頭も胸もいっぱいにするがいいさ！<line-break>だが、俺様は、今、急いでいる。<line-break>待っていられないから答えを教えよう。<line-break>さあ、よく聞くがいい、感謝と共に！<end>"
korean = "후하하! 실컷 고민해라! 이 갈드란님 생각으로 머리도 가슴도 가득 채우도록 해라! 하지만 이 몸은 지금 급하다. 기다릴 수 없으니 답을 알려 주지. 자, 감사하는 마음으로 잘 들어라!<end>"

["2250004"]
