["1280049"]
japanese = "<if><value:$2A><less-equal>%49ウルカーンの長老シェムハザは、<line-break>コーンス族らしいぞ。<end><if><value:$2A><less-equal>%100竜骨の砂漠には、ラドラスの財宝が眠っている<line-break>らしいぞ。探してみるだけの価値は<line-break>あるんじゃないかな。<end><if><value:$2A><less-equal>%130大陸の東に炎竜山があるのは知ってるか？<line-break>あそこに、鍛冶の名人が住んでいるらしいぞ。<end><if><value:$2A><greater-equal>%131名工デルガドは知っているだろ？<line-break>実は鎧を鍛えるのは苦手らしくてな。<line-break>自分の鎧も他人に鍛えてもらっているらしいな。<end>"
korean = "<if><value:$2A><less-equal>%49울칸의 장로 셈하자는 코른스족이라더군.<end><if><value:$2A><less-equal>%100용골의 사막에는 라드라스의 보물이 잠들어 있다더라. 찾아볼 가치는 있지 않을까.<end><if><value:$2A><less-equal>%130대륙 동쪽에 염룡산이 있는 건 알고 있나? 거기에 대장장이 명인이 산다더군.<end><if><value:$2A><greater-equal>%131명공 델가도는 알지? 사실 갑옷 단련은 서툴다더군. 자기 갑옷도 남에게 단련받는 모양이야.<end>"

["1280050"]
japanese = "<if><value:$2A><less-equal>%49各地の街道にしゃべるゴブリンが<line-break>現れるらしいんだ。<line-break>自分たちのことをゴブゴブ団とか呼ぶらしいよ。<end><if><value:$2A><less-equal>%80紺碧の洞窟に住み着いた魔物のせいで<line-break>コロル石の採掘ができないらしいよ。<line-break>なんでも、かなり強い魔物だってね。<line-break>ギルドに退治の依頼が来たらしいが<line-break>どうなったかな？<end><if><value:$2A><less-equal>%139この町に住んでいたコーンス族のナッジの<line-break>おじいさんの話なんだがな。<line-break>実は、魔道アカデミーの教授だったらしいよ。<line-break>あのジラークに魔法を教えたのも、<line-break>ナッジのおじいさんだって話だぜ。<end><if><value:$2A><greater-equal>%140吟遊詩人のレルラ＝ロントンを知ってるかい？<line-break>あいつには生き別れになった娘がいるらしいよ。<line-break>けっこう意外な話だろ？<line-break>５年も家族を無視して旅してたら、奥さんも娘も<line-break>行方不明になっちまったらしい。<line-break>もっとも、家族を捜す気はないみたいだけど。<end>"
korean = "<if><value:$2A><less-equal>%49각지 가도에 말하는 고블린이 나타난다더라. 자기들을 고브고브단이라고 부른다나 봐.<end><if><value:$2A><less-equal>%80감청의 동굴에 자리 잡은 마물 때문에 코롤석 채굴을 못 하고 있대. 꽤 강한 마물이라던데. 길드에 퇴치 의뢰가 들어왔다는데 어떻게 됐으려나?<end><if><value:$2A><less-equal>%139이 마을에 살던 코른스족 나지의 할아버지 이야기인데 말이야. 사실 마도 아카데미 교수였다고 해. 그 지라크에게 마법을 가르친 것도 나지의 할아버지라더군.<end><if><value:$2A><greater-equal>%140음유시인 렐라=론톤을 알아? 그 녀석에겐 생이별한 딸이 있다더군. 꽤 의외지? 5년이나 가족을 내버려 두고 여행했더니 아내와 딸이 행방불명이 됐다나 봐. 그래도 가족을 찾을 생각은 없는 것 같지만.<end>"

["1280051"]
japanese = "<if><value:$2A><less-equal>%49宿屋の別館を魔法で破壊した女の子…、<line-break>修理費を返すまで宿屋でただ働きさせられる<line-break>ことになったけど、まだ働いているのかな。<end><if><value:$2A><less-equal>%100ワッシャー海賊のキャプテン・カンダカンは、<line-break>どうやら死んだらしいよ。<end><if><value:$2A><less-equal>%130ワッシャー海賊のキャプテン・カンダカンには、<line-break>ヒルダリアって名の一人娘がいたはずだが、<line-break>親の跡を継いでキャプテンをしてるのかな？<end><if><value:$2A><greater-equal>%131宿屋の別館を破壊したユーリスって娘は、<line-break>魔道アカデミーでも有名な問題児らしいね。<line-break>建物の破壊なんてのは序の口らしいよ。<line-break>魔法で掃除しようとして歴代名誉教授像の頭を<line-break>ことごとく破壊したり、カゼをひいた友人に<line-break>マヒ薬をのませたりと悪行ざんまいだってな。<end>"
korean = "<if><value:$2A><less-equal>%49여관 별관을 마법으로 부순 여자애… 수리비를 갚을 때까지 여관에서 공짜로 일하게 됐다는데 아직도 일하고 있으려나.<end><if><value:$2A><less-equal>%100와셔 해적의 캡틴 칸다칸은 아무래도 죽은 모양이야.<end><if><value:$2A><less-equal>%130와셔 해적의 캡틴 칸다칸에게 힐다리아라는 외동딸이 있었을 텐데 부모 뒤를 이어 캡틴을 하고 있을까?<end><if><value:$2A><greater-equal>%131여관 별관을 부순 유리스라는 애는 마도 아카데미에서도 유명한 문제아래. 건물 부수는 건 기본이라더군. 마법으로 청소하려다가 역대 명예교수상의 머리를 몽땅 날려 버리거나, 감기 걸린 친구에게 마비약을 먹이는 등 온갖 사고를 쳤다나 봐.<end>"

["1280052"]
japanese = "<if><value:$2A><less-equal>%50エリス王妃は、リベルダムの武器商人ロティや<line-break>同じく武器商人のアンティノと組んで、<line-break>ペウダを操っているみたいだよ。<end><if><value:$2A><less-equal>%75リューガ家のレムオンは二刀流の使い手だ。<line-break>確か剣聖レーグもそうだよな。<line-break>　<line-break>２人ともダブルブレードというスキルを<line-break>習得しているそうだよ。<end><if><value:$2A><less-equal>%129ゼネテスは盾の扱いがどうしようもなく<line-break>下手らしいぜ。ま、盾と片手剣を持った姿は<line-break>似合わないからかまわないと思うがな。<end><if><value:$2A><greater-equal>%130エリス王妃の料理はうまいらしいぜ。<line-break>もっとも実際に食べたわけじゃないから、<line-break>どのくらいうまいのかは知らないけどな。<end>"
korean = "<if><value:$2A><less-equal>%50에리스 왕비는 리벨덤의 무기상 로티와 같은 무기상인 안티노와 손잡고 페우다를 조종하는 것 같아.<end><if><value:$2A><less-equal>%75류가 가문의 레몬은 이도류 사용자야. 검성 레그도 그랬던 것 같은데. 둘 다 더블 블레이드라는 스킬을 익혔다고 해.<end><if><value:$2A><less-equal>%129제네테스는 방패를 다루는 솜씨가 정말 형편없다더라. 뭐, 방패와 한손검을 든 모습은 어울리지 않으니 상관없다고 생각하지만.<end><if><value:$2A><greater-equal>%130에리스 왕비의 요리는 맛있다더라. 물론 실제로 먹어 본 건 아니라 얼마나 맛있는지는 모르지만.<end>"

["1280053"]
japanese = "<if><value:$2A><less-equal>%50盾を装備できるのは騎士として<line-break>認められた者だけなんだそうだよ。<end><if><value:$2A><less-equal>%100ドワーフ王国の王ジンガは、<line-break>若いころに闘士として、<line-break>闘技場で活躍していたそうだよ。<end><if><value:$2A><less-equal>%120フゴーに仕えているダイダロは、<line-break>闘技場で優勝したこともある、<line-break>なかなかの戦士らしいぜ。<end><if><value:$2A><greater-equal>%121フゴーとフゴー夫人の愛の物語を<line-break>最後まで聞いた人間は、恐怖のあまりに<line-break>狂ってしまうらしいぜ。恐い話だよな。<end>"
korean = "<if><value:$2A><less-equal>%50방패를 장비할 수 있는 건 기사로 인정받은 자뿐이라더군.<end><if><value:$2A><less-equal>%100드워프 왕국의 왕 징가는 젊었을 때 투사로서 투기장에서 활약했다더군.<end><if><value:$2A><less-equal>%120휴고를 섬기는 다이다로는 투기장에서 우승한 적도 있는 꽤 뛰어난 전사라던데.<end><if><value:$2A><greater-equal>%121휴고와 휴고 부인의 사랑 이야기를 끝까지 들은 사람은 공포 때문에 미쳐 버린다더군. 무서운 이야기지.<end>"
