japanese = "<select><value:$33>（未：AGETEA_10 旅立ち）<end>世間がどんなに大騒ぎをしようが、<line-break>我らドワーフは落ち着いたもんだよ。<line-break>やっぱり寿命が長いからかね。<end>ディンガル軍の青竜将軍が東方諸国を<line-break>攻略するために出兵したそうだよ。<line-break>少女将軍の力を見せてもらおうかな。<end>ディンガルの少女将軍の手並みは、<line-break>大したものだ。<line-break>次は名将アンギルダンの出番だよ。<end>ディンガルの敗残兵が何人か逃げてきたが、<line-break>それを狩ろうっていう不届き者がいてね。<line-break>そいつらもバカなことをしたもんだよ。<line-break>もちろん、そいつらは牢獄行きさ。<line-break>王国内でのもめ事は禁止されているからね。<line-break>我らは弱い者いじめが大嫌いだからな。<end>少女将軍が東の都リベルダムを破壊しちまった。<line-break>あの娘っこは、物を造ることの大変さが<line-break>わかっていない。嘆かわしいことだ。<end>この間、ネメアを見たぞ。<line-break>ダークエルフとドワーフとボルダンを<line-break>従えていたね。南へ向かったみたいだよ。<line-break>ロストールとの戦いに参加するつもり<line-break>なのかもしれないな。<end>ネメアが死んだという話は本当なのか？<line-break>あれほどの男が、そう簡単に死ぬとは<line-break>思えないな。何かの間違いだろう。<end>"
korean = "<select><value:$33>(미사용: AGETEA_10 여행 시작)<end>세상이 아무리 난리여도 우리 드워프는 느긋하지. 역시 수명이 길어서 그런가.<end>딩갈군의 청룡장군이 동방 여러 나라를 공략하려고 출병했다더군. 소녀 장군의 솜씨를 구경해 볼까.<end>딩갈 소녀 장군의 솜씨는 대단하군. 다음은 명장 앙길단의 차례야.<end>딩갈 패잔병 몇 명이 도망쳐 왔는데 그들을 사냥하겠다는 못된 녀석들이 있었지. 바보 같은 짓을 했어. 물론 그 녀석들은 감옥행이야. 왕국 안에서 분쟁은 금지니까. 우리는 약한 자를 괴롭히는 걸 아주 싫어하거든.<end>소녀 장군이 동쪽 도시 리벨덤을 파괴해 버렸어. 그 아이는 물건을 만드는 게 얼마나 힘든지 몰라. 한심한 일이야.<end>지난번 네메아를 봤어. 다크엘프와 드워프와 볼단을 거느리고 있더군. 남쪽으로 간 모양이야. 로스토올과의 싸움에 참가하려는 걸지도 모르지.<end>네메아가 죽었다는 이야기가 정말이야? 그 정도 남자가 그렇게 쉽게 죽을 것 같진 않은데. 뭔가 잘못된 거겠지.<end>"

["1280018"]
japanese = "<select><value:$33>ガルドランとかいう冒険者が<line-break>うちの看板娘に手をだそうとしたんで<line-break>ぶん殴ってやったよ。<end>ヴァンの事件は不幸な話だったよ。<line-break>ガルドランのような冒険者ばかりじゃないと<line-break>思うが、冒険者って連中には失望したよ。<end>今一番の話題は、勇者ネメアの即位だろ。<line-break>ディンガル国民が待ちに待ってたことだからな。<end>ロセンと自由に行き来できるようになったな。<line-break>これで、ロセンからの巡礼客も増えるだろう。<end>エルズから来た巡礼客に聞いたんだが、<line-break>エルズの女王エアは、人の運命だろうが<line-break>捜し物だろうが、何でもわかるそうだよ。<end>ロセンの闘技場で大会が開かれるようになって<line-break>うれしいね。リベルダムよりは近いから、<line-break>気軽に出かけることができるからな。<end>カルラ将軍の副官アイリーンは、<line-break>元はロストール出身の冒険者だってな。<line-break>冒険者時代にはこの酒場にも来たことがあるぜ。<end>最近、巡礼客の数がめっきり増えてね。<line-break>やはり世界の行く末に不安を感じる人が<line-break>多いんだろうな。<end>"
korean = "<select><value:$33>갈드란이라는 모험자가 우리 간판 아가씨에게 손을 대려 하기에 한 대 때려 줬지.<end>반 사건은 불행한 일이었어. 갈드란 같은 모험자뿐은 아니라고 생각하지만, 모험자라는 녀석들에게 실망했지.<end>지금 가장 큰 화제는 용사 네메아의 즉위겠지. 딩갈 국민이 고대하던 일이니까.<end>로센과 자유롭게 오갈 수 있게 됐군. 이제 로센에서 오는 순례객도 늘겠지.<end>엘즈에서 온 순례객에게 들었는데, 엘즈의 여왕 에아는 사람의 운명이든 잃어버린 물건이든 뭐든 안다더군.<end>로센 투기장에서 대회가 열리게 돼 기쁘군. 리벨덤보다 가까워서 가볍게 다녀올 수 있으니까.<end>카를라 장군의 부관 아이린은 원래 로스토올 출신 모험자였다더군. 모험자 시절에는 이 술집에도 온 적이 있어.<end>요즘 순례객이 부쩍 늘었어. 역시 세계의 앞날을 불안해하는 사람이 많은 거겠지.<end>"

["1280019"]
japanese = "<select><value:$33>（未：AGETEA_12 旅立ち）<end>この間の地震は竜王様が原因みたいだね。<line-break>エンシャントではノトゥーン神殿の<line-break>ステンドグラスが割れてしまったそうだよ。<end>ロストールでは女は騎士になれないんだよ。<line-break>ディンガルには女の将軍が２人もいるのにな。<line-break>貴族どもの頭の中は古すぎるんだよな。<end>ロセン行きの航路が復活して、<line-break>また、にぎやかになりそうだ。<line-break>船乗りも仕事が増えて大変だろうな。<end>アンギルダンが分断の山脈を越えて、<line-break>ロストールに迫ってきた時は、<line-break>どうしようかと思ったよ。<line-break>首都が占領されたら、<line-break>次はここだろうからね。<line-break>自警団じゃ軍隊は防げないよ。<end>リベルダムの港が壊れたもんで、<line-break>船乗りたちは大騒ぎさ。<line-break>ディンガル軍もひどいことをするよな。<end>カルラ率いる青竜軍が、<line-break>いよいよロストールへ攻め込むようだぜ。<line-break>これでロストールもおしまいかな。<end>邪竜の断層では、いにしえに封印された<line-break>凶暴なドラゴンが、復活の好機をうかがっている<line-break>そうだよ。恐ろしい話だよな。<end>"
korean = "<select><value:$33>(미사용: AGETEA_12 여행 시작)<end>지난번 지진은 용왕님이 원인인 모양이야. 엔샨트에서는 노툰 신전의 스테인드글라스가 깨졌다고 해.<end>로스토올에서는 여자가 기사가 될 수 없어. 딩갈에는 여자 장군이 둘이나 있는데 말이지. 귀족들 머릿속은 너무 낡았어.<end>로센행 항로가 복구돼서 다시 활기를 띠겠군. 선원도 일이 늘어 힘들겠지.<end>앙길단이 분단 산맥을 넘어 로스토올로 쳐들어왔을 때는 어쩌나 했어. 수도가 점령되면 다음은 여기일 테니까. 자경단으로 군대를 막을 수는 없지.<end>리벨덤 항구가 부서져서 선원들이 난리야. 딩갈군도 너무 심한 짓을 했어.<end>카를라가 이끄는 청룡군이 드디어 로스토올로 쳐들어갈 모양이야. 이걸로 로스토올도 끝인가.<end>사룡의 단층에서는 오래전에 봉인된 흉폭한 드래곤이 부활할 기회를 노리고 있다더군. 무서운 이야기지.<end>"

["1280020"]
japanese = "<select><value:$33>あんたのような若者が未来を<line-break>切り開いていくんだ。<line-break>新しい時代に期待しているよ。<end>死竜の洞窟には、その名の通りドラゴンの<line-break>死体があるそうだよ。<line-break>　<line-break>死んで何百年も経つのに滅びることなく<line-break>迷い込んだ生物の命を吸って復活の機会を<line-break>待っているというから恐ろしい話だよな。<end>ネメアは皇帝になる少し前に、<line-break>エルズのエアを訪ねたそうだよ。<line-break>何かの予言でも聞いたのかな？<end>処刑されたロセン王ペウダを裏から操って<line-break>いたのがエリスとリベルダムのロティだよ。<line-break>裏世界じゃけっこう有名な話なんだぜ。<end>アンギルダンを破ったゼネテスは、<line-break>元は冒険者をやってたんだ。<line-break>ここにもしょっちゅう酒を飲みに来てたよ。<line-break>貴族とは思えないくらい気さくな男でね、<line-break>この辺りじゃ知らぬ人間がいないくらいの<line-break>人気者だったよ。<end>ロセン解放軍を率いていたクリュセイスも、<line-break>リベルダムを裏切った武器商人アンティノも<line-break>行方不明らしいな。<end>救国の英雄ゼネテスが、再びロストール軍の<line-break>指揮をとるらしいぜ。だが、レムオンを中心と<line-break>した貴族連合が出兵を拒否しているらしい。<line-break>いくらゼネテスでもカルラの半分以下の<line-break>兵力じゃ勝てっこないだろ。<line-break>これで、ロストールもおしまいだな。<end>このタイミングでネメアが死ぬなんて、<line-break>竜王様のご加護に違いないな。もっとも、<line-break>カルラの脅威が消えたわけじゃないがな。<end>"
korean = "<select><value:$33>너 같은 젊은이가 미래를 열어 가는 거야. 새로운 시대를 기대하고 있어.<end>사룡의 동굴에는 이름 그대로 드래곤의 시체가 있다더군. 죽은 지 수백 년이 지나도 사라지지 않고, 헤매어 들어온 생물의 생명을 빨아들여 부활할 기회를 기다린다니 무서운 이야기지.<end>네메아는 황제가 되기 조금 전에 엘즈의 에아를 찾아갔다더군. 무슨 예언이라도 들은 걸까?<end>처형된 로센 왕 페우다를 뒤에서 조종한 건 에리스와 리벨덤의 로티야. 뒷세계에선 꽤 유명한 얘기라고.<end>앙길단을 꺾은 제네테스는 원래 모험자였어. 여기에도 자주 술 마시러 왔지. 귀족답지 않게 소탈한 남자라 이 근처에선 모르는 사람이 없을 정도로 인기인이었어.<end>로센 해방군을 이끌던 크류세이스도, 리벨덤을 배신한 무기상 안티노도 행방불명이라더군.<end>구국의 영웅 제네테스가 다시 로스토올군을 지휘한다더군. 하지만 레몬을 중심으로 한 귀족 연합이 출병을 거부하고 있대. 아무리 제네테스라도 카를라의 절반도 안 되는 병력으로는 이길 수 없겠지. 이걸로 로스토올도 끝이군.<end>이 타이밍에 네메아가 죽다니, 분명 용왕님의 가호겠지. 그렇다고 카를라의 위협이 사라진 건 아니지만.<end>"

["1280021"]
japanese = "<select><value:$33>（未：AGETEA_14 旅立ち）<end>冒険者を狙うダークエルフとか、<line-break>街道を移動中に勝負を挑んでくるボルダンとか<line-break>最近は物騒なヤツらが多いな。<end>ロストールの大貴族レムオンの命を<line-break>狙っているヤツらがいる。レムオンが領地の<line-break>ノーブルへ向かう途中で襲う計画のようだが…。<line-break>いつ実行するつもりなのかはわからないが、<line-break>レムオンが暗殺されるとロストールは<line-break>間違いなく大騒ぎになるな。<end>そうそう、ロティの友人アンティノが、<line-break>暗殺用の毒薬を買ったって情報があるんだ。<line-break>ふふふふ…誰に使うつもりなのかな。<end>ロセンを電撃的に占領したカルラが、<line-break>リベルダムに攻めてくるぜ。<line-break><line-break>しかもあの女は負ける戦をしない。<line-break>アンティノの屋敷にカルラの密偵が<line-break>ひんぱんに訪れてるって話もあるんだ。<line-break>逃げるなら早めにな。<end>フゴーも闘技場もロセンに移ったぜ。<line-break>もう、自由都市リベルダムには何もないんだ。<line-break>それでも俺の居場所は、ここしかないんだな。<end>カルラはロストールとの戦で、ネメアと合流し、<line-break>その勢いで王都を攻め落とすつもりのようだ。<line-break>つまりネメアはロストール領のどこかにいるぞ。<end>エルファスって予言者は知っているか？<line-break>あいつの予言はハズレたことがない。<line-break>不気味な話だと思わないか？<end>"
korean = "<select><value:$33>(미사용: AGETEA_14 여행 출발)<end>모험자를 노리는 다크엘프라든가, 가도를 이동 중인 사람에게 시비를 걸어 오는 볼단이라든가, 요즘 위험한 녀석들이 많아.<end>로스토올의 대귀족 레몬의 목숨을 노리는 녀석들이 있어. 레몬이 영지 노블로 향하는 도중 습격할 계획인 것 같은데…. 언제 실행할지는 모르지만 레몬이 암살되면 로스토올은 틀림없이 난리가 나겠지.<end>그러고 보니 로티의 친구 안티노가 암살용 독약을 샀다는 정보가 있어. 후후후후… 누구에게 쓰려는 걸까.<end>로센을 전격 점령한 카를라가 리벨덤으로 쳐들어온대. 게다가 그 여자는 질 싸움을 하지 않아. 안티노의 저택에 카를라의 첩자가 자주 드나든다는 얘기도 있어. 도망칠 거면 일찍 가.<end>휴고도 투기장도 로센으로 옮겼어. 이제 자유도시 리벨덤엔 아무것도 없어. 그래도 내가 있을 곳은 여기밖에 없군.<end>카를라는 로스토올과의 전쟁에서 네메아와 합류해 그 기세로 왕도를 함락할 생각인 모양이야. 즉 네메아는 로스토올령 어딘가에 있어.<end>엘파스라는 예언자를 알아? 그 녀석의 예언은 한 번도 빗나간 적이 없어. 섬뜩한 이야기라고 생각하지 않나?<end>"

