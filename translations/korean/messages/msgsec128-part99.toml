["1280036"]
japanese = "<if><value:$2C><less-equal>%9戦闘中のスピードは、敏捷さＡＧＩと　　　<line-break>装備品の重さによって変化するんだ。<line-break>そいつを忘れると痛い目にあうぜ。<line-break>例え重装備でも、敵の集中攻撃をくらえば<line-break>大ダメージを受ける可能性があるだろ。<line-break>パーティー内での攻撃順位は確認しとけよ。<end><if><value:$2C><less-equal>%29仲間はたくさんできたか？<line-break>まだ、３人以上いないなら問題だぞ。<line-break>世界中の町を隅々まで歩いてみな。<line-break>必ず、運命が仲間を引き寄せてくれるから。<line-break>もちろん、困っているやつを見捨ててたり<line-break>したらダメだぜ。<end><if><value:$2C><less-equal>%49ゼグナ鉱山では、たまに錬剛石が拾えるぜ。<line-break>拾って何ケ月かたつと、また拾えることも<line-break>あるから、見つけたら迷わず拾っときな。<end><if><value:$2C><greater-equal>%50西の果てに半島があって、<line-break>そこに古城が建っているそうだ。<line-break>なんでも、船でしか行けない場所らしいな。<end>"
korean = "<if><value:$2C><less-equal>%9전투 중 속도는 민첩 AGI와 장비 무게로 변해. 그걸 잊으면 큰코다쳐. 중장비라도 적의 집중 공격을 받으면 큰 피해를 입을 수 있잖아. 파티 내 공격 순서는 확인해 둬.<end><if><value:$2C><less-equal>%29동료는 많이 생겼나? 아직 셋 이상 없다면 문제야. 세계 곳곳의 마을을 구석구석 돌아봐. 분명 운명이 동료를 끌어당겨 줄 테니까. 물론 곤란한 사람을 외면하면 안 돼.<end><if><value:$2C><less-equal>%49제그나 광산에서는 가끔 연강석을 주울 수 있어. 주운 뒤 몇 달 지나면 또 생기기도 하니까 발견하면 망설이지 말고 챙겨 둬.<end><if><value:$2C><greater-equal>%50서쪽 끝에 반도가 있고 거기에 고성이 있다더라. 배로만 갈 수 있는 곳이라는군.<end>"

["1280037"]
