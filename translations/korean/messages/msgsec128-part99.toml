["1280039"]
japanese = "<if><value:$2A><less-equal>%50猫屋敷に住んでいる賢者様は、<line-break>勇者ネメアと一緒に魔王バロルを倒した<line-break>仲間の１人らしいぜ。<end><if><value:$2A><less-equal>%119ザギヴ将軍はライラネート神殿のとなりにある<line-break>墓地をよく訪れるそうだよ。<end><if><value:$2A><less-equal>%150乙女の鏡に強そうなモンスターが<line-break>住み着いたらしいよ。<line-break>もう、誰か、退治してくれたかな？<end><if><value:$2A><greater-equal>%151ここで飲んでるお客さんが、あんたのことを<line-break>話してるのを見ると、なんだか自分の事<line-break>みたいにうれしくなってしまってね。<end>"
