["1280026"]
japanese = "<if><value:$2C><less-equal>%9ガルドランはたいして強くないくせに、<line-break>必殺技だけは、たくさん持っているみたいだな。<line-break>卑怯な技ばかりだけどね。<end><if><value:$2C><less-equal>%29ボルダン族は強い者と戦うことに<line-break>喜びを感じるそうだよ。<line-break>レーグもそうなのかな。<end><if><value:$2C><less-equal>%49火、水、土、風の禁呪を習得するためには、<line-break>それぞれの属性を司る精霊神に会って、<line-break>封印をといてもらわないといけないんだ。<end><if><value:$2C><greater-equal>%50よく、がんばったな。<line-break>そこまで強ければ、もう言うことはない。<line-break>自由に世界中を冒険してくれ。<end>"
korean = "<if><value:$2C><less-equal>%9갈드란은 별로 강하지도 않으면서 필살기만 잔뜩 가진 모양이야. 비겁한 기술뿐이지만.<end><if><value:$2C><less-equal>%29볼단족은 강한 자와 싸우는 데 기쁨을 느낀다더군. 레그도 그런 걸까.<end><if><value:$2C><less-equal>%49불, 물, 땅, 바람의 금주를 익히려면 각 속성을 관장하는 정령신을 만나 봉인을 풀어 달라고 해야 해.<end><if><value:$2C><greater-equal>%50정말 잘했어. 그 정도로 강하면 더 말할 게 없군. 자유롭게 세계를 모험해 줘.<end>"

["1280027"]
japanese = "<if><value:$2C><less-equal>%9あんたくらいのレベルでこの辺りを<line-break>うろつくのはやめたほうがいい。<line-break>若い命を散らすことになるぜ。<end><if><value:$2C><less-equal>%29宝箱を開けるのはディテクターのスキルを<line-break>持っている者の仕事だよ。<line-break>これがないと、開けられないからね。<end><if><value:$2C><less-equal>%49アンチハードルがあれば、罠の解除が少しだけ<line-break>簡単になる。だが、あまり頼りすぎると<line-break>ＭＰがなくなってしまうぞ。<end><if><value:$2C><greater-equal>%50罠の解除で重要なのは、<line-break>解除する者のＤＥＸと慣れだ。<line-break>アンチハードルは、おまけみたいなもんだ。<end>"
korean = "<if><value:$2C><less-equal>%9네 정도 레벨로 이 근처를 돌아다니는 건 그만두는 게 좋아. 젊은 목숨을 잃게 될 거야.<end><if><value:$2C><less-equal>%29보물상자를 여는 건 디텍터 스킬을 가진 자의 일이야. 이게 없으면 열 수 없거든.<end><if><value:$2C><less-equal>%49안티 허들이 있으면 함정 해제가 조금 쉬워져. 하지만 너무 의지하면 MP가 바닥나 버린다.<end><if><value:$2C><greater-equal>%50함정 해제에서 중요한 건 해제하는 사람의 DEX와 숙련도야. 안티 허들은 덤 같은 거지.<end>"

["1280028"]
japanese = "<if><value:$2C><less-equal>%9アハブには悪霊やら死霊がうようよいるぜ。<line-break>もう少し強くなるまで近づかないことだ。<end><if><value:$2C><less-equal>%29敵から逃げてばかりだと、<line-break>精霊力レベルが上がらないぞ。<end><if><value:$2C><less-equal>%49火、水、土、風の禁呪を習得するためには、<line-break>それぞれの属性を司る精霊神に会って、<line-break>封印を解いてもらわないといけないんだぜ。<end><if><value:$2C><greater-equal>%50いやあ、あんたは強い！<line-break>もう何も教えることはないよ。<end>"
