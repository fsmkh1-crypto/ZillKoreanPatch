["1280007"]
japanese = "<select><value:$33>勇者ネメアがとうとう皇帝を見限った　<line-break>みたいだね。<line-break>　<line-break>誰もが予想していたことだけど、<line-break>こうして現実になると悲しいものだね。<end>勇者ネメアがとうとう皇帝を見限った　<line-break>みたいだね。<line-break>　<line-break>誰もが予想していたことだけど、<line-break>こうして現実になると悲しいものだね。<end>勇者ネメアが、我がディンガル帝国の<line-break>皇帝になる日がとうとう来たんだなあ。<line-break>待ち望んでいただけにうれしいよ。<end>ロセンが我がディンガル帝国によって<line-break>解放されたのは知ってるだろ？<line-break>これで、ロセンに入れるようになるぜ。<end>アンギルダン将軍が山越えでロストール軍を<line-break>破ったときは、勝ったと思ったんだがな。<line-break>名将といえども油断することはあるんだねぇ。<end>カルラの次の目標はロストールだね。<line-break>ロストール側はゼネテスが出てくるだろうが<line-break>兵力差がありすぎるね。<line-break>誰も思いつかないような秘策でもない限り、<line-break>ロストールに勝ち目はないだろうよ。<end>最近、姿をみせないネメア様だが、<line-break>何でも親衛隊を連れて宝探しを<line-break>しているそうだよ。<line-break>近々、ゼグナ鉱山に向かうって話もあるよ。<line-break>冒険ってのは、皇帝になってもやめられない<line-break>くらい魅力的なものなのかい？<end>ネメア様の死は、ゼネテスの流した<line-break>デマってのが真相らしいぜ。<line-break>まったく、汚い手を使いやがる！<end>"
korean = "<select><value:$33>용사 네메아가 마침내 황제를 버린 모양이네. 누구나 예상한 일이지만 이렇게 현실이 되니 슬프군.<end>용사 네메아가 마침내 황제를 버린 모양이네. 누구나 예상한 일이지만 이렇게 현실이 되니 슬프군.<end>용사 네메아가 우리 딩갈 제국의 황제가 되는 날이 드디어 왔구나. 기다려 왔던 만큼 기뻐.<end>로센이 우리 딩갈 제국에 의해 해방된 건 알고 있지? 이제 로센에 들어갈 수 있어.<end>앙길단 장군이 산을 넘어 로스토올군을 격파했을 때는 이겼다고 생각했는데. 명장이라도 방심할 때가 있군.<end>카를라의 다음 목표는 로스토올이겠지. 로스토올 쪽에서는 제네테스가 나오겠지만 병력 차이가 너무 커. 누구도 생각 못 한 비책이라도 없으면 로스토올에 승산은 없을 거야.<end>요즘 모습을 보이지 않는 네메아 님은 친위대를 데리고 보물찾기를 하고 있다더군. 조만간 제그나 광산으로 간다는 얘기도 있어. 모험이라는 건 황제가 돼도 그만둘 수 없을 만큼 매력적인 건가?<end>네메아 님의 죽음은 제네테스가 퍼뜨린 거짓말이라는 게 진상인 모양이야. 정말 더러운 수를 쓰는군!<end>"

["1280008"]
japanese = "<select><value:$33><value:$28>くらいの歳なら、<line-break>そろそろ１人で生きていくころだな。<line-break>いつまでも人を頼っていてはダメだぞ。<end>西にある偽りの森の先にオズワルドって名の<line-break>小さな町があるんだ。<line-break>地図にものらない隠れた名所だよ。<line-break>その町には古い遺跡があるそうだ。<line-break>機会があれば行ってみるのもいいだろうな。<end>ディンガル軍がロセン攻略の準備を<line-break>しているようだよ。<line-break>あの辺りには近づかないほうがよいだろうな。<end>ロセンを滅ぼしたカルラは巨大なカマを、<line-break>愛用の武器として使うらしいよ。<line-break>そいつで何人の首が飛んだのかな。<end>ノヴィン総司令率いる我がロストール軍が、<line-break>アンギルダンにやられちまった時は<line-break>どうしようかと思ったぜ。<line-break>なんたってディンガル軍は、老人も女も子供も<line-break>皆殺しにするような軍隊だからな。<line-break>ゼネテス様のおかげで命拾いしたよ。<end>リベルダムが破壊されたから、<line-break>フゴーもロセンに引っ越したらしいぞ。<line-break>珍しい物を売りつけるときはロセンに行きな。<end>ロストール王国の一大事だっていうのに、<line-break>リューガ卿を中心とした有力貴族どもは<line-break>女王にたてついて兵をださないらしい。<line-break>いくらファーロス総司令が名将でも、<line-break>この戦力差じゃどうしようもないぜ。<line-break>俺たちは、どうすりゃいいのかな…。<end>ネメアは闇の神器とかいう破壊神を復活させる<line-break>アイテムを探していたということだ。<line-break>何に使うつもりだったのやら…。<end>"
korean = "<select><value:$33><value:$28> 정도 나이라면 슬슬 혼자 살아갈 때다. 언제까지고 남에게 의지하면 안 돼.<end>서쪽 거짓의 숲 너머에 오즈왈드라는 작은 마을이 있어. 지도에도 나오지 않는 숨은 명소지. 그 마을에는 오래된 유적이 있다더군. 기회가 되면 가 보는 것도 좋을 거야.<end>딩갈군이 로센 공략을 준비하는 모양이야. 그 근처에는 가지 않는 편이 좋겠군.<end>로센을 멸망시킨 카를라는 거대한 낫을 애용 무기로 쓴다더군. 그걸로 몇 명의 목이 날아갔을까.<end>노빈 총사령이 이끄는 우리 로스토올군이 앙길단에게 당했을 때는 어쩌나 했지. 딩갈군은 노인도 여자도 아이도 모조리 죽인다는 군대니까. 제네테스 님 덕분에 목숨을 건졌어.<end>리벨덤이 파괴돼서 휴고도 로센으로 이사했다더군. 희귀한 물건을 팔려면 로센으로 가.<end>로스토올 왕국의 큰 위기인데도 류가 경을 중심으로 한 유력 귀족들은 여왕에게 반발해 병사를 내지 않는다더군. 아무리 파로스 총사령이 명장이라도 이 전력 차로는 답이 없어. 우린 어떻게 해야 하지….<end>네메아는 어둠의 신기라는 파괴신을 부활시키는 아이템을 찾고 있었다더군. 뭘 하려고 했던 건지….<end>"

