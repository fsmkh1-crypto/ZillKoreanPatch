["1280023"]
japanese = "<if><value:$2C><less-equal>%20魔法を使うには精霊力レベルが<line-break>重要なんだってな。<line-break>魔道アカデミーの学生が言っていたよ。<end><if><value:$2C><less-equal>%37宿しているソウルによってレベルが上がった時に<line-break>上がるフィジカルパラメータの変化が違うんだ。<line-break>むやみにレベルを上げても強くなれないよ。<end><if><value:$2C><less-equal>%49あんたくらいのレベルなら、<line-break>ドラゴンだって倒せるかもしれないな。<line-break>例えば死竜の洞窟に住むエルアザルとかな。<end><if><value:$2C><greater-equal>%50今のあんたなら、<line-break>竜王だって倒せるんじゃないか。<line-break>まったく、大した強さだよ。<end>"
korean = "<if><value:$2C><less-equal>%20마법을 쓰려면 정령력 레벨이 중요하다더군. 마도 아카데미 학생이 말해 줬어.<end><if><value:$2C><less-equal>%37깃들인 소울에 따라 레벨이 오를 때 상승하는 피지컬 파라미터가 달라져. 무턱대고 레벨만 올려선 강해질 수 없어.<end><if><value:$2C><less-equal>%49네 정도 레벨이라면 드래곤도 쓰러뜨릴지 모르겠군. 예를 들어 사룡의 동굴에 사는 엘아자르 같은 녀석 말이야.<end><if><value:$2C><greater-equal>%50지금의 너라면 용왕도 쓰러뜨릴 수 있지 않을까. 정말 대단한 강함이야.<end>"

["1280024"]
japanese = "<if><value:$2C><less-equal>%9武器を選ぶときは攻撃力だけじゃなくて、<line-break>重さや、届く距離なんかも考えるんだよ。<end><if><value:$2C><less-equal>%29武器の属性は無属性にしておいた方がいいぞ。<line-break>魔法では無属性にできないからな。<end><if><value:$2C><less-equal>%49攻撃は最大の防御だ。<line-break>敵より１回でも多く攻撃できるように、<line-break>ＡＧＩが上がるようなソウルにするんだ。<end><if><value:$2C><greater-equal>%50あんたくらい強ければ、邪竜の断層や<line-break>未開の森にも行ったことがあるだろう。<line-break>まだなら、一度は行っておいた方がいいぞ。<end>"
korean = "<if><value:$2C><less-equal>%9무기를 고를 때는 공격력만 보지 말고 무게나 공격이 닿는 거리도 생각해야 해.<end><if><value:$2C><less-equal>%29무기 속성은 무속성으로 해 두는 게 좋아. 마법으로는 무속성으로 바꿀 수 없으니까.<end><if><value:$2C><less-equal>%49공격은 최선의 방어야. 적보다 한 번이라도 더 공격할 수 있도록 AGI가 오르는 소울을 선택해.<end><if><value:$2C><greater-equal>%50네 정도로 강하다면 사룡의 단층이나 미개의 숲에도 가 본 적 있겠지. 아직이라면 한 번은 가 보는 게 좋아.<end>"

