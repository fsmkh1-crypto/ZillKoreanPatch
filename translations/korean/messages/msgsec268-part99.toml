korean = "안 돼. 난 알아. 이제 동화의 머리장식으로도 내 마음을 붙잡아 둘 수 없어. 난 지금까지 줄곧 질리온을 향한 마음만으로 살아왔어. 하지만 너와 함께 여행하기 시작한 뒤로 내 안에서 조금씩 너를 향한 마음이 커져 가고 있어….<end>"

