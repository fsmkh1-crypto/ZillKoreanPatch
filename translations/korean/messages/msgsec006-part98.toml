["60011"]
japanese = "<select><value:$33>ロストールでは貴族や王族の間で<line-break>醜い権力闘争が繰り広げられているって<line-break>いうじゃないか。<line-break>国民はえらく迷惑しているだろうねえ。<line-break>私はリベルダムの人間でよかったよ。<end>ロストールでは貴族や王族の間で<line-break>醜い権力闘争が繰り広げられているって<line-break>いうじゃないか。<line-break>国民はえらく迷惑しているだろうねえ。<line-break>私はリベルダムの人間でよかったよ。<end>ペウダがディンガルに攻め込んで国境沿いの<line-break>村々を焼き払うという事件があったのだが、<line-break>あれはエリスが裏で操っていたという噂だよ。<end>カルラの命令でロセン王家の人間は、<line-break>子供もまでも処刑されたそうだね。<line-break>王家に生まれたばっかりに哀れだよ。<end>アンギルダンを破ったゼネテスは、<line-break>エリス王妃の甥だということだよ。<line-break>反エリス派の貴族は不満だろうね。<end>ああ…カルラに何もかも破壊されたこの町で、<line-break>これからどうやって生きていこう。<line-break>娘には苦労させたくないが…。<end>こんなになっても、生まれ育った場所を<line-break>捨てる気になれない…。<line-break>君のように生きることはできないよ。<end>救世主エルファス様の言葉を信じて、<line-break>真の神に祈りを捧げるよ。<line-break>娘のためにもね。<end>"
korean = "<select><value:$33>로스토올에서는 귀족과 왕족 사이에 추악한 권력 다툼이 벌어지고 있다지. 백성들은 정말 민폐겠군. 나는 리벨덤 사람이라 다행이야.<end>로스토올에서는 귀족과 왕족 사이에 추악한 권력 다툼이 벌어지고 있다지. 백성들은 정말 민폐겠군. 나는 리벨덤 사람이라 다행이야.<end>페우다가 딘갈을 침공해 국경의 마을들을 불태운 사건이 있었는데, 그건 엘리스가 뒤에서 조종했다는 소문이야.<end>카를라의 명령으로 로센 왕가 사람들은 아이들까지 처형됐다더군. 왕가에 태어났다는 이유만으로 불쌍하지.<end>앙길단을 꺾은 제네테스는 엘리스 왕비의 조카라더군. 반엘리스파 귀족들은 불만이겠어.<end>아아… 카를라에게 모든 걸 파괴당한 이 마을에서 이제 어떻게 살아가야 할까. 딸에게 고생은 시키고 싶지 않은데….<end>이 지경이 되어도 태어나 자란 곳을 버릴 마음이 안 생기는군…. 난 자네처럼 살 수는 없어.<end>구세주 엘파스 님의 말씀을 믿고, 참된 신께 기도를 올리겠어. 딸을 위해서라도.<end>"
layout = "<select><value:$33>로스토르에서는 귀족과 왕족 사이에<line-break>추악한 권력 다툼이 벌어지고 있다지.<line-break>백성들은 정말 민폐겠군.<line-break>나는 리벨담 사람이라 다행이야.<end>로스토르에서는 귀족과 왕족 사이에<line-break>추악한 권력 다툼이 벌어지고 있다지.<line-break>백성들은 정말 민폐겠군.<line-break>나는 리벨담 사람이라 다행이야.<end>페우다가 딘갈을 침공해 국경의<line-break>마을들을 불태운 사건이 있었는데,<line-break>그건 엘리스가 뒤에서 조종했다는 소문이야.<end>카를라의 명령으로 로센 왕가 사람들은<line-break>아이들까지 처형됐다더군.<line-break>왕가에 태어났다는 이유만으로 불쌍하지.<end>앙길단을 꺾은 제네테스는<line-break>엘리스 왕비의 조카라더군.<line-break>반엘리스파 귀족들은 불만이겠어.<end>아아… 카를라에게 모든 걸 파괴당한 이 마을에서<line-break>이제 어떻게 살아가야 할까.<line-break>딸에게 고생은 시키고 싶지 않은데….<end>이 지경이 되어도 태어나 자란 곳을<line-break>버릴 마음이 안 생기는군….<line-break>난 자네처럼 살 수는 없어.<end>구세주 엘파스 님의 말씀을 믿고,<line-break>참된 신께 기도를 올리겠어.<line-break>딸을 위해서라도.<end>"
