["2240009"]
japanese = "黙れ、この盗賊ッ！<line-break>今すぐ彼女から離れないと<line-break>たたじゃすまないぞッ！<end>"
korean = "닥쳐라, 이 도적놈아!당장 그녀에게서 떨어지지 않으면무사하지 못할 줄 알아!<end>"

["2240010"]
japanese = "ふははは！　この早とちりさんめがっ！<line-break>見てわからんのか、この状況が？<line-break>これだから素人は困るのだ。<line-break>俺様の槍からほとばしる熱き魂に触れ<line-break>彼女は、小さな胸を打ち震わせ<line-break>感動の涙を流しているにすぎん！<end>"
korean = "후하하하! 이 성급한 녀석 같으니! 이 상황을 보고도 모르겠나? 이래서 초보자는 곤란하다. 이 몸의 창에서 뿜어져 나오는 뜨거운 영혼에 감동해 그녀는 작은 가슴을 떨며 감격의 눈물을 흘리고 있을 뿐이다!<end>"

["2240011"]
japanese = "ふっ、礼はいらん。<line-break>ただ、未来の勇者ガルドランの勇姿を<line-break>その魂に刻んでおくがいい…。<line-break>そして貴様も、思うさま<line-break>熱き魂をほとばしらせるのだ。<line-break>この俺様に憧れて、な。<end>"
korean = "흥, 감사는 됐다. 다만 미래의 용사 갈드란의 용맹한 모습을 그 영혼에 새겨 두어라…. 그리고 네놈도 마음껏 뜨거운 영혼을 뿜어내라. 이 나님을 동경하면서 말이지.<end>"

["2240012"]
