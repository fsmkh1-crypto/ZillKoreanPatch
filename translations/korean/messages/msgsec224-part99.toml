["2240002"]
japanese = "ふははははは！<line-break>男は、乙女の涙の数だけ強くなる！<line-break>未来の勇者ガルドラン、ついに参上！<line-break>さあ、可憐な少女よ<line-break>すぐさま悪党どもから助けてやる！<line-break>思うさま美しい笑顔の準備をするのだ。<line-break>未来の勇者の熱き魂を感じろ！<line-break>俺様に助けられる幸運をかみしめろ！<line-break>もはや涙など捨ててしまうがいい！<end>"
korean = "후하하하하하! 남자는 소녀가 흘린 눈물의 수만큼 강해지는 법! 미래의 용자 갈드란, 마침내 등장! 자, 가련한 소녀여. 당장 악당들에게서 구해 주마! 마음껏 아름다운 미소를 준비해라. 미래의 용자의 뜨거운 혼을 느껴라! 이 몸에게 구원받는 행운을 음미해라! 이제 눈물 따윈 버려도 좋다!<end>"

["2240003"]
japanese = "さあ、悪党どもめ、改心の時間だ！<line-break>俺の正義の心を槍から注入してやろう！<line-break>食らえ！　必殺！　悪者成敗勇者槍！<end>"
korean = "자, 악당들아, 개심할 시간이다! 내 정의의 마음을 창을 통해 주입해 주마! 받아라! 필살! 악당응징 용사창!<end>"

["2240004"]
japanese = "フッ…。<line-break>また増やしてしまったな。<line-break>輝かしい英雄叙事詩の１ページを。<end>"
korean = "훗….또 하나 늘려 버렸군.찬란한 영웅 서사시의 한 페이지를.<end>"

["2240005"]
japanese = "さあ、もう怖がることはない。<line-break>こっちへおいで、お嬢さん。<end>"
