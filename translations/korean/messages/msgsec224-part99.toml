["2240019"]
japanese = "ふっ…心配するな、少年たちよ！<line-break>未来の勇者の力を見るがいい！<line-break>正義の力で傷がふさがってい…<line-break>んぐあっ！　痛い！　ふさがらないッ！<line-break>お、俺様に手傷を負わせるとは…<line-break>あの少年…なかなかやるな！<end>"
korean = "후… 걱정 마라, 소년들이여! 미래의 용사의 힘을 보아라! 정의의 힘으로 상처가 아물고 있… 으갹! 아파! 안 아물잖아! 이, 이 몸에게 상처를 입히다니… 그 소년, 제법이군!<end>"

["2240020"]
