["2240025"]
japanese = "ふはははは、青い、青すぎるぞ！<line-break>逆恨み、やっかみ、仕返し、闇討ち…<line-break>そんな言葉は、俺様の辞書に存在せん！<line-break>未来の勇者の辞書にある言葉は<line-break>ただひとつ！<line-break>「熱き魂」のみ！<end>"
korean = "후하하하하, 풋내기군, 너무 풋내기야! 앙심, 질투, 보복, 기습… 그런 말은 나님의 사전에 없다! 미래의 용사의 사전에 있는 말은 단 하나! '뜨거운 영혼'뿐이다!<end>"

["2240026"]
