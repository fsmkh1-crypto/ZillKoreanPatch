["1440000"]
japanese = "グフトク、Ｖｏｌ３メッセージ開始<end>"
korean = "구프트크 볼륨3 메시지 시작<end>"

["1440001"]
japanese = "今、俺は究極の生物を作り上げた。<line-break>俺は、奴を生み出すためだけに<line-break>生まれたのかもしれない。<line-break>思えば、すべてが意味がなかった。<line-break>…孤独な人生も、金も…。<line-break>金には、あれほど執着したのにな。<end>"
korean = "지금 나는 궁극의 생물을 만들어냈다. 나는 그 녀석을 탄생시키기 위해 태어난 것인지도 몰라. 돌이켜보면 모든 게 의미 없었다. …고독한 인생도, 돈도…. 돈에는 그렇게 집착했는데 말이지.<end>"

["1440002"]
japanese = "それも、結局は<line-break>何にすがればよいかわからないために、<line-break>とりあえず選んだ無難な選択肢だった。<line-break>戦闘モンスター事業の成功も、<line-break>親友ロティに対する反発も、<line-break>リベルダムの陥落も、<end>"
korean = "그것도 결국 무엇에 의지해야 할지 몰라서 우선 고른 무난한 선택지였어. 전투 몬스터 사업의 성공도, 절친 로티에 대한 반발도, 리벨덤의 함락도,<end>"

["1440003"]
japanese = "魔人の奴隷になったのも、<line-break>すべてはここに至るまでの<line-break>道標にすぎなかったのだ。<line-break>この俺の小さな身体は、仮の姿。<line-break>お前こそが<line-break>本当の俺だったのかもしれないな。<end>"
korean = "마인의 노예가 된 것도 모두 여기까지 오기 위한 이정표에 지나지 않았어. 이 작은 몸은 임시 모습. 어쩌면 네가 진짜 나였는지도 모르겠군.<end>"

["1440004"]
japanese = "俺は運命を成し遂げた。<line-break>満足だ。醜く、強大なお前、<line-break>いや本当の自分に会えて…。<end>"
korean = "나는 운명을 이루었다. 만족한다. 추하고 강대한 너, 아니 진짜 나 자신을 만나서….<end>"

["1440005"]
japanese = "いろいろあったが、<line-break>これで俺の苦労も報われる。<end>"
korean = "여러 일이 있었지만, 이걸로 내 고생도 보답받겠군.<end>"

["1440006"]
japanese = "今こそ披露しよう、<line-break>これが究極生物エクリプスだ！<end>"
korean = "지금이야말로 보여 주지. 이것이 궁극생물 이클립스다!<end>"

["1440007"]
japanese = "今、小さい自分が死に、<line-break>大いなる自分が世界を蹂躙する<line-break>クックックッ、ハハハ…！<end>"
korean = "지금 작은 나는 죽고, 위대한 내가 세계를 유린한다. 크크크, 하하하…!<end>"

