["1260014"]
japanese = "朱雀将軍アンギルダンに続いて、青竜将軍カルラ<line-break>までも撃退し、ロストールを守ったゼネテスは<line-break>救国の英雄としてたたえられる。<line-break>しかし、貴族の領袖エリエナイ公レムオンは、<line-break>ファーロス家の権力が、このことで決定的になる<line-break>ことに危機感を抱き、リューガの変を起こす。<line-break>王妃エリスはレムオン派の兵士に殺害され、<line-break>ゼネテスも命を落とした。<end>"
korean = "주작장군 앙길단에 이어 청룡장군 카를라마저 격퇴해 로스토올을 지킨 제네테스는 구국의 영웅으로 칭송받는다. 그러나 귀족의 영수 엘리에나이 공 레몬은 파로스 가문의 권력이 결정적으로 커질 것을 우려해 류가의 변을 일으킨다. 왕비 엘리스는 레몬파 병사에게 살해되고 제네테스도 목숨을 잃었다.<end>"

