["1260004"]
japanese = "酒の臭いをさせ、無精ひげをはやし、だらしなく<line-break>胸をはだけて歩くという、無頼の男。<line-break>生まれつき身分の上下が存在し、<line-break>それを仕方がないとするロストールの貴族制度に<line-break>反発している。<line-break>その明るい人柄とざっくばらんなところから<line-break>冒険者や傭兵の間で特に人気がある。<line-break>　<end>"
korean = "술 냄새를 풍기고 수염도 제대로 깎지 않은 채 흐트러진 차림으로 가슴을 드러내고 다니는 무뢰한. 태어나면서부터 신분의 높고 낮음이 존재하고 그것을 당연시하는 로스토올의 귀족 제도에 반발하고 있다. 밝고 소탈한 성격 덕분에 모험가와 용병 사이에서 특히 인기가 많다.<end>"

