japanese = "力の求道者。強い者と戦い、それを打ち破ること<line-break>を生きる目的としている。ネメアと出会い、<line-break>その強さにひかれ彼に従う。ネメアが闇の神器<line-break>探索の旅に出ると、オイフェ、ドルドラムと共に<line-break>ネメアに従い、<value:$28>と闇の神器の<line-break>争奪戦を行う。<line-break>　<line-break>　<end>"
korean = "힘을 추구하는 자. 강한 자와 싸워 쓰러뜨리는 것을 삶의 목적으로 삼고 있다. 네메아를 만나 그 강함에 이끌려 그를 따른다. 네메아가 어둠의 신기를 찾는 여행에 나서자 오이페, 돌드람과 함께 네메아를 따르며 <value:$28>과 어둠의 신기를 놓고 쟁탈전을 벌인다.<end>"

