japanese = "古代の魔道王国ラドラスで４人の巫女のひとり<line-break>であった火の巫女ウルの血を引く者。正体は<line-break>ウルカーン長老シェムハザによって作られた人造<line-break>人間である。精霊神の座所を守る役割を失った後、<line-break><value:$28>と、新しい役割を探す旅に出る。<line-break> <line-break> <line-break>　<end>"
