["1260094"]
japanese = "当代一の刀鍛冶。<line-break>彼が鍛えた剣は、ドワーフ特有の繊細な彫り物が<line-break>施された美しい外見と、岩をも切り裂く切れ味を<line-break>備えた名剣として諸国の王や騎士に高く評価され<line-break>ていた。<line-break>ところが彼は、突然、武器を造ることをやめて<line-break>しまう。<line-break>　<end>"
korean = "당대 최고의 도검 장인. 그가 벼린 검은 드워프 특유의 섬세한 조각이 새겨진 아름다운 외형과 바위마저 가르는 예리함을 갖춘 명검으로 여러 나라의 왕과 기사들에게 높이 평가받았다. 그러나 그는 갑자기 무기를 만드는 일을 그만두었다.<end>"

