["1260059"]
japanese = "元ロストールの貴族。リューガ家の嫡流だったが<line-break>叔父であるレムオンの父に当主の座を奪われる。<line-break>その後も有能すぎる従兄弟のレムオンやエストに<line-break>ことあるごとに比べられ、すさんだ性格になる。<line-break>リューガの変後、廃人同様になって発見される。<line-break><value:$28>の優しさに触れることで<line-break>タルテュバはすさんだ心を少しだけ開いて<line-break>やすらかに永い眠りについた。<end>"
korean = "전 로스토올 귀족. 류가 가문의 적통이었으나 숙부인 레몬의 아버지에게 당주 자리를 빼앗겼다. 이후에도 지나치게 유능한 사촌 레몬과 에스트와 늘 비교당해 성격이 비뚤어진다. 류가의 변 후 폐인과 다름없는 상태로 발견된다. <value:$28>의 다정함을 접한 타르튜바는 메마른 마음을 조금 열고 편안하게 긴 잠에 든다.<end>"

