["1260039"]
japanese = "ロストール先王。ファーロス家の娘エリスと結婚<line-break>することで強力な後ろ盾を得、王になる。この時<line-break>愛のない結婚をしたことが彼に罪悪感を抱かせ<line-break>それがエリスや娘ティアナへの冷たい態度となり<line-break>また、その罪悪感で自縄自縛状態に陥っていた。<line-break>リューガの変でエリスを殺害させると、<line-break>この罪悪感がこうじて、破壊神の円卓騎士である<line-break>縛られしものサムスンに取りつかれてしまう。<end>"
korean = "로스토올 선왕. 파로스 가문의 딸 엘리스와 결혼해 강력한 배경을 얻고 왕이 되었다. 사랑 없는 결혼을 했다는 죄책감은 엘리스와 딸 티아나를 냉정하게 대하는 태도로 이어졌고, 그 죄책감 때문에 스스로를 옭아매고 있었다. 류가의 변에서 엘리스를 살해하게 한 뒤 죄책감이 심해져 파괴신의 원탁기사 '속박된 자' 삼슨에게 빙의되고 만다.<end>"

