japanese = "ロストールの大通りにある酒場で働く、少しぽっ<line-break>ちゃりとした看板娘。愛想がよく元気で、男性<line-break>客に人気が有り、彼女のために通う客も多い。<line-break>ガルドランの好みのタイプなため、彼に<line-break>つきまとわれて困っている。<line-break><line-break><line-break>　<end>"
korean = "로스토올 대로의 술집에서 일하는 조금 통통한 간판 아가씨. 붙임성이 좋고 활기차며 남성 손님들에게 인기가 많아 그녀를 보러 오는 손님도 많다. 갈드란의 취향에 딱 맞는 타입이라 그에게 들러붙음을 당해 곤란해하고 있다.<end>"

