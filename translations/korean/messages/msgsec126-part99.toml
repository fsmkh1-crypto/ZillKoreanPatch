japanese = "ネメアに仕えるドワーフの神官戦士。<line-break>戦神ソリアスを信仰している。<line-break>皇帝になったネメアのもと、オイフェ、ゼリグと<line-break>ともに闇の神器を求め、旅をする。<line-break>墓場を散歩し、墓標に人生を見るという、<line-break>風変わりな趣味を持つ。<line-break>　<line-break>　<end>"
korean = "네메아를 섬기는 드워프 신관 전사. 전쟁신 소리아스를 신앙한다. 황제가 된 네메아 아래에서 오이페, 제리그와 함께 어둠의 신기를 찾아 여행한다. 묘지를 산책하며 묘비에서 인생을 바라본다는 기묘한 취미가 있다.<end>"

