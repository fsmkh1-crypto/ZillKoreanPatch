["1110008"]
japanese = "おう！　<value:$28>。<line-break>なんかすごいことになってるぜ。　<line-break>　<line-break>ディンガルの四天王のひとり、<line-break>玄武将軍ザギヴが、<line-break>お前に礼を言いたいそうだ。<end>"
korean = "오! <value:$28>. 뭔가 굉장한 일이 벌어졌어. 딘갈 사천왕 중 하나인 현무 장군 자기브가 네게 감사하고 싶대.<end>"

["1110009"]
japanese = "城まで来てくれってさ。<line-break>いやー、お前も大物になったなぁ。<line-break>　<end>"
korean = "성까지 와 달래. 이야, 너도 거물이 됐구나.<end>"

["1110010"]
japanese = "無限のソウルの資質を持つ者よ。<line-break>私の執務室まで来てくれ。<end>"
korean = "무한의 소울 자질을 가진 자여. 내 집무실로 와 주게.<end>"

["1110011"]
japanese = "用事がある。<line-break>国計に関わる大事だ。　　　　　　　<line-break>　<line-break>ネメア様の障害となる者、<line-break>つまり、君を私の執務室におびき寄せ<line-break>兵に囲ませて始末するのだ。<end>"
korean = "볼일이 있다. 국정에 관계된 중대사다. 네메아 님의 방해가 되는 자, 즉 너를 내 집무실로 유인해 병사들로 포위하고 처리하는 것이다.<end>"

["1110012"]
japanese = "冗談だ。君ごときなら、<line-break>今、私ひとりで始末できる。<end>"
korean = "농담이다. 너 정도라면 지금 나 혼자서도 처리할 수 있어.<end>"

["1110014"]
japanese = "君はだいたいネメア様に<line-break>たてつくようなマネは<line-break>何もしていないではないか。<end>"
korean = "넌 애초에 네메아 님께 맞서는 짓은 아무것도 하지 않았잖아.<end>"

["1110016"]
japanese = "私は君に期待している。<line-break>君のようなソウルを持つ者は、<line-break>人類の革新者たりうる。<line-break>いくら優れていても<line-break>所詮、四天王は凡人だ。<line-break>人類の革新者たりえない。<end>"
korean = "나는 너를 기대하고 있다. 너 같은 소울을 지닌 자는 인류의 혁신자가 될 수 있다. 아무리 뛰어나도 결국 사천왕은 범인이다. 인류의 혁신자는 될 수 없어.<end>"

["1110017"]
japanese = "それでは意味がないのだ。<end>"
korean = "그러면 의미가 없다.<end>"

["1110018"]
japanese = "また来るといい。<line-break>無限のソウルを持つものよ。<line-break>私は君を歓迎するだろう。<end>"
korean = "또 오게. 무한의 소울을 지닌 자여. 나는 자네를 환영할 것이다.<end>"

