["30007"]
japanese = "<select><value:$33>エリュマルク陛下もひどいお方だよ。　　　<line-break>ネメア様に無理難題ばかりふっかけて<line-break>成し遂げられなかったら罰を与えようなんてさ。<line-break>もっともネメア様はすべての無理難題を成し遂げ<line-break>てしまったから、陛下もくやしかったろうね。<line-break>これでネメア様の株がますます上がっちゃうよ。<end>ネメア様がとうとう皇帝を見限って　　<line-break>エンシャントから逃げ出したって噂は<line-break>どうも本当のことらしいよ。<line-break>皇帝のネメア様に対する嫌がらせも<line-break>ひどいもんだったからねえ。<line-break>ネメア様も今までよく耐えたと思うよ。<end>とうとう来るべき時が来てしまったねえ。　　<line-break>殺されたエリュマルク帝も自業自得だよ。<line-break>ネメア様も皇帝殺しを恥じることはないさ。<line-break>あれだけ無理難題を押しつけられても黙って<line-break>耐えて、しかもすべて成し遂げてきたのだから。<line-break>悪いのはどう考えてもエリュマルク帝だよ。<end>東方の国はぜーんぶ滅ぼされたそうじゃないか。<line-break>ロセンのペウダはひどいことばかりしていた<line-break>そうだから、親族皆殺しも当然の報いだよ。<end>ロストールの将軍は能なしばかりだと　<line-break>思っていたけど、ゼネテスってのは<line-break>それなりにできるみたいじゃないか。<line-break>だけど、カルラ将軍やネメア様には、<line-break>到底かなわないだろうさ。<line-break>ロストールが滅ぶのも時間の問題だよ。<end>リベルダムは、カルラ将軍によって破壊された<line-break>そうだよ。たぶん、逆らう者への見せしめだと<line-break>思うけど、やりすぎのような気がするねぇ。<end>ネメア様はロストール攻略に参加しないのかね。<line-break>宿敵ロストールとの戦いくらい、ネメア様が<line-break>出陣することを期待していたんだけどねぇ。<end>ネメア様が死んだなんて噂が流れているけど、<line-break>あれはロストールのゼネテスが流した<line-break>デマだそうだよ。<line-break>ネメア様が死んだなんて、信じる人間は<line-break>ディンガルにいるわけがないってのに、<line-break>ゼネテスって男もバカだねぇ。<end>"
korean = "<select><value:$33>에류마르크 폐하도 참 너무하신 분이야.　　　<line-break>네메아 님에게 무리한 일만 잔뜩 떠넘기고<line-break>해내지 못하면 벌을 주려고 했다잖아.<line-break>하지만 네메아 님은 그 모든 난제를 해냈으니<line-break>폐하도 무척 분했겠지.<line-break>이제 네메아 님의 평판은 더 올라가겠네.<end>네메아 님이 결국 황제를 포기하고　　<line-break>엔션트에서 달아났다는 소문은<line-break>아무래도 사실인 모양이야.<line-break>황제가 네메아 님을 괴롭힌 것도<line-break>정말 심했으니까.<line-break>네메아 님도 지금까지 잘 참았다고 생각해.<end>결국 올 것이 오고 말았네.　　<line-break>살해당한 에류마르크 황제도 자업자득이야.<line-break>네메아 님도 황제를 죽인 걸 부끄러워할 필요 없어.<line-break>그렇게 터무니없는 일들을 떠맡고도 묵묵히<line-break>참아 내면서 전부 해냈으니까.<line-break>아무리 생각해도 잘못한 건 에류마르크 황제야.<end>동방의 나라들은 전부 멸망했다면서.<line-break>로센의 페우다는 온갖 악행을 저질렀다니<line-break>일족이 몰살당한 것도 당연한 대가겠지.<end>로스톨의 장군들은 무능한 자들뿐이라고　<line-break>생각했는데, 제네테스라는 자는<line-break>제법 능력이 있는 모양이네.<line-break>그래도 카를라 장군이나 네메아 님에게는<line-break>도저히 상대가 안 되겠지.<line-break>로스톨이 멸망하는 것도 시간문제야.<end>리베르담은 카를라 장군에게 파괴됐다더군.<line-break>아마 반항하는 자들에게 본보기를 보이려는<line-break>거였겠지만, 좀 지나쳤던 것 같아.<end>네메아 님은 로스톨 공략에 참가하지 않는 걸까.<line-break>숙적 로스톨과 싸울 때만큼은 네메아 님이<line-break>출진하리라 기대했는데 말이야.<end>네메아 님이 죽었다는 소문이 돌고 있지만,<line-break>그건 로스톨의 제네테스가 퍼뜨린<line-break>거짓 소문이라더군.<line-break>네메아 님이 죽었다는 말을 믿을 사람이<line-break>딘갈에 있을 리도 없는데,<line-break>제네테스라는 남자도 참 바보라니까.<end>"

["30008"]
japanese = "<select><value:$20>%2エリュマルク帝はネメア様に、国境を侵し　　　<line-break>村々を略奪するロセン軍を、わずかな騎兵<line-break>のみで撃退するよう命じたのじゃ。<line-break>ネメア様はロセン王ペウダの野営地に夜襲をかけ<line-break>ロセン軍が壊滅、ペウダは命からがら逃げた<line-break>そうじゃ。１２の難事のひとつじゃよ。<end>エリュマルク帝はネメア様に、施文院大神官の<line-break>イズをさらってくるよう命じたのじゃ。<line-break>イズは絶世の美女として有名じゃったからな。<line-break>ネメア様は不名誉な役目であるにも関わらず<line-break>１人旅立たれ、見事イズを連れてきたのじゃ。<line-break>１２の難事のひとつじゃよ。<end>"
korean = "<select><value:$20>%2에류마르크 황제는 네메아 님에게 국경을 침범해　　　<line-break>마을을 약탈하던 로센군을 고작 소수의 기병<line-break>만으로 격퇴하라고 명했지.<line-break>네메아 님은 로센 왕 페우다의 야영지를 야습하여<line-break>로센군을 괴멸시켰고, 페우다는 간신히 목숨만 건져<line-break>달아났다고 하네. 열두 난업 중 하나였지.<end>에류마르크 황제는 네메아 님에게 시문원 대신관<line-break>이즈를 납치해 오라고 명했지.<line-break>이즈는 절세의 미녀로 유명했거든.<line-break>네메아 님은 불명예스러운 임무임에도<line-break>홀로 길을 떠나 훌륭히 이즈를 데려왔지.<line-break>열두 난업 중 하나였네.<end>"
