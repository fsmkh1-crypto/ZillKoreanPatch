["2760001"]
japanese = "ふたりとも、いいのか？<line-break>わしは、結婚式の立ち会いなんて<line-break>数えるほどしかやっておらんぞ？<line-break>…なんせ、アルノートゥンは<line-break>男ばっかりで<line-break>世界一、結婚と縁のない町だからな。<line-break>しかも本当に構わんのか、この格好で？<end>"
korean = "둘 다 정말 괜찮겠나? 나는 결혼식 입회 같은 건 손에 꼽을 만큼밖에 안 해 봤다네. 알노툰은 남자뿐이라 세계에서 결혼과 가장 인연 없는 마을이니까. 게다가 정말 이 차림으로 괜찮겠어?<end>"

["2760002"]
japanese = "あー、うー、まあそのなんだ。<line-break>小難しいことは省略して、<line-break>お主らは永遠の愛を誓い合うか？<end>"
korean = "아, 음, 뭐 그게 말이지. 어려운 이야기는 생략하고, 너희 둘은 영원한 사랑을 맹세하느냐?<end>"

["2760003"]
japanese = "誓う。<end>"
korean = "맹세해.<end>"

["2760004"]
japanese = "誓います。<end>"
korean = "맹세합니다.<end>"

["2760005"]
japanese = "ここにふたりを生涯の伴侶と認める。<line-break>神だろうと英雄だろうと邪神だろうと<line-break>お主らの仲は引き裂けまい。<line-break>それだけはわしが保証しよう。<line-break>以上！　ふたりの未来に幸あれ！<end>"
korean = "여기서 두 사람을 평생의 반려자로 인정한다. 신이든 영웅이든 사신이든 너희 사이를 갈라놓지는 못할 게야. 그것만은 내가 보증하지. 이상! 두 사람의 앞날에 행복이 있기를!<end>"

["2760006"]
japanese = "あたしたちは新しい大陸に渡るわ。<line-break>どんな世界が待っていようと、<line-break>ふたりで切り開いていけるから。<end>"
korean = "우리는 새로운 대륙으로 갈 거야. 어떤 세계가 기다리고 있어도 둘이 함께 개척해 나갈 수 있으니까.<end>"

["2760007"]
japanese = "競争だな。俺とお前、<line-break>どっちの名声が先に相手の耳に届くか。<line-break>楽しみにしている。<end>"
korean = "경쟁이군. 나와 너, 누구의 명성이 먼저 상대 귀에 들어갈지. 기대하고 있겠다.<end>"

