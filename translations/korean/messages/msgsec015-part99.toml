["150006"]
japanese = "<select><value:$20>%2自警団員として今日も町の平和を<line-break>守っています。今のところ異常は<line-break>ありません。平穏そのものです。<end>キャプテン・カンダカン率いるワッシャー海賊が<line-break>このところ元気ないですね。昔は毎日のように<line-break>フゴー商会の船を襲っていたのに…。<line-break>も、もちろん海が平和なのはけっこうな<line-break>ことなんです。でも、ライバルがいないと<line-break>自警団としては張り合いがなくて。<end>"
korean = "<select><value:$20>%2자경단원으로서 오늘도 마을의 평화를 지키고 있습니다. 지금은 이상 없습니다. 아주 평온합니다.<end>캡틴 칸다칸이 이끄는 왓샤 해적단이 요즘 기운이 없네요. 예전엔 매일같이 휴고 상회의 배를 습격했는데…. 무, 물론 바다가 평화로운 건 좋은 일입니다. 하지만 라이벌이 없으니 자경단으로서는 맥이 빠져서요.<end>"

["150007"]
japanese = "<if><value:$2C><less-equal>%9魔法を使えるようになりたかったら、<line-break>まず探求心Ｓｅａｒｃｈを高めるのです。<line-break>ウォーロックのソウルが宿るはずです。<line-break>もっとも、あなたの精霊力レベルが<line-break>精霊を操るに足るレベルでなければ<line-break>魔法は使えないのですが…。<end><if><value:$2C><less-equal>%29私の現在のソウルはグロウファイターですが、<line-break>ロースペルのスキルを習得しているので<line-break>魔法を使うことができます。<line-break>あなたも気に入ったスキルがあれば<line-break>習得しておくといいですよ。<line-break>特に魔法のスキルは役にたつはずです。<end><if><value:$2C><less-equal>%49魔法は相手の属性を考えて使うものですよ。<line-break>火属性のモンスターに水属性の魔法なんて<line-break>問題外です。<end>すべての魔法スキルを習得した者が<line-break>次に目指すのは禁呪だそうです。<line-break>あなたも探してみますか？<end>"
korean = "<if><value:$2C><less-equal>%9마법을 쓸 수 있게 되고 싶다면 먼저 탐구심 Search를 높이세요. 워록의 소울이 깃들 겁니다. 물론 정령력 레벨이 정령을 다룰 만큼 높지 않으면 마법은 쓸 수 없지만요…<end><if><value:$2C><less-equal>%29제 현재 소울은 그로우 파이터지만 로우 스펠 스킬을 익혀서 마법을 쓸 수 있습니다. 당신도 마음에 드는 스킬이 있으면 익혀 두세요. 특히 마법 스킬은 도움이 될 겁니다.<end><if><value:$2C><less-equal>%49마법은 상대의 속성을 생각해서 써야 합니다. 불 속성 몬스터에게 물 속성 마법이라니 말도 안 됩니다.<end>모든 마법 스킬을 익힌 자가 다음으로 노리는 건 금주라고 합니다. 당신도 찾아볼 건가요?<end>"

["150008"]
japanese = "<if><value:$2C><less-equal>%9アミラルの西と東の森はそれぞれ　　<line-break>シェーヌの森とミューンの森と<line-break>呼ばれているんだ。<line-break>どちらの森にもエルフが住んでいる<line-break>という噂だけど、俺は見たことないね。<end><if><value:$2C><less-equal>%29アミラルの東にある幻惑の洞窟に　<line-break>行ったことはあるのかい？<line-break>コロル石を採取できる洞窟なんだ。<line-break>迷路のようになっているけど、<line-break>あんたくらい強ければモンスターに<line-break>やられることもないだろう。<end><if><value:$2C><less-equal>%49あんたくらい強ければ、<line-break>どんどん西を目指しても大丈夫だろ。<line-break>未開の森の奥には何があるのかな。<end>西の海は危険だらけで船が出せない。<line-break>しぶきの群島を目指した船は<line-break>たいてい難破しているみたいなんだ。<end>"
korean = "<if><value:$2C><less-equal>%9아미랄 서쪽과 동쪽의 숲은 각각 셰느의 숲과 뮤느의 숲이라고 해. 두 숲 모두 엘프가 산다는 소문이지만 난 본 적 없어.<end><if><value:$2C><less-equal>%29아미랄 동쪽의 환혹의 동굴에 가 본 적 있어? 코롤석을 채취할 수 있는 동굴이야. 미로처럼 돼 있지만 너 정도로 강하면 몬스터에게 당할 일은 없겠지.<end><if><value:$2C><less-equal>%49너 정도로 강하면 계속 서쪽을 향해도 괜찮을 거야. 미개척 숲 깊숙한 곳엔 뭐가 있을까.<end>서쪽 바다는 위험투성이라 배를 띄울 수 없어. 물보라 군도를 향한 배는 대부분 난파하는 모양이야.<end>"

["150009"]
japanese = "<if><value:$2C><less-equal>%15若いころは腕利き冒険者として活躍しておった　<line-break>わしも、今は自警団の団員として日夜、<line-break>アミラルの平和を守っておるのじゃ。<line-break>冒険者だったころの知識とスキルを<line-break>活かして、自警団でも大活躍するぞい。<line-break>スキルはたくさん習得しておいて損はないわい。<end><if><value:$2C><less-equal>%25モンスターを相手にするときは、<line-break>冒険者時代の経験が役に立つのじゃ。<line-break>弱点、属性を知っておるからのう。<end><if><value:$2C><less-equal>%35自警団は軍隊と違って装備品を<line-break>指定されないのがいいところじゃな。<line-break>斧以外の武器なんぞ考えられんからのう。<end>属性を固定された武器には注意せい！<line-break>戦闘中に、武器を持ちかえることは<line-break>できないのじゃからな。<end>"
korean = "<if><value:$2C><less-equal>%15젊을 때는 솜씨 좋은 모험자로 활약했던 나도 지금은 자경단원으로 밤낮없이 아미랄의 평화를 지키고 있지. 모험자 시절의 지식과 스킬을 살려 자경단에서도 크게 활약할 거야. 스킬은 많이 익혀 둬서 손해 볼 게 없다네.<end><if><value:$2C><less-equal>%25몬스터를 상대할 땐 모험자 시절 경험이 도움이 되지. 약점과 속성을 알고 있으니까.<end><if><value:$2C><less-equal>%35자경단은 군대와 달리 장비를 지정받지 않는 게 좋은 점이지. 도끼 말고 다른 무기는 생각도 못 하겠거든.<end>속성이 고정된 무기는 조심하게! 전투 중에는 무기를 바꿔 들 수 없으니까.<end>"

["150010"]
japanese = "<select><value:$20>%3アムドゥシアスのソウルを宿すためには<line-break>野生Ｗｉｌｄが低くないとダメなんだよぉ。<line-break>野蛮な吟遊詩人なんてきれいじゃないもんね。<end>きれいは目には見えない。心で感じるんだ。<line-break>師匠がよく言ってたけど、難しすぎて<line-break>ボクにはわからないなぁ…ララッラン。<end>宿屋の別館を破壊した女の子は<line-break>どうしたのかな？<line-break>宿屋でただ働きさせられていたけど。<end>"
korean = "<select><value:$20>%3암두시아스의 소울을 깃들게 하려면 야생 Wild가 낮아야 해. 야만적인 음유시인이라니 아름답지 않잖아.<end>아름다움은 눈에 보이는 게 아니야. 마음으로 느끼는 거지. 스승님이 자주 하시던 말인데 너무 어려워서 난 잘 모르겠어… 라라란.<end>여관 별채를 부순 여자애는 어떻게 됐을까? 여관에서 무급으로 일하고 있었는데.<end>"

["150011"]
japanese = "<select><value:$33>ワッシャー海賊は、フゴー商会の船だけを襲う<line-break>ことで有名な海賊だ。素直に積み荷を渡せば<line-break>命までは取られないが、刃向かうと容赦がない。<end>ワッシャー海賊は、フゴー商会の船だけを襲う<line-break>ことで有名な海賊だ。素直に積み荷を渡せば<line-break>命までは取られないが、刃向かうと容赦がない。<end>エルズの船員が海王を見たって騒いでいたよ。<line-break>竜王が覚醒して、大地震が起きたり、<line-break>海王が現れたり…近頃、おかしなことばかりだ。<end>ロセンの港が解放された記念に、<line-break>次の航海ではロセンへ行くぞ。<line-break>準備をしておけよ。<end>ロセンの…たしかカルラとか言ったか、<line-break>あれはかなりのやり手だな。<line-break>段取りのよさには驚かされたよ。<end>リベルダムの破壊はどの程度なのだ。<line-break>港は使用できるのか！？<line-break>カルラめ！　なんてことをしてくれるのだ！<end>ロセンへ直行する。<line-break>水や食料の補給を多めにしておけよ。<line-break>傭兵も屈強な者を雇っておけ。<end>竜王の島付近を航海するたびに、<line-break>鬼気を感じるのだが…。<line-break>お前はどうだ？<end>"
korean = "<select><value:$33>와셔 해적은 휴고 상회의 배만 습격하는 것으로 유명한 해적이다. 순순히 화물을 넘기면 목숨까지 빼앗지는 않지만 맞서면 가차 없지.<end>와셔 해적은 휴고 상회의 배만 습격하는 것으로 유명한 해적이다. 순순히 화물을 넘기면 목숨까지 빼앗지는 않지만 맞서면 가차 없지.<end>엘즈 선원이 해왕을 봤다고 떠들더군. 용왕이 각성해서 대지진이 일어나고 해왕이 나타나고… 요즘은 이상한 일뿐이야.<end>로센 항구가 해방된 기념으로 다음 항해는 로센으로 간다. 준비해 둬.<end>로센의… 카를라라고 했던가, 상당히 수완이 좋더군. 일 처리 솜씨에 놀랐어.<end>리벨덤의 파괴가 어느 정도냐. 항구는 사용할 수 있나!? 카를라 녀석! 무슨 짓을 한 거냐!<end>로센으로 직행한다. 물과 식량을 넉넉히 보급해 둬. 용병도 강한 자로 고용해.<end>용왕의 섬 근처를 항해할 때마다 섬뜩한 기운이 느껴지는데…. 넌 어때?<end>"

["150012"]
japanese = "<select><value:$33>船長、今度のリベルダム行きの積み荷は<line-break>まさか、フゴー商会のじゃないですよね？<line-break>えっ！　そのまさかなんですか…トホホ。<end>船長、今度のリベルダム行きの積み荷は<line-break>まさか、フゴー商会のじゃないですよね？<line-break>えっ！　そのまさかなんですか…トホホ。<end>海王ってのは広場に建っている<line-break>像のモデルですね。<line-break>まさか、人を襲ったりしないですよね？<end>はっ！<line-break>航路の確認をしておきます。<line-break>しかし積み荷はあるんですかね。<end>カルラ将軍はリベルダムにあるような<line-break>闘技場も建設しているみたいですよ。<end>自由都市リベルダムの面影はどこにも　<line-break>ないそうです。大商人たちはロセンへ<line-break>引っ越したと聞きますし…。<line-break>港も、もはや使用できないと思います。<line-break>船長、これからどうします？<end>はっ！　　　　　　　　　　　　　　　　　　<line-break>早急に手配しておきます。<line-break>　<line-break>しかし、いくら戦争で陸路が使えないからって<line-break>物資が海路に集中すると、海賊やモンスターが<line-break>原因で物資の流れが滞る心配がありますね。<end>えっ！　船長もですか！<line-break>やはり世界の混乱ぶりに、<line-break>竜王様が怒っているのでしょうか…。<end>"
korean = "<select><value:$33>선장님, 이번 리벨덤행 화물은 설마 휴고 상회 건 아니죠? 네!? 설마가 맞아요… 아이고.<end>선장님, 이번 리벨덤행 화물은 설마 휴고 상회 건 아니죠? 네!? 설마가 맞아요… 아이고.<end>해왕이란 광장에 세워진 동상의 모델이죠. 설마 사람을 습격하진 않겠죠?<end>네! 항로를 확인해 두겠습니다. 그런데 화물은 있긴 한가요.<end>카를라 장군은 리벨덤에 있는 것 같은 투기장도 건설 중인 모양입니다.<end>자유도시 리벨덤의 모습은 어디에도 남지 않았다더군요. 대상인들은 로센으로 이사했다 하고…. 항구도 이제 사용할 수 없을 겁니다. 선장님, 앞으로 어떻게 하죠?<end>네! 서둘러 준비해 두겠습니다. 하지만 전쟁으로 육로를 못 쓴다고 물자가 해로에 집중되면 해적이나 몬스터 때문에 물자 흐름이 막힐 걱정이 있네요.<end>네!? 선장님도요! 역시 세계가 혼란스러운 모습에 용왕님이 화가 난 걸까요….<end>"

