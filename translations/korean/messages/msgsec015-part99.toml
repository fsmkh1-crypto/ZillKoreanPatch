["150001"]
japanese = "<if><value:$2A><less-equal>%49私はアミラル自警団の団員です。<line-break>自警団はモンスターや海賊から町を守るために<line-break>結成されました。<line-break>王都ロストールでは貴族たちが権力争いに夢中で<line-break>なにもしてくれませんから、自分たちの町は<line-break>自分たちで守るしかないのです。<end><if><value:$2A><less-equal>%100街道で暴れるモンスターが、<line-break>だんだん凶暴になっていませんか？<line-break>私の気のせいですかね…。<end><if><value:$2A><less-equal>%130あなたが有名な<value:$28>さんですか。<line-break>ぜひ、自警団に入団してもらえませんか？<line-break>あなたが一緒なら恐いものなしですよ。<end>海は平和になりつつありますが、<line-break>陸の上はちっとも平和になりませんね。<line-break>なんとかならないものですかね。<end>"
korean = "<if><value:$2A><less-equal>%49저는 아미랄 자경단의 단원입니다. 자경단은 몬스터와 해적으로부터 마을을 지키기 위해 결성됐습니다. 왕도 로스토올에서는 귀족들이 권력 다툼에 빠져 아무것도 해 주지 않으니, 우리 마을은 우리가 지킬 수밖에 없습니다.<end><if><value:$2A><less-equal>%100가도에서 날뛰는 몬스터들이 점점 흉폭해지는 것 같지 않습니까? 제 기분 탓일까요…?<end><if><value:$2A><less-equal>%130당신이 유명한 <value:$28> 씨입니까? 꼭 자경단에 들어와 주시면 안 될까요? 당신이 함께라면 무서울 게 없습니다.<end>바다는 점점 평화로워지는데 육지는 전혀 평화로워지지 않네요. 어떻게 안 될까요.<end>"

["150002"]
japanese = "<select><value:$33>我らが自警団あるかぎり、<line-break>モンスターだろうが海賊だろうが<line-break>アミラルで好き放題にはさせないぜ。<end>我ら自警団あるかぎり、<line-break>モンスターだろうが海賊だろうが<line-break>アミラルで好き放題にはさせないぜ。<end>ワッシャー海賊の勢いがなくなったおかげで、<line-break>雑魚海賊どもがウヨウヨ出てきやがった。<line-break>まとまりがないだけに対処に困るよ。<end>ワッシャー海賊は、フゴーの船しか襲わないから<line-break>対処しやすかったのだがな。<line-break>もっともどんなに防備を固めても破られたがね。<end>ワッシャーは刃向かうものには容赦しないが、<line-break>黙って積み荷を渡せば何もしなかった。<line-break>だが、最近の海賊は殺しを楽しんでやがる。<end>数年前、漁をしていたらシービショップに　　<line-break>襲われてな、もうダメかと思ったときに<line-break>ワッシャー海賊が現れて助けてくれた。<line-break>俺は海賊は大嫌いだが、カンダカンは好きだ。<line-break>先頭に立って戦う彼の勇姿が忘れられねえよ。<end>カルラ軍が攻めてきたら、<line-break>俺たち自警団でも防ぎようがないぜ。<line-break>総司令のゼネテスにすべてを託すしかないな。<end>世界を混乱させた張本人が死んだら、<line-break>これからどうなってしまうんだ！<line-break>せめてアミラルだけでも平和な町にするぜ。<end>"
korean = "<select><value:$33>우리 자경단이 있는 한 몬스터든 해적이든 아미랄에서 제멋대로 날뛰게 두진 않아.<end>우리 자경단이 있는 한 몬스터든 해적이든 아미랄에서 제멋대로 날뛰게 두진 않아.<end>왓샤 해적의 기세가 꺾인 덕에 잡해적들이 우글우글 나타났어. 통제가 안 되니 오히려 대처하기 곤란해.<end>왓샤 해적은 휴고의 배만 공격해서 상대하기는 쉬웠는데 말이야. 물론 아무리 방비를 굳혀도 뚫렸지만.<end>왓샤는 맞서는 자에겐 가차 없었지만 얌전히 화물을 넘기면 아무 짓도 안 했어. 그런데 요즘 해적들은 살인을 즐기고 있어.<end>몇 년 전 고기잡이를 하다 시 비숍에게 습격당해서 끝장이라고 생각했을 때 왓샤 해적이 나타나 구해 줬지. 난 해적은 정말 싫지만 칸다칸은 좋아해. 선두에서 싸우던 그의 용맹한 모습이 잊히질 않아.<end>카를라군이 쳐들어오면 우리 자경단으로도 막을 방법이 없어. 총사령 제네테스에게 모든 걸 맡길 수밖에 없겠군.<end>세계를 혼란시킨 장본인이 죽으면 앞으로 어떻게 되는 거야! 적어도 아미랄만큼은 평화로운 마을로 만들겠어.<end>"

