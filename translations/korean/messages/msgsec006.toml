section = 6

[[message]]
id = "60000"
japanese = "<select><value:$33>今回の航海は無事成功したが、<line-break>次はどうなるだろうか…。<line-break>モンスターも増えてきているしな。<end>今回の航海は無事成功したが、<line-break>次はどうなるだろうか…。<line-break>モンスターも増えてきているしな。<end>ディンガルでは新しい皇帝の誕生を祝っている<line-break>そうだよ。やはりネメアが帝位につくことを<line-break>国民は待ち望んでいたのだな。<end>ロセンがカルラのおかげで解放されたので、<line-break>我々の仕事も忙しくなりそうだ。<end>アンギルダンが海路でなく山越えでロストールを<line-break>攻めるとはな。おかげで、我々の船は仕事を<line-break>ひとつなくしてしまったぞ。わはははは…。<end>やれやれ自由都市リベルダムを、ここまで<line-break>破壊してしまうとは、カルラもたいした女だ。<line-break>おかげで、動ける船はうちのだけだ。<end>この有様だから、最近はロセンの<line-break>ほうがにぎやかでな、我々の船もめったに<line-break>この港へ寄らなくなってしまったよ。<end>ネメアが死んだという噂が流れているようだが、<line-break>それが事実なら指導者を失ったディンガル帝国の<line-break>行く末が気になるな。<end>"
korean = "<select><value:$33>이번 항해는 무사히 성공했지만,<line-break>다음은 어떻게 될지 모르겠군….<line-break>몬스터도 늘고 있으니 말이야.<end>이번 항해는 무사히 성공했지만,<line-break>다음은 어떻게 될지 모르겠군….<line-break>몬스터도 늘고 있으니 말이야.<end>딘갈에서는 새 황제의 탄생을 축하하고<line-break>있다더군. 역시 네메아가 제위에 오르기를<line-break>백성들도 기다리고 있었던 거야.<end>로센이 카를라 덕분에 해방됐으니,<line-break>우리도 일이 바빠지겠군.<end>앙길단이 바닷길이 아니라 산을 넘어 로스토르를<line-break>공격할 줄이야. 덕분에 우리 배는 일거리<line-break>하나를 잃어버렸군. 와하하하….<end>이런, 자유도시 리벨담을 이 지경까지<line-break>부숴 놓다니, 카를라도 대단한 여자야.<line-break>덕분에 움직일 수 있는 배는 우리 배뿐이군.<end>이 모양이니 요즘은 로센 쪽이<line-break>더 번화해서 말이야. 우리 배도 좀처럼<line-break>이 항구에 들르지 않게 됐어.<end>네메아가 죽었다는 소문이 도는 모양인데,<line-break>그게 사실이라면 지도자를 잃은 딘갈 제국의<line-break>앞날이 걱정되는군.<end>"

[[message]]
id = "60001"
japanese = "<if><value:$2A><less-equal>%49荷を降ろし終わったら、<line-break>すぐ新しい荷を積まなきゃいけねえ。<line-break>まったく休みぐらいくれっていうんだよなあ。<end><if><value:$2A><less-equal>%100船と海がある限り、仕事はなくならねえ。<line-break>あ～あ、休みが欲しいよなあ。<end><if><value:$2A><less-equal>%150あんた、<value:$28>だろ？<line-break>けっこうな有名人みたいだな。<line-break>おいらも名前は知っているぜ。<end>よっ！　<value:$2B>。<line-break>ロストールに行くことがあったら、<line-break>うちのおっかさんによろしく伝えといてくれ。<end>"
korean = "<if><value:$2A><less-equal>%49짐을 다 내리고 나면,<line-break>곧바로 새 짐을 실어야 해.<line-break>정말이지, 좀 쉬게라도 해 달라고.<end><if><value:$2A><less-equal>%100배와 바다가 있는 한 일은 끊이지 않아.<line-break>아~아, 좀 쉬고 싶다.<end><if><value:$2A><less-equal>%150당신, <value:$28> 맞지?<line-break>꽤 유명한 사람인가 보더군.<line-break>나도 이름은 알고 있어.<end>여어! <value:$2B>.<line-break>로스토르에 갈 일이 있으면,<line-break>우리 어머니께 안부 좀 전해 줘.<end>"

[[message]]
id = "60002"
japanese = "<select><value:$20>%3しっかしロセン行きの船には　　　　<line-break>乗りたくないもんだぜ。<line-break><line-break>竜王の島沿岸を通るたびに<line-break>すさまじい鬼気を感じて、<line-break>さすがの俺も鳥肌がたっちまうんだ。<end>船旅でモンスターに襲われたら<line-break>逃げることは絶対にできない。<line-break>すべてのモンスターを倒すしかないのだ。<end>船旅は陸路を進むより早く目的地に<line-break>着けるが金がかかるぞ。<end>"
korean = "<select><value:$20>%3그래도 로센행 배에는<line-break>타고 싶지 않단 말이지.<line-break><line-break>용왕의 섬 연안을 지날 때마다<line-break>엄청난 살기가 느껴져서,<line-break>나조차 소름이 돋는다니까.<end>배를 타다 몬스터에게 습격당하면<line-break>절대로 도망칠 수 없다.<line-break>모든 몬스터를 쓰러뜨릴 수밖에 없어.<end>배는 육로보다 빨리 목적지에<line-break>도착할 수 있지만 돈이 든다.<end>"

[[message]]
id = "60003"
japanese = "<if><value:$2C><less-equal>%9剣聖レーグのような強い用心棒が<line-break>一緒に乗ってくれたなら、<line-break>安心して船旅を楽しめるのだが…。<end><if><value:$2C><less-equal>%29剣聖レーグは、自分を超える戦士を求めている。<line-break>お主ではまだ力不足だが、ネメアやゼネテスなら<line-break>彼の期待に応えられるかもしれぬな。<end><if><value:$2C><less-equal>%49大陸の西に、闇の門の島と呼ばれる<line-break>不気味な島があり、その島の中心には<line-break>異界への入り口があるそうだ。<end>大陸の西にあるしぶきの群島に、<line-break>人の精神を食らって大きくなる化け物が<line-break>いるという話だ。お主なら勝てるかもしれぬな。<end>"
korean = "<if><value:$2C><less-equal>%9검성 레그처럼 강한 호위가<line-break>함께 타 준다면,<line-break>안심하고 뱃길을 즐길 수 있을 텐데….<end><if><value:$2C><less-equal>%29검성 레그는 자신을 뛰어넘을 전사를 찾고 있다.<line-break>자네는 아직 역부족이지만, 네메아나 제네테스라면<line-break>그의 기대에 부응할지도 모르겠군.<end><if><value:$2C><less-equal>%49대륙 서쪽에는 어둠의 문 섬이라 불리는<line-break>기분 나쁜 섬이 있고, 그 섬 중심에는<line-break>이계로 통하는 입구가 있다더군.<end>대륙 서쪽 물보라 군도에는,<line-break>사람의 정신을 먹고 커지는 괴물이<line-break>있다는군. 자네라면 이길지도 모르겠어.<end>"

[[message]]
id = "60004"
japanese = "<select><value:$33>無事に荷が届いて、ほっとひと安心だのう。<line-break>わしは気が弱いから、<line-break>無事に荷が届くまで心配で心配で…。<end>無事に荷が届いて、ほっとひと安心だのう。<line-break>わしは気が弱いから、<line-break>無事に荷が届くまで心配で心配で…。<end>アンティノ様の命令で戦闘用モンスターや<line-break>武器をロセンに送るときは心が痛むのだよ。<line-break>わしもペウダ王の非道は知っておるのでのう。<end>ロセンが解放されて、今度は復興のために<line-break>必要な物資を送ることになったのだ。<line-break>これで少しはよいことをした気になれるのう。<end>ロセンはどんどん復興して立派になっておる。<line-break>わしも仕事のしがいがあるのだけれど、<line-break>解放軍に狙われるのはイヤだのう。<end>いつの時代でも権力者に従わなかった<line-break>自由都市リベルダムが、アンティノの裏切りで<line-break>めちゃくちゃになってしもうた…ぐすっ。<end>フゴー殿がここを捨ててロセンに引っ越して<line-break>しまったので、もうここの復興は無理だのう。<line-break>わしはどうするかのう…。<end>今ではロセンが大陸一の商業都市で<line-break>リベルダム名物の闘技場も移ってしもうた。<line-break>もう、ここには何もないんじゃ…。<end>"
korean = "<select><value:$33>짐이 무사히 도착해서 한시름 놓았구먼.<line-break>내가 워낙 겁이 많아서,<line-break>짐이 무사히 닿을 때까지 걱정돼서 원….<end>짐이 무사히 도착해서 한시름 놓았구먼.<line-break>내가 워낙 겁이 많아서,<line-break>짐이 무사히 닿을 때까지 걱정돼서 원….<end>안티노 님 명령으로 전투용 몬스터와<line-break>무기를 로센에 보낼 때는 마음이 아팠다네.<line-break>나도 페우다 왕의 악행은 알고 있었으니 말일세.<end>로센이 해방되어 이번에는 재건에<line-break>필요한 물자를 보내게 되었네.<line-break>이제야 조금은 좋은 일을 하는 기분이 드는구먼.<end>로센은 나날이 재건되어 훌륭해지고 있네.<line-break>나도 일할 맛은 나지만,<line-break>해방군에게 노려지는 건 싫구먼.<end>어느 시대에도 권력자에게 굴하지 않았던<line-break>자유도시 리벨담이 안티노의 배신으로<line-break>엉망이 되어 버렸구먼… 훌쩍.<end>후고 님이 이곳을 버리고 로센으로 이사해<line-break>버렸으니, 이제 여길 재건하기는 어렵겠구먼.<line-break>나는 어찌해야 할지….<end>이제는 로센이 대륙 제일의 상업도시가 되고<line-break>리벨담 명물인 투기장마저 옮겨 갔네.<line-break>이곳에는 이제 아무것도 없어….<end>"

[[message]]
id = "60005"
japanese = "<if><value:$2C><less-equal>%9竜骨の砂漠には、砂漠の民が住んでいる<line-break>という噂があるのだが本当だろうか。<line-break>水のない砂漠で生きていくことなど不可能だろ？<end><if><value:$2C><less-equal>%29竜骨の砂漠には、古代ラドラスの遺跡が<line-break>眠っているという話を聞いたのだ。<line-break>砂漠の民と関係があるのだろうか？<end><if><value:$2C><less-equal>%49竜骨の砂漠に眠る古代ラドラスの遺跡は、<line-break>空中都市と呼ばれる、その名の通り<line-break>空に浮かぶ都市だということだ。<end>竜骨の砂漠に眠る空中都市には、<line-break>地の精霊神の座所があるというのだ。<line-break>私には確かめようがないが、興味深い話だな。<end>"
korean = "<if><value:$2C><less-equal>%9용골 사막에는 사막의 민족이 살고 있다는<line-break>소문이 있는데 정말일까?<line-break>물도 없는 사막에서 산다는 건 불가능하잖아?<end><if><value:$2C><less-equal>%29용골 사막에는 고대 라드라스의 유적이<line-break>잠들어 있다는 이야기를 들었어.<line-break>사막의 민족과 관계가 있는 걸까?<end><if><value:$2C><less-equal>%49용골 사막에 잠든 고대 라드라스의 유적은<line-break>공중도시라 불리며, 이름 그대로<line-break>하늘에 떠 있는 도시라더군.<end>용골 사막에 잠든 공중도시에는<line-break>땅의 정령신이 머무는 곳이 있다더군.<line-break>내가 확인할 길은 없지만 흥미로운 이야기야.<end>"
