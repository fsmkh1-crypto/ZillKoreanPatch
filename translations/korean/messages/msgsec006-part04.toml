["60012"]
japanese = "<select><value:$33>リベルダムで一番の金持ちはフゴーだけど、　<line-break>実際にリベルダムを動かしているのは、<line-break>ロティとアンティノの２人だよ。<line-break>くれぐれも、あの２人には気をつけるんだよ。<line-break>笑って人を刺せるやつらだからねえ。<end>リベルダムで一番の金持ちはフゴーだけど、　<line-break>実際にリベルダムを動かしているのは、<line-break>ロティとアンティノの２人だよ。<line-break>くれぐれも、あの２人には気をつけるんだよ。<line-break>笑って人を刺せるやつらだからねえ。<end>ロティとアンティノはエリスと手を結んで、<line-break>ロセンのペウダを操っているのさ。<line-break>おかげでロセンはひどい有様だよ。<end>ロティはロセン王家の復活を目論む<line-break>解放軍の指導者だって話だよ。<line-break>カルラには気にくわない存在だろうね。<end>解放軍はロセン王家復興の旗頭に<line-break>クリュセイスをたてるみたいだよ。<line-break>あの娘の母親はロセン王家の出身だからね。<end>何の恨みがあって、こんな破壊をするのかね。<line-break>ディンガルにとって、ここはそんなに目障り<line-break>だったのかい？<end>カルラはロセンを新しいリベルダムに<line-break>するために、ここを破壊したんだよ。<line-break>この町はもうおしまいだよ。<end>ネメアが死んでディンガルもお終いだよ。<line-break>もう世の中なんて何もかもお終いなのさ。<line-break>世界は滅んじゃうんだよ。<end>"
korean = "<select><value:$33>리벨덤에서 가장 부자는 휴고지만, 실제로 리벨덤을 움직이는 건 로티와 안티노 두 사람이야. 그 둘은 정말 조심해야 해. 웃으면서도 사람을 찌를 수 있는 놈들이니까.<end>리벨덤에서 가장 부자는 휴고지만, 실제로 리벨덤을 움직이는 건 로티와 안티노 두 사람이야. 그 둘은 정말 조심해야 해. 웃으면서도 사람을 찌를 수 있는 놈들이니까.<end>로티와 안티노는 에리스와 손을 잡고, 로센의 페우다를 조종하고 있어. 덕분에 로센은 엉망이 됐지.<end>로티는 로센 왕가의 부활을 꾀하는 해방군의 지도자라더군. 카를라 눈에는 영 거슬리는 존재겠지.<end>해방군은 로센 왕가 재건의 기치로 크류세이스를 내세우려는 모양이야. 그 애 어머니가 로센 왕가 출신이니까.<end>무슨 원한이 있어서 이런 파괴를 하는 걸까. 딘갈에게 이곳이 그렇게까지 눈엣가시였던 건가?<end>카를라는 로센을 새로운 리벨덤으로 만들려고 이곳을 파괴한 거야. 이 도시는 이제 끝장이야.<end>네메아가 죽었으니 딘갈도 끝이군. 세상도 이제 전부 끝장이야. 세계는 멸망할 거라고.<end>"
