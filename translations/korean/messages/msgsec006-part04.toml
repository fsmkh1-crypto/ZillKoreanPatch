["60011"]
japanese = "<select><value:$33>ロストールでは貴族や王族の間で<line-break>醜い権力闘争が繰り広げられているって<line-break>いうじゃないか。<line-break>国民はえらく迷惑しているだろうねえ。<line-break>私はリベルダムの人間でよかったよ。<end>ロストールでは貴族や王族の間で<line-break>醜い権力闘争が繰り広げられているって<line-break>いうじゃないか。<line-break>国民はえらく迷惑しているだろうねえ。<line-break>私はリベルダムの人間でよかったよ。<end>ペウダがディンガルに攻め込んで国境沿いの<line-break>村々を焼き払うという事件があったのだが、<line-break>あれはエリスが裏で操っていたという噂だよ。<end>カルラの命令でロセン王家の人間は、<line-break>子供もまでも処刑されたそうだね。<line-break>王家に生まれたばっかりに哀れだよ。<end>アンギルダンを破ったゼネテスは、<line-break>エリス王妃の甥だということだよ。<line-break>反エリス派の貴族は不満だろうね。<end>ああ…カルラに何もかも破壊されたこの町で、<line-break>これからどうやって生きていこう。<line-break>娘には苦労させたくないが…。<end>こんなになっても、生まれ育った場所を<line-break>捨てる気になれない…。<line-break>君のように生きることはできないよ。<end>救世主エルファス様の言葉を信じて、<line-break>真の神に祈りを捧げるよ。<line-break>娘のためにもね。<end>"
korean = "<select><value:$33>로스토르에서는 귀족과 왕족 사이에<line-break>추악한 권력 다툼이 벌어지고 있다지.<line-break>백성들은 정말 민폐겠군.<line-break>나는 리벨담 사람이라 다행이야.<end>로스토르에서는 귀족과 왕족 사이에<line-break>추악한 권력 다툼이 벌어지고 있다지.<line-break>백성들은 정말 민폐겠군.<line-break>나는 리벨담 사람이라 다행이야.<end>페우다가 딘갈을 침공해 국경의<line-break>마을들을 불태운 사건이 있었는데,<line-break>그건 엘리스가 뒤에서 조종했다는 소문이야.<end>카를라의 명령으로 로센 왕가 사람들은<line-break>아이들까지 처형됐다더군.<line-break>왕가에 태어났다는 이유만으로 불쌍하지.<end>앙길단을 꺾은 제네테스는<line-break>엘리스 왕비의 조카라더군.<line-break>반엘리스파 귀족들은 불만이겠어.<end>아아… 카를라에게 모든 걸 파괴당한 이 마을에서<line-break>이제 어떻게 살아가야 할까.<line-break>딸에게 고생은 시키고 싶지 않은데….<end>이 지경이 되어도 태어나 자란 곳을<line-break>버릴 마음이 안 생기는군….<line-break>난 자네처럼 살 수는 없어.<end>구세주 엘파스 님의 말씀을 믿고,<line-break>참된 신께 기도를 올리겠어.<line-break>딸을 위해서라도.<end>"

["60012"]
japanese = "<select><value:$33>リベルダムで一番の金持ちはフゴーだけど、　<line-break>実際にリベルダムを動かしているのは、<line-break>ロティとアンティノの２人だよ。<line-break>くれぐれも、あの２人には気をつけるんだよ。<line-break>笑って人を刺せるやつらだからねえ。<end>リベルダムで一番の金持ちはフゴーだけど、　<line-break>実際にリベルダムを動かしているのは、<line-break>ロティとアンティノの２人だよ。<line-break>くれぐれも、あの２人には気をつけるんだよ。<line-break>笑って人を刺せるやつらだからねえ。<end>ロティとアンティノはエリスと手を結んで、<line-break>ロセンのペウダを操っているのさ。<line-break>おかげでロセンはひどい有様だよ。<end>ロティはロセン王家の復活を目論む<line-break>解放軍の指導者だって話だよ。<line-break>カルラには気にくわない存在だろうね。<end>解放軍はロセン王家復興の旗頭に<line-break>クリュセイスをたてるみたいだよ。<line-break>あの娘の母親はロセン王家の出身だからね。<end>何の恨みがあって、こんな破壊をするのかね。<line-break>ディンガルにとって、ここはそんなに目障り<line-break>だったのかい？<end>カルラはロセンを新しいリベルダムに<line-break>するために、ここを破壊したんだよ。<line-break>この町はもうおしまいだよ。<end>ネメアが死んでディンガルもお終いだよ。<line-break>もう世の中なんて何もかもお終いなのさ。<line-break>世界は滅んじゃうんだよ。<end>"
korean = "<select><value:$33>리벨담에서 가장 부자는 후고지만,<line-break>실제로 리벨담을 움직이는 건<line-break>로티와 안티노 두 사람이야.<line-break>그 둘은 정말 조심해야 해.<line-break>웃으면서도 사람을 찌를 수 있는 놈들이니까.<end>리벨담에서 가장 부자는 후고지만,<line-break>실제로 리벨담을 움직이는 건<line-break>로티와 안티노 두 사람이야.<line-break>그 둘은 정말 조심해야 해.<line-break>웃으면서도 사람을 찌를 수 있는 놈들이니까.<end>로티와 안티노는 엘리스와 손을 잡고,<line-break>로센의 페우다를 조종하고 있어.<line-break>덕분에 로센은 엉망이 됐지.<end>로티는 로센 왕가의 부활을 꾀하는<line-break>해방군의 지도자라더군.<line-break>카를라 눈에는 영 거슬리는 존재겠지.<end>해방군은 로센 왕가 재건의 기치로<line-break>크리세이스를 내세우려는 모양이야.<line-break>그 애 어머니가 로센 왕가 출신이니까.<end>무슨 원한이 있어서 이런 파괴를 하는 걸까.<line-break>딘갈에게 이곳이 그렇게까지<line-break>눈엣가시였던 건가?<end>카를라는 로센을 새로운 리벨담으로<line-break>만들려고 이곳을 파괴한 거야.<line-break>이 도시는 이제 끝장이야.<end>네메아가 죽었으니 딘갈도 끝이군.<line-break>세상도 이제 전부 끝장이야.<line-break>세계는 멸망할 거라고.<end>"

