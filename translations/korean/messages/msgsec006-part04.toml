japanese = "<if><value:$2C><less-equal>%9禁呪を知っているかしら？　<line-break>展示してある古代魔道王国時代の品に<line-break>ヒントがあるかもと思って来たのだけれど…。<line-break>精霊神に関係があるのは確かね。<line-break>もうちょっと調べてみようかしら。<end><if><value:$2C><less-equal>%29禁呪は全部で６個あるみたいね。<line-break>どれもこれも強力な呪文だから、制御するには<line-break>高い精霊力レベルが必要だわ。<end>火、水、土、風の属性を持った禁呪は、<line-break>各属性の精霊神が守っていることがわかったの。<line-break>でも、精霊神に会うことが問題よね。<end>"
