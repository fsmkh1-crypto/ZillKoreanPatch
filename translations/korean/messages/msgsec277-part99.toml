["2770001"]
japanese = "教えて、ジリオン…。<line-break>あたしはどうすればいいの？<end>"
korean = "가르쳐 줘, 질리온…. 난 어떻게 해야 해?<end>"

["2770002"]
japanese = "あたしはこれまでずっと<line-break>陰謀と裏切りの世界に生きてきたわ。<line-break>　<line-break>あたしがテジャワの変に加担したから、<line-break>多くの人が死に、そして…。<line-break>アトレイア様の目は光を失った。<line-break>あたしはいろんな人を不幸にしてきたのよ。<line-break>　<line-break>　<line-break>そんなあたしに<value:$28>から<line-break>愛される資格なんて…。<end>"
korean = "난 지금까지 줄곧 음모와 배신의 세계에서 살아왔어. 내가 테자와의 변에 가담해서 많은 사람이 죽었고, 그리고…. 아트레이아 님의 눈은 빛을 잃었어. 난 여러 사람을 불행하게 만들었어. 그런 내가 <value:$28>에게 사랑받을 자격이 있을 리가….<end>"

["2770003"]
japanese = "　　　　愛に資格なんて必要ない。<line-break>　　　もう自分を責めるのはよせ。<line-break>　　自分を許し、過去を忘れるんだ。<end>"
korean = "사랑에 자격 같은 건 필요 없어. 이제 자신을 탓하는 건 그만둬. 자신을 용서하고 과거를 잊는 거야.<end>"

["2770004"]
japanese = "でも、あたしのせいであなたが…。<end>"
korean = "하지만 나 때문에 당신이….<end>"

["2770005"]
japanese = "　　これは俺自身が選んだ道だ。<line-break>　　　他の誰にも責任はない。<end>"
korean = "이건 내가 직접 선택한 길이다. 누구에게도 책임은 없어.<end>"

["2770006"]
japanese = "ジリオン…。<end>"
korean = "질리온….<end>"

["2770007"]
japanese = "　　　お前は俺のために充分、頑張った。<line-break>　　　これからはお前自身の幸せのために<line-break>　　　　　　　　　生きろ。<line-break>　<line-break>　<line-break>　　　　大丈夫。<value:$28>なら<line-break>　　　　きっとお前を支えてくれる。<end>"
korean = "넌 나를 위해 충분히 애썼다. 이제부터는 네 자신의 행복을 위해 살아라. 괜찮아. <value:$28>라면 분명 널 지탱해 줄 거야.<end>"

["2770009"]
japanese = "本当にあたしがついていってもいいの？<line-break>あたしには消せない過去がある。<line-break>決して償いきれない罪がある。<end>"
korean = "정말 내가 따라가도 괜찮아? 나에겐 지울 수 없는 과거가 있어. 결코 다 갚을 수 없는 죄가 있어.<end>"

["2770010"]
