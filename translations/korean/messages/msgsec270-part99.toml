["2700001"]
japanese = "それはそうと、お主。<line-break>イーシャという娘を知らんかね？<line-break>　<line-break>そうだな。歳は２０歳前後。<line-break>髪は茶色で、可愛い顔をしているが、<line-break>短剣やナイフの扱いが得意でな。<end>"
korean = "그건 그렇고 자네. 이샤라는 아가씨를 모르나? 그렇군. 나이는 스무 살 전후. 갈색 머리에 귀여운 얼굴이지만 단검이나 나이프를 잘 다루지.<end>"

["2700002"]
japanese = "そうか。知らぬか。<end>"
korean = "그런가. 모르는가.<end>"

["2700003"]
japanese = "いや、なに。<line-break>そのイーシャが最近、天経院の周りで<line-break>ダークエルフと一緒にいたと聞いてな。<line-break>ダークエルフには<line-break>善悪の区別なく、殺して回る<line-break>物騒な奴もいる。<line-break>イーシャがそんな奴と<line-break>関わりになっているとは思えんが<line-break>ちと心配になってな。<end>"
korean = "아니, 별건 아니네. 그 이샤가 최근 천경원 주변에서 다크엘프와 함께 있었다고 들어서 말일세. 다크엘프 중에는 선악을 가리지 않고 마구 죽이고 다니는 위험한 자도 있지. 이샤가 그런 자와 엮였으리라 생각하진 않지만 조금 걱정이 되어서 말이야.<end>"

["2700004"]
japanese = "わしにも経験があるが<line-break>若いころは危険をかえりみずに<line-break>無茶をすることもあるからな。<line-break>何事もなければよいが…。<end>"
korean = "나도 경험이 있지만 젊을 때는 위험도 아랑곳하지 않고 무리하기도 하지. 아무 일 없으면 좋겠군….<end>"

