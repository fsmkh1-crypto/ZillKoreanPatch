["90005"]
japanese = "<if><value:$2C><less-equal>%9鳳凰山に住んでいるというフェニックスを　<line-break>ひとめ見ようと、命知らずの冒険者が<line-break>挑戦しているが、今だ成功した者はおらん。<line-break>わしも挑戦したんだが、モンスターが強くて<line-break>危うくドワーフの丸焼きになるところ<line-break>だったわい。<end><if><value:$2C><less-equal>%29鳳凰山のモンスターは、フェニックスが住む<line-break>という山頂に近づくほど強くなるようだわい。<line-break>お主も無理をして深入りせんようにな。<end><if><value:$2C><less-equal>%49お主ならフェニックスと戦っても<line-break>大丈夫かもしれんな。<line-break>わしなどより、よっぽど強いわい。<end>お主ほどの強者になると自分より強い相手が<line-break>おらんでさびしいじゃろう。<line-break>竜王に挑んでみるのはどうじゃ？<end>"
korean = "<if><value:$2C><less-equal>%9봉황산에 산다는 피닉스를 한 번 보겠다고 목숨 아까운 줄 모르는 모험자들이 도전하지만 아직 성공한 자는 없네. 나도 도전해 봤는데 몬스터가 너무 강해서 하마터면 드워프 통구이가 될 뻔했지.<end><if><value:$2C><less-equal>%29봉황산의 몬스터는 피닉스가 산다는 정상에 가까워질수록 강해지는 모양이네. 자네도 무리해서 깊이 들어가진 말게.<end><if><value:$2C><less-equal>%49자네라면 피닉스와 싸워도 괜찮을지 모르겠군. 나보다 훨씬 강하니까.<end>자네 정도의 강자가 되면 자기보다 강한 상대가 없어서 쓸쓸하겠지. 용왕에게 도전해 보는 건 어떤가?<end>"

["90006"]
japanese = "<if><value:$2A><less-equal>%49勇者ネメアって知ってるか？　　<line-break>魔王バロルを倒して世界を救った<line-break>英雄なんだぜ。<line-break>俺もあの人みたいになりたくて<line-break>冒険者をやってるんだ。<line-break>なかなか有名になれないけどな。<end><if><value:$2A><less-equal>%120最近、<value:$28>って名の<line-break>冒険者が活躍しているらしいな。<line-break>俺も負けてられねえぜ。<end><value:$28>は化け物かっ！<line-break>どうやったらこんな短期間で<line-break>大陸中に名前が知れ渡るんだ！？<end>"
