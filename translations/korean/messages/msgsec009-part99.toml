["90007"]
japanese = "<select><value:$20>%2元々ウルカーンは古代魔道王国ラドラスの　　　<line-break>火の巫女ウルと、魔法文明を捨てるという<line-break>彼女の意志に賛同した者たちが造ったのじゃ。<line-break>じゃが長い年月が経って、マグマゴーレム<line-break>を研究して魔法文明をよみがえらせようとする<line-break>魔道士たちが集う都市になってしまったのじゃ。<end>火の巫女フレア様の世話はシェムハザ殿が　　<line-break>しておるんじゃ。そのせいかフレア様のお姿を<line-break>ここ２０年くらい見てない気がするのう。<line-break>しかし、わしが若いころから火の巫女はフレア様<line-break>じゃったが、もうかなりのお年じゃろう、<line-break>いつ代替わりするのかのう。<end>"
korean = "<select><value:$20>%2원래 울칸은 고대 마도왕국 라드라스의 불의 무녀 우르와 마법문명을 버리자는 그녀의 뜻에 동의한 이들이 만든 곳이네. 하지만 긴 세월이 흐르면서 마그마 골렘을 연구해 마법문명을 되살리려는 마도사들이 모이는 도시가 되고 말았지.<end>불의 무녀 플레어 님의 시중은 셰므하자 공이 들고 있네. 그래서인지 플레어 님 모습을 20년쯤 못 본 것 같군. 하지만 내가 젊을 때부터 불의 무녀는 플레어 님이었으니 이제 꽤 연세가 드셨을 텐데, 언제 대가 바뀌려나.<end>"

["90008"]
japanese = "<select><value:$20>%3火の巫女ウルの血をひくフレア様が<line-break>火の神殿で祈ってくださるから、<line-break>わしらは安心して暮らせるんじゃよ。<end>長老のシェムハザ殿はコーンス族でな、<line-break>額に角が生えておる。<line-break>あれが魔力の源なのじゃ。<end>ウルカーンのことは長老のシェムハザ殿が<line-break>すべてしきっておる。おかげで研究に没頭できる<line-break>からありがたいことじゃ。<end>"
