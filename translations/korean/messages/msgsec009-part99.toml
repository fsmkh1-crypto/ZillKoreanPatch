["90009"]
japanese = "<if><value:$2A><less-equal>%49かつて魔道王国ラドラスには砂漠や極寒の地など<line-break>人間が生きていけないような場所で快適に暮らす<line-break>ための魔法技術があったそうです。<line-break>その魔法技術を蘇らせることができれば<line-break>竜骨の砂漠のような灼熱の地でも快適に<line-break>暮らせるのですが…。<end><if><value:$2A><less-equal>%100この地の守護者マグマゴーレムも、　　　　　　<line-break>失われた魔法技術によって<line-break>動いているのですよ。<line-break>かつては傭兵がわりに魔道士たちが<line-break>操っていたそうですが、今では操る者も減って<line-break>ただのモンスターになってますけど。<end>私の友人のエストは、闇の神器という道具を<line-break>中心に魔法技術の研究をしているのですよ。<line-break>私たちの研究成果を期待していてください。<end>"
korean = "<if><value:$2A><less-equal>%49옛 마도왕국 라드라스에는 사막이나 극한지처럼 사람이 살 수 없는 곳에서도 쾌적하게 살 수 있게 해 주는 마법 기술이 있었다고 합니다. 그 기술을 되살릴 수 있다면 용골 사막 같은 작열하는 땅에서도 편히 살 수 있을 텐데요…<end><if><value:$2A><less-equal>%100이 땅의 수호자 마그마 골렘도 잃어버린 마법 기술로 움직이는 겁니다. 예전에는 마도사들이 용병 대신 조종했다지만 지금은 다루는 사람도 줄어 그냥 몬스터가 돼 버렸죠.<end>제 친구 에스트는 어둠의 신기라는 도구를 중심으로 마법 기술을 연구하고 있습니다. 저희 연구 성과를 기대해 주세요.<end>"

