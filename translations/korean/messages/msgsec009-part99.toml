japanese = "<select><value:$20>%3ここウルカーンには、失われた魔法文明の　　<line-break>技術をよみがえらせようと多くの魔道士が<line-break>集まっています。<line-break>私も、マグマゴーレムの製法から何か得る物は<line-break>ないかとディンガルからやってきたのですが、<line-break>なかなか思うように研究が進まなくて…。<end>火の属性に強いのは風の属性で、弱いのは　<line-break>水の属性なのです。冒険に行く前に装備品の<line-break>属性を確認しといたほうがいいですよ。<end>冒険者ギルドの裏側から通じている<line-break>道の向こうに行ったことありますか？<line-break>モンスターが強くて私は行けないんです。<line-break>あの道の向こうには、<line-break>いったい何があるんでしょうね？<end>"
korean = "<select><value:$20>%3여기 울칸에는 잃어버린 마법문명의 기술을 되살리려는 마도사들이 많이 모여 있습니다. 저도 마그마 골렘 제조법에서 뭔가 얻을 게 없을까 해서 딩갈에서 왔는데 연구가 뜻대로 되질 않네요….<end>불 속성에 강한 건 바람 속성이고 약한 건 물 속성입니다. 모험을 떠나기 전에 장비의 속성을 확인해 두는 게 좋아요.<end>모험자 길드 뒤편에서 이어지는 길 너머에 가 본 적 있나요? 몬스터가 강해서 저는 못 가겠어요. 그 길 너머에는 대체 뭐가 있을까요?<end>"

["90001"]
japanese = "<if><value:$2C><less-equal>%9あなた、冒険者としては駆け出しみたいね。<line-break>もし炎竜山に登ったことがないなら<line-break>一度登ってみることをすすめるわ。<line-break>あの辺りには火属性のモンスターが多いけど<line-break>それほど強くないから安心していいわよ。<end><if><value:$2C><less-equal>%29炎竜山や鳳凰山のように<line-break>火属性のモンスターが多いところでは、<line-break>風属性の武器が威力を発揮するのよ。<end><if><value:$2C><less-equal>%49この地のどこかに火属性の禁呪が<line-break>封印されているのよ。<line-break>あたしは神殿が怪しいと思うんだけど…。<end>火属性の禁呪は火の精霊神が守っている<line-break>みたいよ。なんとかして封印を解きたいけど<line-break>精霊神が相手じゃねぇ。<end>"
korean = "<if><value:$2C><less-equal>%9당신, 모험자로는 풋내기 같네. 염룡산에 오른 적이 없다면 한 번 올라가 보는 걸 권할게. 그 근처엔 불 속성 몬스터가 많지만 그리 강하지 않으니 안심해도 돼.<end><if><value:$2C><less-equal>%29염룡산이나 봉황산처럼 불 속성 몬스터가 많은 곳에서는 바람 속성 무기가 위력을 발휘해.<end><if><value:$2C><less-equal>%49이 땅 어딘가에 불 속성 금주가 봉인되어 있어. 난 신전이 수상하다고 생각하는데….<end>불 속성 금주는 불의 정령신이 지키는 모양이야. 어떻게든 봉인을 풀고 싶지만 상대가 정령신이라서야.<end>"

["90002"]
japanese = "<select><value:$33>旅立ちの時にここに来ちゃうなんて…。<line-break>もしかしてバグなのかしら？<end>この間、炎竜山が久しぶりに噴火したの。<line-break>竜王の覚醒だって噂されてる例の地震が<line-break>原因なのかしら？<end>勇者ネメアがディンガル帝国の新皇帝ですって。<line-break>前の皇帝は若かったと思うけど、事故か何かで<line-break>死んだのかしら？<end>おとなりのロセンがディンガルに滅ぼされた<line-break>そうよ。ディンガル軍を指揮していたのは、<line-break>若干１６歳の少女なんですって。<end>カルラ将軍の手腕で、ロセンは新しい都市に<line-break>生まれ変わっているそうよ。<line-break>闘技場もできるんですってよ。<end>リベルダムが陥落したせいで、<line-break>大商人たちはロセンへ引っ越したそうよ。<end>ネメアは何が目的で闇の神器を<line-break>集めているのかしら。<line-break>もしかして破壊神の復活？<end>ネメアが行方不明なんですって。<line-break>彼が集めていたという闇の神器は<line-break>どうなったのかしら？<end>"
korean = "<select><value:$33>여행을 떠나는 시점에 여기 와 버리다니… 혹시 버그인가?<end>얼마 전에 염룡산이 오랜만에 분화했어. 용왕의 각성 때문이라는 그 지진이 원인일까?<end>용사 네메아가 딩갈 제국의 새 황제라니. 전 황제는 젊었던 것 같은데 사고라도 당해 죽은 걸까?<end>이웃 로센이 딩갈에게 멸망했다더라. 딩갈군을 지휘한 건 겨우 16살 소녀였대.<end>카를라 장군의 수완으로 로센은 새로운 도시로 다시 태어나고 있대. 투기장도 생긴다더라.<end>리벨덤이 함락된 탓에 거상들은 로센으로 이사했다더라.<end>네메아는 무슨 목적으로 어둠의 신기를 모으는 걸까. 혹시 파괴신 부활?<end>네메아가 행방불명이래. 그가 모았다던 어둠의 신기는 어떻게 된 걸까?<end>"

["90003"]
japanese = "<if><value:$2C><less-equal>%9ここに住んでいると、<line-break>火の精霊力レベルばかりが上がって困るよ。<line-break>水属性の魔法だって使いたいのになあ。<end><if><value:$2C><less-equal>%29この辺りのモンスターは火属性なんだよ。<line-break>だから火属性の魔法は効きやしない。<line-break>風属性の魔法でないとダメなのさ。<end><if><value:$2C><less-equal>%49闇属性の魔法を使えるようになるには、<line-break>ネガヴァニティアのソウルを宿さないと<line-break>ダメなのさ。知っていたかい？<end>バニティスペルを使えない人は、<line-break>闇属性の禁呪の封印を解くことが<line-break>できないそうだよ。<end>"
