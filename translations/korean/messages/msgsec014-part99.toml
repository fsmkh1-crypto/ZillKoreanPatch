korean = "<select><value:$20>%2하늘신 노툰 님, 구해 주소서. 구세주 엘파스 님께서는 곧 파괴신 우르그가 부활한다고 말씀하셨습니다.<end>신이여! 제 기도가 닿았다면 부디 세계를 파멸에서 구해 주소서.<end>"

