japanese = "<select><value:$33>私は水の都アキュリュースの商人です。<line-break>よくテラネまで木材の買い付けに来ております。<line-break>アキュリュースはよい所ですよ。<end>私は水の都アキュリュースの商人です。<line-break>よくテラネまで木材の買い付けに来ております。<line-break>アキュリュースはよい所ですよ。<end>せっかくここまで来ているのだから、<line-break>私もトールへ巡礼に行けばいいのですが…。<line-break>なかなか決心が付かなくて。<end>宿屋のご主人は非常に気のきくかたで<line-break>こうして快適な旅ができるのも、<line-break>ご主人のおかげですよ。<end>宿屋のご主人がよいかたなので、<line-break>ついつい長居をしてしまいます。<line-break>また、ここに来るのが楽しみですよ。<end>宿屋のご主人は、トールへの巡礼客の案内も<line-break>しておられるようです。<line-break>本当に仕事熱心なかたですよ。<end>トールへの巡礼はモンスターや盗賊に<line-break>襲われたりと危険がいっぱいらしいです。<line-break>巡礼客の道案内も大変でしょうな。<end>エルファス様のお話を聞いて、<line-break>私もトールへ行く決心がつきました。<line-break>家族のため世界のために神に祈りを捧げます。<end>"
korean = "<select><value:$33>저는 물의 도시 아큐류스의 상인입니다. 자주 테라네까지 목재를 사러 옵니다. 아큐류스는 좋은 곳이지요.<end>저는 물의 도시 아큐류스의 상인입니다. 자주 테라네까지 목재를 사러 옵니다. 아큐류스는 좋은 곳이지요.<end>여기까지 온 김에 저도 토르로 순례를 가면 좋겠지만…. 좀처럼 결심이 서지 않는군요.<end>여관 주인은 아주 세심한 분이라 이렇게 편안히 여행할 수 있는 것도 그분 덕분입니다.<end>여관 주인이 좋은 분이라 자꾸 오래 머물게 됩니다. 또 여기 오는 게 기대되는군요.<end>여관 주인은 토르 순례객의 안내도 하는 모양입니다. 정말 열심히 일하는 분입니다.<end>토르 순례는 몬스터나 도적에게 습격당하는 등 위험이 많다고 합니다. 순례객 길 안내도 힘들겠지요.<end>엘파스 님의 말씀을 듣고 저도 토르에 갈 결심을 했습니다. 가족과 세계를 위해 신께 기도를 올리겠습니다.<end>"

["140008"]
japanese = "<if><value:$2A><less-equal>%49おうっ若造！　無理するなよ。<line-break>名を売る前に死んでしまっちゃあ<line-break>意味がねえからな。<end><if><value:$2A><less-equal>%100<value:$28>だって？<line-break>聞いたことがあったかもしれんが、<line-break>覚えてないね。<end><if><value:$2A><less-equal>%140なにっ！　あんたが<value:$28>か！<line-break>なるほど…通り名はだてじゃないな。<end><value:$2B>に会ったことがあるか？<line-break>大陸で１、２を争う凄腕の冒険者らしいぞ。<line-break>俺も会ってみたいもんだ。<end>"
