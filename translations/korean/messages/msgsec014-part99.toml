["140008"]
japanese = "<if><value:$2A><less-equal>%49おうっ若造！　無理するなよ。<line-break>名を売る前に死んでしまっちゃあ<line-break>意味がねえからな。<end><if><value:$2A><less-equal>%100<value:$28>だって？<line-break>聞いたことがあったかもしれんが、<line-break>覚えてないね。<end><if><value:$2A><less-equal>%140なにっ！　あんたが<value:$28>か！<line-break>なるほど…通り名はだてじゃないな。<end><value:$2B>に会ったことがあるか？<line-break>大陸で１、２を争う凄腕の冒険者らしいぞ。<line-break>俺も会ってみたいもんだ。<end>"
korean = "<if><value:$2A><less-equal>%49어이, 젊은이! 무리하지 마라. 이름을 알리기도 전에 죽어 버리면 아무 의미 없으니까.<end><if><value:$2A><less-equal>%100<value:$28>라고? 들어 본 적이 있었을지도 모르겠는데 기억은 안 나는군.<end><if><value:$2A><less-equal>%140뭐라고! 네가 <value:$28>인가! 과연… 별명은 허명이 아니군.<end><value:$2B>을 만난 적 있나? 대륙에서 첫째둘째를 다투는 실력자라던데. 나도 한번 만나 보고 싶군.<end>"

["140009"]
japanese = "<select><value:$20>%4腕の立つ冒険者になるには経験を積むことだ。<line-break>経験を積むにはギルドで引き受けた仕事を<line-break>確実にこなしていくことじゃ。<end>ここは冒険者に冷たい町なんじゃ。<line-break>なんでも、町の有力者である<line-break>宿屋の親父が冒険者嫌いらしい…。<end>宝箱を見つけても、むやみに開けぬほうが<line-break>いいぞ。特に難易度の高い罠はのう。<line-break>何事もあせらず、いそがずじゃ。<end>コーンス族の角には魔力が宿っておる。<line-break>それゆえに研究の材料として角を欲しがる<line-break>魔道士と角狩りを行う冒険者が存在するのじゃ。<end>"
korean = "<select><value:$20>%4실력 있는 모험자가 되려면 경험을 쌓아야 하네. 경험을 쌓으려면 길드에서 맡은 일을 확실히 해내야 하지.<end>이곳은 모험자에게 쌀쌀맞은 마을이야. 마을의 유지인 여관 주인이 모험자를 싫어한다더군….<end>보물상자를 찾아도 함부로 열지 않는 게 좋아. 특히 난도가 높은 함정은 말이지. 무슨 일이든 서두르지 않는 게야.<end>코른스족의 뿔에는 마력이 깃들어 있네. 그래서 연구 재료로 뿔을 원하는 마도사와 뿔 사냥을 하는 모험자가 존재하지.<end>"

["140010"]
japanese = "<select><value:$20>%2冒険に出るならケガをしたときのために<line-break>元気の薬くらいは買っておきなさい。<end>道具屋によって売っている商品が違うから、<line-break>どこで何を売っているのかを覚えておいた<line-break>ほうがいいわよ。<end>"
korean = "<select><value:$20>%2모험을 떠날 거라면 다쳤을 때를 대비해 원기의 약 정도는 사 두렴.<end>도구점마다 파는 물건이 다르니까 어디서 무엇을 파는지 기억해 두는 게 좋아.<end>"

["140011"]
japanese = "<if><value:$2C><less-equal>%9武器は重ければ重いほど１回の攻撃で与える<line-break>ダメージが増えるが、動きが鈍くなる。<line-break>武器の形状を変えるときはよく考えることだ。<end><if><value:$2C><less-equal>%29未開の森には行ったか？<line-break>森の先には海賊のアジトがあるという噂を<line-break>聞いたことがある。あくまで噂だがな。<end><if><value:$2C><less-equal>%49しぶきの群島は謎だらけの島だ。<line-break>島に向かって、帰った者はいないという。<end>俺の斧は旅立ったときからずっと使っている。<line-break>鍛えに鍛え上げたので、かなり強いぞ。<line-break>あんたの武器はどうだい？<end>"
korean = "<if><value:$2C><less-equal>%9무기는 무거울수록 한 번의 공격으로 주는 피해가 늘지만 움직임이 둔해진다. 무기 형태를 바꿀 때는 잘 생각해.<end><if><value:$2C><less-equal>%29미개의 숲에는 가 봤나? 숲 너머에 해적의 아지트가 있다는 소문을 들은 적이 있어. 어디까지나 소문이지만.<end><if><value:$2C><less-equal>%49물보라 군도는 수수께끼투성이 섬이야. 섬으로 갔다가 돌아온 자가 없다고 하지.<end>내 도끼는 여행을 떠날 때부터 계속 쓰고 있어. 단련하고 또 단련해서 꽤 강하지. 네 무기는 어때?<end>"

["140012"]
japanese = "<if><value:$23><equal>0何の用だ、<value:$28>。<line-break>お前のようなヤツはここに用事は<line-break>ないはずだ。出ていってくれ<end><select><value:$20>%3何が冒険者だ。定職にもつかずブラブラと…。<line-break>この神聖な場所からとっとと出ていくがよい。<end>ここは毎日を一生懸命に生きている人々が<line-break>神に感謝し、祈りをささげる場所だ。<line-break>冒険者のような無法者が来るところではない。<end>私は、自分の欲望を満たすためなら<line-break>何でもする、お前たち冒険者が大嫌いなのだ。<end>"
korean = "<if><value:$23><equal>0무슨 용건이냐, <value:$28>. 너 같은 녀석이 여기 올 일은 없을 텐데. 나가라.<end><select><value:$20>%3무슨 모험자냐. 정해진 직업도 없이 빈둥거리기나 하고…. 이 신성한 곳에서 당장 나가라.<end>여기는 하루하루 열심히 살아가는 사람들이 신께 감사하고 기도를 올리는 곳이다. 모험자 같은 무법자가 올 곳이 아니야.<end>나는 자기 욕망을 채우기 위해서라면 무슨 짓이든 하는 너희 모험자들이 정말 싫다.<end>"

["140013"]
japanese = "<if><value:$23><equal>0よう、<value:$28>じゃないか。<line-break>君もノトゥーンに祈りをささげに来たのかい？<end><select><value:$20>%3ここの神官と宿屋の親父が町の有力者なんだが<line-break>２人そろって冒険者嫌いでな、<line-break>気に障ることを言うだろうが気にするなよ。<end>宿屋のヴァンのダジャレはひどいもんだよ。<line-break>あれを聞いた瞬間は、すべてが凍る感じだな。<end>霊峰トールは高い山でね、<line-break>頂上は天に届きそうだよ。<end>"
korean = "<if><value:$23><equal>0여어, <value:$28> 아닌가. 너도 노툰께 기도드리러 온 거야?<end><select><value:$20>%3여기 신관과 여관 주인이 마을의 유력자인데 둘 다 모험자를 싫어해. 기분 나쁜 말을 하겠지만 신경 쓰지 마.<end>여관의 반이 하는 말장난은 정말 심해. 듣는 순간 모든 게 얼어붙는 느낌이지.<end>영봉 토르는 높은 산이라 정상은 하늘에 닿을 것 같아.<end>"

["140014"]
