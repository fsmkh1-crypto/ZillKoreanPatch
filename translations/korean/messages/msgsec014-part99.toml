korean = "<select><value:$33>나를 따라잡으면 말이지. 빨리 안 오면 몽땅 먹어 버릴 거야!<end>후후후… 정말 맛있었어.<end>나 하나 따라잡지 못하는 네가 기사가 될 수 있을 리 없잖아!<end>잠깐! 갈드란 같은 변태 못생긴 남자랑 나를 같이 취급하지 마!<end>기사가 되고 싶으면 따라잡아 봐! 못 하면 흠씬 두들겨 줄 거야~.<end>네가 훌륭한 기사가 되길 바라니까 이렇게 엄하게 수련시키는 거야. 사실은 마음 아프다고… 훌쩍.<end>딸기 한두 개 가지고 시끄럽네. 나를 따라잡으면 준다고 했잖아!<end>복수 같은 건 하나도 안 무서워. 네가 기사가 될 즈음엔 나는 여왕님이 돼 있을 거니까.<end>"

["140002"]
japanese = "<if><value:$23><equal>0ああ、<value:$28>か…。<end><select><value:$20>%4材木が欲しいならボンガの所かな。<line-break>酒場の横の道を行けば小屋があるから<line-break>訪ねてみなよ。<end>宿屋の親父が冒険者嫌いなのもわかるぜ。<line-break>冒険者は無法者だから、巡礼客と一緒の宿に<line-break>泊めると何をしでかすか、わからないだろ。<end>宿屋の親父は宿泊客の面倒をよく見てるよ。<line-break>霊峰トールへの道案内とか大変だろうにな。<end>不良息子のヴァンが問題ばかり起こすから<line-break>宿屋の親父も苦労が絶えないな。<line-break>他人ごとながら同情するよ。<end>"
korean = "<if><value:$23><equal>0아, <value:$28>인가….<end><select><value:$20>%4목재가 필요하면 봉가에게 가 봐. 술집 옆길로 가면 오두막이 있으니 찾아가 봐.<end>여관 주인이 모험자를 싫어하는 것도 이해돼. 모험자는 무법자니까 순례객과 같은 숙소에 묵게 했다가 무슨 일을 벌일지 모르잖아.<end>여관 주인은 투숙객을 잘 챙겨 줘. 영봉 토르로 가는 길 안내 같은 것도 힘들 텐데 말이야.<end>불량 아들 반이 자꾸 문제를 일으켜서 여관 주인도 고생이 끊이지 않겠군. 남의 일이지만 동정이 가.<end>"

["140003"]
japanese = "<if><value:$23><equal>0おや、<value:$28>かい。<end><select><value:$33>この町の近くには霊峰トールがあるからねえ。<line-break>ここはトールへの巡礼者でにぎわってるのさ。<end>この町の近くには霊峰トールがあるからねえ。<line-break>ここはトールへの巡礼者でにぎわってるのさ。<end>トールの頂上には巨大な神殿があってね。<line-break>巡礼者は、そこで神に祈りをささげるのさ。<end>悪名高いロセンが滅ぼされたそうだね。<line-break>さすがはディンガル軍だよ。<end>ロストールとディンガルが<line-break>戦争しているおかげで、ロストールからの<line-break>巡礼者が減ってきているね。<end>なんでもリベルダムはカルラ将軍に、<line-break>破壊されて、ガレキの山になったって<line-break>言うじゃないか。<line-break>恐ろしいことだよねえ…。<end>最近戦争のおかげで世間は大混乱だろ。<line-break>だから神にすがりたい人が多いんだろうね。<line-break>巡礼者の数が増えたような気がするよ。<end>エルファス様のおっしゃるように世界は<line-break>滅んでしまうんだろうか。<line-break>ああ神よ、哀れな人間をお救いください…。<end>"
korean = "<if><value:$23><equal>0어머, <value:$28> 아니니.<end><select><value:$33>이 마을 근처에는 영봉 토르가 있어서 토르로 가는 순례자들로 붐벼.<end>이 마을 근처에는 영봉 토르가 있어서 토르로 가는 순례자들로 붐벼.<end>토르 정상에는 거대한 신전이 있고 순례자들은 거기서 신께 기도를 올리지.<end>악명 높은 로센이 멸망했다더라. 역시 딩갈군이야.<end>로스토올과 딩갈이 전쟁 중이라 로스토올에서 오는 순례자가 줄고 있어.<end>리벨덤은 카를라 장군에게 파괴돼 잔해 더미가 됐다잖아. 무서운 일이야…<end>요즘 전쟁 때문에 세상이 대혼란이잖아. 그래서 신에게 의지하고 싶은 사람이 많은가 봐. 순례자가 늘어난 것 같아.<end>엘파스 님 말씀처럼 세계는 멸망하는 걸까. 아아 신이시여, 불쌍한 인간들을 구해 주소서…<end>"

