["100002"]
japanese = "<select><value:$33>あなたの旅立ちはまだ途中でしょ。<line-break>どうしてここにいるの？<end>アキュリュースは水も豊富で景色も美しくて<line-break>ほんとうによい所だわ。<line-break>他国の軍隊もミズチを恐れて攻めてこないしね。<end>エルフって男も女もきれいな顔をしてるのね。<line-break>ああやって景色を見てる姿なんてステキねぇ。<end>あのエルフの男性に話しかけられると<line-break>胸がドキドキしちゃうの…<line-break>これって恋かも！？<end>愛があれば歳の差なんて…<line-break>とは言うけど５００歳も離れていると<line-break>困っちゃうのよねぇ。<end>えっ！　リベルダムがカルラに攻められて<line-break>陥落したって？　そう…あたしの恋も<line-break>陥落寸前よ。<end>いいの…。<line-break>こうして姿を見ていられるだけで。<line-break>だって彼、森に妻と子どもがいるんだもん。<end>いいの…。<line-break>こうして姿を見ていられるだけで。<line-break>だって彼、森に妻と子どもがいるんだもん。<end>"
korean = "<select><value:$33>네 여행 출발은 아직 도중이잖아. 왜 여기 있어?<end>아큐류스는 물도 풍부하고 경치도 아름다워서 정말 좋은 곳이야. 다른 나라 군대도 미즈치를 두려워해 쳐들어오지 않고.<end>엘프는 남자도 여자도 얼굴이 예쁘구나. 저렇게 경치를 바라보는 모습도 멋져.<end>저 엘프 남자가 말을 걸면 가슴이 두근거려… 이거 사랑일지도!?<end>사랑이 있으면 나이 차이쯤은… 이라고 하지만 500살이나 차이가 나면 곤란하네.<end>뭐! 리벨덤이 카를라에게 공격받아 함락됐다고? 그래… 내 사랑도 함락 직전이야.<end>괜찮아… 이렇게 모습만 볼 수 있어도. 그 사람, 숲에 아내와 아이가 있거든.<end>괜찮아… 이렇게 모습만 볼 수 있어도. 그 사람, 숲에 아내와 아이가 있거든.<end>"

["100003"]
japanese = "<select><value:$20>%3ここ水の都アキュリュースは<line-break>古代魔道王国ラドラスの水の巫女ネイが<line-break>５世紀に造った町なんじゃよ。<end>今でもネイの血をひく女性が水の巫女として<line-break>代々、水の精霊神に仕えておるんじゃ。<line-break>そういえば、今の水の巫女は誰じゃったかな。<end>こうして美しく咲いた花を愛でたり、<line-break>水の流れを耳で感じておる時が、<line-break>わしの至福の一時なんじゃよ。<end>"
korean = "<select><value:$20>%3이 물의 도시 아큐류스는 고대 마도왕국 라드라스의 물의 무녀 네이가 5세기에 만든 도시라네.<end>지금도 네이의 피를 이은 여성이 대대로 물의 무녀가 되어 물의 정령신을 섬기고 있지. 그러고 보니 지금 물의 무녀가 누구였더라.<end>이렇게 아름답게 핀 꽃을 감상하거나 물 흐르는 소리를 듣고 있을 때가 내게는 가장 행복한 시간이라네.<end>"

["100005"]
japanese = "<select><value:$33>おやまあ、どうしてここにいるのかい？<end>アキュリュースはミズチたちが守っているから、<line-break>どこの国の王様も攻めてこれないのさ。<line-break><line-break>どんな強い軍隊も水の中じゃ<line-break>ミズチたちにかなうわけないだろうからね。<end>東のディンガルでは勇者ネメアが<line-break>前の皇帝を倒して即位したそうだよ。<line-break>詳しい事情は知らないけど恐ろしい話だね。<end>ネメアは本気で世界を<line-break>自分の物にするつもりなんだね。<line-break>だったらここにも攻めてくるのかね。<end>ロストールの王宮じゃディンガルが<line-break>攻めてくるって大騒ぎだっただろうよ。<line-break>エリス以外は能なしだからね。<end>リベルダムのように破壊されたら、<line-break>もう、ここに住む気にはならないだろうね。<line-break>この美しい景色を失ってしまってはねえ。<end>ディンガルに占領されても、<line-break>あたしらの生活は変わらないだろうねえ。<line-break>攻められるっていう実感がないよ。<end>世界は本当に滅んでしまうのかい？<line-break>何とかならないものなのかねえ。<end>"
korean = "<select><value:$33>어머, 왜 여기 있는 거니?<end>아큐류스는 미즈치들이 지켜 주니까 어느 나라 왕도 쳐들어오지 못해. 아무리 강한 군대라도 물속에서는 미즈치를 당해낼 수 없을 테니까.<end>동쪽 딩갈에서는 용사 네메아가 전 황제를 쓰러뜨리고 즉위했다더라. 자세한 사정은 모르지만 무서운 이야기야.<end>네메아는 정말로 세계를 자기 것으로 만들 생각인가 보네. 그렇다면 여기에도 쳐들어올까.<end>로스토올 왕궁에선 딩갈이 쳐들어온다고 난리가 났겠지. 엘리스 말고는 무능하니까.<end>리벨덤처럼 파괴된다면 이제 여기서 살 마음은 없어질 거야. 이 아름다운 경치를 잃는다면 말이지.<end>딩갈에 점령돼도 우리 생활은 달라지지 않을 것 같아. 공격받는다는 실감이 없어.<end>세계는 정말 멸망해 버리는 걸까? 어떻게 할 수 없는 걸까.<end>"

["100006"]
japanese = "<if><value:$2C><less-equal>%9北の谷間と南の谷間を探険するときは<line-break>無理をするなよ。谷間の奥にいるモンスターは<line-break>あんたのレベルだと苦戦すると思うぜ。<end><if><value:$2C><less-equal>%29アキュリュース周辺の冒険ポイントっていえば　<line-break>北と南にある谷間だな。あんたのレベルだと<line-break>奥の方まで探険できるだろうから行ってみな。<end><if><value:$2C><less-equal>%49この町のどこかに蒼流の聖槍があるんだ。<line-break>力強く流れる激流のように敵を突き破る槍<line-break>というくらいだから強力なんだろうな。<end>水属性の禁呪がこの地のどこかに<line-break>封印されているらしいんだ。<line-break>どうにかして手に入れたいものだけどな。<end>"
korean = "<if><value:$2C><less-equal>%9북쪽 골짜기와 남쪽 골짜기를 탐험할 땐 무리하지 마. 골짜기 안쪽 몬스터는 네 레벨로는 고전할 거야.<end><if><value:$2C><less-equal>%29아큐류스 주변의 모험 포인트라면 북쪽과 남쪽 골짜기지. 네 레벨이면 안쪽까지 탐험할 수 있을 테니 가 봐.<end><if><value:$2C><less-equal>%49이 마을 어딘가에 창류의 성창이 있어. 힘차게 흐르는 급류처럼 적을 꿰뚫는 창이라니 강력하겠지.<end>물 속성 금주가 이 땅 어딘가에 봉인되어 있다더군. 어떻게든 손에 넣고 싶지만 말이야.<end>"

["100007"]
japanese = "<if><value:$2C><less-equal>%9水属性のモンスターは火属性の武器が<line-break>苦手なんだ。水属性は土属性に強くて<line-break>火属性に弱いからね。<end><if><value:$2C><less-equal>%29迷宮探険にはディテクターのスキルが必須だね。<line-break>このスキルがないと宝箱を開けることが<line-break>できないからね。<end><if><value:$2C><less-equal>%49強力な武器は鍛えることができないよ。<line-break>結局は、自分の鍛えていった武器が<line-break>一番強いのかもしれないな。<end>防具を鍛えることを忘れてないかい？<line-break>攻撃だけでなく、守りも大切だよ。<end>"
