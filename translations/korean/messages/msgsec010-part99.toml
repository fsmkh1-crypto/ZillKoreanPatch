["100000"]
japanese = "<select><value:$20>%3世界各地で起きた先の地震や火山の噴火は<line-break>竜王の覚醒が原因です。竜王の覚醒が<line-break>起きるとき、人の世は乱れるといいます。<end>水の精霊神も世界の異変を感じ取って<line-break>いるのでしょう。この地に集う水の精霊たちが<line-break>影響を受けて、ざわついているのを感じます。<end>竜王は世界のバランスを崩しかねない<line-break>存在である、無限のソウルを持つ者を<line-break>恐れているのです。<end>"
korean = "<select><value:$20>%3세계 각지에서 일어난 최근의 지진과 화산 분화는 용왕의 각성이 원인입니다. 용왕이 깨어날 때 인간 세상은 혼란에 빠진다고 합니다.<end>물의 정령신도 세계의 이변을 감지한 것이겠지요. 이곳에 모인 물의 정령들이 영향을 받아 술렁이고 있는 게 느껴집니다.<end>용왕은 세계의 균형을 무너뜨릴 수도 있는 무한의 소울을 지닌 자를 두려워하는 겁니다.<end>"

["100001"]
japanese = "<select><value:$20>%2アキュリュースは本当に美しい所ね。　　　<line-break>人間の造った建物と水の精霊が無理なく<line-break>融合していて、ほんとうにすばらしいわ。<line-break>冒険エルフの祖、ラミュ様のおっしゃるように<line-break>森を出て本当によかった。<end>ロストールには、エルフの森の長老樹に　　<line-break>負けないくらい立派な、千年樹と呼ばれる<line-break>巨木があるんですってね。<line-break>私も１度、見にいってみようかしら。<line-break>きっと雄々しい樹の精霊が住んでいるのよ。<end>"
korean = "<select><value:$20>%2아큐류스는 정말 아름다운 곳이네. 인간이 만든 건물과 물의 정령이 자연스럽게 어우러져 정말 멋져. 모험 엘프의 시조 라뮤 님 말씀대로 숲을 떠나길 정말 잘했어.<end>로스토올에는 엘프 숲의 장로목에 뒤지지 않을 만큼 훌륭한 천년수라는 거목이 있다면서? 나도 한번 보러 가 볼까. 분명 늠름한 나무 정령이 살고 있을 거야.<end>"

["100003"]
japanese = "<select><value:$20>%3ここ水の都アキュリュースは<line-break>古代魔道王国ラドラスの水の巫女ネイが<line-break>５世紀に造った町なんじゃよ。<end>今でもネイの血をひく女性が水の巫女として<line-break>代々、水の精霊神に仕えておるんじゃ。<line-break>そういえば、今の水の巫女は誰じゃったかな。<end>こうして美しく咲いた花を愛でたり、<line-break>水の流れを耳で感じておる時が、<line-break>わしの至福の一時なんじゃよ。<end>"
korean = "<select><value:$20>%3이 물의 도시 아큐류스는 고대 마도왕국 라드라스의 물의 무녀 네이가 5세기에 만든 도시라네.<end>지금도 네이의 피를 이은 여성이 대대로 물의 무녀가 되어 물의 정령신을 섬기고 있지. 그러고 보니 지금 물의 무녀가 누구였더라.<end>이렇게 아름답게 핀 꽃을 감상하거나 물 흐르는 소리를 듣고 있을 때가 내게는 가장 행복한 시간이라네.<end>"

["100007"]
japanese = "<if><value:$2C><less-equal>%9水属性のモンスターは火属性の武器が<line-break>苦手なんだ。水属性は土属性に強くて<line-break>火属性に弱いからね。<end><if><value:$2C><less-equal>%29迷宮探険にはディテクターのスキルが必須だね。<line-break>このスキルがないと宝箱を開けることが<line-break>できないからね。<end><if><value:$2C><less-equal>%49強力な武器は鍛えることができないよ。<line-break>結局は、自分の鍛えていった武器が<line-break>一番強いのかもしれないな。<end>防具を鍛えることを忘れてないかい？<line-break>攻撃だけでなく、守りも大切だよ。<end>"
korean = "<if><value:$2C><less-equal>%9물 속성 몬스터는 불 속성 무기에 약해. 물 속성은 땅 속성에 강하고 불 속성에 약하거든.<end><if><value:$2C><less-equal>%29미궁 탐험에는 디텍터 스킬이 필수야. 이 스킬이 없으면 보물상자를 열 수 없거든.<end><if><value:$2C><less-equal>%49강력한 무기는 단련할 수 없어. 결국 자신이 계속 단련해 온 무기가 가장 강할지도 모르지.<end>방어구 단련을 잊고 있는 건 아니지? 공격뿐 아니라 방어도 중요해.<end>"

