japanese = "<select><value:$20>%3湖の中ほどに島が見えるだろ？<line-break>あれが水の都アキュリュースだよ。<end>地の精霊神グラジェオンが、妹である水の精霊神<line-break>アキュリュースのために大地を踏みしめてできた<line-break>のが、グラジェオンの足跡とよばれるこの湖さ。<end>アキュリュースは湖の真ん中にある島のことさ。<line-break>当然船に乗らなくちゃいけないぞ。<line-break>船の乗り方は知っているかい？<line-break>あそこのボルダンに話しかければ<line-break>タダでアキュリュースへ運んでもらえるよ。<end>"
korean = "<select><value:$20>%3호수 한가운데 섬이 보이지? 저기가 물의 도시 아큐류스야.<end>땅의 정령신 그라제온이 여동생인 물의 정령신 아큐류스를 위해 대지를 밟아 생긴 곳이 그라제온의 발자국이라 불리는 이 호수야.<end>아큐류스는 호수 한가운데 있는 섬이야. 당연히 배를 타야 하지. 배 타는 법은 알고 있나? 저기 볼단에게 말을 걸면 공짜로 아큐류스까지 데려다줄 거야.<end>"

