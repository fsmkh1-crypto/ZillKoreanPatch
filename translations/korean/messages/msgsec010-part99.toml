["100001"]
japanese = "<select><value:$20>%2アキュリュースは本当に美しい所ね。　　　<line-break>人間の造った建物と水の精霊が無理なく<line-break>融合していて、ほんとうにすばらしいわ。<line-break>冒険エルフの祖、ラミュ様のおっしゃるように<line-break>森を出て本当によかった。<end>ロストールには、エルフの森の長老樹に　　<line-break>負けないくらい立派な、千年樹と呼ばれる<line-break>巨木があるんですってね。<line-break>私も１度、見にいってみようかしら。<line-break>きっと雄々しい樹の精霊が住んでいるのよ。<end>"
