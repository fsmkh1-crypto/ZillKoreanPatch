["2010004"]
japanese = "それでよ。オルファウスの奴は、<line-break>俺の授業で、とんでもない悪さを<line-break>しやがってな。<line-break>こともあろうに俺の後頭部に<line-break>ファイアの呪文をぶつけやがったんだ。<line-break>なあ、オルファウス？<end>"
korean = "그래서 말이지. 오르파우스 녀석이 내 수업에서 엄청난 장난을 쳤어. 하필이면 내 뒤통수에 파이어 주문을 날렸다고. 그렇지, 오르파우스?<end>"

["2010006"]
