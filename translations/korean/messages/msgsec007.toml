japanese = "<select><value:$33>俺たちからしぼり取った税金でリベルダムから<line-break>モンスターを買い、慰み者にした娘たちを<line-break>そのエサにする…。<line-break>奴は、ペウダは人間じゃねえ。<line-break>神はどうして悪魔の所業を見過ごすのか…。<line-break>俺たちは悪夢がさめるのを待つしかないのか。<end>俺たちからしぼり取った税金でリベルダムから<line-break>モンスターを買い、慰み者にした娘たちを<line-break>そのエサにする…。<line-break>奴は、ペウダは人間じゃねえ。<line-break>神はどうして悪魔の所業を見過ごすのか…。<line-break>俺たちは悪夢がさめるのを待つしかないのか。<end>俺たちからしぼり取った税金でリベルダムから<line-break>モンスターを買い、慰み者にした娘たちを<line-break>そのエサにする…。<line-break>奴は、ペウダは人間じゃねえ。<line-break>神はどうして悪魔の所業を見過ごすのか…。<line-break>俺たちは悪夢がさめるのを待つしかないのか。<end>ペウダが、悪魔がロセンからいなくなった！<line-break>天空神は我々を見捨てなかったんだ！<line-break>神よ、そしてディンガル帝国万歳！<end>これがロセンをペウダから解放してくれた青竜<line-break>将軍カルラの像だよ。こんなにかわいい少女が<line-break>俺たちの救世主だなんて信じられないよな。<end>青竜将軍カルラは戦争の天才だよ。<line-break>リベルダムをあっというまに<line-break>占領してしまうんだからな。<end>カルラ様が本気を出せば、<line-break>ロストールのへなちょこ騎士なんて<line-break>目じゃないね。<end>ネメアが本当に死んだのなら、<line-break>次の皇帝にはカルラ様がいいな。<line-break>強いし美しいし文句なしだよ。<end>"
