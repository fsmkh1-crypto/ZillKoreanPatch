korean = "<select><value:$33>페우다는 딘갈의 네메아를 무서워해. 딘갈을 공격했을 때 약탈에 정신이 팔렸다가 네메아에게 반격당해 간신히 목숨만 건졌거든. 그래서 성벽을 높이고 가도와 해로까지 봉쇄한 뒤 자기는 성에 틀어박혀 벌벌 떠는 거야. 도망밖에 할 줄 모르는 최악의 인간이지.<end>페우다는 딘갈의 네메아를 무서워해. 딘갈을 공격했을 때 약탈에 정신이 팔렸다가 네메아에게 반격당해 간신히 목숨만 건졌거든. 그래서 성벽을 높이고 가도와 해로까지 봉쇄한 뒤 자기는 성에 틀어박혀 벌벌 떠는 거야. 도망밖에 할 줄 모르는 최악의 인간이지.<end>페우다는 딘갈의 네메아를 무서워해. 딘갈을 공격했을 때 약탈에 정신이 팔렸다가 네메아에게 반격당해 간신히 목숨만 건졌거든. 그래서 성벽을 높이고 가도와 해로까지 봉쇄한 뒤 자기는 성에 틀어박혀 벌벌 떠는 거야. 도망밖에 할 줄 모르는 최악의 인간이지.<end>딘갈 제국 청룡장군 카를라의 동상인가…. 분명 어리석은 왕 페우다에게서 로센을 해방해 준 구세주이긴 하지만, 도시 한복판에 자기 동상을 세우는 건 별로 좋은 취미는 아니지. 뭐, 귀여우니까 개인적으론 용서한다.<end>카를라 장군은 무섭단 말이지. 자기에게 거스르는 사람은 모조리 죽일 것 같고… 무기가 사신의 낫이라는 것도 문제야.<end>아무리 리벨담의 무기상이 밉다 해도 철저하게 파괴할 것까지는 없었을 텐데. 저래선 자기를 미워할 사람만 늘어날 뿐이야.<end>연전연승 중인 카를라 장군도 이번만큼은 신중해야 할 거야. 상대가 바로 제네테스니까.<end>네메아 사망설은 아마 제네테스 진영이 퍼뜨린 거짓 정보겠지. 하지만 아니 땐 굴뚝에 연기 나랴는 말도 있으니까.<end>"
