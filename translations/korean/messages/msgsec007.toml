japanese = "<select><value:$33>東方６国家の盟主と言われた<line-break>ロセン王国も今は大陸最悪の国だよ。<line-break>すべてはペウダのせいだよ。<end>東方６国家の盟主と言われた<line-break>ロセン王国も今は大陸最悪の国だよ。<line-break>すべてはペウダのせいだよ。<end>東方６国家の盟主と言われた<line-break>ロセン王国も今は大陸最悪の国だよ。<line-break>すべてはペウダのせいだよ。<end>うれしいねえ、ペウダが処刑されて　　　　<line-break>この国にも平和が戻ってきたんだ。<line-break>すべてはディンガル帝国のおかげだよ。<line-break>ロセンを悪魔から解放してくれたのは<line-break>カルラっていう少女だっていうじゃないか。<line-break>ああ、私たちにとっては女神様だよ。<end>ロセンも少しずつだけど昔の活気を　<line-break>取り戻しているよ。他国に逃げていた<line-break>人々も戻ってきてるしねえ。<line-break>ただ、高い税金が…。<line-break>いや、ペウダのころにくらべれば<line-break>ましだから文句はいえないね。<end>確かにカルラ将軍のおかげで、ロセンは急速に<line-break>昔の繁栄を取り戻しているよ。破壊された<line-break>町並みも少しずつ修復されているしね。<line-break>でもね、地方じゃペウダの時代と変わらない<line-break>くらい重い税金を徴収されて苦しんでいる<line-break>人々がいるんだよ。<end>カルラ将軍のリベルダム破壊で、　　　　　　<line-break>リベルダムの商人たちも闘技場も<line-break>ここに引っ越してきたね。<line-break>しかし、重い税金に苦しめられた地方の人々や<line-break>故郷を失ったリベルダムの難民を思うと<line-break>素直に喜ぶことはできないよ。<end>ネメア様が行方不明になったという噂が<line-break>真実なら、ディンガル帝国は<line-break>どうなってしまうのだろう…。<end>"
korean = "<select><value:$33>동방 ６개국의 맹주라 불리던 로센 왕국도 지금은 대륙 최악의 나라야. 전부 페우다 때문이지.<end>동방 ６개국의 맹주라 불리던 로센 왕국도 지금은 대륙 최악의 나라야. 전부 페우다 때문이지.<end>동방 ６개국의 맹주라 불리던 로센 왕국도 지금은 대륙 최악의 나라야. 전부 페우다 때문이지.<end>기쁘구나, 페우다가 처형되고 이 나라에도 평화가 돌아왔어. 전부 딘갈 제국 덕분이야. 로센을 악마에게서 해방해 준 건 카를라라는 소녀라면서? 아아, 우리에겐 여신이나 다름없지.<end>로센도 조금씩 옛 활기를 되찾고 있어. 다른 나라로 도망쳤던 사람들도 돌아오고 있고. 다만 세금이 너무 높아서…. 아니, 페우다 때보다는 나으니 불평할 수도 없겠지.<end>확실히 카를라 장군 덕분에 로센은 빠르게 옛 번영을 되찾고 있어. 파괴된 거리도 조금씩 복구되고 있고. 하지만 지방에서는 페우다 시대와 다르지 않을 정도로 무거운 세금을 거둬 고통받는 사람들도 있어.<end>카를라 장군이 리벨담을 파괴하면서 리벨담 상인들과 투기장도 이곳으로 옮겨 왔네. 하지만 무거운 세금에 시달리는 지방 사람들과 고향을 잃은 리벨담 난민을 생각하면 마냥 기뻐할 수는 없어.<end>네메아 님이 행방불명됐다는 소문이 사실이라면 딘갈 제국은 어떻게 되는 걸까….<end>"
