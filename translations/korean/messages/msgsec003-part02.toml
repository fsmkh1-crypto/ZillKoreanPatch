["30011"]
japanese = "<if><value:$2A><less-equal>%49ぼくの夢は、英雄の詩を作ることなんだぁ。<line-break>英雄叙事詩なら、ぼくが死んでも<line-break>ずーっと歌い継がれるもん。<line-break>だから、伝説の英雄って呼ばれそうな人を<line-break>探してるの。誰か英雄になりそうな人を<line-break>知ってたらおしえてよ。　<end><if><value:$2A><less-equal>%100きみ、<value:$28>って名前でしょう？<line-break>冒険者ギルドの主人に聞いたんだ。<line-break>最近すっごく活躍しているんだってね。<line-break>今度、きみの冒険談を聞かせてよ。<line-break>きみなら英雄叙事詩の主役になれそうな<line-break>気がするんだ。<end><if><value:$2A><less-equal>%150やあ、<value:$2B>さん。<line-break>通り名がついてますますいい感じだね。<line-break>ぼくもがんばって詩を書くぞ！<end><value:$28>が主人公の叙事詩も、<line-break>だいぶ完成にちかづいてきたよ。<line-break>君の冒険に決着がついたとき、歌ってあげるよ。<end>"
korean = "<if><value:$2A><less-equal>%49내 꿈은 영웅의 노래를 만드는 거야.<line-break>영웅 서사시라면 내가 죽고 나서도<line-break>계속해서 사람들에게 불릴 테니까.<line-break>그래서 전설의 영웅이라 불릴 만한 사람을<line-break>찾고 있어. 영웅이 될 것 같은 사람을<line-break>알고 있다면 알려 줘.　<end><if><value:$2A><less-equal>%100너, 이름이 <value:$28> 맞지?<line-break>모험자 길드 주인에게 들었어.<line-break>요즘 엄청 활약하고 있다면서?<line-break>다음에 네 모험 이야기를 들려 줘.<line-break>너라면 영웅 서사시의 주인공이 될 수 있을 것<line-break>같은 느낌이 들어.<end><if><value:$2A><less-equal>%150안녕, <value:$2B> 씨.<line-break>이명까지 생기니까 점점 더 멋진데.<line-break>나도 열심히 시를 쓸 거야!<end><value:$28>이 주인공인 서사시도<line-break>이제 거의 완성되어 가고 있어.<line-break>네 모험이 결말을 맞으면 노래해 줄게.<end>"

["30012"]
japanese = "<if><value:$2C><less-equal>%9エンシャントの西にある新月の塔の最上階に、<line-break>使い方も造られた目的もわかっていない<line-break>謎の祭壇があるって話を知っているかい？<line-break>俺もその祭壇を見てやろうと登ってみたが<line-break>上の階にいくほどモンスターが強くてね。<line-break>恥ずかしながら途中までしか登れなかったぜ。<end><if><value:$2C><less-equal>%29乙女の鏡なんて、しゃれた名前だと思わないか？<line-break>湖畔に美しい乙女がずらーっと並んで湖面を<line-break>鏡代わり使ってる姿が目に浮かぶねえ。<line-break>実際に行ってみると乙女じやなくてモンスターが<line-break>いるんだけどな。そういえば５本の柱に囲まれた<line-break>小さな島が湖の真ん中にあったなあ。<end>新月の塔の最上階に行ったことあるかい？　<line-break>俺は今まで最上階にあるって噂の謎の祭壇を<line-break>見てやろうと、何回も挑戦しているんだぜ。<line-break>だけど上の階にいくほどモンスターが強くて<line-break>なかなかたどり着けないんだな、これが。<line-break>もうちょっとで、たどり着けるんだがよ。<end>"
korean = "<if><value:$2C><less-equal>%9엔션트 서쪽 신월의 탑 꼭대기에<line-break>사용법도 만들어진 목적도 알려지지 않은<line-break>수수께끼의 제단이 있다는 이야기 알아?<line-break>나도 그 제단을 보려고 올라가 봤지만<line-break>위층으로 갈수록 몬스터가 강해지더라고.<line-break>부끄럽지만 중간까지밖에 못 올라갔어.<end><if><value:$2C><less-equal>%29소녀의 거울이라니, 멋진 이름이라고 생각하지 않아?<line-break>호숫가에 아름다운 소녀들이 쭉 늘어서서 호수를<line-break>거울 삼아 바라보는 모습이 눈에 선하잖아.<line-break>막상 가 보면 소녀가 아니라 몬스터가 있지만 말이야.<line-break>그러고 보니 다섯 개의 기둥에 둘러싸인 작은 섬이<line-break>호수 한가운데 있었지.<end>신월의 탑 꼭대기에 가 본 적 있어?　<line-break>난 꼭대기에 있다는 수수께끼의 제단을 보려고<line-break>지금까지 몇 번이나 도전했어.<line-break>그런데 위층으로 갈수록 몬스터가 강해져서<line-break>좀처럼 도착할 수가 없더라고.<line-break>이제 조금만 더 가면 될 것 같은데 말이야.<end>"

["30013"]
japanese = "<select><value:$33>ぼくの従妹はロセンに住んでいるんです。　　<line-break>だけど、今のロセンは門を閉ざしているから<line-break>ぜんぜん会えないんです。<line-break>ロセン王ペウダが近辺の村から娘をさらわせて<line-break>怪物のエサにしているなんて悪い噂を聞いた<line-break>ものだから、心配でしょうがないです。<end>ぼくの従妹はロセンに住んでいるんです。　　<line-break>だけど、今のロセンは門を閉ざしているから<line-break>ぜんぜん会えないんです。<line-break>ロセン王ペウダが近辺の村から娘をさらわせて<line-break>怪物のエサにしているなんて悪い噂を聞いた<line-break>ものだから、心配でしょうがないです。<end>新しく皇帝に即位されたネメア様は、　　　　　<line-break>以前ロセン王が我が国に攻め込んできたとき、　<line-break>わずかな騎兵で撃退したことがあるんです。<line-break>ロセンに住んでいる私の従妹のためにも、<line-break>暗愚王ペウダに苦しむ他の町の人々のためにも、<line-break>ぜひ、ロセン攻めを行ってほしいです。<end>ロセンが解放されてよかったです。<line-break>これで自由にロセンに入ることができますね。<line-break>すべては青竜将軍カルラ様のおかげですよ。<line-break>さっそく、ロセンに住んでいる従妹の<line-break>消息を調べに行かなくてはいけません。<line-break>無事であればいいのですが…。<end>ロセンに住んでいる従妹に無事会うことが　　　<line-break>できました。<line-break>少しやつれていましたが元気そうでした。<line-break>ペウダの悪政と戦争の影響でロセンの町は<line-break>ずいぶん荒廃していますが、ペウダも処刑された<line-break>ことですし、少しずつ復興していくでしょう。<end>ロセンのカルラ将軍はすごい人ですね。<line-break>ロセンの町がすごい勢いで復興しているんです。<line-break>以前より華やかな町になるかもしれませんよ。<end>今のロセンは、まるでリベルダムですよ。　　　<line-break>リベルダム名物の闘技場も建設された<line-break>ようですし、商人も増えて活気もありますし。<line-break>カルラ将軍がリベルダムを破壊したため、<line-break>大富豪フゴーもロセンへ引っ越したそうですよ。<line-break>これで時計塔が建てば完璧なんですけどね。<end>ネメア様が死んだなんていう不吉な噂が<line-break>流れているみたいですね。<line-break>カルラ将軍のロストール攻めも失敗したし…。<line-break>このまま戦乱は続くのでしょうか？<line-break>救世主エルファス様のおっしゃるように<line-break>世界は破滅の道を歩んでいるのかなあ…。<end>"
korean = "<select><value:$33>제 사촌은 로센에 살고 있습니다.　　<line-break>하지만 지금 로센은 성문을 닫아 버려서<line-break>전혀 만날 수가 없습니다.<line-break>로센 왕 페우다가 인근 마을에서 처녀들을 납치해<line-break>괴물의 먹이로 삼는다는 흉흉한 소문을 들어서<line-break>걱정돼 견딜 수가 없습니다.<end>제 사촌은 로센에 살고 있습니다.　　<line-break>하지만 지금 로센은 성문을 닫아 버려서<line-break>전혀 만날 수가 없습니다.<line-break>로센 왕 페우다가 인근 마을에서 처녀들을 납치해<line-break>괴물의 먹이로 삼는다는 흉흉한 소문을 들어서<line-break>걱정돼 견딜 수가 없습니다.<end>새로 황제에 즉위하신 네메아 님은　　　　　<line-break>예전에 로센 왕이 우리나라를 침공했을 때　<line-break>소수의 기병만으로 격퇴한 적이 있습니다.<line-break>로센에 사는 제 사촌을 위해서라도,<line-break>암군 페우다에게 고통받는 다른 사람들을 위해서라도<line-break>꼭 로센을 공격해 주셨으면 합니다.<end>로센이 해방되어 정말 다행입니다.<line-break>이제 자유롭게 로센에 들어갈 수 있겠군요.<line-break>모두 청룡장군 카를라 님 덕분입니다.<line-break>당장 로센에 사는 사촌의<line-break>소식을 알아보러 가야겠습니다.<line-break>무사해야 할 텐데….<end>로센에 사는 사촌을 무사히 만날 수　　　<line-break>있었습니다.<line-break>조금 수척해졌지만 건강해 보였습니다.<line-break>페우다의 폭정과 전쟁 탓에 로센은<line-break>많이 황폐해졌지만, 페우다도 처형되었으니<line-break>조금씩 복구되겠지요.<end>로센의 카를라 장군은 대단한 분이군요.<line-break>로센이 엄청난 기세로 복구되고 있습니다.<line-break>예전보다 더 화려한 도시가 될지도 모르겠어요.<end>지금의 로센은 마치 리베르담 같습니다.　　　<line-break>리베르담 명물인 투기장도 건설된 모양이고,<line-break>상인도 늘어 활기가 넘칩니다.<line-break>카를라 장군이 리베르담을 파괴한 탓에<line-break>대부호 휴고도 로센으로 이사했다고 합니다.<line-break>이제 시계탑만 세워지면 완벽하겠는데요.<end>네메아 님이 죽었다는 불길한 소문이<line-break>퍼지고 있는 모양입니다.<line-break>카를라 장군의 로스톨 공격도 실패했고….<line-break>이대로 전란이 계속되는 걸까요?<line-break>구세주 엘파스 님의 말씀처럼<line-break>세계는 파멸의 길을 걷고 있는 걸까요….<end>"

["30014"]
japanese = "<select><value:$20>%2ここは魔法を学ぶために若者が集い、　　　　　<line-break>魔法の研究に励む由緒正しき魔道アカデミーよ。<line-break>ここを卒業しなければ、魔道士とは呼べないわ。<line-break>しかも首席で卒業すれば、各国から宮廷魔道士<line-break>としてお呼びがかかるのよ。あたしもザギヴ先輩<line-break>やシェスター先輩のように首席卒業を目指すの。<end>どうしてあちこち建物が壊れてるのかって？　<line-break>言っておくけど校舎が古くて壊れたとか<line-break>実験モンスターが暴れたんじゃないからね。<line-break>伝統ある魔道アカデミーの神聖なる学舎を<line-break>ここまで破壊したのはあの娘、アカデミー史上<line-break>最低最悪の問題児、暴走爆弾娘ユーリスよ！<end>"
korean = "<select><value:$20>%2여기는 마법을 배우려는 젊은이들이 모여　　　　　<line-break>마법 연구에 힘쓰는 유서 깊은 마도 아카데미야.<line-break>여길 졸업하지 않으면 마도사라고 할 수 없지.<line-break>게다가 수석으로 졸업하면 여러 나라에서 궁정 마도사<line-break>자리를 제안받게 돼. 나도 자기브 선배나<line-break>셰스터 선배처럼 수석 졸업을 노리고 있어.<end>왜 여기저기 건물이 부서져 있냐고?　<line-break>말해 두지만 건물이 낡아서 무너진 것도 아니고<line-break>실험용 몬스터가 날뛴 것도 아니야.<line-break>전통 있는 마도 아카데미의 신성한 교사를<line-break>이 지경으로 만든 건 바로 그 애, 아카데미 역사상<line-break>최악의 문제아이자 폭주 폭탄소녀 유리스라고!<end>"
