japanese = "<select><value:$33>ディンガルのネメアは　　　　　　　　　　<line-break>かなり強いんだってよ。<line-break>　<line-break>しかし、我らがリベルダムのチャンピオン、<line-break>剣聖レーグにはかなわないだろう。<line-break>なんといってもレーグは二刀流だからな。<end>ディンガルのネメアは　　　　　　　　　　<line-break>かなり強いんだってよ。<line-break>　<line-break>しかし、我らがリベルダムのチャンピオン、<line-break>剣聖レーグにはかなわないだろう。<line-break>なんといってもレーグは二刀流だからな。<end>ネメアが将軍に任命したジラークは、<line-break>額に角が生えたコーンス族らしいぞ。<end>あまり大きな声じゃ言えないけれど、<line-break>ロティの娘クリュセイスは、カルラが根絶やしに<line-break>したロセン王家の血をひく最後の１人らしいぜ。<end>カルラに反抗してロセンで破壊活動をしてる<line-break>解放軍ってヤツらがいるんだが、それを裏で<line-break>操っている大商人がいるって話だ。<end>アンティノの野郎がカルラと手を結んで<line-break>いたなんて予想してなかったぜ。<line-break>おかげで、この有様だ。<end>もうリベルダムもおしまいだな。<line-break>復興しようと思っても金と人手がない。<line-break>せめて、みんなを率いるリーダーがいればな…。<end>救世主様の話だともうすぐ世界は滅ぶそうだ。<line-break>あんたも思い残すことがないようにな。<end>"
korean = "<select><value:$33>딘갈의 네메아는　　　　　　　　　　<line-break>상당히 강하다더군.<line-break>　<line-break>하지만 우리 리벨담의 챔피언,<line-break>검성 레그에게는 못 당하겠지.<line-break>무엇보다 레그는 이도류니까.<end>딘갈의 네메아는　　　　　　　　　　<line-break>상당히 강하다더군.<line-break>　<line-break>하지만 우리 리벨담의 챔피언,<line-break>검성 레그에게는 못 당하겠지.<line-break>무엇보다 레그는 이도류니까.<end>네메아가 장군으로 임명한 지라크는,<line-break>이마에 뿔이 난 콘스족이라더군.<end>큰 소리로 말할 얘기는 아니지만,<line-break>로티의 딸 크리세이스는 카를라가 씨를 말린<line-break>로센 왕가의 피를 잇는 마지막 한 사람이라더군.<end>카를라에게 반항하며 로센에서 파괴 활동을 하는<line-break>해방군이라는 녀석들이 있는데, 그들을 뒤에서<line-break>조종하는 거상이 있다는 얘기야.<end>안티노 녀석이 카를라와 손을 잡고<line-break>있었다니 전혀 예상 못 했어.<line-break>덕분에 이 꼴이 됐지.<end>이제 리벨담도 끝장이군.<line-break>재건하려 해도 돈과 일손이 없어.<line-break>적어도 모두를 이끌 지도자라도 있다면….<end>구세주 님 말로는 곧 세상이 멸망한다더군.<line-break>당신도 후회 남기지 않도록 해.<end>"
