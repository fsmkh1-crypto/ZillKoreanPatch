["60006"]
japanese = "<select><value:$33>これがリベルダムのシンボル、時計塔よ。<line-break>この時計塔の鐘の音は、町中に響きわたるの。<end>これがリベルダムのシンボル、時計塔よ。<line-break>この時計塔の鐘の音は、町中に響きわたるの。<end>この時計塔の上からだったら、<line-break>エンシャントやロストールも<line-break>見えるかもしれないわね。<end>ロセンの王族たちは皆殺しにされたそうよ。<line-break>カルラって、きっと恐ろしい性格の娘なのね。<end>ディンガル軍は分断の山脈を越えて、<line-break>ロストールを攻めたそうよ。<line-break>これってすごいことなのかな。<end>そんな…あたしの生まれ育った町が…<line-break>平和で活気のあふれたリベルダムが…<line-break>こんなことになるなんて…。<end>もう…何もかもおしまいよ…<line-break>この町には何もないの…何もないのよっ！<end>エルファス様こそ救世主…<line-break>あわれな人間を導いてくださるお方…。<end>"
korean = "<select><value:$33>이게 리벨담의 상징인 시계탑이야.<line-break>이 시계탑의 종소리는 온 마을에 울려 퍼져.<end>이게 리벨담의 상징인 시계탑이야.<line-break>이 시계탑의 종소리는 온 마을에 울려 퍼져.<end>이 시계탑 위에서라면,<line-break>엔션트나 로스토르도<line-break>보일지도 모르겠네.<end>로센의 왕족들은 모두 죽임을 당했다더라.<line-break>카를라라는 애, 분명 무서운 성격이겠지.<end>딘갈군은 분단의 산맥을 넘어,<line-break>로스토르를 공격했다더라.<line-break>이게 그렇게 대단한 일인가?<end>말도 안 돼… 내가 태어나 자란 마을이…<line-break>평화롭고 활기 넘치던 리벨담이…<line-break>이렇게 되어 버리다니….<end>이젠… 전부 끝이야…<line-break>이 마을엔 아무것도 없어… 아무것도 없다고!<end>엘파스 님이야말로 구세주…<line-break>가엾은 인간들을 이끌어 주실 분….<end>"

