japanese = "<if><value:$2A><less-equal>%50どこかに有名人はいないかなー。　　　　<line-break>あたし有名人に会うのが夢なの。<line-break>あなた、有名人に会ったことなーい？<line-break>魔王バロルを倒した勇者ネメアとか。<line-break>ディンガル統一時に活躍した赤い巨星<line-break>アンギルダンとかさー。<end><if><value:$2A><less-equal>%100ファーロス家のゼネテス様は冒険者を　　　　<line-break>してるんだってー。あなたも冒険者なら<line-break>ゼネテス様に会ったことぐらいあるでしょ？<line-break>どこに行けば会えるか教えてくれないかなー。<line-break>ゼネテス様ったら、あまりにあたしがかわいい<line-break>から一目ぼれしちゃったりしてぇ、うふふ。<end><if><value:$2A><less-equal>%150今、一番会いたい有名人は<value:$28>よ。<line-break>どんな人かは知らないけど、きっとステキな<line-break>人にちがいないわー。どこにいるのかなー。<end>きゃっ！　もしかして<value:$28>さん？<line-break>やったぁ、あなたに会うのが夢だったのー。<line-break>あたしって運がいいわー。<end>"
korean = "<if><value:$2A><less-equal>%50어디 유명한 사람 없나아.　　　　<line-break>난 유명인을 만나는 게 꿈이거든.<line-break>당신, 유명인 만나 본 적 없어어?<line-break>마왕 바로르를 쓰러뜨린 용사 네메아라든가,<line-break>딘갈 통일 때 활약한 붉은 거성<line-break>안길단이라든가 말이야아.<end><if><value:$2A><less-equal>%100파로스 가문의 제네테스 님은 모험자를　　　　<line-break>하고 있다며어. 당신도 모험자라면<line-break>제네테스 님을 만난 적 정도는 있지 않아?<line-break>어디 가면 만날 수 있는지 알려 주면 안 될까아.<line-break>제네테스 님이 내가 너무 귀여워서<line-break>첫눈에 반해 버릴지도 모르잖아, 우후후.<end><if><value:$2A><less-equal>%150지금 가장 만나고 싶은 유명인은 <value:$28>이야.<line-break>어떤 사람인지는 모르지만 분명 멋진<line-break>사람일 거야아. 어디 있으려나아.<end>꺅! 혹시 <value:$28> 씨?<line-break>됐다아, 당신을 만나는 게 꿈이었어어.<line-break>나 정말 운이 좋네에.<end>"

["40009"]
japanese = "<select><value:$33>つつましやかで影から男を立てるのが<line-break>ロストール女性の美徳だったはずだ。　　　　<line-break>それを王妃エリス…あのファーロスの雌狐め。<line-break>夫であるセルモノー陛下や兄のノヴィン様を<line-break>ないがしろにし国政を牛耳るとは！<line-break>まったくもって、許しがたい事態だ！<end>つつましやかで影から男を立てるのが<line-break>ロストール女性の美徳だったはずだ。　　　　<line-break>それを王妃エリス…あのファーロスの雌狐め。<line-break>夫であるセルモノー陛下や兄のノヴィン様を<line-break>ないがしろにし国政を牛耳るとは！<line-break>まったくもって、許しがたい事態だ！<end>ディンガルじゃ武勇にすぐれたネメアが　　　<line-break>前の皇帝エリュマルクを殺して、<line-break>自ら帝位についたそうじゃないか。<line-break>いかにファーロスの雌狐が悪知恵のきく女でも<line-break>戦争になっちまったらどうしようもないだろ。<line-break>今こそ、国王陛下やノヴィン様の出番だな。<end>ディンガルが東方国家の盟主ロセンを占領した<line-break>そうじゃないか。これではっきりしただろ。<line-break>ディンガルは大陸統一を目指してるんだよ。<line-break>我が国も早急に軍備を整えて迎撃しなくては<line-break>ならんのだ。ファーロスの雌狐ごときに<line-break>任せておいてはダメなんだよ！<end>ああ、なんということだ…。いかに予想外の　　<line-break>奇襲だったとはいえ、こうも簡単に我が軍が<line-break>破れてしまうとは…。<line-break>大陸最強と呼ばれた竜騎軍が破れさり、<line-break>総司令のノヴィン様も自決されたという。<line-break>ロストールはこれからどうなってしまうのだ…。<end>ゼネテス様がアンギルダンを破って、<line-break>平和になったと思ったら、今度はカルラが<line-break>リベルダムを滅ぼしたというではないか。<line-break>次はロストールに攻めてくるに違いない。<line-break>エリスの雌狐が国政を牛耳っておるから、<line-break>ディンガルごときになめられるのだ！<end>いかにゼネテス様が名将でも、先の戦いで兵力の<line-break>大半を失ったロストール軍では、カルラの侵攻を<line-break>防ぐことはできないだろう…。<end>もう、何もかも終わりだ。<line-break>すべては雌狐エリスのせいなんだよ！<line-break>ああ…救世主エルファス様、私はどうすれば…。<end>"
korean = "<select><value:$33>정숙하게 뒤에서 남자를 세워 주는 것이<line-break>로스톨 여성의 미덕이었을 터이다.　　　　<line-break>그런데 왕비 에리스… 그 파로스의 암여우 같으니.<line-break>남편인 셀모노 폐하와 오라버니 노빈 님을<line-break>업신여기고 국정을 좌지우지하다니!<line-break>정말이지 용납할 수 없는 일이다!<end>정숙하게 뒤에서 남자를 세워 주는 것이<line-break>로스톨 여성의 미덕이었을 터이다.　　　　<line-break>그런데 왕비 에리스… 그 파로스의 암여우 같으니.<line-break>남편인 셀모노 폐하와 오라버니 노빈 님을<line-break>업신여기고 국정을 좌지우지하다니!<line-break>정말이지 용납할 수 없는 일이다!<end>딘갈에서는 무용이 뛰어난 네메아가　　　<line-break>전 황제 에류마르크를 죽이고<line-break>스스로 제위에 올랐다지 않나.<line-break>아무리 파로스의 암여우가 잔꾀에 능한 여자라도<line-break>전쟁이 벌어지면 어쩔 도리가 없겠지.<line-break>이제야말로 국왕 폐하와 노빈 님이 나설 때다.<end>딘갈이 동방 국가의 맹주 로센을 점령했다며.<line-break>이제 분명해졌겠지.<line-break>딘갈은 대륙 통일을 노리고 있는 거야.<line-break>우리나라도 서둘러 군비를 갖추고 맞서야 한다.<line-break>파로스의 암여우 따위에게<line-break>맡겨 둬서는 안 돼!<end>아아, 이럴 수가…. 아무리 예상 밖의　　<line-break>기습이었다 해도 우리 군이 이렇게 간단히<line-break>무너지다니….<line-break>대륙 최강이라 불리던 용기군이 패하고,<line-break>총사령관 노빈 님도 자결하셨다 한다.<line-break>로스톨은 이제 어떻게 되는 건가….<end>제네테스 님이 안길단을 물리쳐<line-break>평화가 찾아왔다고 생각했더니, 이번에는 카를라가<line-break>리베르담을 멸망시켰다지 않나.<line-break>다음에는 틀림없이 로스톨로 쳐들어올 거다.<line-break>에리스라는 암여우가 국정을 좌지우지하니<line-break>딘갈 따위에게 얕보이는 거야!<end>아무리 제네테스 님이 명장이라 해도 지난 전투로 병력의<line-break>대부분을 잃은 로스톨군으로는 카를라의 침공을<line-break>막을 수 없겠지….<end>이젠 전부 끝이야.<line-break>모두 암여우 에리스 때문이라고!<line-break>아아… 구세주 엘파스 님, 저는 어찌해야 합니까….<end>"

["40010"]
japanese = "<select><value:$20>%3ロストールは竜王様の加護を受けておる国。<line-break>わしを含めた国民のほとんどが<line-break>竜王様を神とあがめておるですじゃ。<line-break>はああ、ありがたや、ありがたや。<line-break>今日も竜王様のおかげで、<line-break>平和に１日が過ぎておりますじゃ。<end>昔々ディンガルの野心的な征服帝ランガスターが<line-break>諸国を滅ぼし世界を統一しようとしたとき、<line-break>７人の勇者が現れたそうですじゃ。<line-break>竜王様に導かれ七竜士と呼ばれた勇者たちは<line-break>ランガスターを激闘の末、倒したそうですじゃ。<line-break>その後彼らが建国したのがロストールですじゃ。<end>死んだ爺さんが言っておりました。　　　　　　<line-break>爺さんがお城の番兵をしとったころ、お城の<line-break>地下に奇妙な通路を見つけたそうですじゃ。<line-break>その奥にはふたつ出口があったらしいのじゃが、<line-break>爺さんは恐くなって引き返したそうですじゃ。<line-break>その通路が何なのか知りたいものですじゃ。<end>"
korean = "<select><value:$20>%3로스톨은 용왕님의 가호를 받는 나라지요.<line-break>나를 포함한 백성 대부분이<line-break>용왕님을 신으로 받들고 있답니다.<line-break>아아, 감사하도다, 감사하도다.<line-break>오늘도 용왕님 덕분에<line-break>평화롭게 하루가 지나가고 있지요.<end>옛날 옛적 딘갈의 야심가 정복제 랑가스터가<line-break>여러 나라를 멸망시키고 세계를 통일하려 했을 때<line-break>７명의 용사가 나타났다고 합니다.<line-break>용왕님의 인도를 받아 칠룡사라 불린 용사들은<line-break>격전 끝에 랑가스터를 쓰러뜨렸답니다.<line-break>그 뒤 그들이 세운 나라가 로스톨이지요.<end>돌아가신 할아버지께 들은 이야기입니다.　　　　　　<line-break>할아버지가 성의 경비병으로 일하시던 시절 성<line-break>지하에서 기묘한 통로를 발견하셨다더군요.<line-break>그 안쪽에는 출구가 둘 있었다고 하는데,<line-break>무서워져서 되돌아오셨다고 합니다.<line-break>그 통로가 무엇인지 참 궁금하군요.<end>"

