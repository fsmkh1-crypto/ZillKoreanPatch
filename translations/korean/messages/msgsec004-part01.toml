japanese = "<select><value:$33>森を出て、旅に出ているんですが…<line-break>世界は人間でいっぱいですね。<line-break>我々エルフなどの妖精種族の数は少ない…。<line-break>冒険エルフの祖、ラミュ様のおっしゃるとおり<line-break>エルフも森を出て、活動をしなければ<line-break>世界は人間種族だけのものになってしまう！<end>森を出て、旅に出ているんですが…<line-break>世界は人間でいっぱいですね。<line-break>我々エルフなどの妖精種族の数は少ない…。<line-break>冒険エルフの祖、ラミュ様のおっしゃるとおり<line-break>エルフも森を出て、活動をしなければ<line-break>世界は人間種族だけのものになってしまう！<end>この国の人間は我々エルフのような妖精種族より<line-break>自分たちの方が優れているとでも思っているの<line-break>ですか！　我々に対する態度は許し難いです。<line-break>数に任せておごる人間は必ず報いを受けます。<line-break>いえ、あなたは別ですよ。あなたは相手の種族や<line-break>生まれなど気にしない人でしょうから。<end>我々エルフの住む森にはオモヒキと名付けられた<line-break>巨大な霊樹が１本ずつあります。オモヒキは幹に<line-break>触れて思いを強く念じると他のオモヒキに思いが<line-break>届くという不思議な樹です。それぞれのエルフの<line-break>森の指導者であるクィーダはオモヒキに念じる<line-break>ことでお互いに連絡を取り合っているのです。<end>冒険エルフの祖、ラミュ様は、８００年ほど前に<line-break>ともに旅をする仲間たちと破壊神ウルグの復活を<line-break>目論んでいた邪竜エルアザルを倒したそうです。<end>古の樹海には、エルフの聖地があります。<line-break>そこに無限のソウルを持つ者がたどり着けば、<line-break>究極のソウルを宿すといわれています。<line-break>あなたには普通の人間と違う力を感じます。<line-break>だから、このような秘密までも明かして<line-break>しまうのでしょうか…。<end>古の樹海には、エルフの聖地があります。<line-break>そこに無限のソウルを持つ者がたどり着けば、<line-break>究極のソウルを宿すといわれています。<line-break>あなたには普通の人間と違う力を感じます。<line-break>だから、このような秘密までも明かして<line-break>しまうのでしょうか…。<end>古の樹海には、エルフの聖地があります。<line-break>そこに無限のソウルを持つ者がたどり着けば、<line-break>究極のソウルを宿すといわれています。<line-break>あなたには普通の人間と違う力を感じます。<line-break>だから、このような秘密までも明かして<line-break>しまうのでしょうか…。<end>"
korean = "<select><value:$33>숲을 나와 여행하고 있는데…<line-break>세상은 인간으로 가득하군요.<line-break>우리 엘프 같은 요정 종족은 수가 적습니다….<line-break>모험 엘프의 시조 라뮤 님 말씀대로<line-break>엘프도 숲을 나와 활동하지 않으면<line-break>세계는 인간 종족만의 것이 되고 말 겁니다!<end>숲을 나와 여행하고 있는데…<line-break>세상은 인간으로 가득하군요.<line-break>우리 엘프 같은 요정 종족은 수가 적습니다….<line-break>모험 엘프의 시조 라뮤 님 말씀대로<line-break>엘프도 숲을 나와 활동하지 않으면<line-break>세계는 인간 종족만의 것이 되고 말 겁니다!<end>이 나라의 인간들은 우리 엘프 같은 요정 종족보다<line-break>자신들이 더 우월하다고 생각하는 겁니까!<line-break>우리를 대하는 태도는 도저히 용납할 수 없습니다.<line-break>숫자만 믿고 오만해진 인간은 반드시 대가를 치를 겁니다.<line-break>아니, 당신은 다르군요. 당신은 상대의 종족이나<line-break>태생 같은 건 신경 쓰지 않는 사람이니까요.<end>우리 엘프가 사는 숲에는 오모히키라 불리는<line-break>거대한 영목이 한 그루씩 있습니다. 오모히키는 줄기에<line-break>손을 대고 생각을 강하게 떠올리면 다른 오모히키로 마음이<line-break>전해지는 신비한 나무입니다. 각 엘프 숲의<line-break>지도자인 퀴다는 오모히키에 마음을 보내<line-break>서로 연락을 주고받습니다.<end>모험 엘프의 시조 라뮤 님은 약 ８００년 전에<line-break>함께 여행하던 동료들과 파괴신 울그의 부활을<line-break>꾀하던 사룡 엘아자르를 쓰러뜨렸다고 합니다.<end>고대 수해에는 엘프의 성지가 있습니다.<line-break>그곳에 무한의 소울을 지닌 자가 도달하면<line-break>궁극의 소울을 품게 된다고 합니다.<line-break>당신에게서는 평범한 인간과 다른 힘이 느껴집니다.<line-break>그래서 이런 비밀까지도 털어놓게<line-break>되는 걸까요….<end>고대 수해에는 엘프의 성지가 있습니다.<line-break>그곳에 무한의 소울을 지닌 자가 도달하면<line-break>궁극의 소울을 품게 된다고 합니다.<line-break>당신에게서는 평범한 인간과 다른 힘이 느껴집니다.<line-break>그래서 이런 비밀까지도 털어놓게<line-break>되는 걸까요….<end>고대 수해에는 엘프의 성지가 있습니다.<line-break>그곳에 무한의 소울을 지닌 자가 도달하면<line-break>궁극의 소울을 품게 된다고 합니다.<line-break>당신에게서는 평범한 인간과 다른 힘이 느껴집니다.<line-break>그래서 이런 비밀까지도 털어놓게<line-break>되는 걸까요….<end>"

