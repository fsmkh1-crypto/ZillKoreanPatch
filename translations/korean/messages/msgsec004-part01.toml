japanese = "<select><value:$33>レムオン公爵と王妃エリス様が　　　<line-break>宮廷で争っているあいだ、<line-break>地方のことなんてほったらかしだ。　<line-break>この南にあるノーブルってところじゃ<line-break>ボルボラっていう悪代官が<line-break>幅をきかしてるってさ。<end>この間の地震と世界中に響きわたるような<line-break>うなり声は聞いただろう？<line-break>あれは竜王の覚醒と呼ばれるものらしいぞ。<end>勇者ネメア、主君エリュマルク帝を廃し、　　<line-break>自らディンガル皇帝の座に着くってのが、<line-break>今一番世界を騒がせている事件だよ。<line-break>その昔、邪眼帝バロルが自分の仕えていた<line-break>皇帝を殺して帝位を奪い魔王となったように、<line-break>ネメアも魔王になるのかもな。<end>ロセンを攻め滅ぼしたディンガルの青竜将軍は　<line-break>若干１６歳の女の子なんだと。いや、ほんとに。<line-break>ロセンは弱体化してるっていうけどロセン王は<line-break>戦闘用モンスターをリベルダムから大量に買って<line-break>いたそうだから、決して弱くはないはずだぜ。<line-break>俺は彼女の実力は本物だと思うけどな。<end>ロセンの次はいきなり山越えでロストールかよ。<line-break>ロセンは東方の脅威だから攻めたのも納得できる<line-break>けど、ロストールを攻めてどうする気なんだ。<line-break>まさか、ネメアは征服帝ランガスターの真似でも<line-break>して世界を征服するつもりなのかよ。<line-break>魔王を倒した勇者の名が聞いてあきれるぜ。<end>リベルダムを占領するだけならまだしも、<line-break>破壊してしまうなんて、何を考えてるんだ！<line-break>ロセンを第２のリベルダムにするためかよ！<end>カルラがロストールに攻めてくるっていうのに、<line-break>貴族どもはつまらん権力争いを続けている。<line-break>国が滅んでも貴族でいられると思っているのか！<end>救世主エルファス様の予言通り、<line-break>世界の終わりが近づいているような気がするよ。<line-break>俺もガラじゃないが、神に祈ってみるか…。<end>"
korean = "<select><value:$33>레몬 공작과 왕비 에리스 님이　　　<line-break>궁정에서 다투는 동안<line-break>지방 일은 완전히 내버려 두고 있어.　<line-break>남쪽의 노블이라는 곳에서는<line-break>볼보라라는 악덕 대관이<line-break>설치고 있다더군.<end>지난번 지진과 온 세상에 울려 퍼지는 듯한<line-break>울음소리, 들었지?<line-break>그걸 용왕의 각성이라고 부른다더군.<end>용사 네메아가 주군 에류마르크 황제를 폐하고　　<line-break>스스로 딘갈 황제 자리에 오른 사건이<line-break>지금 세상을 가장 떠들썩하게 하고 있어.<line-break>옛날 사안제 바로르가 자신이 섬기던<line-break>황제를 죽이고 제위를 빼앗아 마왕이 되었듯,<line-break>네메아도 마왕이 될지도 모르지.<end>로센을 멸망시킨 딘갈의 청룡장군은　<line-break>겨우 １６살짜리 여자애라더군. 아니, 진짜야.<line-break>로센이 약해졌다지만 로센 왕은<line-break>전투용 몬스터를 리베르담에서 대량으로 사들였다니<line-break>결코 약한 나라는 아니었을 거야.<line-break>나는 그 애 실력이 진짜라고 생각해.<end>로센 다음에는 갑자기 산을 넘어 로스톨이라니.<line-break>로센은 동방의 위협이니 공격한 건 이해하겠는데<line-break>로스톨을 공격해서 어쩌려는 거지.<line-break>설마 네메아는 정복제 랑가스터를 흉내 내<line-break>세계를 정복할 생각인 건가.<line-break>마왕을 쓰러뜨린 용사라는 이름이 아깝군.<end>리베르담을 점령하는 것까지는 몰라도<line-break>파괴해 버리다니, 대체 무슨 생각이야!<line-break>로센을 제２의 리베르담으로 만들려는 건가!<end>카를라가 로스톨로 쳐들어온다는데도<line-break>귀족들은 시시한 권력 다툼을 계속하고 있어.<line-break>나라가 망해도 귀족으로 남을 수 있다고 생각하나!<end>구세주 엘파스 님의 예언대로<line-break>세계의 종말이 다가오는 것 같은 기분이야.<line-break>나답지는 않지만 신에게 기도라도 해 볼까….<end>"

