["2540004"]
japanese = "結局、いかなる運命の力でさえ<line-break>人の意志を支配することは<line-break>できないということか…。<line-break>君は証明してくれた、<line-break>　<line-break>　<line-break>すべては人の生まれによって<line-break>決められるのではなく、その後の<line-break>生き方によって、定まるのだと。<line-break><value:$28>は人々の希望だよ。<line-break>人類の可能性を見つめ、未来を<line-break>切り開いていくための道しるべ…。<end>"
korean = "결국 어떤 운명의 힘도 인간의 의지를 지배할 수는 없다는 건가…. 네가 증명해 줬어. 모든 것은 태어날 때 정해지는 게 아니라 그 뒤 어떻게 살아가느냐에 따라 정해진다는 것을. <value:$28>는 사람들의 희망이야. 인류의 가능성을 바라보며 미래를 열어 가기 위한 이정표….<end>"

