korean = "지금 와 생각해 보면 바로 네가 인류의 혁신을 맡기에 가장 어울리는 존재였던 것 같다. 인류의 혁신이란 인간의 의지로, 인간 자신의 힘으로 진화해 가는 것이니까…. 너와 함께 이룬 일을 나는 자랑스럽게 생각한다.<end>"

