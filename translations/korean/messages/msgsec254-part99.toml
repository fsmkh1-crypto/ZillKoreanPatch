japanese = "愉快だとは思わないか？<line-break>いかに吟遊の名手、リルビーでも<line-break>思いつくまい。<line-break>人類の革新に命をかけ、運命と闘い、<line-break>世界の未来を勝ち取った者が<line-break>　<line-break>みずからの驕りと、魔道技術への<line-break>過信ゆえに滅んだ愚かな王によって<line-break>造られた人間であることを…。<end>"
