["1690004"]
japanese = "新たなノーブルはいかがかしら。<line-break>ボルボラに怯えながら暮らしていたのが<line-break>ウソみたいでしょう？<end>"
korean = "새로운 노블은 어때요? 볼보라를 두려워하며 살던 게 거짓말 같죠?<end>"

["1690005"]
japanese = "ボルボラがいなくなったから、<line-break>パパもママも笑うようになったんだ。<line-break>だから毎日たのしーんだ。<line-break>今日もいい子になったリルビーに<line-break>遊んでもらおっと！<end>"
korean = "볼보라가 없어져서 아빠도 엄마도 웃게 됐어. 그래서 매일 즐거워. 오늘도 착한 아이가 된 릴비랑 놀아야지!<end>"

["1690006"]
japanese = "ボルボラがいなくなったから、<line-break>よその人と話してもいいって<line-break>ママが言ったんだ。だ・か・ら…　　<line-break>ノーブルの町へ<line-break>ようこそ！<line-break>…なんちゃって。<end>"
korean = "볼보라가 없어졌으니 다른 사람이랑 이야기해도 된다고 엄마가 그랬어. 그·러·니… 노블 마을에 어서 오세요! …농담이야.<end>"

["1690007"]
japanese = "ぼくはボルボラの手下として、<line-break>町の人にひどいことをしてました。<line-break>今はとーっても深く反省してますです。<line-break>世の中に悪が栄えたためしなしって<line-break>言いますが、本当なんですね。<end>"
korean = "저는 볼보라의 부하로서 마을 사람들에게 나쁜 짓을 했었습니다. 지금은 아~주 깊이 반성하고 있습니다. 세상에 악이 번성한 적은 없다고들 하는데 정말이네요.<end>"

["1690014"]
japanese = "ボルボラがいなくなって、<line-break>この町もずいぶん活気が出てきましたな。<line-break>昔は雰囲気が暗い町だったのですよ。<line-break>今は昔の悪夢を振り払うみたいに、<line-break>明るくなっています。<end>"
korean = "볼보라가 사라지고 이 마을도 제법 활기를 되찾았습니다. 예전엔 분위기가 어두운 마을이었죠. 지금은 옛 악몽을 떨쳐 내듯 밝아지고 있습니다.<end>"

["1690016"]
