japanese = "<select><value:$33>女神ライラネートよ、私の息子が軍隊に<line-break>入りました。貧しい我が家のため私に内緒で<line-break>入隊したのです。息子をどうかお守りください。<end>女神ライラネートよ、愛する息子が軍隊に<line-break>入りました。貧しい我が家のため私に内緒で<line-break>入隊したのです。息子をどうかお守りください。<end>女神ライラネートよ、息子から手紙とお金が<line-break>届きました。息子は家族のために少ない給料の<line-break>中から半分以上も送ってくれたのです…。<line-break>息子は新しく青竜将軍に任命されたカルラ様の<line-break>下で戦うことになったそうです。どうか息子に<line-break>戦神ソリアスの加護をお与えください。<end>女神ライラネートよ、息子が所属している<line-break>東方攻略軍がロセンを攻め落としたそうです。　<line-break>でも、息子からは何の連絡もありません…。<line-break>どうか、息子の身に何も起きていませんように、<line-break>そして息子が無事に帰って来ますように、<line-break>女神様どうかお願いします…。<end>女神ライラネートよ、息子からやっと手紙が<line-break>届きました。息子はロセン攻めの際、矢傷を<line-break>負ったそうですが、軽傷ですんだとのこと。<line-break>これもライラネート様とソリアス様の<line-break>ご加護だと感謝しております。<line-break>どうか今後も息子をお守りください…。<end>女神ライラネートよ、息子の犯した罪をお許し<line-break>ください。息子はカルラ将軍の命令とはいえ<line-break>リベルダムを破壊し、罪なき人を苦しめました。<line-break>息子に対する罰は私が受けますので、<line-break>どうか今まで通り息子をお守りください。<line-break>息子が無事に帰ってくるようお願いします…。<end>女神ライラネートよ、息子が戦うロストールの<line-break>司令官は、アンギルダン将軍を破ったゼネテス<line-break>だと聞きました。<line-break>どうか息子が、無事に帰って来ますように、<line-break>ゼネテスの卑劣な罠で、命を落とすことの<line-break>ないようにお願いします…。<end>ああ…なんということでしょう…　　　　　　　<line-break>ネメア陛下が崩御されたなんて…。<line-break>女神ライラネートよ、教えてください。<line-break>敵地にいる私の息子は無事でしょうか、<line-break>ネメア様の死を知って勢いづいたロストール軍に<line-break>攻められていないでしょうか…。<end>"
korean = "<select><value:$33>여신 라이라네이트여, 제 아들이 군대에 들어갔습니다. 가난한 집안을 위해 제게 말도 없이 입대했습니다. 부디 아들을 지켜 주세요.<end>여신 라이라네이트여, 사랑하는 아들이 군대에 들어갔습니다. 가난한 집안을 위해 제게 말도 없이 입대했습니다. 부디 아들을 지켜 주세요.<end>여신 라이라네이트여, 아들에게서 편지와 돈이 왔습니다. 적은 봉급에서 절반 넘게 가족에게 보내 줬어요…. 새로 청룡장군이 된 카를라 님 아래서 싸우게 됐다 합니다. 부디 전신 솔리아스의 가호를 내려 주세요.<end>여신 라이라네이트여, 아들이 속한 동방 공략군이 로센을 함락했다 합니다. 하지만 아들에게선 아무 연락도 없습니다…. 부디 아들이 무사하고 돌아오게 해 주세요….<end>여신 라이라네이트여, 드디어 아들 편지가 왔습니다. 로센 공격 때 화살에 맞았지만 가벼운 상처였대요. 이것도 라이라네이트 님과 솔리아스 님의 가호라 감사드립니다. 앞으로도 아들을 지켜 주세요….<end>여신 라이라네이트여, 아들의 죄를 용서해 주세요. 카를라 장군의 명령이었다지만 리벨덤을 파괴하고 죄 없는 사람들을 괴롭혔습니다. 벌은 제가 받을 테니 부디 아들을 지켜 주시고 무사히 돌아오게 해 주세요….<end>여신 라이라네이트여, 아들이 싸울 로스토올의 사령관은 앙길단 장군을 꺾은 제네테스라 들었습니다. 부디 아들이 무사히 돌아오고 비열한 함정에 목숨을 잃지 않게 해 주세요….<end>아아… 이럴 수가…. 네메아 폐하가 붕어하셨다니…. 여신 라이라네이트여, 적지의 제 아들은 무사한가요? 네메아 님의 죽음에 기세 오른 로스토올군에게 공격받고 있진 않나요….<end>"
