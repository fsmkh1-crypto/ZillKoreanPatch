japanese = "<select><value:$20>%4そこのお若いの、ここディンガル　　<line-break>魔道アカデミーの創始者マノン道師を<line-break>ご存知かな？<line-break>精霊力の行使法を現在のような<line-break>学問の形へ一般化したのが<line-break>何を隠そうマノン道師なんじゃよ。<end>マノン道師は９世紀末の人でな。天才魔道士と<line-break>呼ばれ、メガ・ディンガル帝の側近として<line-break>活躍したそうじゃ。<line-break>彼女が後進の育成のために創設したのが、<line-break>ここディンガル魔道アカデミーなんじゃよ。<line-break>ババの話も少しは役に立つじゃろうが？<end>メガ・ディンガル帝の死後、マノン道師は<line-break>魔道の塔にこもり、精霊力とソウルの関係を<line-break>研究することに生涯の後半を捧げたそうじゃ。<line-break>そのためか老いることもなく、いつまでも<line-break>少女のように若々しかったということじゃ。<line-break>ほんに、うらやましいことじゃてのう。<end>あんた、魔道の塔に登ったことはあるのかい？<line-break>もし、登っている途中で暖炉を見つけたなら<line-break>調べてみなされ。ババの知恵袋じゃて。<end>"
korean = "<select><value:$20>%4거기 젊은이, 이 딩갈 마도 아카데미의 창시자 마논 도사를 알고 있나? 정령력의 행사법을 지금처럼 학문의 형태로 일반화한 분이 바로 마논 도사라네.<end>마논 도사는 9세기 말 사람으로 천재 마도사라 불리며 메가 딩갈 황제의 측근으로 활약했다네. 그녀가 후진 양성을 위해 세운 곳이 바로 이 딩갈 마도 아카데미지. 이 할미 이야기도 조금은 도움이 되지?<end>메가 딩갈 황제가 죽은 뒤 마논 도사는 마도의 탑에 틀어박혀 정령력과 소울의 관계 연구에 생애 후반을 바쳤다더군. 그래서인지 늙지도 않고 언제까지나 소녀처럼 젊었다고 해. 정말 부러운 일이지.<end>자네, 마도의 탑에 올라가 본 적 있나? 올라가는 도중 난로를 발견하면 조사해 보게. 할미의 지혜주머니라네.<end>"

