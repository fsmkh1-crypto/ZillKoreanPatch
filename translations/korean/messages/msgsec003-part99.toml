["30002"]
japanese = "<select><value:$33>一度旅立ってしまうとしばらくは<line-break>帰れないぞ。後悔のないようにな。<end>いやー、このあいだの地震はすごかったな。<line-break>ノトゥーン神殿のシンボルともいえる<line-break>天井のステンドグラスが壊れるぐらいだものな。<end>ばんざーい！　とうとう皇帝ネメアの誕生だ！<line-break>ディンガル帝国の皇帝には、あの方こそ<line-break>ふさわしかったんだよ。<line-break>えっ、主君殺しだって？　とんでもない！<line-break>もともと玉座にはネメア様が座るべきなんだ。<line-break>それをエリュマルクから取り戻しただけだよ。<end>青竜将軍カルラの活躍は聞いたかい？<line-break>東方諸国をたった数週間で滅ぼして<line-break>しまうんだから彼女は間違いなく天才だよ。<line-break>あんなかわいい少女が戦争の天才だなんて<line-break>普通気づかないよなあ。彼女を見いだして<line-break>将軍に任命したネメア様はすばらしいね。<end>アンギルダン将軍の山越え作戦は歴史に残るね。<line-break>ロストール軍も壊滅的だっていうし、<line-break>我がディンガルに、敵はなしだな。<line-break>えっ！？<line-break>ロストールのゼネテスにアンギルダン将軍が<line-break>敗れたって？　じょ、冗談だろ？<end>青竜将軍カルラが、リベルダムを占領したね。<line-break>なんでも、大商人のアンティノを使って<line-break>門を、中から開けさせたそうだよ。<line-break>難攻不落の城壁も、内側から攻められれば<line-break>ただの壁ってことだね。<line-break>しっかし、カルラ将軍は戦いの天才だね。<end>いよいよカルラ将軍がロストール攻略を<line-break>開始するそうだね。<line-break>ネメア陛下の世界統一も時間の問題だね。<end>ネメア様が行方不明なんて根も葉もない噂が<line-break>流れているけど、信じるものか！<line-break>魔王バロルを倒した勇者が、死ぬわけがない！<end>"
korean = "<select><value:$33>한번 여행을 떠나면 한동안 돌아올 수 없어. 후회 없도록 해.<end>이야, 지난번 지진은 대단했지. 노툰 신전의 상징이라 할 천장 스테인드글라스가 부서질 정도였으니까.<end>만세! 드디어 황제 네메아의 탄생이다! 딩갈 제국의 황제는 그분이야말로 어울려. 뭐? 주군 살해라고? 말도 안 돼! 원래 옥좌에는 네메아 님이 앉아야 했어. 에류마르크에게서 되찾았을 뿐이지.<end>청룡장군 카를라의 활약 들었어? 동방 여러 나라를 겨우 몇 주 만에 멸망시켰으니 틀림없이 천재야. 저렇게 귀여운 소녀가 전쟁 천재라니 보통은 모르지. 그녀를 알아보고 장군으로 임명한 네메아 님은 대단해.<end>앙길단 장군의 산악 돌파 작전은 역사에 남을 거야. 로스토올군도 괴멸적이라니 우리 딩갈에는 적이 없군. 뭐!? 로스토올의 제네테스에게 앙길단 장군이 졌다고? 노, 농담이지?<end>청룡장군 카를라가 리벨덤을 점령했네. 대상인 안티노를 이용해 문을 안에서 열게 했다더군. 난공불락의 성벽도 안쪽에서 공격당하면 그냥 벽이라는 거지. 정말 카를라 장군은 전투의 천재야.<end>드디어 카를라 장군이 로스토올 공략을 시작한다더군. 네메아 폐하의 세계 통일도 시간문제야.<end>네메아 님이 행방불명이라는 터무니없는 소문이 돌지만 믿을 수 없어! 마왕 발로르을 쓰러뜨린 용사가 죽을 리가 없잖아!<end>"

["30007"]
japanese = "<select><value:$33>エリュマルク陛下もひどいお方だよ。　　　　　<line-break>ネメア様に無理難題ばかりふっかけて<line-break>成し遂げられなかったら罰を与えようなんてさ。<line-break>もっともネメア様はすべての無理難題を成し遂げ<line-break>てしまったから、陛下もくやしかったろうね。<line-break>これでネメア様の株がますます上がっちゃうよ。<end>ネメア様がとうとう皇帝を見限って　　<line-break>エンシャントから逃げ出したって噂は<line-break>どうも本当のことらしいよ。<line-break>皇帝のネメア様に対する嫌がらせも<line-break>ひどいもんだったからねえ。<line-break>ネメア様も今までよく耐えたと思うよ。<end>とうとう来るべき時が来てしまったねえ。　　<line-break>殺されたエリュマルク帝も自業自得だよ。<line-break>ネメア様も皇帝殺しを恥じることはないさ。<line-break>あれだけ無理難題を押しつけられても黙って<line-break>耐えて、しかもすべて成し遂げてきたのだから。<line-break>悪いのはどう考えてもエリュマルク帝だよ。<end>東方の国はぜーんぶ滅ぼされたそうじゃないか。<line-break>ロセンのペウダはひどいことばかりしていた<line-break>そうだから、親族皆殺しも当然の報いだよ。<end>ロストールの将軍は能なしばかりだと　<line-break>思っていたけど、ゼネテスってのは<line-break>それなりにできるみたいじゃないか。<line-break>だけど、カルラ将軍やネメア様には、<line-break>到底かなわないだろうさ。<line-break>ロストールが滅ぶのも時間の問題だよ。<end>リベルダムは、カルラ将軍によって破壊された<line-break>そうだよ。たぶん、逆らう者への見せしめだと<line-break>思うけど、やりすぎのような気がするねぇ。<end>ネメア様はロストール攻略に参加しないのかね。<line-break>宿敵ロストールとの戦いくらい、ネメア様が<line-break>出陣することを期待していたんだけどねぇ。<end>ネメア様が死んだなんて噂が流れているけど、<line-break>あれはロストールのゼネテスが流した<line-break>デマだそうだよ。<line-break>ネメア様が死んだなんて、信じる人間は<line-break>ディンガルにいるわけがないってのに、<line-break>ゼネテスって男もバカだねぇ。<end>"
korean = "<select><value:$33>에류마르크 폐하도 너무하신 분이야. 네메아님께 무리한 일만 떠넘기고 못 해내면 벌을 주려 했다니. 하지만 네메아님은 그 무리한 일들을 전부 해내셨으니 폐하도 분했겠지. 이걸로 네메아님의 평판은 더 올라가겠네.<end>네메아님이 마침내 황제를 버리고 엔샨트에서 도망쳤다는 소문은 아무래도 사실인 모양이야. 황제가 네메아님을 괴롭힌 것도 너무 심했으니까. 네메아님도 지금까지 정말 잘 참았다고 생각해.<end>마침내 올 때가 왔구나. 죽은 에류마르크 황제도 자업자득이야. 네메아님도 황제를 죽인 걸 부끄러워할 필요 없어. 그렇게 무리한 일을 떠맡기면서도 묵묵히 참고, 게다가 전부 해냈잖아. 아무리 생각해도 잘못한 건 에류마르크 황제야.<end>동방의 나라들은 전부 멸망했다면서. 로센의 페우다는 나쁜 짓만 했다고 하니 친족이 몰살당한 것도 당연한 대가야.<end>로스토올 장군들은 무능한 놈들뿐인 줄 알았는데 제네테스라는 녀석은 제법 하는 모양이네. 그래도 카를라 장군이나 네메아님에겐 도저히 상대가 안 되겠지. 로스토올이 멸망하는 것도 시간문제야.<end>리벨덤은 카를라 장군에게 파괴됐다더라. 아마 거역하는 자들에게 본보기를 보인 거겠지만, 너무 지나친 것 같아.<end>네메아님은 로스토올 공략에 참가하지 않으시는 건가. 숙적 로스토올과의 싸움 정도는 네메아님이 출진하시길 기대했는데.<end>네메아님이 죽었다는 소문이 돌고 있지만 그건 로스토올의 제네테스가 퍼뜨린 거짓말이라더라. 네메아님이 죽었다고 믿을 사람이 딩갈에 있을 리도 없는데, 제네테스라는 남자도 바보네.<end>"

["30009"]
japanese = "<select><value:$33>ここはディンガル帝国の首都エンシャントよ。<end>ねえ、聞いた聞いた？　どんなにひどい仕打ちを<line-break>受けても耐えていたネメア様も、とうとう<line-break>エリュマルク帝を見限って出奔したそうよ。<line-break>城勤めの友達の情報なんだけど、ネメア様の<line-break>人気を妬んだエリュマルク帝が無実の罪で<line-break>ネメア様を処刑しようとしたのが原因みたいよ。<end>ねえねえ、聞いた聞いた？　再編成された　　　<line-break>ディンガル軍にはディンガル統一戦争で活躍した<line-break>アンギルダン将軍が戻ってきたんですって。<line-break>驚くのはまだ早いわよ、若干１６歳の少女が<line-break>将軍の１人として大抜擢されたらしいのよ。<line-break>ネメア様も大胆な人事をされるわね。<end>ねえねえねえ、あなた知ってる？　　　　　　<line-break>例の若干１６歳で青竜将軍に任命された少女、<line-break>カルラって娘なんだけど、大活躍なのよ。<line-break>ロセンを含む東方の６国家をたったの数週間で<line-break>滅ぼしちゃったの。たったの数週間よ！<line-break>私が保証するわ、彼女は戦争の天才よ。<end>ねえねえったらねえ、あなた知ってる？<line-break>名将アンギルダン将軍が、山越えの奇襲ってのを<line-break>成功させてロストール軍をやっつけたんだって。<line-break>でも、アンギルダン将軍がゼネテスっていう<line-break>冒険者上がりの男にやられたって話も聞いたわ。<line-break>どっちが本当なのかしら…。<end>あなた、リベルダムって知っているかしら？　<line-break>ここの南にある大きな町なの。<line-break>そこを天才カルラ将軍が占領したんだって。<line-break>でもね、せっかく占領したのにめちゃめちゃに<line-break>壊しちゃったみたいなの。<line-break>もう闘技場で試合観戦はできないのねぇ。<end>もう、知っていると思うけど、カルラ将軍が<line-break>ロストール攻略を開始するんだって。<line-break>ゼネテスとカルラ将軍、どっちが勝つかな。<end>ねえねえ、すごい情報があるんだけど。<line-break>ネメア様が死んだって噂がロストールを中心に<line-break>流れているんだって。<line-break>これって、ロストールのゼネテスの作戦よ。<line-break>この噂で動揺させるつもりに違いないわ。<line-break>ひっかかったらダメだからね。<end>"
korean = "<select><value:$33>여기는 딩갈 제국의 수도 엔샨트야.<end>있잖아, 들었어? 아무리 심한 대우를 받아도 참던 네메아 님이 결국 에류마르크 황제를 버리고 떠났대. 성에서 일하는 친구 말로는 네메아 님의 인기를 질투한 황제가 누명을 씌워 처형하려 한 게 원인이라더라.<end>들었어? 재편된 딩갈군에 통일전쟁에서 활약한 앙길단 장군이 돌아왔대. 게다가 겨우 16살 소녀가 장군으로 발탁됐다더라. 네메아 님도 정말 대담한 인사야.<end>있잖아, 알아? 16살에 청룡장군으로 임명된 카를라라는 소녀가 엄청 활약했대. 로센을 포함한 동방 6개국을 불과 몇 주 만에 멸망시켰어. 내가 보증해, 전쟁의 천재야.<end>있잖아, 알아? 명장 앙길단 장군이 산을 넘는 기습으로 로스토올군을 물리쳤대. 그런데 앙길단이 제네테스라는 모험자 출신 남자에게 당했다는 말도 들었어. 어느 쪽이 진짜일까….<end>리벨덤 알아? 남쪽에 있는 큰 도시인데 천재 카를라 장군이 점령했대. 그런데 점령해 놓고 완전히 부숴 버린 모양이야. 이제 투기장 경기는 못 보겠네.<end>이미 알겠지만 카를라 장군이 로스토올 공략을 시작한대. 제네테스와 카를라 장군, 누가 이길까.<end>대단한 정보가 있어. 네메아 님이 죽었다는 소문이 로스토올을 중심으로 퍼지고 있대. 분명 제네테스의 작전이야. 이 소문으로 동요시키려는 거지. 속으면 안 돼.<end>"

["30010"]
japanese = "<select><value:$20>%2あなた冒険者なら賢者の森に入ったことある？<line-break>勇者ネメアと一緒に魔王バロルと戦った賢者が<line-break>猫に囲まれて住んでいるって本当なのかしら。<line-break>あっ、でもよく考えたら普通の人は入れない<line-break>らしいから、あなたも入れないわけよね。<line-break>もし入れたら普通じゃないってことだもの。<end>故郷のテラネにはコーンス族の男の子がいたの。<line-break>でも、エンシャントではコーンス族って見たこと<line-break>ないわ。コーンス族の数が減ってるのは本当ね。<end>"
korean = "<select><value:$20>%2당신 모험자라면 현자의 숲에 들어가 본 적 있어? 용자 네메아와 함께 마왕 발로르과 싸운 현자가 고양이들에 둘러싸여 살고 있다는 게 정말일까. 아, 하지만 생각해 보니 보통 사람은 못 들어간다니까 당신도 못 들어가겠네. 들어갈 수 있으면 보통 사람이 아니라는 뜻이니까.<end>고향 테라네에는 코른스족 남자아이가 있었어. 그런데 엔샨트에서는 코른스족을 본 적이 없어. 코른스족 수가 줄고 있다는 건 사실인가 봐.<end>"

["30017"]
japanese = "<select><value:$20>%2武器や防具に精霊の力を宿すエンチャント魔法は<line-break>ルーンファイターのソウルを宿した者だけが<line-break>使えるそうです。<end>魔法を使うとＭＰを消費するのはご存知ですね。<line-break>ＭＰが０になると気絶してしまうので、<line-break>魔法の使いすぎには注意してくださいね。<end>"
korean = "<select><value:$20>%2무기와 방어구에 정령의 힘을 깃들이는 인챈트 마법은 룬 파이터의 소울을 지닌 사람만 사용할 수 있다고 합니다.<end>마법을 쓰면 MP를 소비하는 건 알고 있죠? MP가 0이 되면 기절하니 마법을 너무 많이 쓰지 않도록 조심하세요.<end>"

["30018"]
japanese = "<select><value:$20>%2魔法の講義って属性の話ばかりで<line-break>す～ぐ眠くなっちゃうの。<line-break>火が水に強くて、水が土に強くて…。<end>属性は火、水、土、風の４属性以外にも聖と闇の<line-break>２属性があるの。どちらも火、水、土、風より<line-break>強い属性で聖と闇では聖属性のほうが強いのよ。<end>"
korean = "<select><value:$20>%2마법 강의는 속성 이야기만 해서 금방 졸려. 불은 물에 강하고, 물은 땅에 강하고….<end>속성에는 불, 물, 땅, 바람 네 속성 말고도 성과 암 두 속성이 있어. 둘 다 불·물·땅·바람보다 강한 속성이고, 성과 암 중에서는 성 속성이 더 강해.<end>"

