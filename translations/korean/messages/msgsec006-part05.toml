korean = "<select><value:$33>과연 대륙 제일이라 불리는 리벨덤 길드답군. 로스토올와는 차원이 달라.<end>과연 대륙 제일이라 불리는 리벨덤 길드답군. 로스토올와는 차원이 달라.<end>현상범이었던 앙길단도, 이젠 주작장군이 됐잖아. 역시 실력과 인망이 있는 사람은 다르군.<end>엔샨트로 돌아가지 않고 로센에 눌러앉았다는 건…, 카를라는 전쟁을 계속할 생각이라는 거겠지. 다음엔 어디를 공격하려는 걸까?<end>앙길단이 로스토올를 공격했다면, 역시 카를라의 다음 공략 목표는 여기겠군. 하지만 이곳 방어는 단단해. 어떻게 공격하려는 거지?<end>설마 안티노를 이용할 줄이야… 그 녀석은 자기 이익을 위해서라면 뭐든 하는 남자야. 이번 작전에는 딱 맞는 인간이지.<end>카를라군은 연전연승이라 사기도 높고, 무엇보다 거의 피해가 없어. 그에 비해 로스토올군은 병력이 부족하고 실전 경험도 적지. 아무리 생각해도 로스토올가 질 것 같지만, 지휘관이 그 제네테스라 기대하게 되는군.<end>솔직히 네메아가 죽었다는 건 믿기 어렵지만, 딘갈의 혼란상을 보면 사실인 것 같군.<end>"
layout = "<select><value:$33>과연 대륙 제일이라 불리는<line-break>리벨담 길드답군.<line-break>로스토르와는 차원이 달라.<end>과연 대륙 제일이라 불리는<line-break>리벨담 길드답군.<line-break>로스토르와는 차원이 달라.<end>현상범이었던 앙길단도,<line-break>이젠 주작장군이 됐잖아.<line-break>역시 실력과 인망이 있는 사람은 다르군.<end>엔션트로 돌아가지 않고 로센에 눌러앉았다는 건…,<line-break>카를라는 전쟁을 계속할 생각이라는 거겠지.<line-break>다음엔 어디를 공격하려는 걸까?<end>앙길단이 로스토르를 공격했다면,<line-break>역시 카를라의 다음 공략 목표는 여기겠군.<line-break>하지만 이곳 방어는 단단해. 어떻게 공격하려는 거지?<end>설마 안티노를 이용할 줄이야…<line-break>그 녀석은 자기 이익을 위해서라면 뭐든 하는 남자야.<line-break>이번 작전에는 딱 맞는 인간이지.<end>카를라군은 연전연승이라 사기도 높고, 무엇보다<line-break>거의 피해가 없어. 그에 비해 로스토르군은<line-break>병력이 부족하고 실전 경험도 적지.<line-break>아무리 생각해도 로스토르가 질 것 같지만,<line-break>지휘관이 그 제네테스라 기대하게 되는군.<end>솔직히 네메아가 죽었다는 건<line-break>믿기 어렵지만, 딘갈의 혼란상을<line-break>보면 사실인 것 같군.<end>"

