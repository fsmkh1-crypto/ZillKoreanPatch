name: U6 warning census

on:
  push:
    branches:
      - audit/U6-warning-population
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build current-source CLI
        run: go build -o /tmp/zill-u6 ./cmd/zill
      - name: Residual warning ownership census
        shell: bash
        run: |
          set -euo pipefail
          /tmp/zill-u6 korean-check > /tmp/u6.log 2>&1
          grep -E 'FORENSIC KOREAN_ENGLISH_(CONTRACT_CHAIN|WARNING |WARNING_SUMMARY)' /tmp/u6.log > /tmp/u6-summary.log || true
          if [ ! -s /tmp/u6-summary.log ]; then
            echo 'U6_CENSUS_MISSING_OUTPUT'
            tail -n 120 /tmp/u6.log
            exit 1
          fi
          cat /tmp/u6-summary.log
