name: U6 warning census

on:
  push:
    branches:
      - audit/U6-warning-population
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Residual warning ownership census
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/release -run '^TestCurrentKoreanCorpusEnglishConsumerStorageContracts$' -count=1 -v > /tmp/u6.log 2>&1
          grep -E 'FORENSIC (U6_WARNING_SUMMARY|U6_ITEM_DESCRIPTION_WARNING_IDS|KOREAN_DIALOGUE_REFLOW_SUMMARY|KOREAN_ENGLISH_WARNING_CENSUS|KOREAN_CONSUMER_STORAGE_SUMMARY)' /tmp/u6.log > /tmp/u6-summary.log || true
          if [ ! -s /tmp/u6-summary.log ]; then
            echo 'U6_CENSUS_MISSING_OUTPUT'
            tail -n 120 /tmp/u6.log
            exit 1
          fi
          cat /tmp/u6-summary.log
