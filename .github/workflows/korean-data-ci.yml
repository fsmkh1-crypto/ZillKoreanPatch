name: Korean data CI

on:
  pull_request:
    paths:
      - 'translations/korean/messages/**'
      - 'release/korean/font/glyphs.toml'
      - 'work/korean-results/**'
      - 'work/korean-staging/**'
  push:
    paths:
      - 'translations/korean/messages/**'
      - 'release/korean/font/glyphs.toml'
      - 'work/korean-results/**'
      - 'work/korean-staging/**'

permissions:
  contents: read

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: python3 -m py_compile tools/korean/*.py
      - run: python3 -m unittest discover -s tools/korean -p 'test_*.py'
      - run: ./zill korean-check
      - run: ./zill korean-font-check
