name: Korean data CI

on:
  pull_request:
    paths:
      - 'translations/korean/messages/**'
      - 'release/korean/font/glyphs.toml'
      - 'work/korean-results/**'
      - 'work/korean-staging/**'
      - 'tools/korean/**'
      - '.github/workflows/korean-data-ci.yml'
  push:
    paths:
      - 'translations/korean/messages/**'
      - 'release/korean/font/glyphs.toml'
      - 'work/korean-results/**'
      - 'work/korean-staging/**'
      - 'tools/korean/**'
      - '.github/workflows/korean-data-ci.yml'

permissions:
  contents: read

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: python3 -m py_compile tools/korean/*.py
      - run: python3 -m unittest discover -s tools/korean -p 'test_*.py'
      - run: ./zill korean-check
      - run: ./zill korean-font-check
      - name: Run whole-corpus QA-1 integrity scan
        run: python3 tools/korean/qa-integrity.py --json /tmp/korean-qa-integrity.json --max-examples 40
      - name: Upload QA-1 integrity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: korean-qa-integrity
          path: /tmp/korean-qa-integrity.json
          if-no-files-found: warn
