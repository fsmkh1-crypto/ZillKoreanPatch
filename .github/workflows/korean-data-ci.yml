name: Korean data CI

on:
  pull_request:
    paths:
      - 'translations/korean/messages/**'
      - 'translations/terminology/korean-canonical.toml'
      - 'release/korean/font/glyphs.toml'
      - 'work/korean-results/**'
      - 'work/korean-staging/**'
      - 'tools/korean/**'
      - '.github/workflows/korean-data-ci.yml'
  push:
    paths:
      - 'translations/korean/messages/**'
      - 'translations/terminology/korean-canonical.toml'
      - 'release/korean/font/glyphs.toml'
      - 'work/korean-results/**'
      - 'work/korean-staging/**'
      - 'tools/korean/**'
      - '.github/workflows/korean-data-ci.yml'

permissions:
  contents: read

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: python3 -m py_compile tools/korean/*.py
      - run: python3 -m unittest discover -s tools/korean -p 'test_*.py'
      - run: python3 tools/korean/audit-korean-glyph-repertoire.py
      - name: Require zero Korean layout lexical drift
        run: python3 tools/korean/qa-layout-drift.py
      - run: ./zill korean-check
      - run: ./zill korean-font-check
      - name: Run whole-corpus QA-1 integrity scan
        run: python3 tools/korean/qa-integrity.py --json /tmp/korean-qa-integrity.json --max-examples 40
      - name: Run QA-2 canonical terminology scan
        run: python3 tools/korean/qa-terminology.py --json /tmp/korean-qa-terminology.json --max-examples 60
      - name: Run QA-3 repeated-source consistency scan
        run: python3 tools/korean/qa-consistency.py --json /tmp/korean-qa-consistency.json --max-examples 40
      - name: Require zero actionable QA-3 inconsistencies
        run: |
          python3 - <<'PY'
          import json
          q=json.load(open('/tmp/korean-qa-consistency.json',encoding='utf-8'))
          print(f"QA-3 raw groups={q['inconsistent_groups']} records={q['inconsistent_records']}")
          print(f"QA-3 contextual exceptions={q['contextual_exception_groups']} actionable={q['actionable_inconsistent_groups']}")
          if q['actionable_inconsistent_groups'] != 0 or q['actionable_inconsistent_records'] != 0:
              raise SystemExit('actionable QA-3 inconsistencies remain')
          PY
      - name: Triage QA-3 inconsistencies by risk
        run: python3 tools/korean/qa-consistency-triage.py --json /tmp/korean-qa-consistency-triage.json --max-examples 40
      - name: Run QA-4 speaker voice hazard scan
        run: python3 tools/korean/qa-voice.py --json /tmp/korean-qa-voice.json --max-examples 80
      - name: Run Korean text sanity scan
        run: python3 tools/korean/qa-text-sanity.py --json /tmp/korean-qa-text-sanity.json --max-examples 80
      - name: Upload Korean QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: korean-qa-reports
          path: |
            /tmp/korean-qa-integrity.json
            /tmp/korean-qa-terminology.json
            /tmp/korean-qa-consistency.json
            /tmp/korean-qa-consistency-triage.json
            /tmp/korean-qa-voice.json
            /tmp/korean-qa-text-sanity.json
          if-no-files-found: warn
