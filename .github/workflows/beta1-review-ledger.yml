name: Beta1 review ledger v2

on:
  push:
    branches:
      - milestone/Beta1
    paths:
      - 'translations/korean/messages/**'
      - 'docs/audit/beta1-contextual-copyedit-*-reviewed.json'
      - 'docs/audit/beta1-context-review-scopes.json'
      - 'docs/audit/beta1-context-review-commits.json'
      - 'tools/korean/known-source-anomalies.toml'
      - 'tools/korean/build-beta1-review-ledger.py'
      - '.github/workflows/beta1-review-ledger.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: milestone/Beta1
          path: korean
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: HK47196/zill
          ref: a98d9ce29f361d666ec23da0dcfd351f24537ffd
          path: english
      - name: Build stale-proof review ledger
        working-directory: korean
        run: |
          python3 tools/korean/build-beta1-review-ledger.py --english-root ../english
          git diff --check
      - name: Commit generated review coverage
        working-directory: korean
        run: |
          if [ -z "$(git status --porcelain -- translations/korean/review-ledger.jsonl docs/audit/beta1-review-coverage.md docs/audit/beta1-review-groups.json)" ]; then
            echo 'Review ledger already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add translations/korean/review-ledger.jsonl docs/audit/beta1-review-coverage.md docs/audit/beta1-review-groups.json
          git commit -m 'audit: refresh stale-proof Beta1 review ledger v2'
          git fetch origin milestone/Beta1
          git rebase origin/milestone/Beta1
          git push origin HEAD:milestone/Beta1
