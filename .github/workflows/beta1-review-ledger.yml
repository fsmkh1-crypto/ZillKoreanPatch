name: Beta1 review ledger structural refresh

on:
  push:
    branches:
      - milestone/Beta1
    paths:
      - 'translations/korean/messages/**'
      - 'docs/audit/beta1-contextual-copyedit-*-reviewed.json'
      - 'docs/audit/beta1-context-review-scopes.json'
      - 'docs/audit/beta1-context-review-commits.json'
      - 'release/layout/consumer-map.toml'
      - 'release/layout/categories.toml'
      - 'internal/layout/**'
      - 'internal/release/korean_consumer_storage_test.go'
      - 'tools/korean/known-source-anomalies.toml'
      - 'tools/korean/build-beta1-review-ledger.py'
      - 'tools/korean/build-beta1-review-consumer-map.py'
      - 'tools/korean/enrich-beta1-review-ledger.py'
      - 'tools/korean/analyze-beta1-review-distribution.py'
      - '.github/workflows/beta1-review-ledger.yml'
  workflow_dispatch:

concurrency:
  group: beta1-review-ledger-structural-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: milestone/Beta1
          path: korean
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: HK47196/zill
          ref: a98d9ce29f361d666ec23da0dcfd351f24537ffd
          path: english
      - uses: actions/setup-go@v7
        with:
          go-version-file: korean/go.mod
          cache-dependency-path: korean/go.sum
      - name: Export repository-derived runtime and storage evidence
        working-directory: korean
        run: |
          go test -v ./internal/release -run TestCurrentKoreanCorpusEnglishConsumerStorageContracts -count=1 | tee /tmp/beta1-review-runtime.log
          python3 tools/korean/build-beta1-review-consumer-map.py \
            --english-root ../english \
            --runtime-log /tmp/beta1-review-runtime.log \
            --output docs/audit/beta1-review-consumer-evidence.json
      - name: Build language-stale-proof review ledger
        working-directory: korean
        run: |
          python3 tools/korean/build-beta1-review-ledger.py --english-root ../english
          python3 tools/korean/enrich-beta1-review-ledger.py --consumer-map docs/audit/beta1-review-consumer-evidence.json
          python3 tools/korean/analyze-beta1-review-distribution.py
          git diff --check
      - name: Commit generated review evidence
        working-directory: korean
        run: |
          paths=(
            translations/korean/review-ledger.jsonl
            docs/audit/beta1-review-coverage.md
            docs/audit/beta1-review-groups.json
            docs/audit/beta1-review-consumer-evidence.json
            docs/audit/beta1-review-distribution.json
            docs/audit/beta1-review-distribution.md
          )
          if [ -z "$(git status --porcelain -- "${paths[@]}")" ]; then
            echo 'Review ledger already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${paths[@]}"
          git commit -m 'audit: refresh Beta1 review ledger v3 structural evidence'
          git fetch origin milestone/Beta1
          git rebase origin/milestone/Beta1
          git push origin HEAD:milestone/Beta1
