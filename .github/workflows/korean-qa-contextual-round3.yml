name: Korean QA contextual round 3

on:
  push:
    paths:
      - 'tools/korean/qa-fix-contextual-round3.py'
      - '.github/workflows/korean-qa-contextual-round3.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: translation/section001-batch2
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Baseline QA
        run: |
          python3 tools/korean/qa-consistency.py --json /tmp/before.json --max-examples 0
      - name: Apply contextual round 3
        run: python3 tools/korean/qa-fix-contextual-round3.py
      - name: Validate corpus
        run: |
          ./zill korean-check
          ./zill korean-font-check
          python3 tools/korean/qa-integrity.py --json /tmp/integrity.json --max-examples 20
          python3 tools/korean/qa-terminology.py --json /tmp/terms.json --max-examples 20
          python3 tools/korean/qa-consistency.py --json /tmp/after.json --max-examples 20
          python3 tools/korean/qa-text-sanity.py --json /tmp/sanity.json --max-examples 20
          python3 - <<'PY'
          import json
          b=json.load(open('/tmp/before.json',encoding='utf-8')); a=json.load(open('/tmp/after.json',encoding='utf-8'))
          i=json.load(open('/tmp/integrity.json',encoding='utf-8')); t=json.load(open('/tmp/terms.json',encoding='utf-8')); s=json.load(open('/tmp/sanity.json',encoding='utf-8'))
          critical=i.get('critical',[])
          crit_count=len(critical) if isinstance(critical,list) else int(critical or 0)
          print(f"QA-3: groups {b['inconsistent_groups']}->{a['inconsistent_groups']}; records {b['inconsistent_records']}->{a['inconsistent_records']}")
          print(f"QA-1 critical={crit_count} QA-2 mismatch={t['mismatch_count']} sanity={s['finding_count']}")
          if a['inconsistent_groups']>b['inconsistent_groups'] or a['inconsistent_records']>b['inconsistent_records']: raise SystemExit('QA-3 regressed')
          if crit_count!=0 or t['mismatch_count']!=0 or s['finding_count']!=0: raise SystemExit('validation failed')
          PY
      - name: Commit contextual normalization
        run: |
          if git diff --quiet -- translations/korean/messages; then echo 'No changes'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add translations/korean/messages
          git commit -m 'Normalize contextual Korean lines round 3'
          git push origin HEAD:translation/section001-batch2
