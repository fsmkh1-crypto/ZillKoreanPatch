name: Korean raster catalog

on:
  workflow_dispatch:
  push:
    paths:
      - 'translations/korean/**'
      - 'internal/koreanfont/**'
      - 'cmd/zill/korean_font_generate.go'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Fetch pinned UnDotum source font
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/UnDotum.ttf \
            https://raw.githubusercontent.com/deepin-community/fonts-unfonts-core/ef6c68f4f0beb2a03fcf460aa643d73389aac59a/UnDotum.ttf
          sha256sum /tmp/UnDotum.ttf
      - name: Generate current Korean raster catalog
        run: |
          mkdir -p build release/korean/font
          go run ./cmd/zill korean-font-generate \
            --font /tmp/UnDotum.ttf \
            --output build/korean-glyphs.toml
          test -s build/korean-glyphs.toml
          cp build/korean-glyphs.toml release/korean/font/glyphs.toml
      - name: Validate generated Korean raster catalog
        run: go run ./cmd/zill korean-font-check
      - uses: actions/upload-artifact@v4
        with:
          name: korean-glyphs
          path: build/korean-glyphs.toml
          if-no-files-found: error
          retention-days: 7
      - name: Commit generated catalog to translation branch
        if: github.event_name == 'push' && github.ref_name != 'main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/korean/font/glyphs.toml
          if git diff --cached --quiet; then
            echo 'Raster catalog already current'
            exit 0
          fi
          git commit -m 'Update generated Korean raster catalog'
          git push origin HEAD:${{ github.ref_name }}
