name: Beta1 reviewed copyedit queue

on:
  push:
    branches: [milestone/Beta1]
    paths:
      - 'docs/audit/beta1-copyedit-queue.json'

concurrency:
  group: beta1-reviewed-copyedit-queue
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: milestone/Beta1
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Read queue
        run: |
          python3 - <<'PY'
          import json,os,re
          q=json.load(open('docs/audit/beta1-copyedit-queue.json',encoding='utf-8'))
          if not q.get('enabled',True): raise SystemExit('queue disabled')
          m=re.search(r'beta1-contextual-copyedit-(\d{3})-reviewed\.json$',q['manifest'])
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write('MANIFEST='+q['manifest']+'\n')
              f.write('COMMIT_MESSAGE='+q['commit_message']+'\n')
              f.write('ALLOW_COMMA_SPACE='+('1' if q.get('allow_comma_space_variance') else '0')+'\n')
              f.write('REVIEW_BATCH='+(m.group(1) if m else '')+'\n')
          PY
      - name: Verify reviewed before-values
        run: |
          args=(--manifest "$MANIFEST" --json /tmp/review-before.json)
          if [ "$ALLOW_COMMA_SPACE" = 1 ]; then args+=(--allow-comma-space-variance); fi
          python3 tools/korean/apply-multifile-reviewed-copyedit.py "${args[@]}"
      - name: Apply reviewed values
        run: |
          args=(--manifest "$MANIFEST" --apply --json /tmp/review-apply.json)
          if [ "$ALLOW_COMMA_SPACE" = 1 ]; then args+=(--allow-comma-space-variance); fi
          python3 tools/korean/apply-multifile-reviewed-copyedit.py "${args[@]}"
      - name: Invalidate stale persisted layouts for re-derivation
        run: python3 tools/korean/qa-layout-drift.py --fix | tee /tmp/layout-invalidation.txt
      - name: Verify expected values and zero layout drift
        run: |
          args=(--manifest "$MANIFEST" --json /tmp/review-after.json)
          if [ "$ALLOW_COMMA_SPACE" = 1 ]; then args+=(--allow-comma-space-variance); fi
          python3 tools/korean/apply-multifile-reviewed-copyedit.py "${args[@]}"
          python3 tools/korean/qa-layout-drift.py
      - name: Require changes stay within manifest overlay files
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          m=json.load(open(os.environ['MANIFEST'],encoding='utf-8'))
          allowed={p for r in m['records'] for p in r['paths']}
          changed=set(filter(None,subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()))
          unexpected=changed-allowed
          if unexpected: raise SystemExit(f'unexpected changed files {sorted(unexpected)}; allowed={sorted(allowed)}')
          if not changed: raise SystemExit('reviewed batch produced no overlay changes')
          PY
          git diff --check
      - name: Per-batch Korean gates
        run: |
          python3 tools/korean/audit-korean-glyph-repertoire.py
          ./zill korean-check
          ./zill korean-font-check
          python3 tools/korean/qa-integrity.py --json /tmp/integrity.json --max-examples 20
          python3 tools/korean/qa-terminology.py --json /tmp/terminology.json --max-examples 20
          python3 tools/korean/qa-consistency.py --json /tmp/consistency.json --max-examples 20
          python3 tools/korean/qa-text-sanity.py --json /tmp/sanity.json --max-examples 20
      - name: English-consumer storage and effective-layout contract
        run: go test ./internal/release -run TestCurrentKoreanCorpusEnglishConsumerStorageContracts -count=1
      - name: Commit accepted reviewed batch and register review basis
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add translations/korean/messages
          git commit -m "$COMMIT_MESSAGE"

          # Rebase the semantic commit first, then capture the final SHA that will
          # actually be pushed. The workflow-level concurrency group prevents two
          # reviewed queue runs from entering this rebase/push window together.
          git fetch origin milestone/Beta1
          git rebase origin/milestone/Beta1
          semantic_sha="$(git rev-parse HEAD)"

          if [ -n "$REVIEW_BATCH" ]; then
            SEMANTIC_SHA="$semantic_sha" python3 - <<'PY'
          import json,os
          from pathlib import Path
          path=Path('docs/audit/beta1-context-review-commits.json')
          doc=json.loads(path.read_text(encoding='utf-8'))
          batch=os.environ['REVIEW_BATCH']
          sha=os.environ['SEMANTIC_SHA']
          commits=doc.setdefault('semantic_commits',{})
          old=commits.get(batch)
          if old and old != sha:
              raise SystemExit(f'review basis collision batch={batch}: existing={old} new={sha}')
          commits[batch]=sha
          path.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
            git add docs/audit/beta1-context-review-commits.json
            if ! git diff --cached --quiet; then
              git commit -m "audit: register Beta1 contextual copyedit ${REVIEW_BATCH} review basis"
            fi
          fi

          git push origin HEAD:milestone/Beta1
