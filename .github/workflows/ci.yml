name: CI

on:
  pull_request:
    paths-ignore:
      - 'translations/korean/messages/**'
      - 'release/korean/font/glyphs.toml'
      - 'work/korean-results/**'
      - 'work/korean-staging/**'
      - 'work/korean-packets/**'
  push:
    paths-ignore:
      - 'translations/korean/messages/**'
      - 'release/korean/font/glyphs.toml'
      - 'work/korean-results/**'
      - 'work/korean-staging/**'
      - 'work/korean-packets/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: python3 tools/korean/check-project-premise.py
      - run: python3 tools/korean/audit-english-first-full-parity.py
      - run: python3 tools/korean/audit-english-first-entrypoint-closure.py
      - run: python3 tools/korean/audit-english-first-param-sfo.py
      - run: go test ./...
      - run: go vet ./...
      - run: python3 -m py_compile tools/korean/*.py
      - run: python3 -m unittest discover -s tools/korean -p 'test_*.py'
      - run: python3 tools/korean/qa-layout-drift.py
      - run: python3 tools/korean/audit-runtime-text.py
      - run: python3 tools/korean/audit-dynamic-substitutions.py
      - run: python3 tools/korean/audit-inline-opcode-consumers.py
      - run: ./zill check
      - run: ./zill korean-check
      - run: ./zill korean-font-check
