name: Korean apply results

on:
  workflow_dispatch:
  push:
    branches:
      - translation/section001-batch2
    paths:
      - 'work/korean-results/*.jsonl'
      - 'tools/korean/apply-results.py'
      - 'tools/korean/refresh-japanese-refs.py'
      - 'internal/corpus/korean.go'
      - '.github/workflows/korean-apply-results.yml'

permissions:
  contents: write

concurrency:
  group: korean-translation-pipeline
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: translation/section001-batch2
          fetch-depth: 0
      - name: Apply pending result packets idempotently
        shell: bash
        run: |
          shopt -s nullglob
          files=(work/korean-results/*.jsonl)
          if [ ${#files[@]} -eq 0 ]; then
            echo 'No result packets found.'
            : > /tmp/korean-processed-files
            exit 0
          fi
          printf '%s\n' "${files[@]}" > /tmp/korean-processed-files
          python3 tools/korean/apply-results.py "${files[@]}"
      - name: Quarantine invalid legacy overlays
        run: python3 tools/korean/refresh-japanese-refs.py
      - name: Validate Korean corpus
        run: ./zill korean-check
      - name: Commit generated overlays and consume processed packets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -s /tmp/korean-processed-files ]; then
            while IFS= read -r path; do
              [ -e "$path" ] && git rm -- "$path"
            done < /tmp/korean-processed-files
          fi
          git add translations/korean/messages
          if git diff --cached --quiet; then
            echo 'No overlay or packet-consumption changes.'
          else
            git commit -m 'Apply Korean translation results'
            git fetch origin translation/section001-batch2
            git rebase origin/translation/section001-batch2
            git push origin HEAD:translation/section001-batch2
          fi

      # Deliberately no raster generation or next-packet publication here.
      # Any overlay commit above triggers korean-next-packet.yml, which is the
      # single owner of raster synchronization and packet publication.
