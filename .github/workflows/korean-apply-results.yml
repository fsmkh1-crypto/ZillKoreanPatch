name: Korean apply results

on:
  workflow_dispatch:
  push:
    branches:
      - translation/section001-batch2
    paths:
      - 'work/korean-results/*.jsonl'
      - 'tools/korean/apply-results.py'
      - 'tools/korean/refresh-japanese-refs.py'
      - 'tools/korean/next-packet.py'
      - 'internal/corpus/korean.go'
      - '.github/workflows/korean-apply-results.yml'

permissions:
  contents: write

concurrency:
  group: korean-apply-results
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: translation/section001-batch2
          fetch-depth: 0
      - name: Apply all result packets idempotently
        shell: bash
        run: |
          shopt -s nullglob
          files=(work/korean-results/*.jsonl)
          if [ ${#files[@]} -eq 0 ]; then
            echo 'No result packets found.'
            exit 0
          fi
          python3 tools/korean/apply-results.py "${files[@]}"
      - name: Quarantine invalid legacy overlays
        run: python3 tools/korean/refresh-japanese-refs.py
      - name: Validate Korean corpus
        run: ./zill korean-check
      - name: Commit generated overlays
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add translations/korean/messages
          if git diff --cached --quiet; then
            echo 'No overlay changes.'
          else
            git commit -m 'Apply Korean translation results'
            git push origin HEAD:translation/section001-batch2
          fi
      - name: Generate next untranslated packet
        run: |
          rm -rf /tmp/korean-packet
          mkdir -p /tmp/korean-packet
          python3 tools/korean/next-packet.py \
            --max-records 2000 \
            --max-bytes 600000 \
            --out /tmp/korean-packet/current.jsonl \
            --progress /tmp/korean-packet/progress.json
      - name: Publish next packet to helper branch
        run: |
          git fetch origin korean-source-chunks
          git checkout korean-source-chunks
          mkdir -p work/korean-packets
          cp /tmp/korean-packet/current.jsonl work/korean-packets/current.jsonl
          cp /tmp/korean-packet/progress.json work/korean-packets/progress.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/korean-packets
          if git diff --cached --quiet; then
            echo 'Packet unchanged.'
            exit 0
          fi
          git commit -m 'Refresh next Korean translation packet'
          git push origin HEAD:korean-source-chunks
