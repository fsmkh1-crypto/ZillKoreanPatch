name: Korean quarantine recovery

on:
  workflow_dispatch:
  push:
    branches:
      - translation/section001-batch2
    paths:
      - 'tools/korean/recover-linebreak-quarantine.py'
      - '.github/workflows/korean-recover-quarantine.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: translation/section001-batch2
          fetch-depth: 0
      - name: Recover falsely quarantined Korean wording
        run: python3 tools/korean/recover-linebreak-quarantine.py
      - name: Validate recovered corpus
        run: |
          ./zill korean-check
          python3 -m unittest discover -s tools/korean -p 'test_*.py'
      - name: Commit recovery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add translations/korean/messages
          if git diff --cached --quiet; then
            echo 'No quarantined rows required recovery.'
            exit 0
          fi
          git commit -m 'Restore Korean wording lost to legacy linebreak quarantine'
          git pull --rebase origin translation/section001-batch2
          git push origin HEAD:translation/section001-batch2
