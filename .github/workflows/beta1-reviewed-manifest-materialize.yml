name: Beta1 reviewed manifest materializer

on:
  workflow_dispatch:
    inputs:
      batch:
        description: Three-digit contextual review batch to materialize
        required: true
        type: string

concurrency:
  group: beta1-reviewed-manifest-materializer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: milestone/Beta1
          fetch-depth: 0

      - name: Materialize requested reviewed manifest only
        env:
          BATCH: ${{ inputs.batch }}
        run: |
          set -euo pipefail
          if [[ ! "$BATCH" =~ ^[0-9]{3}$ ]]; then
            echo "batch must be exactly three digits: $BATCH" >&2
            exit 1
          fi
          proposal="docs/audit/review/proposals-${BATCH}.json"
          output="docs/audit/beta1-contextual-copyedit-${BATCH}-reviewed.json"
          test -s "$proposal"
          source_head="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["source_head"])' "$proposal")"
          python3 tools/korean/materialize-beta1-reviewed-manifest.py \
            --proposals "$proposal" \
            --output "$output" \
            --base-sha "$source_head" \
            --overwrite
          git diff --check

      - name: Commit requested reviewed manifest only if remote head is unchanged
        env:
          BATCH: ${{ inputs.batch }}
        run: |
          set -euo pipefail
          output="docs/audit/beta1-contextual-copyedit-${BATCH}-reviewed.json"
          if [ -z "$(git status --porcelain -- "$output")" ]; then
            echo "Reviewed manifest ${BATCH} already current."
            exit 0
          fi
          BASE_HEAD="$(git rev-parse HEAD)"
          git fetch origin milestone/Beta1
          REMOTE_HEAD="$(git rev-parse origin/milestone/Beta1)"
          if [ "$REMOTE_HEAD" != "$BASE_HEAD" ]; then
            echo "remote milestone/Beta1 moved during manifest materialization: base=$BASE_HEAD remote=$REMOTE_HEAD" >&2
            echo "rerun this workflow with the same batch" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$output"
          git commit -m "audit: materialize Beta1 reviewed copyedit manifest ${BATCH}"
          git push origin HEAD:milestone/Beta1
