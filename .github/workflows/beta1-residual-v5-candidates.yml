name: Beta1 residual v5 candidate materialization

on:
  push:
    branches: [audit/beta1-residual-v5]
    paths:
      - '.github/workflows/beta1-residual-v5-candidates.yml'

permissions:
  contents: read

jobs:
  candidates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen Korean source
        uses: actions/checkout@v6
        with:
          ref: 2c29f53c8c949e3b10f27ec2ea3044abb2278bec
          path: korean
          fetch-depth: 1

      - name: Materialize reviewed residual candidates
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import csv, json, re, tomllib
          from collections import Counter, defaultdict
          from pathlib import Path

          ROOT=Path('korean')
          OUT=Path('/tmp/beta1-residual-v5-candidates')
          OUT.mkdir(parents=True, exist_ok=True)
          HEAD='2c29f53c8c949e3b10f27ec2ea3044abb2278bec'
          EN='a98d9ce29f361d666ec23da0dcfd351f24537ffd'

          by_id=defaultdict(list)
          for path in sorted((ROOT/'translations/korean/messages').rglob('*.toml')):
              data=tomllib.loads(path.read_text(encoding='utf-8'))
              for raw_id,row in data.items():
                  if not isinstance(row,dict) or not isinstance(row.get('korean'),str):
                      continue
                  rid=str(raw_id)
                  by_id[rid].append({
                      'path':str(path.relative_to(ROOT)),
                      'japanese':str(row.get('japanese','')),
                      'korean':str(row.get('korean','')),
                  })
          if len(by_id)!=42016:
              raise SystemExit(f'unique id mismatch {len(by_id)}')

          proposals={}
          reasons=defaultdict(list)
          def set_after(rid, after, reason):
              before=by_id[rid][0]['korean']
              old=proposals.get(rid, before)
              if old == after:
                  reasons[rid].append(reason)
                  return
              proposals[rid]=after
              reasons[rid].append(reason)

          def mutate(rid, fn, reason):
              before=by_id[rid][0]['korean']
              cur=proposals.get(rid,before)
              after=fn(cur)
              if after!=cur:
                  proposals[rid]=after
                  reasons[rid].append(reason)

          def normalize_atakushi(s):
              # Preserve the character's marked self-reference without leaving Japanese
              # or producing broken Korean particles. More natural existing 나/이 몸/우리
              # renderings elsewhere are intentionally left alone.
              reps=[
                  ('이 아타쿠시들이','우리'),('아타쿠시들이','우리'),
                  ('이 아타쿠시에게','이 몸에게'),('아타쿠시에게','이 몸에게'),
                  ('이 아타쿠시에겐','이 몸에겐'),('아타쿠시에겐','이 몸에겐'),
                  ('이 아타쿠시가','이 몸이'),('아타쿠시가','이 몸이'),
                  ('이 아타쿠시는','이 몸은'),('아타쿠시는','이 몸은'),
                  ('이 아타쿠시의','이 몸의'),('아타쿠시의','이 몸의'),
                  ('이 아타쿠시를','이 몸을'),('아타쿠시를','이 몸을'),
                  ('이 아타쿠시도','이 몸도'),('아타쿠시도','이 몸도'),
                  ('이 아타쿠시야','이 몸이야'),('아타쿠시야','이 몸이야'),
                  ('아타쿠시 힘','이 몸의 힘'),('아타쿠시 없이','이 몸 없이'),
                  ('이 아타쿠시','이 몸'),('아타쿠시','이 몸'),
              ]
              for a,b in reps: s=s.replace(a,b)
              return s

          # Canonical fixed terms/labels. Generic grammar words remain contextual.
          for rid,occs in by_id.items():
              jp=occs[0]['japanese']
              if '勇者' in jp:
                  mutate(rid,lambda s:s.replace('용자','용사'),'勇者 canonical -> 용사')
              if '竜の座' in jp:
                  mutate(rid,lambda s:s.replace('용의 좌소','용의 자리').replace('용좌','용의 자리'),'竜の座 canonical -> 용의 자리')
              if '誘拐' in jp:
                  mutate(rid,lambda s:s.replace('유괴','납치'),'誘拐 canonical -> 납치')
              if 'ロースペル' in jp:
                  mutate(rid,lambda s:s.replace('로 스펠','로우 스펠'),'ロースペル canonical -> 로우 스펠')
              if 'アタクシ' in jp and '아타쿠시' in proposals.get(rid,occs[0]['korean']):
                  mutate(rid,normalize_atakushi,'literal アタクシ residue -> marked Korean self-reference')
              if '義母' in jp:
                  mutate(rid,lambda s:s.replace('양어머니','새어머니'),'義母 Lemghon-family canonical -> 새어머니')

          # Confirmed registry patterns; these are enumerated before mutation.
          for rid,occs in by_id.items():
              jp=occs[0]['japanese']
              if '大街道沿い' in jp:
                  mutate(rid,lambda s:s.replace('대가도 연선의 도시','대가도를 따라 늘어선 도시').replace('대가도 연선 도시','대가도를 따라 늘어선 도시').replace('대가도 연변 도시','대가도를 따라 늘어선 도시'),'大街道沿い natural Korean')
              if ('顔を出' in jp or '顔を見せ' in jp):
                  mutate(rid,lambda s:s.replace('얼굴을 비췄','얼굴을 비쳤').replace('얼굴 비췄','얼굴 비쳤').replace('얼굴을 비추','얼굴을 비치').replace('얼굴 비추','얼굴 비치'),'顔を出す/見せる idiom -> 얼굴을 비치다')

          # Exact rows confirmed by the completed 200-row blind audit.
          manual={
            '10033':'일격필살의 검술을 극한까지 익히고 싶다면 그대에게 필요한 것은 어느 쪽인가?<end>',
            '300024':'좋아. 그럼 부탁한다. 뭐, 너 혼자면 충분하겠지만… 혹시 모르니 네 소꿉친구도 뒤따라 보내지. 사이좋게 지내라.<end>',
            '420254':'부디 그 소용돌이를 이겨 내고 새로운 시대를 열어 주세요. …세상을 떠난 남동생을 위해서라도….<end>',
            '430023':'다, 다, 당치도 않습니다! 주민 놈들이 날뛰어서 어쩔 수 없이 대관으로서 책임을 다했을 뿐입니다. 게헤헤….<end>',
            '450101':'아니, 괜찮아.<end>',
            '520087':'분단의 산맥을 넘어 대륙 반대편을 공격하는 전법은 전례 없는 장거였다. 앙길단은 전격적으로 대가도를 따라 늘어선 도시들을 공격해 차례로 점령했고, 왕도 로스톨 공략을 눈앞에 두었다.<end>',
            '560608':'어, 큰일이다! 좀 지나쳤나…?<end>',
            '620009':'훗, 마침 잘됐군. 이 몸의 사랑의 전설에 조연으로 넣어 주마!<end>',
            '670013':'그대, 티아나의 방에도 얼굴을 비쳤던 건가.<end>',
            '1330068':'후후…… 그대와는 이야기가 안 되는군. <value:$28>여, 어떻게 할 텐가? 그대도 가겠다는 건가?<end>',
            '1370534':'같은 로우 스펠이라도 배우기 쉬운 것과 어려운 게 있어. 뭐, 레벨이 있다는 거지. 순서대로 말하자면… 세상에는 정령력이라는 게 있고 불, 물, 땅, 바람의 네 속성이 있다.<end>',
            '1420107':'하, 하지만 그렇게 하시면 두 나라는….<end>',
            '1710134':'이제 이 앞의 땅도 당신을 받아들일 것입니다. 자, 나아가세요. 그리고 오세요. 제 곁으로…. 저는 물의 정령신 아큐류스…. 무한의 소울을 가진 자여, 자, 나아가세요….<end>',
            '2240001':'흑…, 흑….<end>',
          }
          for rid,after in manual.items(): set_after(rid,after,'completed blind-audit correction')

          # Deterministic companions revealed by the same-source/pattern census.
          fixed={
            '2240006':'흑…, 흑….<end>',
            '270087':'굳이 서두르지 않아도 괜찮아. 싸울 준비가 되면 알려 줘.<end>',
          }
          for rid,after in fixed.items(): set_after(rid,after,'registry companion correction')

          repls={
            '1090025':[('대가도 연변 도시들','대가도를 따라 늘어선 도시들')],
            '1330041':[('야, <value:$28>잖아?','어, <value:$28>잖아?')],
            '1870032':[('나를 숭배하는 딸,','나를 숭배하는 소녀,')],
            '850161':[('분명 네 평판이 올라갈 거야.','분명 자기브가 널 더 좋게 볼 거야.')],
            '1710009':[('하핫!<end>','예!<end>')],
            '630156':[('또 그 이야기인가요? 레무온 님이라도 화내실 거예요.<end>','또 그 이야기인가요? 계속 그러시면 저도 화낼 거예요, 레무온 님.<end>')],
            '1540115':[('우후후….<end>','후후후….<end>')],
            '1330716':[('칼라 님','카를라 님')],
            '1220080':[('실례할게.<end>','무례하네.<end>')],
          }
          for rid,pairs in repls.items():
              def f(s,pairs=pairs):
                  for a,b in pairs: s=s.replace(a,b)
                  return s
              mutate(rid,f,'exact-source/registry companion correction')

          # Final structural review of the generated candidates.
          ctrl_re=re.compile(r'<[^>]+>|%(?:\d+|[A-Za-z])')
          bad_korean=re.compile(r'이 몸(?:가|는|야)|이 이 몸|아타쿠시')
          records=[]; categories=Counter()
          for rid in sorted(proposals,key=lambda x:(0,int(x)) if x.isdigit() else (1,x)):
              occs=by_id[rid]; before=occs[0]['korean']; after=proposals[rid]
              if any(o['korean']!=before for o in occs): raise SystemExit(f'alias Korean drift {rid}')
              if before==after: continue
              if ctrl_re.findall(before)!=ctrl_re.findall(after):
                  raise SystemExit(f'control/substitution drift {rid}: {ctrl_re.findall(before)} -> {ctrl_re.findall(after)}')
              if bad_korean.search(after): raise SystemExit(f'malformed/literal atakushi residue {rid}: {after}')
              records.append({'id':rid,'paths':sorted({o['path'] for o in occs}),'before_korean':before,'proposed_korean':after})
              for reason in set(reasons[rid]): categories[reason]+=1

          manifest={'version':1,'purpose':'Beta1 residual quality v5 reviewed normalization/correction candidates','source_head':HEAD,'english_reference_sha':EN,'records':records}
          (OUT/'candidate-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          with (OUT/'candidate-review.csv').open('w',encoding='utf-8-sig',newline='') as f:
              fields=['id','paths','japanese','before_korean','proposed_korean','reasons']; w=csv.DictWriter(f,fieldnames=fields); w.writeheader()
              for r in records:
                  rid=r['id']; w.writerow({'id':rid,'paths':' | '.join(r['paths']),'japanese':by_id[rid][0]['japanese'],'before_korean':r['before_korean'],'proposed_korean':r['proposed_korean'],'reasons':' | '.join(sorted(set(reasons[rid])))})
          summary={'source_head':HEAD,'english_sha':EN,'candidate_count':len(records),'reason_counts':dict(categories)}
          (OUT/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: beta1-residual-v5-candidates
          path: /tmp/beta1-residual-v5-candidates
          if-no-files-found: error
          retention-days: 30
