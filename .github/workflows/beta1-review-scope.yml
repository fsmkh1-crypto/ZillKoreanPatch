name: Beta1 dense review scope

on:
  push:
    branches: [milestone/Beta1]
    paths:
      - 'docs/audit/review/scope-*.json'
      - 'docs/audit/beta1-review-consumer-evidence.json'
      - 'tools/korean/build-beta1-review-packet.py'
      - '.github/workflows/beta1-review-scope.yml'

concurrency:
  group: beta1-review-scope
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: milestone/Beta1
          path: korean
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: HK47196/zill
          ref: a98d9ce29f361d666ec23da0dcfd351f24537ffd
          path: english
      - name: Require cached structural evidence
        working-directory: korean
        run: test -s docs/audit/beta1-review-consumer-evidence.json
      - name: Regenerate and verify every dense review packet
        working-directory: korean
        run: |
          shopt -s nullglob
          scopes=(docs/audit/review/scope-*.json)
          if [ ${#scopes[@]} -eq 0 ]; then
            echo 'No dense scopes yet.'
          else
            for scope in "${scopes[@]}"; do
              python3 tools/korean/build-beta1-review-packet.py \
                --english-root ../english --scope "$scope" --verify
            done
          fi
      - name: Rebuild language ledger without heavy Go gates
        working-directory: korean
        run: |
          python3 tools/korean/build-beta1-review-ledger.py --english-root ../english
          python3 tools/korean/enrich-beta1-review-ledger.py \
            --consumer-map docs/audit/beta1-review-consumer-evidence.json
          git diff --check
      - name: Commit derived scope coverage
        working-directory: korean
        run: |
          paths=(translations/korean/review-ledger.jsonl docs/audit/beta1-review-coverage.md docs/audit/beta1-review-groups.json)
          if [ -z "$(git status --porcelain -- "${paths[@]}")" ]; then
            echo 'Scope-derived review ledger already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${paths[@]}"
          git commit -m 'audit: refresh Beta1 dense review scope coverage'
          git fetch origin milestone/Beta1
          git rebase origin/milestone/Beta1
          git push origin HEAD:milestone/Beta1
