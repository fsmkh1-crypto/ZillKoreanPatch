name: Korean next packet

on:
  workflow_dispatch:
  push:
    branches:
      - translation/section001-batch2
    paths:
      - 'translations/korean/messages/**'
      - 'translations/messages/**'
      - 'tools/korean/next-packet.py'
      - 'tools/korean/auto-trivial.py'
      - 'tools/korean/auto-safe.py'
      - 'tools/korean/migrate-semantic-linebreaks.py'
      - '.github/workflows/korean-next-packet.yml'

permissions:
  contents: write

concurrency:
  group: korean-translation-pipeline
  cancel-in-progress: false

jobs:
  packet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: translation/section001-batch2
          fetch-depth: 0
      - name: Migrate legacy semantic line breaks
        run: |
          python3 tools/korean/migrate-semantic-linebreaks.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add translations/korean/messages
          if ! git diff --cached --quiet; then
            git commit -m 'Separate Korean semantic text from legacy line breaks'
            git pull --rebase origin translation/section001-batch2
            git push origin HEAD:translation/section001-batch2
          fi
      - name: Generate mixed-lane candidate packet
        run: |
          rm -rf /tmp/korean-packet
          mkdir -p /tmp/korean-packet
          python3 tools/korean/next-packet.py \
            --max-records 2500 \
            --max-bytes 600000 \
            --order mixed \
            --out /tmp/korean-packet/current.jsonl \
            --progress /tmp/korean-packet/progress.json
      - name: Auto-apply safe TM, patterns, and deterministic literals
        shell: bash
        run: |
          python3 tools/korean/auto-safe.py \
            /tmp/korean-packet/current.jsonl \
            --out /tmp/korean-packet/safe.jsonl
          python3 tools/korean/auto-trivial.py \
            /tmp/korean-packet/current.jsonl \
            --out /tmp/korean-packet/trivial.jsonl

          inputs=()
          [ -s /tmp/korean-packet/safe.jsonl ] && inputs+=(/tmp/korean-packet/safe.jsonl)
          [ -s /tmp/korean-packet/trivial.jsonl ] && inputs+=(/tmp/korean-packet/trivial.jsonl)
          if [ ${#inputs[@]} -gt 0 ]; then
            # Reuse the single authoritative fail-closed application gate.
            python3 tools/korean/apply-results.py "${inputs[@]}"
            if [ -f tools/korean/refresh-japanese-refs.py ]; then
              python3 tools/korean/refresh-japanese-refs.py
            fi
            ./zill korean-check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add translations/korean/messages
            if ! git diff --cached --quiet; then
              git commit -m 'Auto-translate safe Korean repetitions and literals'
              git pull --rebase origin translation/section001-batch2
              git push origin HEAD:translation/section001-batch2
            fi
          fi
      - name: Keep Korean raster catalog synchronized
        run: |
          if ./zill korean-font-check; then
            echo 'Korean raster catalog already current.'
            exit 0
          fi

          mkdir -p build release/korean/font
          curl --fail --location --retry 3 \
            --output /tmp/UnDotum.ttf \
            https://raw.githubusercontent.com/deepin-community/fonts-unfonts-core/ef6c68f4f0beb2a03fcf460aa643d73389aac59a/UnDotum.ttf
          echo '5b8373e126bb61f59105cf7f54a47eb1b089c2b0aacb70c6cd688bd8ea76cdc9  /tmp/UnDotum.ttf' | sha256sum -c -
          go run ./cmd/zill korean-font-generate \
            --font /tmp/UnDotum.ttf \
            --output build/korean-glyphs.toml
          test -s build/korean-glyphs.toml
          cp build/korean-glyphs.toml release/korean/font/glyphs.toml
          ./zill korean-font-check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/korean/font/glyphs.toml
          if ! git diff --cached --quiet; then
            git commit -m 'Update generated Korean raster catalog'
            git pull --rebase origin translation/section001-batch2
            git push origin HEAD:translation/section001-batch2
          fi
      - name: Regenerate next untranslated packet
        run: |
          python3 tools/korean/next-packet.py \
            --max-records 2500 \
            --max-bytes 600000 \
            --order mixed \
            --out /tmp/korean-packet/current.jsonl \
            --progress /tmp/korean-packet/progress.json
      - name: Publish packet to helper branch
        run: |
          git fetch origin korean-source-chunks
          git checkout korean-source-chunks
          mkdir -p work/korean-packets
          cp /tmp/korean-packet/current.jsonl work/korean-packets/current.jsonl
          cp /tmp/korean-packet/progress.json work/korean-packets/progress.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/korean-packets
          if git diff --cached --quiet; then
            echo 'Packet unchanged.'
            exit 0
          fi
          git commit -m 'Refresh next Korean translation packet'
          git pull --rebase origin korean-source-chunks
          git push origin HEAD:korean-source-chunks
