name: Korean apply manual staging

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: korean-translation-pipeline
  cancel-in-progress: false

jobs:
  apply-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: translation/section001-batch2
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Read packets from manual staging branch
        shell: bash
        run: |
          git fetch origin korean-manual-staging
          rm -rf /tmp/korean-manual-staging
          git worktree add --detach /tmp/korean-manual-staging origin/korean-manual-staging
          shopt -s nullglob
          files=(/tmp/korean-manual-staging/work/korean-staging/*.jsonl)
          if [ ${#files[@]} -eq 0 ]; then
            echo 'No manual staging packets found.'
            exit 0
          fi
          printf '%s\n' "${files[@]}" > /tmp/korean-staging-files
          # Do not invent overlap/diff logic here. The existing authoritative
          # gate handles identical rows idempotently and conflicting rows by
          # failing closed.
          python3 tools/korean/apply-results.py "${files[@]}"
          python3 tools/korean/refresh-japanese-refs.py
          ./zill korean-check
      - name: Commit accepted staging translations
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add translations/korean/messages
          if git diff --cached --quiet; then
            echo 'All staged rows were already applied identically.'
            exit 0
          fi
          git commit -m 'Apply manual Korean staging translations'
          git fetch origin translation/section001-batch2
          git rebase origin/translation/section001-batch2
          git push origin HEAD:translation/section001-batch2
