name: Beta1 comma spacing

on:
  push:
    branches: [milestone/Beta1]
    paths:
      - '.github/workflows/beta1-comma-spacing.yml'
      - 'tools/korean/fix-beta1-comma-spacing.py'

permissions:
  contents: write

concurrency:
  group: beta1-comma-spacing
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: milestone/Beta1
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify fixed population
        run: python3 tools/korean/fix-beta1-comma-spacing.py --json /tmp/comma-before.json
      - name: Apply missing comma spaces
        run: python3 tools/korean/fix-beta1-comma-spacing.py --apply --json /tmp/comma-apply.json
      - name: Sync layouts
        run: python3 tools/korean/qa-layout-drift.py --fix | tee /tmp/layout-sync.txt
      - name: Verify layout and changed paths
        run: |
          python3 tools/korean/qa-layout-drift.py
          python3 - <<'PY'
          import json, subprocess
          d=json.load(open('/tmp/comma-before.json',encoding='utf-8'))
          expected=set(d['changed_files'])
          changed=set(filter(None,subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()))
          if changed != expected:
              raise SystemExit(f'unexpected changed files: expected={len(expected)} actual={len(changed)}')
          PY
          git diff --check
      - name: Korean language gates
        run: |
          python3 tools/korean/audit-korean-glyph-repertoire.py
          ./zill korean-check
          ./zill korean-font-check
          python3 tools/korean/qa-integrity.py --json /tmp/integrity.json --max-examples 40
          python3 tools/korean/qa-terminology.py --json /tmp/terms.json --max-examples 60
          python3 tools/korean/qa-consistency.py --json /tmp/consistency.json --max-examples 40
          python3 tools/korean/qa-text-sanity.py --json /tmp/sanity.json --max-examples 80
          python3 - <<'PY'
          import json
          i=json.load(open('/tmp/integrity.json')); t=json.load(open('/tmp/terms.json')); c=json.load(open('/tmp/consistency.json')); s=json.load(open('/tmp/sanity.json'))
          critical=i.get('critical',[])
          if (len(critical) if isinstance(critical,list) else int(critical or 0)): raise SystemExit('integrity critical')
          if t.get('mismatch_count',0): raise SystemExit('terminology mismatch')
          if c.get('actionable_inconsistent_groups',0) or c.get('actionable_inconsistent_records',0): raise SystemExit('consistency regression')
          if s.get('finding_count',0): raise SystemExit('text sanity regression')
          PY
      - name: Consumer storage contract
        run: go test ./internal/release -run TestCurrentKoreanCorpusEnglishConsumerStorageContracts -count=1
      - name: Commit accepted punctuation-spacing batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add translations/korean/messages
          git commit -m 'copyedit: restore missing spaces after commas'
          git fetch origin milestone/Beta1
          git rebase origin/milestone/Beta1
          git push origin HEAD:milestone/Beta1
