name: Beta1 reviewed copyedit apply

on:
  workflow_call:
    inputs:
      manifest:
        description: Reviewed copyedit manifest
        required: true
        type: string
      overrides:
        description: Optional audited override manifest for legacy manifest schema
        required: false
        default: ''
        type: string
  push:
    branches: [milestone/Beta1]
    paths:
      - 'docs/audit/beta1-contextual-copyedit-*-reviewed.json'
  workflow_dispatch:
    inputs:
      manifest:
        description: Reviewed copyedit manifest
        required: true
      overrides:
        description: Optional audited override manifest for legacy manifest schema
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: beta1-reviewed-copyedit-apply
  cancel-in-progress: false

env:
  INPUT_MANIFEST: ${{ inputs.manifest }}
  OVERRIDES: ${{ inputs.overrides }}

jobs:
  apply:
    runs-on: ubuntu-latest
    outputs:
      review_batch: ${{ steps.metadata.outputs.review_batch }}
      semantic_sha: ${{ steps.commit.outputs.semantic_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: milestone/Beta1
          fetch-depth: 0

      - name: Resolve reviewed manifest input
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_MANIFEST" ]; then
            manifest="$INPUT_MANIFEST"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            before="$EVENT_BEFORE"
            if [[ ! "$before" =~ ^[0-9a-f]{40}$ ]] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              echo "push event is missing a usable before SHA" >&2
              exit 1
            fi
            mapfile -t changed < <(
              git diff --name-only --diff-filter=AM "$before" "$GITHUB_SHA" -- \
                'docs/audit/beta1-contextual-copyedit-*-reviewed.json'
            )
            if [ "${#changed[@]}" -ne 1 ]; then
              echo "expected exactly one added/modified reviewed manifest, found ${#changed[@]}: ${changed[*]-}" >&2
              exit 1
            fi
            manifest="${changed[0]}"
            if [[ ! "$manifest" =~ ^docs/audit/beta1-contextual-copyedit-[0-9]{3}-reviewed\.json$ ]]; then
              echo "cannot derive reviewed manifest from push: $manifest" >&2
              exit 1
            fi
            if [ -n "$OVERRIDES" ]; then
              echo "overrides are not supported for push-triggered reviewed manifests" >&2
              exit 1
            fi
          else
            echo "reviewed manifest input is required for event: $GITHUB_EVENT_NAME" >&2
            exit 1
          fi
          test -s "$manifest"
          echo "MANIFEST=$manifest" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Record validated branch head, manifest schema, and target files
        id: metadata
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee /tmp/copyedit-base-head.txt
          python3 - <<'PY' | tee /tmp/copyedit-target-files.txt
          import json, os, re, subprocess
          data=json.load(open(os.environ['MANIFEST'],encoding='utf-8'))
          records=data.get('records', [])
          if not isinstance(records, list) or not records:
              raise SystemExit('manifest has no records')
          default=data.get('korean_file')
          paths=set()
          multifile=bool(data.get('source_head')) and all(isinstance(r,dict) and isinstance(r.get('paths'),list) and r.get('paths') for r in records)
          for record in records:
              if not isinstance(record, dict):
                  raise SystemExit('manifest contains a non-object record')
              decision=record.get('decision')
              if decision not in (None, 'PROPOSED_CHANGE'):
                  continue
              if isinstance(record.get('paths'),list): paths.update(str(p) for p in record['paths'])
              elif record.get('path'): paths.add(str(record['path']))
              elif default: paths.add(str(default))
          if not paths: raise SystemExit('manifest has no proposed target files')
          name=os.path.basename(os.environ['MANIFEST'])
          m=re.search(r'beta1-contextual-copyedit-(\d{3})-reviewed\.json$', name)
          if not m:
              raise SystemExit(f'cannot derive review batch from manifest name: {name}')
          batch=m.group(1)
          request_path=f'docs/audit/review/scope-requests/{batch}.json'
          if not os.path.isfile(request_path) or os.path.getsize(request_path) <= 0:
              raise SystemExit(f'missing scope request for batch {batch}: {request_path}')
          request=json.load(open(request_path,encoding='utf-8'))
          if str(request.get('batch_id')) != batch:
              raise SystemExit(f'scope request batch mismatch: {request.get("batch_id")} != {batch}')
          required=('reviewer','reviewed_at','review_method')
          missing=[key for key in required if not request.get(key)]
          if missing:
              raise SystemExit(f'scope request missing review metadata: {missing}')
          if multifile:
              source_head=str(data.get('source_head',''))
              if not re.fullmatch(r'[0-9a-f]{40}', source_head):
                  raise SystemExit('multifile manifest missing valid source_head')
              pinned='a98d9ce29f361d666ec23da0dcfd351f24537ffd'
              if data.get('english_reference_sha') != pinned:
                  raise SystemExit('multifile manifest English reference is not pinned')
              head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
              if subprocess.run(
                  ['git','merge-base','--is-ancestor',source_head,head],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL
              ).returncode != 0:
                  raise SystemExit(f'manifest source_head {source_head} is not an ancestor of HEAD {head}')
              if os.environ.get('OVERRIDES'):
                  raise SystemExit('overrides are not supported for current multifile reviewed manifests')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write('MULTIFILE_SCHEMA='+('1' if multifile else '0')+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('review_batch='+batch+'\n')
          for path in sorted(paths): print(path)
          PY

      - name: Record corpus consistency baseline
        run: python3 tools/korean/qa-consistency.py --json /tmp/korean-qa-consistency-baseline.json --max-examples 40

      - name: Apply exact reviewed semantic values
        run: |
          set -euo pipefail
          if [ "$MULTIFILE_SCHEMA" = 1 ]; then
            python3 tools/korean/apply-multifile-reviewed-copyedit.py \
              --manifest "$MANIFEST" --apply --json /tmp/copyedit-apply.json
          else
            args=(--manifest "$MANIFEST" --require-base-sha --json /tmp/copyedit-apply.json)
            if [ -n "$OVERRIDES" ]; then args+=(--overrides "$OVERRIDES"); fi
            python3 tools/korean/apply-reviewed-copyedit.py "${args[@]}"
          fi

      - name: Invalidate stale persisted layouts for build-owned reflow
        run: python3 tools/korean/qa-layout-drift.py --invalidate-drift | tee /tmp/layout-invalidate.txt

      - name: Verify reviewed values and zero semantic layout drift
        run: |
          set -euo pipefail
          if [ "$MULTIFILE_SCHEMA" = 1 ]; then
            python3 tools/korean/apply-multifile-reviewed-copyedit.py \
              --manifest "$MANIFEST" --json /tmp/copyedit-verify.json
          else
            args=(--manifest "$MANIFEST" --require-base-sha --verify --json /tmp/copyedit-verify.json)
            if [ -n "$OVERRIDES" ]; then args+=(--overrides "$OVERRIDES"); fi
            python3 tools/korean/apply-reviewed-copyedit.py "${args[@]}"
          fi
          python3 tools/korean/qa-layout-drift.py
          python3 tools/korean/audit-beta1-persisted-layouts.py --json /tmp/persisted-layout-audit.json

      - name: Require only reviewed overlay files changed
        run: |
          python3 - <<'PY'
          import subprocess
          allowed=set(filter(None,open('/tmp/copyedit-target-files.txt',encoding='utf-8').read().splitlines()))
          changed=set(filter(None,subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()))
          if changed != allowed:
              raise SystemExit(f'expected only {sorted(allowed)}, found {sorted(changed)}')
          PY
          git diff --check

      - name: Per-batch glyph and Korean contract gates
        run: |
          python3 tools/korean/audit-korean-glyph-repertoire.py
          ./zill korean-check
          ./zill korean-font-check

      - name: Per-batch corpus QA gates
        run: |
          python3 tools/korean/qa-integrity.py --json /tmp/korean-qa-integrity.json --max-examples 40
          python3 tools/korean/qa-terminology.py --json /tmp/korean-qa-terminology.json --max-examples 60
          python3 tools/korean/qa-consistency.py --json /tmp/korean-qa-consistency.json --max-examples 40
          python3 tools/korean/qa-consistency-triage.py --json /tmp/korean-qa-consistency-triage.json --max-examples 40
          python3 tools/korean/qa-text-sanity.py --json /tmp/korean-qa-text-sanity.json --max-examples 80
          python3 - <<'PY'
          import json
          integrity=json.load(open('/tmp/korean-qa-integrity.json',encoding='utf-8'))
          terms=json.load(open('/tmp/korean-qa-terminology.json',encoding='utf-8'))
          consistency=json.load(open('/tmp/korean-qa-consistency.json',encoding='utf-8'))
          baseline=json.load(open('/tmp/korean-qa-consistency-baseline.json',encoding='utf-8'))
          sanity=json.load(open('/tmp/korean-qa-text-sanity.json',encoding='utf-8'))
          critical=integrity.get('critical', [])
          critical_count=len(critical) if isinstance(critical,list) else int(critical or 0)
          if critical_count != 0: raise SystemExit(f'QA-1 critical={critical_count}')
          if terms.get('mismatch_count',0) != 0: raise SystemExit(f"QA-2 mismatch={terms.get('mismatch_count')}")
          for key in ('actionable_inconsistent_groups','actionable_inconsistent_records'):
              before=int(baseline.get(key,0) or 0)
              after=int(consistency.get(key,0) or 0)
              if after > before:
                  raise SystemExit(f'QA-3 regression {key}: baseline={before} after={after}')
          if sanity.get('finding_count',0) != 0: raise SystemExit(f"text sanity findings={sanity.get('finding_count')}")
          PY

      - name: Per-batch English-consumer storage and static overflow contract
        run: go test ./internal/release -run TestCurrentKoreanCorpusEnglishConsumerStorageContracts -count=1

      - name: Upload batch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta1-reviewed-copyedit-evidence
          path: |
            /tmp/copyedit-base-head.txt
            /tmp/copyedit-target-files.txt
            /tmp/copyedit-apply.json
            /tmp/copyedit-verify.json
            /tmp/layout-invalidate.txt
            /tmp/persisted-layout-audit.json
            /tmp/korean-qa-integrity.json
            /tmp/korean-qa-terminology.json
            /tmp/korean-qa-consistency-baseline.json
            /tmp/korean-qa-consistency.json
            /tmp/korean-qa-consistency-triage.json
            /tmp/korean-qa-text-sanity.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commit accepted batch only if remote head is unchanged
        id: commit
        run: |
          set -euo pipefail
          BASE_HEAD="$(cat /tmp/copyedit-base-head.txt)"
          git fetch origin milestone/Beta1
          REMOTE_HEAD="$(git rev-parse origin/milestone/Beta1)"
          if [ "$REMOTE_HEAD" != "$BASE_HEAD" ]; then
            echo "remote milestone/Beta1 moved during validation: base=$BASE_HEAD remote=$REMOTE_HEAD" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          while IFS= read -r path; do git add "$path"; done < /tmp/copyedit-target-files.txt
          git commit -m "copyedit: apply Beta1 reviewed batch from $(basename "$MANIFEST")"
          semantic_sha="$(git rev-parse HEAD)"
          git push origin HEAD:milestone/Beta1
          echo "semantic_sha=$semantic_sha" >> "$GITHUB_OUTPUT"

  finalize-evidence:
    needs: apply
    uses: ./.github/workflows/beta1-finalize-evidence.yml
    with:
      batch: ${{ needs.apply.outputs.review_batch }}
      semantic_sha: ${{ needs.apply.outputs.semantic_sha }}
