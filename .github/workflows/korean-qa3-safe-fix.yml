name: Korean QA-3 safe consistency cleanup

on:
  push:
    paths:
      - 'tools/korean/qa-fix-consistency-safe.py'
      - '.github/workflows/korean-qa3-safe-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: translation/section001-batch2
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Baseline QA-3 inconsistency count
        run: python3 tools/korean/qa-consistency.py --json /tmp/before.json --max-examples 0
      - name: Apply conservative QA-3 normalization
        run: python3 tools/korean/qa-fix-consistency-safe.py
      - name: Validate normalized corpus
        run: |
          ./zill korean-check
          ./zill korean-font-check
          python3 tools/korean/qa-integrity.py --json /tmp/integrity.json --max-examples 20
          python3 tools/korean/qa-terminology.py --json /tmp/terms.json --max-examples 20
          python3 tools/korean/qa-consistency.py --json /tmp/after.json --max-examples 20
          python3 tools/korean/qa-consistency-triage.py --json /tmp/triage.json --max-examples 20
          python3 - <<'PY'
          import json
          b=json.load(open('/tmp/before.json', encoding='utf-8'))
          a=json.load(open('/tmp/after.json', encoding='utf-8'))
          t=json.load(open('/tmp/terms.json', encoding='utf-8'))
          bg=int(b['inconsistent_groups']); ag=int(a['inconsistent_groups'])
          br=int(b['inconsistent_records']); ar=int(a['inconsistent_records'])
          tm=int(t['mismatch_count'])
          print(f'QA-3 inconsistency change: groups {bg}->{ag}; records {br}->{ar}')
          print(f'QA-2 canonical mismatches after safe pass: {tm}')
          if ag > bg or ar > br:
              raise SystemExit('safe QA-3 pass increased inconsistency')
          if tm != 0:
              raise SystemExit('safe QA-3 pass introduced canonical terminology mismatches')
          PY
      - name: Commit safe QA-3 normalization
        run: |
          if git diff --quiet -- translations/korean/messages; then
            echo 'No safe QA-3 fixes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add translations/korean/messages
          git commit -m 'Normalize safe repeated-source Korean variants'
          git push origin HEAD:translation/section001-batch2
