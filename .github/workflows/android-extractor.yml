name: Android PPSSPP freeze tracer

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-patcher/**'
      - 'cmd/zill/**'
      - '.github/workflows/android-extractor.yml'
  pull_request:
    paths:
      - 'android-patcher/**'
      - 'cmd/zill/**'
      - '.github/workflows/android-extractor.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify inline-page tracer source
        shell: bash
        run: |
          set -euo pipefail
          TRACE=android-patcher/app/src/main/java/com/fsmkh1/zillfontdump/FreezeTraceService.java
          grep -q 'SECOND_SCANNER_CALL = 0x0886C9B4L' "$TRACE"
          grep -q 'INLINE_PAGE_OFFSET = 0x2C0L' "$TRACE"
          grep -q 'INLINE_DUMP_SIZE = 0x120' "$TRACE"
          grep -q 'rawCommand("memory.read"' "$TRACE"
          grep -q 'lf_count_before_nul' "$TRACE"
          grep -q 'slot_plus_3c0_word' "$TRACE"
          grep -q 'inline_page_capture' "$TRACE"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build arm64 PPSSPP debugger bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-patcher/app/src/main/jniLibs/arm64-v8a
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -buildmode=pie -o android-patcher/app/src/main/jniLibs/arm64-v8a/libzill.so ./cmd/zill
          chmod 0755 android-patcher/app/src/main/jniLibs/arm64-v8a/libzill.so

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build tracer APK
        run: gradle -p android-patcher :app:assembleDebug --no-daemon --stacktrace

      - name: Verify tracer APK
        shell: bash
        run: |
          set -euo pipefail
          APK=android-patcher/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" > /tmp/apk-list.txt
          grep -q 'lib/arm64-v8a/libzill.so' /tmp/apk-list.txt
          grep -q 'classes.dex' /tmp/apk-list.txt
          sha256sum "$APK" | tee "$APK.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: zill-freeze-tracer-debug
          path: |
            android-patcher/app/build/outputs/apk/debug/app-debug.apk
            android-patcher/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
