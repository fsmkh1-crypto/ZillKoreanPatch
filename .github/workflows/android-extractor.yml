name: Android Korean beta patcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-patcher/**'
      - 'translations/korean/**'
      - 'release/korean/**'
      - 'cmd/zill/build_korean_iso.go'
      - 'cmd/zill/build_korean_mobile_plan.go'
      - 'cmd/zill/korean_fixed.go'
      - 'cmd/zill/main.go'
      - 'internal/**'
      - 'patches/executable/**'
      - 'patches/system/**'
      - '.github/workflows/android-extractor.yml'
  pull_request:
    paths:
      - 'android-patcher/**'
      - 'translations/korean/**'
      - 'release/korean/**'
      - 'cmd/zill/build_korean_iso.go'
      - 'cmd/zill/build_korean_mobile_plan.go'
      - 'cmd/zill/korean_fixed.go'
      - 'cmd/zill/main.go'
      - 'internal/**'
      - 'patches/executable/**'
      - 'patches/system/**'
      - '.github/workflows/android-extractor.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Prepare embedded Korean beta project data
        shell: bash
        run: |
          set -euxo pipefail
          ROOT=android-patcher/app/src/main/assets/zillroot
          rm -rf "$ROOT"
          mkdir -p "$ROOT/release/strings" "$ROOT/release/korean/font" "$ROOT/release/korean/strings" "$ROOT/patches/executable" "$ROOT/patches/system"
          cp -R translations "$ROOT/translations"
          cp release/strings/eboot.toml release/strings/equipment.toml "$ROOT/release/strings/"
          cp release/korean/font/glyphs.toml "$ROOT/release/korean/font/"
          cp release/korean/strings/eboot.toml "$ROOT/release/korean/strings/"
          cp patches/executable/manifest.toml "$ROOT/patches/executable/"
          cp patches/system/param-sfo.toml "$ROOT/patches/system/"
          du -sh "$ROOT"

      - name: Isolate message 10010 without first-use glyphs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android-patcher/app/src/main/assets/zillroot/translations/korean/messages/msgsec001.toml')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('korean = "<value:$15>여 나는 그대가 나아갈 길을 묻노라 그 길을 보이고 운명의 문을 열어라<end>"',
               'korean = "<value:$15>여 나는 그대가 나아갈 길을 보라 그 길을 보이고 그대의 문을 열어라<end>"'),
              ('layout = "<value:$15>여<line-break>나는 그대가 나아갈 길을 묻노라<line-break>그 길을 보이고 운명의 문을 열어라<end>"',
               'layout = "<value:$15>여<line-break>나는 그대가 나아갈 길을 보라<line-break>그 길을 보이고 그대의 문을 열어라<end>"'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one 10010 experiment target, found {count}: {old}')
              text = text.replace(old, new, 1)
          for forbidden in ('묻', '노', '명', '운'):
              block = text[text.index('["10010"]'):text.index('["10011"]')]
              if forbidden in block:
                  raise SystemExit(f'10010 still contains first-use glyph {forbidden!r}')
          path.write_text(text, encoding='utf-8')
          print('10010 A/B experiment A: value token preserved; first-use glyphs removed')
          PY

      - name: Build arm64 Korean beta builder
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p android-patcher/app/src/main/jniLibs/arm64-v8a
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -buildmode=pie \
            -o android-patcher/app/src/main/jniLibs/arm64-v8a/libzill.so ./cmd/zill
          chmod 0755 android-patcher/app/src/main/jniLibs/arm64-v8a/libzill.so
          file android-patcher/app/src/main/jniLibs/arm64-v8a/libzill.so
          readelf -h android-patcher/app/src/main/jniLibs/arm64-v8a/libzill.so | sed -n '1,40p'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Go tests
        run: go test ./...

      - name: Android unit tests
        run: gradle -p android-patcher :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle -p android-patcher :app:assembleDebug --no-daemon --stacktrace

      - name: Inspect APK beta payload
        shell: bash
        run: |
          set -euo pipefail
          unzip -l android-patcher/app/build/outputs/apk/debug/app-debug.apk > /tmp/apk-list.txt
          grep -q 'lib/arm64-v8a/libzill.so' /tmp/apk-list.txt
          grep -q 'assets/zillroot/translations/korean/messages/' /tmp/apk-list.txt
          grep -q 'assets/zillroot/release/korean/font/glyphs.toml' /tmp/apk-list.txt
          grep -q 'assets/zillroot/release/korean/strings/eboot.toml' /tmp/apk-list.txt
          grep -E 'lib/arm64-v8a/libzill.so|assets/zillroot/translations/korean/messages/|assets/zillroot/release/korean/font/glyphs.toml|assets/zillroot/release/korean/strings/eboot.toml' /tmp/apk-list.txt | sed -n '1,24p'

      - name: SHA-256
        shell: bash
        run: sha256sum android-patcher/app/build/outputs/apk/debug/app-debug.apk | tee android-patcher/app/build/outputs/apk/debug/app-debug.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: zill-korean-beta-patcher-debug
          path: |
            android-patcher/app/build/outputs/apk/debug/app-debug.apk
            android-patcher/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
