name: Android PPSSPP freeze tracer

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-patcher/**'
      - 'cmd/zill/**'
      - '.github/workflows/android-extractor.yml'
  pull_request:
    paths:
      - 'android-patcher/**'
      - 'cmd/zill/**'
      - '.github/workflows/android-extractor.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify committed polling tracer source
        shell: bash
        run: |
          set -euxo pipefail
          TRACE=android-patcher/app/src/main/java/com/fsmkh1/zillfontdump/FreezeTraceService.java
          grep -q 'PRODUCER_CALL = 0x0886C938L' "$TRACE"
          grep -q 'PRODUCER_POST_CALL = 0x0886C940L' "$TRACE"
          grep -q 'PRODUCER_STORE = 0x0886C948L' "$TRACE"
          grep -q 'BACKEND_ENTRY = 0x08A23064L' "$TRACE"
          grep -q 'SECOND_SCANNER_CALL = 0x0886C9B4L' "$TRACE"
          grep -q 'SECOND_SCANNER_SKIP = 0x0886C9C4L' "$TRACE"
          grep -q 'OBSERVED_FAILING_FIELD_VALUE = 0x8C4C89A4L' "$TRACE"
          grep -q 'STATUS_POLL_MS = 20' "$TRACE"
          grep -q 'rawCommand("cpu.status"' "$TRACE"
          grep -q 'waitForStoppedPc' "$TRACE"
          grep -q 'store_equals_scanner_input' "$TRACE"
          grep -q 'saveLatestCandidate' "$TRACE"
          grep -q 'cleanupBreakpoints' "$TRACE"
          grep -q 'cpu.breakpoint.add' "$TRACE"
          grep -q 'pointer_boundary_capture' "$TRACE"
          grep -q 'writeEvent("armed"' "$TRACE"
          ! grep -q 'bridgeWait' "$TRACE"
          ! grep -q 'drainBridgeEvents' "$TRACE"
          ! grep -q 'command.put("event", "cpu.stepping")' "$TRACE"
          ! grep -q 'BACKEND_DISASM_START' "$TRACE"
          ! grep -q 'ALLOCATOR_CANDIDATE_DISASM_START' "$TRACE"
          ! grep -q 'exact producer invocation' "$TRACE"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build arm64 PPSSPP debugger bridge
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p android-patcher/app/src/main/jniLibs/arm64-v8a
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -buildmode=pie \
            -o android-patcher/app/src/main/jniLibs/arm64-v8a/libzill.so ./cmd/zill
          chmod 0755 android-patcher/app/src/main/jniLibs/arm64-v8a/libzill.so
          file android-patcher/app/src/main/jniLibs/arm64-v8a/libzill.so

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build tracer APK
        run: gradle -p android-patcher :app:assembleDebug --no-daemon --stacktrace

      - name: Verify tracer-only APK essentials
        shell: bash
        run: |
          set -euo pipefail
          APK=android-patcher/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" > /tmp/apk-list.txt
          grep -q 'lib/arm64-v8a/libzill.so' /tmp/apk-list.txt
          grep -q 'classes.dex' /tmp/apk-list.txt
          ! grep -q 'assets/zillroot/translations/korean/messages/' /tmp/apk-list.txt
          sha256sum "$APK" | tee "$APK.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: zill-freeze-tracer-debug
          path: |
            android-patcher/app/build/outputs/apk/debug/app-debug.apk
            android-patcher/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
