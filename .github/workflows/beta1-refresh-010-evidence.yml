name: Beta1 refresh copyedit 010 evidence

on:
  push:
    branches: [milestone/Beta1]
    paths:
      - '.github/workflows/beta1-refresh-010-evidence.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: milestone/Beta1
          path: korean
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: HK47196/zill
          ref: a98d9ce29f361d666ec23da0dcfd351f24537ffd
          path: english
      - name: Refresh exact evidence fields
        working-directory: korean
        run: |
          python3 - <<'PY'
          import json, subprocess, tomllib
          from pathlib import Path

          manifest_path = Path('docs/audit/beta1-contextual-copyedit-010-reviewed.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))

          english = {}
          for path in sorted((Path('../english') / 'translations/messages').glob('msgsec*.toml')):
              data = tomllib.loads(path.read_text(encoding='utf-8'))
              for rid, row in data.items():
                  if isinstance(row, dict):
                      rid = str(rid)
                      if rid in english:
                          raise SystemExit(f'duplicate English id {rid}')
                      english[rid] = {
                          'english': row.get('english', ''),
                          'japanese': row.get('japanese', ''),
                      }

          korean = {}
          for path in sorted(Path('translations/korean/messages').glob('*.toml')):
              data = tomllib.loads(path.read_text(encoding='utf-8'))
              rel = path.as_posix()
              for rid, row in data.items():
                  if isinstance(row, dict) and isinstance(row.get('korean'), str):
                      korean.setdefault(str(rid), []).append((rel, row))

          current_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          for rec in manifest['records']:
              rid = str(rec['id'])
              rows = korean.get(rid)
              if not rows:
                  raise SystemExit(f'missing Korean id {rid}')
              first = rows[0][1]
              for rel, row in rows[1:]:
                  for key in ('japanese', 'korean', 'layout', 'consumer'):
                      if row.get(key, '') != first.get(key, ''):
                          raise SystemExit(f'non-identical Korean alias {rid} key={key}')
              erow = english.get(rid)
              if erow is None:
                  raise SystemExit(f'missing English id {rid}')
              rec['paths'] = [rel for rel, _ in rows]
              rec['before_korean'] = first.get('korean', '')
              rec['japanese'] = first.get('japanese', '')
              rec['english'] = erow.get('english', '')
              rec['english_sha'] = 'a98d9ce29f361d666ec23da0dcfd351f24537ffd'
          manifest['source_head'] = current_sha
          manifest['english_reference_sha'] = 'a98d9ce29f361d666ec23da0dcfd351f24537ffd'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Verify only evidence fields changed semantically
        working-directory: korean
        run: |
          python3 - <<'PY'
          import json, re, subprocess
          p='docs/audit/beta1-contextual-copyedit-010-reviewed.json'
          old=json.loads(subprocess.check_output(['git','show','HEAD:'+p], text=True))
          new=json.load(open(p,encoding='utf-8'))
          allowed_top={'source_head','english_reference_sha'}
          for k in set(old)|set(new):
              if k in allowed_top or k=='records':
                  continue
              if old.get(k)!=new.get(k): raise SystemExit(f'unexpected top-level change {k}')
          if len(old['records'])!=len(new['records']): raise SystemExit('record count changed')
          allowed={'paths','before_korean','japanese','english','english_sha'}
          for a,b in zip(old['records'],new['records']):
              if a['id']!=b['id']: raise SystemExit('record order/id changed')
              for k in set(a)|set(b):
                  if k in allowed: continue
                  if a.get(k)!=b.get(k): raise SystemExit(f'unexpected semantic change id={a["id"]} key={k}')
              controls=lambda s: re.findall(r'<[^>]+>',s)
              if controls(b['before_korean'])!=controls(b['proposed_korean']):
                  raise SystemExit(f'control topology differs id={b["id"]}')
          PY
          git diff --check
      - name: Commit refreshed manifest
        working-directory: korean
        run: |
          if git diff --quiet -- docs/audit/beta1-contextual-copyedit-010-reviewed.json; then
            echo 'No evidence changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/audit/beta1-contextual-copyedit-010-reviewed.json
          git commit -m 'audit: refresh copyedit 010 exact JP EN KO evidence'
          git fetch origin milestone/Beta1
          git rebase origin/milestone/Beta1
          git push origin HEAD:milestone/Beta1
