name: Bootstrap upstream history

on:
  push:
    paths:
      - .github/workflows/bootstrap-upstream.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import HK47196/zill with history preserved
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_SHA=a98d9ce29f361d666ec23da0dcfd351f24537ffd
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/HK47196/zill.git
          git fetch --no-tags upstream "$UPSTREAM_SHA"

          OUR_HEAD="$(git rev-parse HEAD)"
          UPSTREAM_HEAD="$(git rev-parse FETCH_HEAD)"

          # Start from the exact pinned upstream root tree.
          git read-tree --reset -u "$UPSTREAM_HEAD"

          # Overlay Korean-project-owned paths so the bootstrap can safely run
          # after Android/research/PoC work has already landed in this repository.
          for path in \
            android-patcher \
            font-tools \
            research \
            tests \
            internal/cp932/glyphkey.go \
            internal/cp932/glyphkey_test.go \
            internal/koreanslots \
            .github/workflows/android-extractor.yml \
            .github/workflows/bootstrap-upstream.yml
          do
            if git cat-file -e "$OUR_HEAD:$path" 2>/dev/null; then
              git checkout "$OUR_HEAD" -- "$path"
            fi
          done

          TREE="$(git write-tree)"
          COMMIT="$(printf '%s\n' \
            'Import HK47196/zill upstream history' \
            '' \
            'Pinned upstream: HK47196/zill@a98d9ce29f361d666ec23da0dcfd351f24537ffd' \
            'Preserves the upstream GPL-3.0-or-later code history and license files.' \
            | git commit-tree "$TREE" -p "$OUR_HEAD" -p "$UPSTREAM_HEAD")"

          git reset --hard "$COMMIT"
          git push origin "$COMMIT:main"
