name: Korean QA-2 safe terminology cleanup

on:
  push:
    paths:
      - 'tools/korean/qa-fix-terminology-safe.py'
      - '.github/workflows/korean-qa2-safe-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: translation/section001-batch2
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Baseline QA-2 mismatch count
        run: python3 tools/korean/qa-terminology.py --json /tmp/before.json --max-examples 0
      - name: Apply conservative terminology normalization
        run: python3 tools/korean/qa-fix-terminology-safe.py
      - name: Validate normalized corpus
        run: |
          ./zill korean-check
          ./zill korean-font-check
          python3 tools/korean/qa-integrity.py --json /tmp/integrity.json --max-examples 20
          python3 tools/korean/qa-terminology.py --json /tmp/after.json --max-examples 20
          if grep -R -n --include='msgsec*.toml' '눈동자동자' translations/korean/messages; then
            echo 'corrupted 색혹의 눈동자 overreplacement remains'
            exit 1
          fi
          python3 - <<'PY'
          import json
          before=json.load(open('/tmp/before.json', encoding='utf-8'))
          after=json.load(open('/tmp/after.json', encoding='utf-8'))
          b=int(before['mismatch_count']); a=int(after['mismatch_count'])
          print(f'QA-2 mismatch change: {b} -> {a} (delta {a-b})')
          if a > b:
              raise SystemExit('safe terminology pass increased mismatch count')
          PY
      - name: Commit safe terminology normalization
        run: |
          if git diff --quiet -- translations/korean/messages; then
            echo 'No safe terminology fixes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add translations/korean/messages
          git commit -m 'Normalize safe Korean terminology variants'
          git push origin HEAD:translation/section001-batch2
